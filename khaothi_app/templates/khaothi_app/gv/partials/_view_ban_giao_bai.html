<div id="view-ban-giao-bai" class="view-section hidden-view w-full h-full animate-fade-in flex flex-col gap-6">
    <div class="flex justify-between items-end border-b border-gray-200 pb-4">
        <div>
            <h2 class="text-2xl font-bold text-[#9e1c22] flex items-center gap-2">
                <i data-lucide="send" class="w-6 h-6 text-red-600"></i> Trả bài đã chấm
            </h2>
        </div>
    </div>

    <!-- Main Creation Panel -->
    <div class="flex flex-col lg:flex-row gap-8 bg-white border border-gray-200 rounded-lg shadow-sm p-6 min-h-[400px]">
        <!-- Left Column: Form Fields and Submit Button -->
        <div class="w-full lg:w-1/2 min-w-0 flex flex-col gap-6 border-r border-gray-100 lg:pr-8 justify-between">
            <div class="space-y-6">
                <h3 class="font-bold text-gray-800 text-sm mb-2 border-b pb-3 flex items-center gap-1.5">
                    <i data-lucide="file-plus" class="w-4 h-4 text-[#9e1c22]"></i> Khởi tạo phiếu bàn giao
                </h3>
                
                <!-- Step 1 -->
                <div class="bg-gray-50/50 p-4 rounded-xl border border-gray-200 shadow-sm transition-all">
                    <label class="flex items-center mb-3">
                        <span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-red-100 text-[#9e1c22] text-xs font-bold mr-2 shadow-sm">1</span>
                        <span class="text-sm font-bold text-gray-800">Bên tiếp nhận bàn giao</span>
                    </label>
                    <input type="text" readonly value="Giáo vụ Khoa (dvcm)" class="w-full px-3 py-3 border border-gray-200 rounded-lg text-sm bg-gray-50 outline-none font-bold text-gray-800 shadow-sm" />
                </div>

                <!-- Step 2 -->
                <div class="bg-gray-50/50 p-4 rounded-xl border border-gray-200 shadow-sm hover:border-red-200 transition-all">
                    <label class="flex items-center mb-3">
                        <span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-red-100 text-[#9e1c22] text-xs font-bold mr-2 shadow-sm">2</span>
                        <span class="text-sm font-bold text-gray-800">Đính kèm bảng điểm chi tiết đã ký (nếu có)</span>
                    </label>
                    <input type="file" id="gv-gn-file-input" class="hidden" accept=".pdf,.jpg,.jpeg,.png" onchange="handleGvGiaoNhanFileSelect(this)">
                    <div onclick="document.getElementById('gv-gn-file-input').click()" class="border-2 border-dashed border-gray-300 rounded-xl p-5 flex flex-col items-center justify-center bg-white text-gray-400 text-center hover:bg-red-50/20 hover:border-red-300 transition-all cursor-pointer shadow-inner">
                        <i data-lucide="upload-cloud" class="w-8 h-8 mb-1.5 text-red-500 animate-pulse"></i>
                        <span id="gv-gn-file-status" class="text-xs font-bold text-gray-700">Tải lên file scan bảng điểm (.pdf)</span>
                    </div>
                </div>
            </div>

            <!-- Footer constraints and Submit -->
            <div class="mt-4 space-y-4">
                <button onclick="handleGvExecuteTaoPhieu()" class="w-full bg-[#9e1c22] text-white font-bold py-3.5 rounded-xl shadow-md hover:bg-red-800 flex justify-center items-center gap-2 text-sm transition-all transform hover:-translate-y-0.5">
                    <i data-lucide="send" class="w-4 h-4"></i> GỬI PHIẾU BÀN GIAO TRẢ BÀI
                </button>
            </div>
        </div>

        <!-- Right Column: Checkbox Selection List -->
        <div class="w-full lg:w-1/2 min-w-0 flex flex-col gap-3">
            <h3 class="font-bold text-gray-800 text-sm mb-2 border-b pb-2 flex items-center gap-1.5">
                <i data-lucide="list-checks" class="w-4 h-4 text-green-600"></i> Chọn các túi bài thi đã chấm xong
            </h3>
            <div class="border border-gray-200 rounded-lg p-3 bg-gray-50 flex-1 overflow-y-auto min-h-[250px] space-y-1.5" id="gv-gn-list-tui-kha-dung"></div>
        </div>
    </div>

    <!-- History Panel below creation panel -->
    <div class="bg-white border border-gray-200 rounded-lg shadow-sm p-6 flex flex-col gap-4">
        <h3 class="font-bold text-gray-800 text-sm border-b pb-2 flex items-center gap-1.5">
            <i data-lucide="history" class="w-4 h-4 text-gray-600"></i> Lịch sử trả túi bài thi đã chấm
        </h3>
        <div class="overflow-x-auto">
            <table class="w-full text-left text-sm">
                <thead class="bg-gray-50 text-gray-600 border-b">
                    <tr>
                        <th class="px-4 py-2.5 font-semibold">Mã phiếu</th>
                        <th class="px-4 py-2.5 font-semibold">Luồng luân chuyển</th>
                        <th class="px-4 py-2.5 font-semibold text-center">Số lượng</th>
                        <th class="px-4 py-2.5 font-semibold text-center">Trạng thái phiếu</th>
                    </tr>
                </thead>
                <tbody id="gn-lich-su-giao-tbody" class="divide-y divide-gray-100"></tbody>
            </table>
        </div>
    </div>
</div>
