<!-- Modal: Từ chối phê duyệt (Nhập lý do) -->
<div id="modal-tu-choi" class="hidden-view fixed inset-0 bg-black/60 z-[110] flex items-center justify-center animate-fade-in">
    <div class="bg-white rounded-lg shadow-xl max-w-md w-full overflow-hidden animate-fade-in-down flex flex-col border border-gray-100">
        <div class="bg-gray-50 border-b border-gray-200 p-4 flex justify-between items-center rounded-t-lg">
            <h3 class="font-bold text-sm text-gray-800 flex items-center gap-2">
                <i data-lucide="x-circle" class="w-5 h-5 text-rose-600"></i> TỪ CHỐI PHÊ DUYỆT HỒ SƠ
            </h3>
            <button onclick="hideTuChoiModal()" class="text-gray-400 hover:text-gray-600 transition-colors"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        <div class="p-6 flex flex-col gap-4 text-xs font-sans">
            <p class="text-gray-600 leading-relaxed">Bạn đang thực hiện từ chối phê duyệt đối với mục: <strong id="tuchoi-target-title" class="text-[#9e1c22] font-bold">...</strong></p>
            
            <div>
                <label class="block font-bold text-gray-700 mb-1">Lý do từ chối phê duyệt <span class="text-red-500">*</span></label>
                <textarea id="tuchoi-lydo" rows="3" placeholder="Nhập chi tiết lý do từ chối (ví dụ: Xung đột ca thi, thiếu kết quả rà soát, nội dung đề thi chưa phù hợp...)" class="w-full p-2.5 border border-gray-300 bg-white rounded focus:border-[#9e1c22] outline-none text-xs transition-colors"></textarea>
                <span id="tuchoi-error" class="hidden-view text-red-600 font-bold block mt-1.5"><i data-lucide="alert-circle" class="w-3.5 h-3.5 inline pb-0.5"></i> Vui lòng nhập lý do từ chối!</span>
            </div>
        </div>
        <div class="bg-gray-50 p-4 border-t border-gray-200 flex justify-end gap-2 text-xs">
            <button onclick="hideTuChoiModal()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded font-bold transition-colors">HỦY BỎ</button>
            <button onclick="confirmTuChoiExecute()" class="bg-[#9e1c22] hover:bg-red-800 text-white px-4 py-2 rounded font-bold shadow-xs transition-colors flex items-center gap-1.5">
                <i data-lucide="x-circle" class="w-4 h-4"></i> XÁC NHẬN TỪ CHỐI
            </button>
        </div>
    </div>
</div>
