<!-- View: Phê duyệt Danh sách thi -->
<div id="view-duyet-danh-sach-thi" class="view-section hidden-view animate-fade-in flex flex-col h-full space-y-6">
    <div class="mb-2 border-b border-gray-200 pb-4">
        <h2 class="text-2xl font-bold text-blue-900 mb-1 flex items-center gap-2">
            <i data-lucide="users-check" class="text-blue-600"></i> Phê duyệt Danh sách Sinh viên Dự thi
        </h2>
        <p class="text-sm text-gray-600">Kiểm tra danh sách sinh viên đủ điều kiện / bị cấm thi (nợ học phí) và phê duyệt công bố danh sách thi chính thức.</p>
    </div>

    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 space-y-4">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-3 border-b border-gray-100">
            <!-- Thanh tìm kiếm -->
            <div class="relative flex-1 max-w-md">
                <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="text" id="search-duyet-ds-thi" value="" autocomplete="off" onkeyup="renderDuyetDanhSachThi()" placeholder="Tìm theo mã danh sách, học phần..." class="w-full pl-9 pr-4 py-2 border border-gray-300 rounded text-xs focus:border-red-800 outline-none" />
            </div>

            <!-- Bộ lọc trạng thái & Thao tác chọn hàng loạt -->
            <div class="flex items-center gap-2">
                <button id="btn-select-duyet-ds" onclick="toggleSelectMode('duyet-ds')" class="bg-white border border-gray-300 hover:bg-gray-100 text-gray-700 font-bold px-3 py-1.5 text-xs rounded transition-colors flex items-center gap-1.5"><i data-lucide="check-square" class="w-3.5 h-3.5 text-gray-600"></i> <span>Chọn</span></button>
                <button id="btn-approve-all-duyet-ds" onclick="handleApproveSelected('duyet-ds')" class="text-emerald-700 hover:text-emerald-800 font-bold px-2.5 py-1.5 text-xs transition-colors items-center gap-1.5 hidden cursor-pointer"><i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-600"></i> <span>Phê duyệt chọn</span></button>
                <button id="btn-reject-all-duyet-ds" onclick="handleRejectSelected('duyet-ds')" class="text-rose-700 hover:text-rose-800 font-bold px-2.5 py-1.5 text-xs transition-colors items-center gap-1.5 hidden cursor-pointer"><i data-lucide="x-circle" class="w-4 h-4 text-rose-600"></i> <span>Từ chối chọn</span></button>
                <span class="text-xs font-bold text-gray-600 ml-2">LỌC TRẠNG THÁI:</span>
                <div class="inline-flex rounded shadow-sm" role="group">
                    <button onclick="filterDuyetDanhSachThiStatus('all')" id="fds-status-all" class="fds-status-btn px-3 py-1.5 text-xs font-bold bg-[#9e1c22] text-white rounded-l border border-[#9e1c22]">Tất cả</button>
                    <button onclick="filterDuyetDanhSachThiStatus('cho-duyet')" id="fds-status-cho-duyet" class="fds-status-btn px-3 py-1.5 text-xs font-bold bg-white text-gray-700 hover:bg-gray-50 border-t border-b border-r border-gray-300">Chờ phê duyệt</button>
                    <button onclick="filterDuyetDanhSachThiStatus('da-duyet')" id="fds-status-da-duyet" class="fds-status-btn px-3 py-1.5 text-xs font-bold bg-white text-gray-700 hover:bg-gray-50 border-t border-b border-r border-gray-300">Đã phê duyệt</button>
                    <button onclick="filterDuyetDanhSachThiStatus('tu-choi')" id="fds-status-tu-choi" class="fds-status-btn px-3 py-1.5 text-xs font-bold bg-white text-gray-700 hover:bg-gray-50 border-t border-b border-r border-gray-300 rounded-r">Từ chối</button>
                </div>
            </div>
        </div>

        <!-- Bảng danh sách thi -->
        <div class="overflow-x-auto overflow-y-auto max-h-[420px] border border-gray-200 rounded-lg">
            <table class="w-full text-left text-xs border-collapse">
                <thead class="bg-gray-50 text-gray-700 font-bold uppercase tracking-wider border-b border-gray-200 sticky top-0 bg-gray-50 z-10">
                    <tr>
                        <th class="select-col-duyet-ds hidden px-3 py-3 border-b text-center w-8"></th>
                        <th class="px-4 py-3 text-center w-12 whitespace-nowrap">STT</th>
                        <th class="px-4 py-3 whitespace-nowrap">Mã danh sách</th>
                        <th class="px-4 py-3 whitespace-nowrap">Học phần</th>
                        <th class="px-4 py-3 text-center whitespace-nowrap">Tổng SV</th>
                        <th class="px-4 py-3 text-center whitespace-nowrap">Đủ ĐK dự thi</th>
                        <th class="px-4 py-3 text-center whitespace-nowrap">Cấm thi (Nợ HP)</th>
                        <th class="px-4 py-3 whitespace-nowrap">Thời gian gửi</th>
                        <th class="px-4 py-3 text-center whitespace-nowrap">Trạng thái</th>
                        <th class="px-4 py-3 text-center whitespace-nowrap min-w-[160px]">Thao tác</th>
                    </tr>
                </thead>
                <tbody id="duyet-danh-sach-thi-tbody" class="divide-y divide-gray-200">
                    <!-- Dynamic rendering -->
                </tbody>
            </table>
        </div>
    </div>
</div>
