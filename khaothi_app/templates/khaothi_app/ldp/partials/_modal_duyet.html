<!-- Modal: Phê duyệt ký số -->
<div id="modal-duyet" class="hidden-view fixed inset-0 bg-black/60 z-[100] flex items-center justify-center animate-fade-in">
    <div class="bg-white rounded-lg shadow-xl max-w-md w-full overflow-hidden animate-fade-in-down flex flex-col">
        <div class="bg-red-900 text-white p-4 flex justify-between items-center rounded-t-lg border-b border-orange-500">
            <h3 class="font-bold text-sm flex items-center gap-1.5"><i data-lucide="shield-check" class="w-4 h-4 text-yellow-400"></i> XÁC THỰC CHỮ KÝ ĐIỆN TỬ TRƯỞNG PHÒNG</h3>
            <button onclick="hideDuyetModal()" class="text-white hover:text-gray-200"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        <div class="p-6 flex flex-col gap-4 text-xs font-sans">
            <p class="text-gray-600 leading-relaxed">Để phê duyệt và đóng dấu chữ ký điện tử nội bộ cho văn bản <strong id="duyet-doc-name" class="text-red-900">...</strong>, vui lòng nhập mật khẩu tài khoản của Trưởng phòng.</p>
            <div>
                <label class="block font-bold text-gray-700 mb-1">Mật khẩu Trưởng phòng (test: 123456):</label>
                <input type="password" id="duyet-password" placeholder="Nhập mật khẩu..." class="w-full p-2.5 border rounded focus:border-red-700 outline-none font-mono" />
                <span id="duyet-error" class="hidden-view text-red-600 font-bold block mt-1"><i data-lucide="alert-circle" class="w-3.5 h-3.5 inline pb-0.5"></i> Mật khẩu xác thực chưa đúng. Vui lòng kiểm tra lại.</span>
            </div>
        </div>
        <div class="bg-gray-50 p-4 border-t flex justify-end gap-2 text-xs">
            <button onclick="hideDuyetModal()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded font-bold">HỦY BỎ</button>
            <button onclick="confirmDuyetExecute()" class="bg-red-900 hover:bg-red-800 text-white px-4 py-2 rounded font-bold shadow">KÝ PHÊ DUYỆT</button>
        </div>
    </div>
</div>
