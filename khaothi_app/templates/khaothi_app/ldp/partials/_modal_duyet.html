<!-- Modal: Phê duyệt -->
<div id="modal-duyet" class="hidden-view fixed inset-0 bg-black/60 z-[100] flex items-center justify-center animate-fade-in">
    <div class="bg-white rounded-lg shadow-xl max-w-md w-full overflow-hidden animate-fade-in-down flex flex-col border border-gray-100">
        <!-- Header đồng bộ tông màu xám sáng + thương hiệu #9e1c22 -->
        <div class="bg-gray-50 border-b border-gray-200 p-4 flex justify-between items-center rounded-t-lg">
            <h3 class="font-bold text-sm text-gray-800 flex items-center gap-2">
                <i data-lucide="shield-check" class="w-5 h-5 text-[#9e1c22]"></i> XÁC THỰC MẬT KHẨU PHÊ DUYỆT
            </h3>
            <button onclick="hideDuyetModal()" class="text-gray-400 hover:text-gray-600 transition-colors">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>
        <!-- Body -->
        <div class="p-6 flex flex-col gap-4 text-xs font-sans">
            <p class="text-gray-600 leading-relaxed">Để phê duyệt <strong id="duyet-doc-name" class="text-[#9e1c22] font-bold">...</strong>, vui lòng nhập mật khẩu tài khoản để xác nhận.</p>
            <div>
                <label class="block font-bold text-gray-700 mb-1">Mật khẩu xác nhận</label>
                <input type="password" id="duyet-password" placeholder="Nhập mật khẩu..." class="w-full p-2.5 border border-gray-300 bg-white rounded text-sm focus:border-[#9e1c22] outline-none font-mono transition-colors" />
                <span id="duyet-error" class="hidden-view text-red-600 font-bold block mt-1.5"><i data-lucide="alert-circle" class="w-3.5 h-3.5 inline pb-0.5"></i> Mật khẩu xác nhận chưa đúng. Vui lòng kiểm tra lại.</span>
            </div>
        </div>
        <!-- Footer Buttons đồng bộ chuẩn hệ thống -->
        <div class="bg-gray-50 p-4 border-t border-gray-200 flex justify-end gap-2 text-xs">
            <button onclick="hideDuyetModal()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded font-bold transition-colors">HỦY BỎ</button>
            <button onclick="confirmDuyetExecute()" class="bg-[#9e1c22] hover:bg-red-800 text-white px-4 py-2 rounded font-bold shadow-xs transition-colors flex items-center gap-1.5">
                <i data-lucide="check-circle-2" class="w-4 h-4"></i> XÁC NHẬN PHÊ DUYỆT
            </button>
        </div>
    </div>
</div>
