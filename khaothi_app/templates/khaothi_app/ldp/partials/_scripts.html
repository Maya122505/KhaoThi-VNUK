<!-- Scripts Section -->
<script>
    // Synced global variables
    let kyThiData = [];
    let caThiData = [];
    let lichThiData = [];
    let hocPhiData = [];
    let lopThiDiemData = [];

    let phongThiGocData = [];
    let tuiPhachData = [];
    let phieuGiaoNhanData = [];
    let canBoCoiThiData = [];
    let phucKhaoData = [];
    let deThiData = [];
    let danhSachThiData = [];
    let systemConfigsData = {};

    let isStateLoaded = false;
    let activeViewId = "view-home";

    let duyetTargetType = ""; // 'diem', 'pk', 'thulao'
    let duyetTargetId = "";   // item id

    // Thù lao approved state
    let isThulaoApproved = false;
    let thulaoApprover = "";
    let thulaoApprovedAt = "";

    // LDP Approval Filters & Modes
    let duyetLichStatusFilter = 'all';
    let duyetDanhSachStatusFilter = 'all';
    let duyetDeStatusFilter = 'all';

    let selectModeLich = false;
    let selectModeDs = false;
    let selectModeDe = false;

    window.onload = async function() {
        initIcons();
        await loadStateFromServer();
        const savedViewId = sessionStorage.getItem('ldp_activeViewId');
        navigate(savedViewId || 'view-home');
    };

    function initIcons() { lucide.createIcons(); }

    async function loadStateFromServer() {
        try {
            const res = await fetch('/api/get_state/');
            const data = await res.json();

            kyThiData = data.kyThiData || [];
            caThiData = data.caThiData || [];
            lichThiData = data.lichThiData || [];
            hocPhiData = data.hocPhiData || [];
            lopThiDiemData = data.lopThiDiemData || [];
            phongThiGocData = data.phongThiGocData;
            tuiPhachData = data.tuiPhachData;
            phieuGiaoNhanData = data.phieuGiaoNhanData;
            canBoCoiThiData = (data.canBoCoiThiData || []).map(g => ({
                ...g,
                id: g.code || g.id,
                code: g.code || g.id
            }));
            phucKhaoData = data.phucKhaoData;
            deThiData = data.deThiData || [];
            systemConfigsData = data.systemConfigsData || {};

            danhSachThiData = data.danhSachThiData || [];
            if (danhSachThiData.length === 0) {
                danhSachThiData = [
                    { id: "DS-ENG101", subjectName: "Tiếng Anh GTQT 3 (ENG101)", totalSv: 120, eligibleSv: 115, debtSv: 5, timeSent: "14:30 25/07/2026", status: "Chờ phê duyệt" },
                    { id: "DS-BUS201", subjectName: "Quản trị dự án (BUS201)", totalSv: 90, eligibleSv: 88, debtSv: 2, timeSent: "10:15 26/07/2026", status: "Đã phê duyệt" },
                    { id: "DS-CS101", subjectName: "Nhập môn Lập trình (CS101)", totalSv: 60, eligibleSv: 60, debtSv: 0, timeSent: "08:30 27/07/2026", status: "Chờ phê duyệt" }
                ];
            }
            isStateLoaded = true;
        } catch(e) {
            console.error("Lỗi đồng bộ dữ liệu:", e);
        }
    }

    async function saveStateToServer() {
        try {
            await fetch('/api/save_state/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                        kyThiData,
                        caThiData,
                        lichThiData,
                        hocPhiData,
                        lopThiDiemData,
                    phongThiGocData,
                    tuiPhachData,
                    phieuGiaoNhanData,
                    canBoCoiThiData,
                    phucKhaoData,
                    deThiData,
                    danhSachThiData,
                    systemConfigsData
                })
            });
        } catch(e) {
            console.error("Lỗi lưu dữ liệu:", e);
        }
    }

    function toggleDropdown(id, event) {
        if (event) event.stopPropagation();
        const el = document.getElementById(id);
        if (!el) return;
        const isHidden = el.classList.contains('hidden-view');
        
        document.querySelectorAll('.dropdown-menu').forEach(d => d.classList.add('hidden-view'));
        document.querySelectorAll('.nav-btn i').forEach(icon => {
            if (icon.id) icon.setAttribute('data-lucide', 'chevron-down');
        });

        if (isHidden) {
            el.classList.remove('hidden-view');
            const icon = event.currentTarget.querySelector('i');
            if (icon) icon.setAttribute('data-lucide', 'chevron-up');
        }
        initIcons();
    }
    window.toggleDropdown = toggleDropdown;

    document.addEventListener('click', () => {
        document.querySelectorAll('.dropdown-menu').forEach(d => d.classList.add('hidden-view'));
        document.querySelectorAll('.nav-btn i').forEach(icon => {
            if (icon.id) icon.setAttribute('data-lucide', 'chevron-down');
        });
        initIcons();
    });

    function navigatePheDuyet(subView) {
        document.querySelectorAll('.dropdown-menu').forEach(d => d.classList.add('hidden-view'));
        if (subView === 'diem') navigate('view-duyet-diem');
        else if (subView === 'phuc-khao') navigate('view-duyet-phuc-khao');
        else if (subView === 'thu-lao') navigate('view-duyet-thu-lao');
    }
    window.navigatePheDuyet = navigatePheDuyet;

    function navigate(viewId) {
        document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden-view'));
        const targetView = document.getElementById(viewId);
        if(targetView) targetView.classList.remove('hidden-view');
        sessionStorage.setItem('ldp_activeViewId', viewId);

        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.classList.remove('bg-[#801418]', 'border-b-white', 'font-bold');
            btn.classList.add('border-transparent');
        });

        activeViewId = viewId;
        let activeBtnId = 'nav-btn-' + viewId.replace('view-', '');

        const activeBtn = document.getElementById(activeBtnId);
        if (activeBtn) {
            activeBtn.classList.remove('border-transparent');
            activeBtn.classList.add('bg-[#801418]', 'border-b-white', 'font-bold');
        }

        if(viewId === 'view-home') {
            renderHome();
        } else if(viewId === 'view-duyet-diem') {
            renderDuyetDiem();
        } else if(viewId === 'view-duyet-phuc-khao') {
            renderDuyetPhucKhao();
        } else if(viewId === 'view-duyet-thu-lao') {
            renderDuyetThuLao();
        } else if(viewId === 'view-duyet-lich-thi') {
            renderDuyetLichThi();
        } else if(viewId === 'view-duyet-danh-sach-thi') {
            renderDuyetDanhSachThi();
        } else if(viewId === 'view-duyet-de-thi') {
            renderDuyetDeThi();
        }
        initIcons();
    }
    window.navigate = navigate;

    function renderHome() {
        const countDiem = tuiPhachData.filter(t => t.status === "Khoa đã phê duyệt").length;
        const countPk = phucKhaoData.filter(p => p.status === "Đã xử lý" || p.status === "DaXuLy").length;
        const countTuiLock = tuiPhachData.filter(t => t.status === "Đã khóa phách").length;

        document.getElementById('count-diem-cho').innerText = countDiem;
        document.getElementById('count-pk-cho').innerText = countPk;
        document.getElementById('count-tui-khoa').innerText = countTuiLock;
        document.getElementById('count-thu-lao-cho').innerText = isThulaoApproved ? 0 : 1;

        const qaList = document.getElementById('quick-action-list');
        qaList.innerHTML = '';

        let hasActions = false;

        if (countDiem > 0) {
            hasActions = true;
            qaList.innerHTML += `
                <div class="flex justify-between items-center p-3 border border-purple-100 bg-purple-50 rounded-lg">
                    <span class="font-medium text-purple-900 text-xs">Có <strong>${countDiem} điểm thi KTHP Khoa đã gửi</strong> đang chờ phê duyệt.</span>
                    <button onclick="navigate('view-duyet-diem')" class="bg-purple-700 hover:bg-purple-800 text-white font-bold px-3 py-1.5 rounded text-[10px] shadow transition-colors">XEM NGAY</button>
                </div>
            `;
        }

        if (countPk > 0) {
            hasActions = true;
            qaList.innerHTML += `
                <div class="flex justify-between items-center p-3 border border-indigo-100 bg-indigo-50 rounded-lg">
                    <span class="font-medium text-indigo-900 text-xs">Có <strong>${countPk} biên bản phúc khảo</strong> đã hoàn thành chấm lại, chờ phê duyệt.</span>
                    <button onclick="navigate('view-duyet-phuc-khao')" class="bg-indigo-700 hover:bg-indigo-800 text-white font-bold px-3 py-1.5 rounded text-[10px] shadow transition-colors">PHÊ DUYỆT</button>
                </div>
            `;
        }

        if (!isThulaoApproved) {
            hasActions = true;
            qaList.innerHTML += `
                <div class="flex justify-between items-center p-3 border border-pink-100 bg-pink-50 rounded-lg">
                    <span class="font-medium text-pink-900 text-xs">Báo cáo quyết toán giờ coi thi học kỳ III chờ Trưởng phòng xác nhận thù lao.</span>
                    <button onclick="navigate('view-duyet-thu-lao')" class="bg-pink-700 hover:bg-pink-800 text-white font-bold px-3 py-1.5 rounded text-[10px] shadow transition-colors">KIỂM DUYỆT</button>
                </div>
            `;
        }

        if(!hasActions) {
            qaList.innerHTML = `<div class="text-center py-6 text-gray-400 italic text-xs">Tất cả hồ sơ khảo thí đã được phê duyệt xác nhận an toàn. Không có hành động chờ duyệt.</div>`;
        }
    }

    let selectedDuyetTuiId = null;

    function renderDuyetDiem() {
        const leftList = document.getElementById('duyet-diem-left-list');
        const countSpan = document.getElementById('duyet-list-count');
        if (!leftList) return;

        leftList.innerHTML = '';

        const filterVal = document.getElementById('duyet-filter-select')?.value || 'cho';
        const query = (document.getElementById('duyet-search-input')?.value || '').toLowerCase().trim();

        // Chỉ hiển thị các bài Khoa đã phê duyệt (Chờ duyệt) hoặc Lãnh đạo Đã duyệt
        let list = tuiPhachData.filter(t => t.status === "Khoa đã phê duyệt" || t.status === "Đã duyệt bảng điểm");

        if (filterVal === 'cho') {
            list = list.filter(t => t.status === "Khoa đã phê duyệt");
        } else if (filterVal === 'da') {
            list = list.filter(t => t.status === "Đã duyệt bảng điểm");
        }

        if (query) {
            list = list.filter(t => t.id.toLowerCase().includes(query) || (t.subjectName || '').toLowerCase().includes(query));
        }

        if (countSpan) countSpan.innerText = `${list.length} túi bài`;

        if (list.length === 0) {
            leftList.innerHTML = `<div class="p-8 text-center text-gray-400 italic text-xs">Không tìm thấy điểm thi nào phù hợp.</div>`;
            const pEmpty = document.getElementById('duyet-detail-empty');
            const pPanel = document.getElementById('duyet-detail-panel');
            if (pEmpty) pEmpty.classList.remove('hidden-view');
            if (pPanel) pPanel.classList.add('hidden-view');
            updateBatchDuyetCount();
            return;
        }

        list.forEach(t => {
            let cbCol = `<span class="text-gray-300 w-4 inline-block text-center">-</span>`;
            let badge = `<span class="bg-green-100 text-green-800 px-2 py-0.5 rounded text-xs font-bold">✓ Đã duyệt</span>`;

            if (t.status === "Khoa đã phê duyệt") {
                cbCol = `<input type="checkbox" class="duyet-item-cb w-4 h-4 cursor-pointer accent-[#9e1c22]" value="${t.id}" onchange="updateBatchDuyetCount(); event.stopPropagation();" onclick="event.stopPropagation();">`;
                badge = `<span class="bg-amber-100 text-amber-800 px-2 py-0.5 rounded text-xs font-bold">Chờ duyệt</span>`;
            }

            const isSelected = (selectedDuyetTuiId === t.id);
            const activeClass = isSelected ? 'bg-blue-50/80 border-l-4 border-l-[#9e1c22]' : 'hover:bg-gray-50 border-l-4 border-l-transparent';

            leftList.innerHTML += `
                <div onclick="selectDuyetItem('${t.id}')" class="p-3.5 cursor-pointer transition-all flex items-center justify-between ${activeClass}" id="duyet-item-row-${t.id}">
                    <div class="flex items-center gap-3">
                        ${cbCol}
                        <div>
                            <div class="flex items-center gap-2">
                                <span class="font-mono font-bold text-gray-800 text-sm">${t.id}</span>
                                ${badge}
                            </div>
                            <p class="text-sm font-semibold text-gray-900 mt-0.5 line-clamp-1">${t.subjectName}</p>
                            <p class="text-xs text-gray-500 mt-0.5">${t.papers} bài thi</p>
                        </div>
                    </div>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-gray-400"></i>
                </div>
            `;
        });

        if (list.length > 0) {
            const exists = list.find(t => t.id === selectedDuyetTuiId);
            if (!exists) {
                selectDuyetItem(list[0].id);
            } else {
                selectDuyetItem(selectedDuyetTuiId);
            }
        }

        updateBatchDuyetCount();
        initIcons();
    }

    function selectDuyetItem(tuiId) {
        selectedDuyetTuiId = tuiId;

        const list = tuiPhachData.filter(t => t.status === "Khoa đã phê duyệt" || t.status === "Đã duyệt bảng điểm");
        const item = list.find(t => t.id === tuiId);

        document.querySelectorAll('#duyet-diem-left-list > div').forEach(el => {
            el.classList.remove('bg-blue-50/80', 'border-l-4', 'border-l-[#9e1c22]');
            el.classList.add('hover:bg-gray-50', 'border-l-4', 'border-l-transparent');
        });

        const activeRow = document.getElementById(`duyet-item-row-${tuiId}`);
        if (activeRow) {
            activeRow.classList.remove('hover:bg-gray-50', 'border-l-transparent');
            activeRow.classList.add('bg-blue-50/80', 'border-l-[#9e1c22]');
        }

        const panelEmpty = document.getElementById('duyet-detail-empty');
        const panelForm = document.getElementById('duyet-detail-panel');

        if (!item) {
            if (panelEmpty) panelEmpty.classList.remove('hidden-view');
            if (panelForm) panelForm.classList.add('hidden-view');
            return;
        }

        if (panelEmpty) panelEmpty.classList.add('hidden-view');
        if (panelForm) panelForm.classList.remove('hidden-view');

        const cbName = item.graderName || item.teacher || item.can_bo || (canBoCoiThiData && canBoCoiThiData.find(g => g.id === item.grader1 || g.code === item.grader1)?.name) || item.grader1 || 'ThS. Nguyễn Văn A';
        document.getElementById('detail-tui-id').innerText = `Túi bài thi: ${item.id}`;
        document.getElementById('detail-hp-name').innerText = `Học phần: ${item.subjectName} (${item.subjectId || ''})`;
        document.getElementById('detail-meta-info').innerText = `Số lượng: ${item.papers} bài thi | Cán bộ chấm thi: ${cbName}`;

        const badgeEl = document.getElementById('detail-status-badge');
        const actionBox = document.getElementById('detail-action-container');

        if (item.status === "Khoa đã phê duyệt") {
            if (badgeEl) badgeEl.innerHTML = `<span class="bg-amber-100 text-amber-800 px-2.5 py-0.5 rounded text-xs font-bold">Chờ duyệt</span>`;
            if (actionBox) actionBox.innerHTML = `
                <span class="bg-amber-50 text-amber-800 border border-amber-200 px-3 py-1 rounded text-sm font-bold inline-block">Chờ Lãnh đạo duyệt</span>
            `;
        } else {
            if (badgeEl) badgeEl.innerHTML = `<span class="bg-green-100 text-green-800 px-2.5 py-0.5 rounded text-xs font-bold">✓ Đã duyệt</span>`;
            if (actionBox) actionBox.innerHTML = `
                <div class="text-right">
                    <span class="bg-green-50 text-green-800 border border-green-200 px-3 py-1 rounded text-sm font-bold block mb-1">✓ ĐÃ PHÊ DUYỆT</span>
                    <span class="text-gray-400 italic text-xs block">Xác nhận bởi: ${item.approver || 'Trưởng phòng'}<br>${item.approvedAt || ''}</span>
                </div>
            `;
        }

        const tbody = document.getElementById('duyet-detail-tbody');
        tbody.innerHTML = '';

        const phachs = item.phachGoc || [];
        const paperCount = phachs.length > 0 ? phachs.length : (item.papers || 15);

        for (let i = 0; i < paperCount; i++) {
            const pCode = phachs[i] || `P-${(100 + i)}`;
            const seed = sumChars(pCode);
            const finalPt = (6.0 + (seed % 35) / 10).toFixed(1);

            tbody.innerHTML += `
                <tr class="hover:bg-gray-50 transition-colors font-mono">
                    <td class="px-4 py-2 text-gray-500 font-sans text-center text-sm">${i + 1}</td>
                    <td class="px-4 py-2 font-mono font-bold text-gray-800 text-sm">${pCode}</td>
                    <td class="px-4 py-2 text-center font-bold text-blue-900 font-mono text-base">${finalPt}</td>
                </tr>
            `;
        }

        initIcons();
    }
    window.selectDuyetItem = selectDuyetItem;

    function sumChars(str) {
        let s = 0;
        for (let i = 0; i < str.length; i++) s += str.charCodeAt(i);
        return s;
    }

    function toggleSelectAllDuyet(isChecked) {
        document.querySelectorAll('.duyet-item-cb:not(:disabled)').forEach(cb => {
            cb.checked = isChecked;
        });
        updateBatchDuyetCount();
    }
    window.toggleSelectAllDuyet = toggleSelectAllDuyet;

    function updateBatchDuyetCount() {
        const checkedCbs = document.querySelectorAll('.duyet-item-cb:checked');
        const count = checkedCbs.length;
        const countSpan = document.getElementById('count-checked-duyet');
        const btnBatch = document.getElementById('btn-batch-duyet-diem');

        if (countSpan) countSpan.innerText = count;

        if (btnBatch) {
            if (count > 0) {
                btnBatch.removeAttribute('disabled');
                btnBatch.classList.remove('opacity-50', 'cursor-not-allowed');
                btnBatch.classList.add('hover:bg-red-800', 'cursor-pointer');
            } else {
                btnBatch.setAttribute('disabled', 'true');
                btnBatch.classList.add('opacity-50', 'cursor-not-allowed');
                btnBatch.classList.remove('hover:bg-red-800', 'cursor-pointer');
            }
        }

        const allCbs = document.querySelectorAll('.duyet-item-cb:not(:disabled)');
        const checkAllEl = document.getElementById('check-all-duyet');
        if (checkAllEl && allCbs.length > 0) {
            checkAllEl.checked = (checkedCbs.length === allCbs.length);
        }
    }
    window.updateBatchDuyetCount = updateBatchDuyetCount;

    function executeBatchDuyetDiem() {
        const checkedCbs = Array.from(document.querySelectorAll('.duyet-item-cb:checked'));
        if (checkedCbs.length === 0) {
            showGlobalToast("Cảnh báo", "Vui lòng chọn ít nhất 1 túi điểm thi để phê duyệt hàng loạt!", "warning");
            return;
        }

        const ids = checkedCbs.map(cb => cb.value);
        showDuyetModal('diem', ids, `Hàng loạt (${ids.length} túi bài thi: ${ids.join(', ')})`);
    }
    window.executeBatchDuyetDiem = executeBatchDuyetDiem;

    function renderDuyetPhucKhao() {
        const tbody = document.getElementById('duyet-phuc-khao-tbody');
        tbody.innerHTML = '';

        const list = phucKhaoData.filter(p => p.status === "Đã xử lý" || p.status === "Đã hoàn thành" || p.status === "DaXuLy" || p.status === "DaHoanThanh" || p.status === "Đã phê duyệt phúc khảo" || p.status === "DaPheDuyet");

        if(list.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" class="px-6 py-12 text-center text-gray-400 italic">Không có quyết định phúc khảo nào chờ duyệt.</td></tr>`;
            return;
        }

        list.forEach(p => {
            let badge = `<span class="bg-amber-100 text-amber-800 px-2 py-0.5 rounded text-[10px] font-bold">Chờ duyệt</span>`;
            let actionBtn = `<button onclick="showDuyetModal('pk', '${p.id}', 'Đơn phúc khảo ${p.id} - ${p.name}')" class="bg-[#9e1c22] hover:bg-red-800 text-white px-3 py-1 rounded text-[10px] font-bold shadow">PHÊ DUYỆT</button>`;

            if(p.status === "Đã phê duyệt phúc khảo") {
                badge = `<span class="bg-green-100 text-green-800 px-2 py-0.5 rounded text-[10px] font-bold">✓ Đã duyệt</span>`;
                actionBtn = `<span class="text-gray-400 italic text-[10px] font-medium">Xác nhận bởi: ${p.approver || 'Trưởng phòng'}<br>${p.approvedAt || ''}</span>`;
            }

            tbody.innerHTML += `
                <tr class="hover:bg-gray-50 transition-colors">
                    <td class="px-6 py-4 font-mono font-bold text-gray-800">${p.id}</td>
                    <td class="px-6 py-4 font-semibold text-gray-900">${p.subjectName}</td>
                    <td class="px-6 py-4">${p.name} (${p.msv})</td>
                    <td class="px-6 py-4 text-center font-mono">${p.originalPt1}</td>
                    <td class="px-6 py-4 text-center font-mono font-bold text-red-600">${p.ptFinal}</td>
                    <td class="px-6 py-4 text-center">${badge}</td>
                    <td class="px-6 py-4 text-right">${actionBtn}</td>
                </tr>
            `;
        });
    }

    function renderDuyetThuLao() {
        const tbody = document.getElementById('duyet-thulao-tbody');
        tbody.innerHTML = '';

        let grandTotalGV = canBoCoiThiData.length;
        let grandTotalCa = 0;
        let grandTotalGio = 0;
        let grandTotalMoney = 0;

        canBoCoiThiData.forEach(gv => {
            const confirmedShifts = gv.history.filter(h => h.confirmed);
            const totalCa = gv.history.length;
            const totalGio = confirmedShifts.reduce((sum, h) => sum + h.hours, 0);
            const totalMoney = totalGio * gv.pricePerHour;

            grandTotalCa += totalCa;
            grandTotalGio += totalGio;
            grandTotalMoney += totalMoney;

            tbody.innerHTML += `
                <tr class="hover:bg-gray-50 transition-colors text-xs">
                    <td class="px-4 py-2.5 font-mono font-bold text-gray-800">${gv.code}</td>
                    <td class="px-4 py-2.5 font-semibold text-gray-900">${gv.name}</td>
                    <td class="px-4 py-2.5 text-gray-600">${gv.donVi}</td>
                    <td class="px-4 py-2.5 text-center font-bold text-indigo-700">${totalCa} ca</td>
                    <td class="px-4 py-2.5 text-center font-bold text-blue-900">${totalGio} giờ</td>
                    <td class="px-4 py-2.5 text-right font-bold text-red-700">${totalMoney.toLocaleString()} VND</td>
                </tr>
            `;
        });

        tbody.innerHTML += `
            <tr class="bg-gray-50 text-xs font-bold border-t-2 border-gray-200">
                <td colspan="3" class="px-4 py-3 text-right uppercase text-gray-600">Tổng cộng quyết toán:</td>
                <td class="px-4 py-3 text-center text-indigo-700">${grandTotalCa} ca</td>
                <td class="px-4 py-3 text-center text-blue-900">${grandTotalGio} giờ</td>

    function showDuyetModal(type, targetId, docName) {
        duyetTargetType = type;
        duyetTargetId = targetId;

        document.getElementById('duyet-doc-name').innerText = docName;
        document.getElementById('duyet-password').value = '';

    async function confirmDuyetExecute() {
        const pwInput = document.getElementById('duyet-password');
        const pw = pwInput ? pwInput.value.trim() : '';

        if (!pw) {
            const errElem = document.getElementById('duyet-error');
            if (errElem) errElem.classList.remove('hidden-view');
            return;
        }

        const targetIds = Array.isArray(duyetTargetId) ? duyetTargetId : [duyetTargetId];

        try {
            await fetch('/ldp/api/phe-duyet/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': typeof getCookie === 'function' ? getCookie('csrftoken') : ''
                },
                body: JSON.stringify({
                    type: duyetTargetType,
                    targets: targetIds,
                    password: pw
                })
            });
        } catch(e) {
            console.log("Client side fallback approval execution");
        }

        const timestamp = new Date().toLocaleString('vi-VN');
        targetIds.forEach(tid => {
            if (duyetTargetType === 'diem') {
                const t = tuiPhachData.find(x => x.id === tid);
                if (t) {
                    t.status = "Đã duyệt bảng điểm";
                    t.approver = "Trưởng phòng";
                    t.approvedAt = timestamp;
                }
            } else if (duyetTargetType === 'pk') {
                const p = phucKhaoData.find(x => x.id === tid);
                if (p) {
                    p.status = "Đã phê duyệt phúc khảo";
                    p.approver = "Trưởng phòng";
                    p.approvedAt = timestamp;
                }
            } else if (duyetTargetType === 'thulao') {
                isThulaoApproved = true;
                thulaoApprover = "Trưởng phòng";
                thulaoApprovedAt = timestamp;
            }
        });

        hideDuyetModal();
        showGlobalToast("Phê duyệt thành công", `Đã xác thực mật khẩu & phê duyệt thành công ${targetIds.length} mục trên hệ thống.`);
        if (typeof saveStateToServer === 'function') saveStateToServer();
        if (activeViewId === 'view-home') renderHome();
    }



    function showGlobalToast(title, msg, type = 'success') {
        const toast = document.getElementById('toast-global');
        const icon = document.getElementById('toast-global-icon');

        toast.className = "fixed bottom-6 right-6 text-white px-6 py-4 rounded shadow-xl flex items-center gap-3 animate-fade-in-up z-[200]";

        if (type === 'error') {
            toast.classList.add('bg-red-600');
            icon.setAttribute('data-lucide', 'alert-circle');
        } else {
            toast.classList.add('bg-green-600');
            icon.setAttribute('data-lucide', 'check-circle-2');

        document.getElementById('toast-global-title').innerText = title;
        document.getElementById('toast-global-msg').innerText = msg || '';
        toast.classList.remove('hidden-view');
        initIcons();

        setTimeout(() => toast.classList.add('hidden-view'), 4000);

    function renderDuyetLichThi() {
        const tbody = document.getElementById('duyet-lich-thi-tbody');
        if (!tbody) return;

        const searchKw = (document.getElementById('search-duyet-lich')?.value || '').toLowerCase().trim();

        let list = [...lichThiData];

        // Apply search keyword
        if (searchKw) {
            list = list.filter(item => 
                item.id.toLowerCase().includes(searchKw) || 
                item.subjectName.toLowerCase().includes(searchKw) || 
                (item.room && item.room.toLowerCase().includes(searchKw))
            );
        }

        // Apply status filter
        if (duyetLichStatusFilter !== 'all') {
            list = list.filter(item => {
                const status = (systemConfigsData.lichThiStatus && systemConfigsData.lichThiStatus[item.id]) || 'Chờ phê duyệt';
                if (duyetLichStatusFilter === 'cho-duyet') return status === 'Chờ phê duyệt' || status === 'Chờ duyệt';
                if (duyetLichStatusFilter === 'da-duyet') return status === 'Đã phê duyệt';
                if (duyetLichStatusFilter === 'tu-choi') return status === 'Từ chối';
                return true;
            });
        }

        if (list.length === 0) {
            tbody.innerHTML = `<tr><td colspan="9" class="text-center py-8 text-gray-500 italic">Không tìm thấy lịch thi nào.</td></tr>`;
            return;
        }

        tbody.innerHTML = list.map((item, index) => {
            const status = (systemConfigsData.lichThiStatus && systemConfigsData.lichThiStatus[item.id]) || 'Chờ phê duyệt';
            let badgeClass = "bg-yellow-100 text-yellow-800";
            if (status === "Đã phê duyệt") badgeClass = "bg-green-100 text-green-800 font-bold";
            else if (status === "Từ chối") badgeClass = "bg-red-100 text-red-800";

            return `
                <tr class="hover:bg-gray-50 border-b border-gray-100">
                    <td class="select-col-duyet-lich ${selectModeLich ? '' : 'hidden'} px-3 py-3 text-center w-8">
                        <input type="checkbox" class="chk-duyet-lich cursor-pointer" data-id="${item.id}" onchange="updateSelectActionsVisibility('duyet-lich')" />
                    </td>
                    <td class="px-4 py-3 text-center font-semibold text-gray-500">${index + 1}</td>
                    <td class="px-4 py-3 font-mono font-bold text-blue-900">${item.id}</td>

                    <td class="px-4 py-3 text-center">
                        ${status === 'Chờ phê duyệt' || status === 'Chờ duyệt' ? `
                            <button onclick="changeDanhSachThiStatus('${item.id}', 'Đã phê duyệt')" class="bg-green-50 text-green-700 border border-green-200 hover:bg-green-100 font-bold px-2 py-1 rounded text-[10px] mr-1">Phê duyệt</button>
                            <button onclick="changeDanhSachThiStatus('${item.id}', 'Từ chối')" class="bg-red-50 text-red-700 border border-red-200 hover:bg-red-100 font-bold px-2 py-1 rounded text-[10px]">Từ chối</button>
                        ` : `<span class="text-gray-400 italic text-[11px]">Đã xử lý</span>`}
                    </td>
                </tr>
            `;
        }).join('');
    }
    window.renderDuyetDanhSachThi = renderDuyetDanhSachThi;

    function renderDuyetDeThi() {
        const tbody = document.getElementById('duyet-de-thi-tbody');
        if (!tbody) return;

        const searchKw = (document.getElementById('search-duyet-de')?.value || '').toLowerCase().trim();

        let list = [...deThiData];

        // Apply search keyword
        if (searchKw) {
            list = list.filter(item => 
                item.id.toLowerCase().includes(searchKw) || 
                item.hocPhan.toLowerCase().includes(searchKw) ||
                (item.nguoiNop && item.nguoiNop.toLowerCase().includes(searchKw))
            );
        }

        // Apply status filter
        if (duyetDeStatusFilter !== 'all') {
            list = list.filter(item => {
                const status = item.trangThai || 'Chờ phê duyệt';
                const mappedStatus = (status === 'ChoRaSoat' || status === 'Chờ rà soát' || status === 'Chờ phê duyệt') ? 'cho-duyet' :
                                     (status === 'Dat' || status === 'Đạt' || status === 'Đã phê duyệt') ? 'da-duyet' : 'tu-choi';
                return mappedStatus === duyetDeStatusFilter;
            });
        }

        if (list.length === 0) {
            tbody.innerHTML = `<tr><td colspan="9" class="text-center py-8 text-gray-500 italic">Không tìm thấy đề thi nào.</td></tr>`;
            return;
        }

        tbody.innerHTML = list.map((item, index) => {
            const status = item.trangThai || 'Chờ phê duyệt';
            let statusText = 'Chờ phê duyệt';
            let badgeClass = "bg-yellow-100 text-yellow-800";
            
            if (status === 'Dat' || status === 'Đạt' || status === 'Đã phê duyệt') {
                statusText = 'Đã phê duyệt';
                badgeClass = "bg-green-100 text-green-800 font-bold";
            } else if (status === 'ChoChinhSua' || status === 'Chờ chỉnh sửa' || status === 'Từ chối') {
                statusText = 'Từ chối';
                badgeClass = "bg-red-100 text-red-800";
            }

            return `
                <tr class="hover:bg-gray-50 border-b border-gray-100">
                    <td class="select-col-duyet-de ${selectModeDe ? '' : 'hidden'} px-3 py-3 text-center w-8">
                        <input type="checkbox" class="chk-duyet-de cursor-pointer" data-id="${item.id}" onchange="updateSelectActionsVisibility('duyet-de')" />
                    </td>
                    <td class="px-4 py-3 text-center font-semibold text-gray-500">${index + 1}</td>
                    <td class="px-4 py-3 font-mono font-bold text-blue-900">${item.id}</td>
                    <td class="px-4 py-3 font-semibold text-gray-800">${item.hocPhan}</td>
                    <td class="px-4 py-3 text-gray-600 text-xs">
                        Người nộp: <strong>${item.nguoiNop || 'N/A'}</strong><br/>
                        Thời gian: <span class="text-gray-400">${item.thoiGian || 'N/A'}</span>
                    </td>
                    <td class="px-4 py-3 text-center font-semibold text-blue-600">
                        <a href="#" class="text-blue-600 font-bold hover:underline" onclick="event.preventDefault(); showGlobalToast('Tải tệp', 'Đang tải xuống đề thi ${item.fileName}...');">${item.fileName || 'Chưa đính kèm'}</a>
                    </td>
                    <td class="px-4 py-3 text-gray-600 italic">${item.nhanXet || 'Không có nhận xét'}</td>
                    <td class="px-4 py-3 text-center">
                        <span class="px-2 py-0.5 rounded text-[10px] font-bold ${badgeClass}">${statusText}</span>
                    </td>
                    <td class="px-4 py-3 text-center">
                        ${statusText === 'Chờ phê duyệt' ? `
                            <button onclick="changeDeThiStatus('${item.id}', 'Đạt')" class="bg-green-50 text-green-700 border border-green-200 hover:bg-green-100 font-bold px-2 py-1 rounded text-[10px] mr-1">Phê duyệt</button>
                            <button onclick="changeDeThiStatus('${item.id}', 'Chờ chỉnh sửa')" class="bg-red-50 text-red-700 border border-red-200 hover:bg-red-100 font-bold px-2 py-1 rounded text-[10px]">Từ chối</button>
                        ` : `<span class="text-gray-400 italic text-[11px]">Đã xử lý</span>`}
                    </td>
                </tr>
            `;
        }).join('');
    }
    window.renderDuyetDeThi = renderDuyetDeThi;
</script>
