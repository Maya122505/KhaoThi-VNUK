<!-- Scripts Section -->
<script>
    // Synced global variables
    let kyThiData = [];
    let caThiData = [];
    let lichThiData = [];
    let hocPhiData = [];
    let lopThiDiemData = [];

    let phongThiGocData = [];
    let tuiPhachData = [];
    let phieuGiaoNhanData = [];
    let canBoCoiThiData = [];
    let phucKhaoData = [];
    let deThiData = [];
    let danhSachThiData = [];
    let phongThiData = [];
    let phanCongPhongData = [];
    let inSaoData = [];
    let donGiaRulesData = [];

    let isStateLoaded = false;
    let activeViewId = "view-home";

    let duyetTargetType = ""; // 'diem', 'pk', 'thulao', 'lich-thi', 'de-thi', 'danh-sach-thi'
    let duyetTargetId = "";   // item id

    let tuChoiTargetType = ""; // 'lich-thi', 'de-thi', 'danh-sach-thi'
    let tuChoiTargetId = "";

    let activeDuyetLichThiStatusFilter = 'all';
    let activeDuyetDeThiStatusFilter = 'all';
    let activeDuyetDanhSachThiStatusFilter = 'all';

    // Thù lao approved state
    let isThulaoApproved = false;
    let thulaoApprover = "";
    let thulaoApprovedAt = "";



    window.onload = async function() {
        initIcons();
        try {
            await loadStateFromServer();
        } catch (err) {
            console.error("Lỗi loadStateFromServer:", err);
        }
        const hash = window.location.hash.replace('#', '');
        const initialView = (hash && document.getElementById(`view-${hash}`)) ? `view-${hash}` : 'view-home';
        navigate(initialView, false);
    };

    window.addEventListener('popstate', function() {
        const hash = window.location.hash.replace('#', '');
        const targetView = (hash && document.getElementById(`view-${hash}`)) ? `view-${hash}` : 'view-home';
        if (activeViewId !== targetView) {
            navigate(targetView, false);
        }
    });

    function initIcons() { lucide.createIcons(); }

    async function loadStateFromServer() {
        try {
            const res = await fetch('/api/get_state/');
            const data = await res.json();

            kyThiData = data.kyThiData || [];
            caThiData = data.caThiData || [];
            lichThiData = data.lichThiData || [];
            hocPhiData = data.hocPhiData || [];
            lopThiDiemData = data.lopThiDiemData || [];

            phongThiGocData = data.phongThiGocData || [];
            tuiPhachData = data.tuiPhachData || [];
            phieuGiaoNhanData = data.phieuGiaoNhanData || [];
            canBoCoiThiData = data.canBoCoiThiData || [];
            phucKhaoData = data.phucKhaoData || [];
            phongThiData = data.phongThiData || [];
            phanCongPhongData = data.phanCongPhongData || [];
            inSaoData = data.inSaoData || [];
            donGiaRulesData = data.donGiaRulesData || [];
            if (data.systemConfigsData) {
                isThulaoApproved = !!data.systemConfigsData.isThulaoApproved;
                thulaoApprover = data.systemConfigsData.thulaoApprover || "";
                thulaoApprovedAt = data.systemConfigsData.thulaoApprovedAt || "";
            }
            deThiData = data.deThiData || [];
            danhSachThiData = data.danhSachThiData || [];
            isStateLoaded = true;
            if (activeViewId) {
                navigate(activeViewId, false);
            }
        } catch(e) {
            console.error("Lỗi đồng bộ dữ liệu:", e);
        }
    }

    async function saveStateToServer() {
        try {
            const res = await fetch('/api/save_state/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    kyThiData,
                    caThiData,
                    lichThiData,
                    hocPhiData,
                    lopThiDiemData,
                    phongThiGocData,
                    tuiPhachData,
                    phieuGiaoNhanData,
                    canBoCoiThiData,
                    phucKhaoData,
                    deThiData,
                    danhSachThiData,
                    phongThiData,
                    phanCongPhongData,
                    inSaoData,
                    donGiaRulesData,
                    systemConfigsData: {
                        isThulaoApproved,
                        thulaoApprover,
                        thulaoApprovedAt
                    }
                })
            });
            if (!res.ok) {
                const errData = await res.json().catch(() => ({}));
                console.error("Server trả về lỗi:", res.status, errData);
                if (typeof showGlobalToast === "function") {
                    showGlobalToast("Lỗi đồng bộ", "Không thể lưu dữ liệu lên server. Vui lòng thử lại!", "error");
                }
            }
        } catch(e) {
            console.error("Lỗi lưu dữ liệu:", e);
            if (typeof showGlobalToast === "function") {
                showGlobalToast("Lỗi đồng bộ", "Không thể kết nối đến server để lưu dữ liệu!", "error");
            }
        }
    }

    function navigate(viewId, updateHash = true) {
        document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden-view'));
        const targetView = document.getElementById(viewId);
        if(targetView) targetView.classList.remove('hidden-view');

        document.querySelectorAll('.nav-btn').forEach(btn => btn.className = "nav-btn px-5 py-3 text-sm font-semibold border-r border-red-800 transition-colors hover:bg-red-800");

        activeViewId = viewId;
        const activeKey = viewId.replace('view-', '');
        if (updateHash) {
            const hashStr = '#' + activeKey;
            if (window.location.hash !== hashStr) {
                history.pushState(null, '', hashStr);
            }
        }

        if(viewId === 'view-home') {
            document.getElementById('nav-btn-home').className += " bg-red-800";
            renderHome();
        } else if(viewId === 'view-duyet-lich-thi') {
            const inp = document.getElementById('search-duyet-lich');
            if(inp) inp.value = '';
            document.getElementById('nav-btn-duyet-lich-thi').className += " bg-red-800";
            renderDuyetLichThi();
        } else if(viewId === 'view-duyet-danh-sach-thi') {
            const inp = document.getElementById('search-duyet-ds-thi');
            if(inp) inp.value = '';
            document.getElementById('nav-btn-duyet-danh-sach-thi').className += " bg-red-800";
            renderDuyetDanhSachThi();
        } else if(viewId === 'view-duyet-de-thi') {
            const inp = document.getElementById('search-duyet-de');
            if(inp) inp.value = '';
            document.getElementById('nav-btn-duyet-de-thi').className += " bg-red-800";
            renderDuyetDeThi();
        } else if(viewId === 'view-duyet-diem') {
            const inp = document.getElementById('duyet-search-input');
            if(inp) inp.value = '';
            document.getElementById('nav-btn-duyet-diem').className += " bg-red-800";
            renderDuyetDiem();
        } else if(viewId === 'view-duyet-phuc-khao') {
            document.getElementById('nav-btn-duyet-phuc-khao').className += " bg-red-800";
            renderDuyetPhucKhao();
        } else if(viewId === 'view-duyet-thu-lao') {
            document.getElementById('nav-btn-duyet-thu-lao').className += " bg-red-800";
            renderDuyetThuLao();
        }
        initIcons();
    }

    // ==========================================================
    // TRANG CHỦ & NHÁNH TÁC VỤ NHANH
    // ==========================================================
    function renderHome() {
        const countDiem = tuiPhachData.filter(t => t.status === "Đã đối chiếu hợp lệ" || t.status === "Chờ phê duyệt" || t.status === "ChoKhopDiem" || t.status === "Chờ khớp điểm").length;
        const countPk = phucKhaoData.filter(p => p.status === "Đã xử lý").length;
        const countLich = lichThiData.filter(l => !l.status || l.status === "Chờ duyệt" || l.status === "Chờ phê duyệt").length;
        const countDs = danhSachThiData.filter(d => !d.status || d.status === "Chờ duyệt" || d.status === "Chờ phê duyệt").length;
        const countDe = deThiData.filter(d => !d.trangThai || d.trangThai === "ChoPheDuyet" || d.trangThai === "Chờ phê duyệt" || d.trangThai === "ChoRaSoat").length;

        document.getElementById('count-diem-cho').innerText = countDiem;
        document.getElementById('count-pk-cho').innerText = countPk;
        document.getElementById('count-lich-cho').innerText = countLich;
        document.getElementById('count-ds-cho').innerText = countDs;
        document.getElementById('count-de-cho').innerText = countDe;
        document.getElementById('count-thu-lao-cho').innerText = isThulaoApproved ? 0 : 1;

        const qaList = document.getElementById('quick-action-list');
        qaList.innerHTML = '';

        let hasActions = false;

        if (countLich > 0) {
            hasActions = true;
            qaList.innerHTML += `
                <div class="flex justify-between items-center p-3 border border-red-100 bg-red-50 rounded-lg">
                    <span class="font-medium text-red-900 text-xs">Có <strong>${countLich} kế hoạch lịch thi</strong> đang chờ Trưởng phòng xem xét phê duyệt.</span>
                    <button onclick="navigate('view-duyet-lich-thi')" class="bg-[#9e1c22] hover:bg-red-800 text-white font-bold px-3 py-1.5 rounded text-[10px] shadow transition-colors">PHÊ DUYỆT LỊCH THI</button>
                </div>
            `;
        }

        if (countDs > 0) {
            hasActions = true;
            qaList.innerHTML += `
                <div class="flex justify-between items-center p-3 border border-blue-100 bg-blue-50 rounded-lg">
                    <span class="font-medium text-blue-900 text-xs">Có <strong>${countDs} danh sách thi sinh viên</strong> đang chờ kiểm duyệt điều kiện thi.</span>
                    <button onclick="navigate('view-duyet-danh-sach-thi')" class="bg-blue-700 hover:bg-blue-800 text-white font-bold px-3 py-1.5 rounded text-[10px] shadow transition-colors">PHÊ DUYỆT DANH SÁCH</button>
                </div>
            `;
        }

        if (countDe > 0) {
            hasActions = true;
            qaList.innerHTML += `
                <div class="flex justify-between items-center p-3 border border-amber-100 bg-amber-50 rounded-lg">
                    <span class="font-medium text-amber-900 text-xs">Có <strong>${countDe} đề thi đã rà soát</strong> chờ phê duyệt để chuyển sang in sao.</span>
                    <button onclick="navigate('view-duyet-de-thi')" class="bg-amber-700 hover:bg-amber-800 text-white font-bold px-3 py-1.5 rounded text-[10px] shadow transition-colors">PHÊ DUYỆT ĐỀ THI</button>
                </div>
            `;
        }

        if (countDiem > 0) {
            hasActions = true;
            qaList.innerHTML += `
                <div class="flex justify-between items-center p-3 border border-purple-100 bg-purple-50 rounded-lg">
                    <span class="font-medium text-purple-900 text-xs">Có <strong>${countDiem} bảng điểm đối soát lần 2</strong> đang trình duyệt.</span>
                    <button onclick="navigate('view-duyet-diem')" class="bg-purple-700 hover:bg-purple-800 text-white font-bold px-3 py-1.5 rounded text-[10px] shadow transition-colors">XEM BẢNG ĐIỂM</button>
                </div>
            `;
        }

        if (countPk > 0) {
            hasActions = true;
            qaList.innerHTML += `
                <div class="flex justify-between items-center p-3 border border-indigo-100 bg-indigo-50 rounded-lg">
                    <span class="font-medium text-indigo-900 text-xs">Có <strong>${countPk} biên bản phúc khảo</strong> đã hoàn thành chấm lại, chờ phê duyệt.</span>
                    <button onclick="navigate('view-duyet-phuc-khao')" class="bg-indigo-700 hover:bg-indigo-800 text-white font-bold px-3 py-1.5 rounded text-[10px] shadow transition-colors">PHÊ DUYỆT PHÚC KHẢO</button>
                </div>
            `;
        }

        if (!isThulaoApproved) {
            hasActions = true;
            qaList.innerHTML += `
                <div class="flex justify-between items-center p-3 border border-pink-100 bg-pink-50 rounded-lg">
                    <span class="font-medium text-pink-900 text-xs">Báo cáo quyết toán giờ coi thi học kỳ III chờ Trưởng phòng phê duyệt thù lao.</span>
                    <button onclick="navigate('view-duyet-thu-lao')" class="bg-pink-700 hover:bg-pink-800 text-white font-bold px-3 py-1.5 rounded text-[10px] shadow transition-colors">KIỂM DUYỆT THÙ LAO</button>
                </div>
            `;
        }

        if(!hasActions) {
            qaList.innerHTML = `<div class="text-center py-6 text-gray-400 italic text-xs">Tất cả hồ sơ khảo thí đã được phê duyệt an toàn. Không có hành động chờ duyệt.</div>`;
        }
    }

    // ==========================================================
    // QUẢN LÝ CHẾ ĐỘ CHỌN & CHỌN TẤT CẢ (MULTI-SELECT SYSTEM FOR LĐP)
    // ==========================================================
    const selectModesState = {}; // key -> 0: Off, 1: On, 2: All Checked

    function updateBulkButtons(key) {
        const checkedCount = document.querySelectorAll(`.select-cb-${key}:checked`).length;
        const btnApprove = document.getElementById(`btn-approve-all-${key}`);
        const btnReject = document.getElementById(`btn-reject-all-${key}`);
        if (checkedCount > 0) {
            if (btnApprove) { btnApprove.classList.remove('hidden'); btnApprove.classList.add('flex'); }
            if (btnReject) { btnReject.classList.remove('hidden'); btnReject.classList.add('flex'); }
        } else {
            if (btnApprove) { btnApprove.classList.add('hidden'); btnApprove.classList.remove('flex'); }
            if (btnReject) { btnReject.classList.add('hidden'); btnReject.classList.remove('flex'); }
        }
    }

    function toggleSelectMode(key) {
        const btn = document.getElementById(`btn-select-${key}`);
        const btnSpan = btn ? btn.querySelector('span') : null;
        const currentState = selectModesState[key] || 0;

        if (currentState === 0) {
            selectModesState[key] = 1;
            if (btnSpan) btnSpan.innerText = "Chọn tất cả";
            document.querySelectorAll(`.select-cb-${key}, .select-col-${key}`).forEach(el => el.classList.remove('hidden'));
            updateBulkButtons(key);
        } else if (currentState === 1) {
            selectModesState[key] = 2;
            if (btnSpan) btnSpan.innerText = "Bỏ chọn tất cả";
            document.querySelectorAll(`.select-cb-${key}`).forEach(cb => cb.checked = true);
            updateBulkButtons(key);
        } else {
            selectModesState[key] = 0;
            if (btnSpan) btnSpan.innerText = "Chọn";
            document.querySelectorAll(`.select-cb-${key}`).forEach(cb => cb.checked = false);
            document.querySelectorAll(`.select-cb-${key}, .select-col-${key}`).forEach(el => el.classList.add('hidden'));
            updateBulkButtons(key);
        }
        if (typeof initIcons !== "undefined") initIcons();
    }

    function isExamReviewedAndPassed(dt) {
        if (!dt) return false;
        const st = dt.trangThai || '';
        if (st === "Đạt" || st === "Dat") return true;
        if (st === "Chờ rà soát" || st === "ChoRaSoat" || st === "Chờ chỉnh sửa" || st === "Không đạt" || st === "ChoPheDuyet" || st === "Chờ phê duyệt") {
            const nx = (dt.nhanXet || '').toLowerCase();
            return (nx.includes("đạt") && !nx.includes("không"));
        }
        const nx = (dt.nhanXet || '').toLowerCase();
        return (nx.includes("đạt") && !nx.includes("không"));
    }

    function renderSelectCheckbox(key, extraClass = "", itemId = "") {
        const isVisible = (selectModesState[key] > 0);
        const isChecked = (selectModesState[key] === 2);
        return `<input type="checkbox" data-id="${itemId}" class="select-cb-${key} ${isVisible ? '' : 'hidden'} ${extraClass} w-4 h-4 text-red-600 rounded border-gray-300 focus:ring-red-500 cursor-pointer shrink-0" ${isChecked ? 'checked' : ''} onclick="event.stopPropagation()" onchange="updateBulkButtons('${key}')">`;
    }

    function handleApproveSelected(key) {
        const checkedCbs = document.querySelectorAll(`.select-cb-${key}:checked`);
        if (checkedCbs.length === 0) {
            showGlobalToast("Thông báo", "Vui lòng chọn ít nhất một mục để phê duyệt.", "warning");
            return;
        }
        const ids = Array.from(checkedCbs).map(cb => cb.getAttribute('data-id')).filter(Boolean);
        if (key === 'duyet-de') {
            const unreviewed = deThiData.filter(d => ids.includes(d.id) && !isExamReviewedAndPassed(d));
            if (unreviewed.length > 0) {
                showGlobalToast("Cảnh báo", `Có ${unreviewed.length} đề thi chưa được rà soát (${unreviewed.map(u => u.id).join(', ')}). Vui lòng bỏ chọn các đề thi này trước khi phê duyệt!`, "warning");
                return;
            }
        }
        showDuyetModal(key, ids.join(','), `${ids.length} mục đã chọn`);
    }

    function handleRejectSelected(key) {
        const checkedCbs = document.querySelectorAll(`.select-cb-${key}:checked`);
        if (checkedCbs.length === 0) {
            showGlobalToast("Thông báo", "Vui lòng chọn ít nhất một mục để từ chối.", "warning");
            return;
        }
        const ids = Array.from(checkedCbs).map(cb => cb.getAttribute('data-id')).filter(Boolean);
        if (key === 'duyet-de') {
            const unreviewed = deThiData.filter(d => ids.includes(d.id) && !isExamReviewedAndPassed(d));
            if (unreviewed.length > 0) {
                showGlobalToast("Cảnh báo", `Có ${unreviewed.length} đề thi chưa được rà soát (${unreviewed.map(u => u.id).join(', ')}). Vui lòng bỏ chọn các đề thi này trước khi từ chối!`, "warning");
                return;
            }
        }
        showTuChoiModal(key, ids.join(','), `${ids.length} mục đã chọn`);
    }

    // ==========================================================
    // USE CASE 1: PHÊ DUYỆT LỊCH THI
    // ==========================================================
    function filterDuyetLichThiStatus(statusKey) {
        activeDuyetLichThiStatusFilter = statusKey;
        document.querySelectorAll('.flt-status-btn').forEach(btn => {
            btn.className = "flt-status-btn px-3 py-1.5 text-xs font-bold bg-white text-gray-700 hover:bg-gray-50 border-t border-b border-r border-gray-300";
        });
        const activeBtn = document.getElementById(`flt-status-${statusKey}`);
        if(activeBtn) {
            activeBtn.className = "flt-status-btn px-3 py-1.5 text-xs font-bold bg-[#9e1c22] text-white border border-[#9e1c22]";
        }
        renderDuyetLichThi();
    }

    function renderDuyetLichThi() {
        const tbody = document.getElementById('duyet-lich-thi-tbody');
        if(!tbody) return;
        tbody.innerHTML = '';

        const kw = (document.getElementById('search-duyet-lich')?.value || '').toLowerCase().trim();

        const filtered = lichThiData.filter(lt => {
            const matchKw = !kw || 
                (lt.id && lt.id.toLowerCase().includes(kw)) ||
                (lt.subjectName && lt.subjectName.toLowerCase().includes(kw)) ||
                (lt.subjectCode && lt.subjectCode.toLowerCase().includes(kw)) ||
                (lt.room && lt.room.toLowerCase().includes(kw));

            const st = lt.status || "Chờ duyệt";
            let matchStatus = true;
            if (activeDuyetLichThiStatusFilter === 'cho-duyet') {
                matchStatus = (st === "Chờ duyệt" || st === "Chờ phê duyệt");
            } else if (activeDuyetLichThiStatusFilter === 'da-duyet') {
                matchStatus = (st === "Đã phê duyệt" || st === "Đã duyệt");
            } else if (activeDuyetLichThiStatusFilter === 'tu-choi') {
                matchStatus = (st === "Từ chối" || st === "Từ chối phê duyệt");
            }

            return matchKw && matchStatus;
        });

        if (filtered.length === 0) {
            tbody.innerHTML = `<tr><td colspan="9" class="px-6 py-12 text-center text-gray-400 italic font-semibold">Không có lịch thi cần phê duyệt.</td></tr>`;
            return;
        }

        filtered.forEach((lt, idx) => {
            const st = lt.status || "Chờ duyệt";
            let badge = `<span class="text-amber-600 font-bold whitespace-nowrap inline-flex items-center gap-1"><i data-lucide="clock" class="w-3.5 h-3.5"></i> Chờ phê duyệt</span>`;
            let actions = `
                <div class="flex items-center justify-end gap-2 whitespace-nowrap">
                    <button onclick="showDuyetModal('duyet-lich', '${lt.id}', 'Lịch thi ${lt.id} - ${lt.subjectName}')" class="bg-emerald-50 hover:bg-emerald-600 text-emerald-700 hover:text-white border border-emerald-200 hover:border-emerald-600 font-semibold px-2.5 py-1 rounded-md text-xs transition-all duration-150 inline-flex items-center gap-1.5 shadow-2xs"><i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i> Phê duyệt</button>
                    <button onclick="showTuChoiModal('duyet-lich', '${lt.id}', 'Lịch thi ${lt.id} - ${lt.subjectName}')" class="bg-rose-50 hover:bg-rose-600 text-rose-700 hover:text-white border border-rose-200 hover:border-rose-600 font-semibold px-2.5 py-1 rounded-md text-xs transition-all duration-150 inline-flex items-center gap-1.5 shadow-2xs"><i data-lucide="x-circle" class="w-3.5 h-3.5"></i> Từ chối</button>
                </div>
            `;

            if (st === "Đã phê duyệt" || st === "Đã duyệt") {
                badge = `<span class="text-emerald-600 font-bold whitespace-nowrap inline-flex items-center gap-1"><i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i> Đã phê duyệt</span>`;
                actions = `
                    <div class="flex items-center justify-end gap-1.5 whitespace-nowrap">
                        <span class="text-gray-400 italic text-xs whitespace-nowrap flex items-center gap-1"><i data-lucide="check-check" class="w-3.5 h-3.5 text-emerald-600"></i> Đã duyệt: ${lt.approvedAt || ''}</span>
                    </div>
                `;
            } else if (st === "Từ chối" || st === "Từ chối phê duyệt") {
                badge = `<span class="text-rose-600 font-bold whitespace-nowrap inline-flex items-center gap-1" title="${lt.lyDoTuChoi || ''}"><i data-lucide="x-circle" class="w-3.5 h-3.5"></i> Từ chối</span>`;
                actions = `
                    <div class="flex items-center justify-end gap-1.5 whitespace-nowrap">
                        <button onclick="showDuyetModal('duyet-lich', '${lt.id}', 'Lịch thi ${lt.id} - ${lt.subjectName}')" class="bg-amber-50 hover:bg-amber-600 text-amber-700 hover:text-white border border-amber-200 hover:border-amber-600 font-semibold px-2.5 py-1 rounded-md text-xs transition-all duration-150 inline-flex items-center gap-1.5 shadow-2xs"><i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i> Duyệt lại</button>
                    </div>
                `;
            }

            tbody.innerHTML += `
                <tr class="hover:bg-gray-50 transition-colors cursor-pointer" onclick="showLichThiDetail('${lt.id}')">
                    <td class="select-col-duyet-lich ${selectModesState['duyet-lich'] > 0 ? '' : 'hidden'} px-3 py-3 text-center">
                        ${renderSelectCheckbox('duyet-lich', '', lt.id)}
                    </td>
                    <td class="px-4 py-3 text-center text-gray-400 font-mono whitespace-nowrap">${idx + 1}</td>

    function hideLdpDetailModal() {
        document.getElementById('modal-chi-tiet-ldp').classList.add('hidden-view');
    }

    let selectedDuyetDiemIds = [];

    function toggleSelectAllDuyet(checked) {
        const filterVal = document.getElementById('duyet-filter-select')?.value || 'cho';
        const filtered = (tuiPhachData || []).filter(t => {
            if (!t) return false;
            const st = (t.status || '').trim();
            if (filterVal === 'cho') return (st === "Đã đối chiếu hợp lệ" || st === "Chờ phê duyệt" || st === "ChoKhopDiem" || st === "Chờ khớp điểm");
            if (filterVal === 'da') return (st === "Đã duyệt bảng điểm" || st === "Đã phê duyệt");
            return (st === "Đã đối chiếu hợp lệ" || st === "Chờ phê duyệt" || st === "ChoKhopDiem" || st === "Chờ khớp điểm" || st === "Đã duyệt bảng điểm" || st === "Đã phê duyệt");
        });
        if (checked) {
            selectedDuyetDiemIds = filtered.map(t => t.id);
        } else {
            selectedDuyetDiemIds = [];
        }
        renderDuyetDiem();
        updateBatchDuyetButton();
    }
    window.toggleSelectAllDuyet = toggleSelectAllDuyet;

    function toggleSelectDuyetDiem(e, id) {
        if (e && e.stopPropagation) e.stopPropagation();
        const isChecked = e.target ? e.target.checked : e;
        if (isChecked) {
            if (!selectedDuyetDiemIds.includes(id)) selectedDuyetDiemIds.push(id);
        } else {
            selectedDuyetDiemIds = selectedDuyetDiemIds.filter(x => x !== id);
        }
        updateBatchDuyetButton();
    }
    window.toggleSelectDuyetDiem = toggleSelectDuyetDiem;

    function updateBatchDuyetButton() {
        const btn = document.getElementById('btn-batch-duyet-diem');
        const countSpan = document.getElementById('count-checked-duyet');
        if (countSpan) countSpan.innerText = selectedDuyetDiemIds.length;
        if (btn) {
            if (selectedDuyetDiemIds.length > 0) {
                btn.disabled = false;
                btn.className = "bg-[#9e1c22] hover:bg-red-800 text-white text-xs font-bold px-5 py-2.5 rounded shadow flex items-center gap-2 transition-all cursor-pointer";
            } else {
                btn.disabled = true;
                btn.className = "bg-[#9e1c22] opacity-50 cursor-not-allowed text-white text-xs font-bold px-5 py-2.5 rounded shadow flex items-center gap-2 transition-all";
            }
        }
    }

    function executeBatchDuyetDiem() {
        if (selectedDuyetDiemIds.length === 0) {
            showGlobalToast("Thông báo", "Vui lòng chọn ít nhất 1 bảng điểm để phê duyệt!", "error");
            return;
        }
        const timestamp = new Date().toLocaleString('vi-VN');
        const approverName = "ThS. Nguyễn Văn X";
        selectedDuyetDiemIds.forEach(id => {
            const tui = tuiPhachData.find(x => x.id === id);
            if (tui) {
                tui.status = "Đã duyệt bảng điểm";
                tui.approver = approverName;
                tui.approvedAt = timestamp;
            }
        });
        showGlobalToast("Thành công", `Đã phê duyệt ${selectedDuyetDiemIds.length} bảng điểm thành công.`);
        selectedDuyetDiemIds = [];
        updateBatchDuyetButton();
        saveStateToServer();
        renderDuyetDiem();
    }
    window.executeBatchDuyetDiem = executeBatchDuyetDiem;

    function renderDuyetDiem() {
        const container = document.getElementById('duyet-diem-left-list');
        if (!container) return;

        const filterVal = document.getElementById('duyet-filter-select')?.value || 'cho';
        const kw = (document.getElementById('duyet-search-input')?.value || '').toLowerCase().trim();

        const filtered = (tuiPhachData || []).filter(t => {
            if (!t) return false;
            const matchKw = !kw || (t.id && t.id.toLowerCase().includes(kw)) || (t.subjectName && t.subjectName.toLowerCase().includes(kw));
            const st = (t.status || '').trim();
            if (filterVal === 'cho') {
                return matchKw && (st === "Đã đối chiếu hợp lệ" || st === "Chờ phê duyệt" || st === "ChoKhopDiem" || st === "Chờ khớp điểm");
            } else if (filterVal === 'da') {
                return matchKw && (st === "Đã duyệt bảng điểm" || st === "Đã phê duyệt");
            } else {
                return matchKw && (st === "Đã đối chiếu hợp lệ" || st === "Chờ phê duyệt" || st === "ChoKhopDiem" || st === "Chờ khớp điểm" || st === "Đã duyệt bảng điểm" || st === "Đã phê duyệt");
            }
        });

        const countEl = document.getElementById('duyet-list-count');
        if (countEl) countEl.innerText = `${filtered.length} mục`;

        if (filtered.length === 0) {
            container.innerHTML = `<div class="p-8 text-center text-gray-400 italic text-xs">Không có bảng điểm nào phù hợp.</div>`;
            return;
        }

        let listHtml = '';
        filtered.forEach(t => {
            const st = (t.status || '').trim();
            let badge = `<span class="bg-amber-100 text-amber-900 border border-amber-200 px-2 py-0.5 rounded text-[10px] font-bold">Chờ duyệt</span>`;
            if (st === "Đã duyệt bảng điểm" || st === "Đã phê duyệt") {
                badge = `<span class="bg-emerald-100 text-emerald-800 border border-emerald-200 px-2 py-0.5 rounded text-[10px] font-bold">✓ Đã duyệt</span>`;
            }

            const isChecked = selectedDuyetDiemIds.includes(t.id);

            listHtml += `
                <div class="p-3 hover:bg-gray-50 cursor-pointer flex items-center justify-between gap-3 transition-colors border-b border-gray-100" onclick="showDuyetDiemDetail('${t.id}')">
                    <div class="flex items-center gap-2.5">
                        <input type="checkbox" value="${t.id}" ${isChecked ? 'checked' : ''} onchange="toggleSelectDuyetDiem(event, '${t.id}')" class="check-duyet-item w-4 h-4 cursor-pointer accent-[#9e1c22]" onclick="event.stopPropagation()">
                        <div>
                            <div class="font-bold text-gray-800 text-xs font-mono">${t.id}</div>
                            <div class="text-[11px] font-medium text-gray-700 mt-0.5">${t.subjectName || 'Học phần'}</div>
                            <div class="text-[10px] text-gray-400 mt-0.5">${t.papers || 30} bài thi</div>
                        </div>
                    </div>
                    <div>${badge}</div>
                </div>
            `;
        });

        container.innerHTML = listHtml;
        if (typeof initIcons !== "undefined") {
            try { initIcons(); } catch(e) {}
        }
    }

    function showDuyetDiemDetail(tuiId) {
        const tui = (tuiPhachData || []).find(x => x.id === tuiId);
        const emptyView = document.getElementById('duyet-detail-empty');
        const panelView = document.getElementById('duyet-detail-panel');
        if (!tui || !panelView) return;

        if (emptyView) emptyView.classList.add('hidden-view');
        panelView.classList.remove('hidden-view');

        const elTuiId = document.getElementById('detail-tui-id');
        const elHpName = document.getElementById('detail-hp-name');
        const elMeta = document.getElementById('detail-meta-info');
        if (elTuiId) elTuiId.innerText = `Túi bài thi: ${tui.id}`;
        if (elHpName) elHpName.innerText = `Học phần: ${tui.subjectName || ''}`;
        if (elMeta) elMeta.innerText = `Số lượng: ${tui.papers || 30} bài thi`;

        const badgeEl = document.getElementById('detail-status-badge');
        const st = (tui.status || '').trim();
        if (badgeEl) {
            if (st === "Đã duyệt bảng điểm" || st === "Đã phê duyệt") {
                badgeEl.innerHTML = `<span class="bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded text-[10px] font-bold">✓ Đã phê duyệt</span>`;
            } else {
                badgeEl.innerHTML = `<span class="bg-amber-100 text-amber-900 px-2 py-0.5 rounded text-[10px] font-bold">Chờ phê duyệt</span>`;
            }
        }

        const actionContainer = document.getElementById('detail-action-container');
        if (actionContainer) {
            if (st === "Đã duyệt bảng điểm" || st === "Đã phê duyệt") {
                actionContainer.innerHTML = `<span class="text-gray-400 italic text-xs">Phê duyệt bởi: ${tui.approver || 'Trưởng phòng'}<br>${tui.approvedAt || ''}</span>`;
            } else {
                actionContainer.innerHTML = `<button onclick="showDuyetModal('diem', '${tui.id}', 'Bảng điểm chính thức ${tui.id}')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2 rounded text-xs shadow flex items-center gap-1.5 transition-colors"><i data-lucide="check-circle" class="w-4 h-4"></i> Phê duyệt bảng điểm này</button>`;
            }
        }

        const tbody = document.getElementById('duyet-detail-tbody');
        if (tbody) {
            let detailRows = '';
            const phachList = tui.phachGoc || [];
            const scoresObj = tui.scores || {};

            if (phachList.length === 0) {
                const totalPapers = tui.papers || 0;
                for (let i = 1; i <= totalPapers; i++) {
                    const phachCode = `P${String(i).padStart(3, '0')}`;
                    detailRows += `
                        <tr class="hover:bg-gray-50">
                            <td class="px-4 py-2 text-gray-400">${i}</td>
                            <td class="px-4 py-2 font-mono font-bold text-gray-800">${phachCode}</td>
                            <td class="px-4 py-2 text-center font-bold text-blue-900">--</td>
                        </tr>
                    `;
                }
            } else {
                phachList.forEach((pCode, idx) => {
                    const sc = scoresObj[pCode];
                    let scoreVal = '--';
                    if (sc && sc.grader1 !== null && sc.grader1 !== undefined) {
                        scoreVal = sc.grader1;
                    }
                    detailRows += `
                        <tr class="hover:bg-gray-50">
                            <td class="px-4 py-2 text-gray-400">${idx + 1}</td>
                            <td class="px-4 py-2 font-mono font-bold text-gray-800">${pCode}</td>
                            <td class="px-4 py-2 text-center font-bold text-blue-900">${scoreVal}</td>
                        </tr>
                    `;
                });
            }
            tbody.innerHTML = detailRows || `<tr><td colspan="3" class="px-4 py-6 text-center text-gray-400 italic">Chưa có bài thi nào trong túi này.</td></tr>`;
        }
        if (typeof initIcons !== "undefined") {
            try { initIcons(); } catch(e) {}
        }
    }
    window.showDuyetDiemDetail = showDuyetDiemDetail;

    function renderDuyetThuLao() {
        const tbody = document.getElementById('duyet-thulao-tbody');
        if (!tbody) return;
        tbody.innerHTML = '';

        let grandTotalGV = canBoCoiThiData.length;
        let grandTotalCa = 0;
        let grandTotalGio = 0;
        let grandTotalMoney = 0;

        canBoCoiThiData.forEach(gv => {
            const confirmedShifts = gv.history.filter(h => h.confirmed);
            const totalCa = gv.history.length;
            const totalGio = confirmedShifts.reduce((sum, h) => sum + h.hours, 0);
            const totalMoney = totalGio * gv.pricePerHour;

            grandTotalCa += totalCa;
            grandTotalGio += totalGio;
            grandTotalMoney += totalMoney;

            tbody.innerHTML += `
                <tr class="hover:bg-gray-50 transition-colors text-xs">
                    <td class="px-4 py-2.5 font-mono font-bold text-gray-800 whitespace-nowrap">${gv.code}</td>
                    <td class="px-4 py-2.5 font-semibold text-gray-900 whitespace-nowrap">${gv.name}</td>
                    <td class="px-4 py-2.5 text-gray-600 whitespace-nowrap">${gv.donVi}</td>
                    <td class="px-4 py-2.5 text-center font-bold text-indigo-700 whitespace-nowrap">${totalCa} ca</td>
                    <td class="px-4 py-2.5 text-center font-bold text-blue-900 whitespace-nowrap">${totalGio} giờ</td>
                    <td class="px-4 py-2.5 text-right font-bold text-red-700 whitespace-nowrap">${totalMoney.toLocaleString()} VND</td>
                </tr>
            `;
        });

        tbody.innerHTML += `
            <tr class="bg-gray-50 text-xs font-bold border-t-2 border-gray-200">
                <td colspan="3" class="px-4 py-3 text-right uppercase text-gray-600 whitespace-nowrap">Tổng cộng quyết toán:</td>
                <td class="px-4 py-3 text-center text-indigo-700 whitespace-nowrap">${grandTotalCa} ca</td>
                <td class="px-4 py-3 text-center text-blue-900 whitespace-nowrap">${grandTotalGio} giờ</td>
                <td class="px-4 py-3 text-right text-red-700 whitespace-nowrap">${grandTotalMoney.toLocaleString()} VND</td>
            </tr>
        `;

        const stampDiv = document.getElementById('thulao-status-stamp');
        const btnDuyet = document.getElementById('btn-duyet-thulao-action');

        if (isThulaoApproved) {
            stampDiv.innerHTML = `
                <div class="border border-green-200 bg-green-50 p-4 rounded-lg flex items-center gap-3 text-green-800 text-xs font-semibold">
                    <i data-lucide="check-circle" class="w-5 h-5"></i>
                    <div>
                        <p class="font-bold">Đã phê duyệt quyết toán thù lao coi thi thành công!</p>
                        <p class="text-[10px] font-normal text-gray-500 mt-0.5">Phê duyệt bởi Trưởng phòng: <strong>${thulaoApprover}</strong> vào lúc ${thulaoApprovedAt}. Trạng thái đã chuyển sang kế toán chi trả.</p>
                    </div>
                </div>
            `;
            btnDuyet.classList.add('hidden-view');
        } else {
            stampDiv.innerHTML = `
                <div class="border border-yellow-200 bg-yellow-50 p-4 rounded-lg flex items-center gap-3 text-yellow-800 text-xs font-semibold">
                    <i data-lucide="alert-triangle" class="w-5 h-5 animate-bounce"></i>
                    <div>
                        <p class="font-bold">Bản tổng hợp thù lao đang chờ Trưởng phòng phê duyệt!</p>
                        <p class="text-[10px] font-normal text-gray-500 mt-0.5">Vui lòng kiểm tra kỹ số giờ trực của giảng viên trước khi thực hiện phê duyệt chi.</p>
                    </div>
                </div>
            `;
            btnDuyet.classList.remove('hidden-view');
        }
        initIcons();
    }

    // ==========================================================
    // XỬ LÝ MODAL PHÊ DUYỆT & TỪ CHỐI
    // ==========================================================
    function showDuyetModal(type, targetId, docName) {
        duyetTargetType = type;
        duyetTargetId = targetId;

        document.getElementById('duyet-doc-name').innerText = docName;
        document.getElementById('duyet-password').value = '';
        document.getElementById('duyet-error').classList.add('hidden-view');
        document.getElementById('modal-duyet').classList.remove('hidden-view');
    }

    function hideDuyetModal() {
        document.getElementById('modal-duyet').classList.add('hidden-view');
    }

    function confirmDuyetExecute() {
        const pw = document.getElementById('duyet-password').value;
        if (pw !== "123456") {
            document.getElementById('duyet-error').classList.remove('hidden-view');
            return;
        }

        hideDuyetModal();

        const timestamp = new Date().toLocaleString('vi-VN');
        const approverName = "ThS. Nguyễn Văn X";
        const ids = duyetTargetId.split(',').map(s => s.trim()).filter(Boolean);

        ids.forEach(id => {
            if (duyetTargetType === 'lich-thi' || duyetTargetType === 'duyet-lich') {
                const lt = lichThiData.find(x => x.id === id);
                if (lt) {
                    lt.status = "Đã phê duyệt";
                    lt.approver = approverName;
                    lt.approvedAt = timestamp;
                }
            } else if (duyetTargetType === 'danh-sach-thi' || duyetTargetType === 'duyet-ds') {
                const ds = danhSachThiData.find(x => x.id === id);
                if (ds) {
                    ds.status = "Đã phê duyệt";
                    ds.approver = approverName;
                    ds.approvedAt = timestamp;
                }
            } else if (duyetTargetType === 'de-thi' || duyetTargetType === 'duyet-de') {
                const dt = deThiData.find(x => x.id === id);
                if (dt) {
                    if (!isExamReviewedAndPassed(dt)) {
                        showGlobalToast("Không thể phê duyệt", `Đề thi ${dt.id} chưa được Tổ Khảo thí  rà soát. Không thể phê duyệt!`, "error");
                        return;
                    }
                    dt.trangThai = "Đã phê duyệt";
                    dt.approver = approverName;
                    dt.approvedAt = timestamp;
                }
            } else if (duyetTargetType === 'diem') {
                const t = tuiPhachData.find(x => x.id === id);
                if (t) {
                    t.status = "Đã duyệt bảng điểm";
                    t.approver = approverName;
                    t.approvedAt = timestamp;
                }
            } else if (duyetTargetType === 'pk') {
                const p = phucKhaoData.find(x => x.id === id);
                if (p) {
                    p.status = "Đã phê duyệt phúc khảo";
                    p.approver = approverName;
                    p.approvedAt = timestamp;
                }
            } else if (duyetTargetType === 'thulao') {
                isThulaoApproved = true;
                thulaoApprover = approverName;
                thulaoApprovedAt = timestamp;
            }
        });

        // Reset multi-select state if active
        if (selectModesState[duyetTargetType] > 0) {
            selectModesState[duyetTargetType] = 0;
            const btn = document.getElementById(`btn-select-${duyetTargetType}`);
            if (btn && btn.querySelector('span')) btn.querySelector('span').innerText = "Chọn";
            const btnApprove = document.getElementById(`btn-approve-all-${duyetTargetType}`);
            const btnReject = document.getElementById(`btn-reject-all-${duyetTargetType}`);
            if (btnApprove) { btnApprove.classList.add('hidden'); btnApprove.classList.remove('flex'); }
            if (btnReject) { btnReject.classList.add('hidden'); btnReject.classList.remove('flex'); }
        }

        showGlobalToast("Phê duyệt thành công", `Đã phê duyệt ${ids.length} mục thành công.`);

        if (duyetTargetType === 'lich-thi' || duyetTargetType === 'duyet-lich') renderDuyetLichThi();
        else if (duyetTargetType === 'danh-sach-thi' || duyetTargetType === 'duyet-ds') renderDuyetDanhSachThi();
        else if (duyetTargetType === 'de-thi' || duyetTargetType === 'duyet-de') renderDuyetDeThi();
        else if (duyetTargetType === 'diem') renderDuyetDiem();
        else if (duyetTargetType === 'pk') renderDuyetPhucKhao();
        else if (duyetTargetType === 'thulao') renderDuyetThuLao();

        if (activeViewId === 'view-home') renderHome();
        saveStateToServer();
    }

    function showTuChoiModal(type, targetId, titleStr) {
        tuChoiTargetType = type;
        tuChoiTargetId = targetId;

        document.getElementById('tuchoi-target-title').innerText = titleStr;
        document.getElementById('tuchoi-lydo').value = '';
        document.getElementById('tuchoi-error').classList.add('hidden-view');
        document.getElementById('modal-tu-choi').classList.remove('hidden-view');
    }

    function hideTuChoiModal() {
        document.getElementById('modal-tu-choi').classList.add('hidden-view');
    }

    function confirmTuChoiExecute() {
        const lyDo = document.getElementById('tuchoi-lydo').value.trim();
        if (!lyDo) {
            document.getElementById('tuchoi-error').classList.remove('hidden-view');
            return;
        }

        hideTuChoiModal();

        const timestamp = new Date().toLocaleString('vi-VN');
        const ids = tuChoiTargetId.split(',').map(s => s.trim()).filter(Boolean);

        ids.forEach(id => {
            if (tuChoiTargetType === 'lich-thi' || tuChoiTargetType === 'duyet-lich') {
                const lt = lichThiData.find(x => x.id === id);
                if (lt) {
                    lt.status = "Từ chối";
                    lt.lyDoTuChoi = lyDo;
                    lt.rejectedAt = timestamp;
                }
            } else if (tuChoiTargetType === 'danh-sach-thi' || tuChoiTargetType === 'duyet-ds') {
                const ds = danhSachThiData.find(x => x.id === id);
                if (ds) {
                    ds.status = "Từ chối";
                    ds.lyDoTuChoi = lyDo;
                    ds.rejectedAt = timestamp;
                }
            } else if (tuChoiTargetType === 'de-thi' || tuChoiTargetType === 'duyet-de') {
                const dt = deThiData.find(x => x.id === id);
                if (dt) {
                    dt.trangThai = "Từ chối";
                    dt.lyDoTuChoi = lyDo;
                    dt.rejectedAt = timestamp;
                }
            }
        });

        if (selectModesState[tuChoiTargetType] > 0) {
            selectModesState[tuChoiTargetType] = 0;
            const btn = document.getElementById(`btn-select-${tuChoiTargetType}`);
            if (btn && btn.querySelector('span')) btn.querySelector('span').innerText = "Chọn";
            const btnApprove = document.getElementById(`btn-approve-all-${tuChoiTargetType}`);
            const btnReject = document.getElementById(`btn-reject-all-${tuChoiTargetType}`);
            if (btnApprove) { btnApprove.classList.add('hidden'); btnApprove.classList.remove('flex'); }
            if (btnReject) { btnReject.classList.add('hidden'); btnReject.classList.remove('flex'); }
        }

        showGlobalToast("Đã từ chối", `Đã từ chối phê duyệt ${ids.length} mục.`, "error");

        if (tuChoiTargetType === 'lich-thi' || tuChoiTargetType === 'duyet-lich') renderDuyetLichThi();
        else if (tuChoiTargetType === 'danh-sach-thi' || tuChoiTargetType === 'duyet-ds') renderDuyetDanhSachThi();
        else if (tuChoiTargetType === 'de-thi' || tuChoiTargetType === 'duyet-de') renderDuyetDeThi();

        if (activeViewId === 'view-home') renderHome();
        saveStateToServer();
    }

    function showGlobalToast(title, msg, type = 'success') {
        const toast = document.getElementById('toast-global');
        const icon = document.getElementById('toast-global-icon');

        toast.className = "fixed bottom-6 right-6 text-white px-6 py-4 rounded shadow-xl flex items-center gap-3 animate-fade-in-up z-[200]";

        if (type === 'error') {
            toast.classList.add('bg-red-600');
            icon.setAttribute('data-lucide', 'alert-circle');
        } else {
            toast.classList.add('bg-green-600');
            icon.setAttribute('data-lucide', 'check-circle-2');
        }

        document.getElementById('toast-global-title').innerText = title;
        document.getElementById('toast-global-msg').innerText = msg || '';
        toast.classList.remove('hidden-view');
        initIcons();

        setTimeout(() => toast.classList.add('hidden-view'), 4000);
    }
</script>
