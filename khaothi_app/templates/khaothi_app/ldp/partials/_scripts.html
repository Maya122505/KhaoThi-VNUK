<!-- Scripts Section -->
<script>
    // Synced global variables
    let kyThiData = [];
    let caThiData = [];
    let lichThiData = [];
    let hocPhiData = [];
    let lopThiDiemData = [];

    let phongThiGocData = [];
    let tuiPhachData = [];
    let phieuGiaoNhanData = [];
    let canBoCoiThiData = [];
    let phucKhaoData = [];

    let isStateLoaded = false;
    let activeViewId = "view-home";

    let duyetTargetType = ""; // 'diem', 'pk', 'thulao'
    let duyetTargetId = "";   // item id

    // Thù lao approved state
    let isThulaoApproved = false;
    let thulaoApprover = "";
    let thulaoApprovedAt = "";

    window.onload = async function() {
        initIcons();
        await loadStateFromServer();
        const savedViewId = sessionStorage.getItem('ldp_activeViewId');
        navigate(savedViewId || 'view-home');
    };

    function initIcons() { lucide.createIcons(); }

    async function loadStateFromServer() {
        try {
            kyThiData = data.kyThiData || [];
            caThiData = data.caThiData || [];
            lichThiData = data.lichThiData || [];
            hocPhiData = data.hocPhiData || [];
            lopThiDiemData = data.lopThiDiemData || [];
            const res = await fetch('/api/get_state/');
            const data = await res.json();

            phongThiGocData = data.phongThiGocData;
            tuiPhachData = data.tuiPhachData;
            phieuGiaoNhanData = data.phieuGiaoNhanData;
            canBoCoiThiData = data.canBoCoiThiData;
            phucKhaoData = data.phucKhaoData;
            isStateLoaded = true;
        } catch(e) {
            console.error("Lỗi đồng bộ dữ liệu:", e);
        }
    }

    async function saveStateToServer() {
        try {
            await fetch('/api/save_state/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                        kyThiData,
                        caThiData,
                        lichThiData,
                        hocPhiData,
                        lopThiDiemData,
                    phongThiGocData,
                    tuiPhachData,
                    phieuGiaoNhanData,
                    canBoCoiThiData,
                    phucKhaoData
                })
            });
        } catch(e) {
            console.error("Lỗi lưu dữ liệu:", e);
        }
    }

    function navigate(viewId) {
        document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden-view'));
        const targetView = document.getElementById(viewId);
        if(targetView) targetView.classList.remove('hidden-view');
        sessionStorage.setItem('ldp_activeViewId', viewId);

        document.querySelectorAll('.nav-btn').forEach(btn => btn.className = "nav-btn px-6 py-3 text-sm font-semibold border-r border-red-800 transition-colors hover:bg-red-800");

        activeViewId = viewId;
        if(viewId === 'view-home') {
            document.getElementById('nav-btn-home').className += " bg-red-800";
            renderHome();
        } else if(viewId === 'view-duyet-diem') {
            document.getElementById('nav-btn-duyet-diem').className += " bg-red-800";
            renderDuyetDiem();
        } else if(viewId === 'view-duyet-phuc-khao') {
            document.getElementById('nav-btn-duyet-phuc-khao').className += " bg-red-800";
            renderDuyetPhucKhao();
        } else if(viewId === 'view-duyet-thu-lao') {
            document.getElementById('nav-btn-duyet-thu-lao').className += " bg-red-800";
            renderDuyetThuLao();
        }
        initIcons();
    }

    function renderHome() {
        const countDiem = tuiPhachData.filter(t => t.status === "Đã đối chiếu hợp lệ").length;
        const countPk = phucKhaoData.filter(p => p.status === "Đã xử lý").length;
        const countTuiLock = tuiPhachData.filter(t => t.status === "Đã khóa phách").length;

        document.getElementById('count-diem-cho').innerText = countDiem;
        document.getElementById('count-pk-cho').innerText = countPk;
        document.getElementById('count-tui-khoa').innerText = countTuiLock;
        document.getElementById('count-thu-lao-cho').innerText = isThulaoApproved ? 0 : 1;

        const qaList = document.getElementById('quick-action-list');
        qaList.innerHTML = '';

        let hasActions = false;

        if (countDiem > 0) {
            hasActions = true;
            qaList.innerHTML += `
                <div class="flex justify-between items-center p-3 border border-purple-100 bg-purple-50 rounded-lg">
                    <span class="font-medium text-purple-900 text-xs">Có <strong>${countDiem} bảng điểm đối soát lần 2</strong> đang trình duyệt.</span>
                    <button onclick="navigate('view-duyet-diem')" class="bg-purple-700 hover:bg-purple-800 text-white font-bold px-3 py-1.5 rounded text-[10px] shadow transition-colors">XEM NGAY</button>
                </div>
            `;
        }

        if (countPk > 0) {
            hasActions = true;
            qaList.innerHTML += `
                <div class="flex justify-between items-center p-3 border border-indigo-100 bg-indigo-50 rounded-lg">
                    <span class="font-medium text-indigo-900 text-xs">Có <strong>${countPk} biên bản phúc khảo</strong> đã hoàn thành chấm lại, chờ phê duyệt ký số.</span>
                    <button onclick="navigate('view-duyet-phuc-khao')" class="bg-indigo-700 hover:bg-indigo-800 text-white font-bold px-3 py-1.5 rounded text-[10px] shadow transition-colors">PHÊ DUYỆT</button>
                </div>
            `;
        }

        if (!isThulaoApproved) {
            hasActions = true;
            qaList.innerHTML += `
                <div class="flex justify-between items-center p-3 border border-pink-100 bg-pink-50 rounded-lg">
                    <span class="font-medium text-pink-900 text-xs">Báo cáo quyết toán giờ coi thi học kỳ III chờ Trưởng phòng ký xác nhận thù lao.</span>
                    <button onclick="navigate('view-duyet-thu-lao')" class="bg-pink-700 hover:bg-pink-800 text-white font-bold px-3 py-1.5 rounded text-[10px] shadow transition-colors">KIỂM DUYỆT</button>
                </div>
            `;
        }

        if(!hasActions) {
            qaList.innerHTML = `<div class="text-center py-6 text-gray-400 italic text-xs">Tất cả hồ sơ khảo thí đã được ký phê duyệt an toàn. Không có hành động chờ duyệt.</div>`;
        }
    }

    function renderDuyetDiem() {
        const tbody = document.getElementById('duyet-diem-tbody');
        tbody.innerHTML = '';

        const list = tuiPhachData.filter(t => t.status === "Đã đối chiếu hợp lệ" || t.status === "Đã duyệt bảng điểm");
        if(list.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-12 text-center text-gray-400 italic">Không có bảng điểm nào cần phê duyệt vào lúc này.</td></tr>`;
            return;
        }

        list.forEach(t => {
            let badge = `<span class="bg-yellow-100 text-yellow-800 px-2 py-0.5 rounded text-[10px] font-bold">Chờ Trưởng phòng duyệt</span>`;
            let actionBtn = `<button onclick="showDuyetModal('diem', '${t.id}', 'Bảng điểm chính thức ${t.id}')" class="bg-red-900 hover:bg-red-800 text-white px-3 py-1 rounded text-[10px] font-bold shadow">KÝ PHÊ DUYỆT</button>`;

            if (t.status === "Đã duyệt bảng điểm") {
                badge = `<span class="bg-green-100 text-green-800 px-2 py-0.5 rounded text-[10px] font-bold">✓ Đã duyệt ký số</span>`;
                actionBtn = `<span class="text-gray-400 italic text-[10px] font-medium">Ký bởi: ${t.approver || 'Trưởng phòng'}<br>${t.approvedAt || ''}</span>`;
            }

            tbody.innerHTML += `
                <tr class="hover:bg-gray-50 transition-colors">
                    <td class="px-6 py-4 font-mono font-bold text-gray-800">${t.id}</td>
                    <td class="px-6 py-4 font-semibold text-gray-900">${t.subjectName}</td>
                    <td class="px-6 py-4 text-center font-medium">${t.papers} bài thi</td>
                    <td class="px-6 py-4 text-center">${badge}</td>
                    <td class="px-6 py-4 text-right">${actionBtn}</td>
                </tr>
            `;
        });
    }

    function renderDuyetPhucKhao() {
        const tbody = document.getElementById('duyet-phuc-khao-tbody');
        tbody.innerHTML = '';

        const list = phucKhaoData.filter(p => p.status === "Đã xử lý" || p.status === "Đã phê duyệt phúc khảo");
        if(list.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" class="px-6 py-12 text-center text-gray-400 italic">Không có quyết định phúc khảo nào chờ duyệt.</td></tr>`;
            return;
        }

        list.forEach(p => {
            let badge = `<span class="bg-yellow-100 text-yellow-800 px-2 py-0.5 rounded text-[10px] font-bold">Chờ duyệt biên bản</span>`;
            let actionBtn = `<button onclick="showDuyetModal('pk', '${p.id}', 'Đơn phúc khảo ${p.id} - ${p.name}')" class="bg-red-900 hover:bg-red-800 text-white px-3 py-1 rounded text-[10px] font-bold shadow">KÝ PHÊ DUYỆT</button>`;

            if(p.status === "Đã phê duyệt phúc khảo") {
                badge = `<span class="bg-green-100 text-green-800 px-2 py-0.5 rounded text-[10px] font-bold">✓ Đã duyệt ký số</span>`;
                actionBtn = `<span class="text-gray-400 italic text-[10px] font-medium">Ký bởi: ${p.approver || 'Trưởng phòng'}<br>${p.approvedAt || ''}</span>`;
            }

            tbody.innerHTML += `
                <tr class="hover:bg-gray-50 transition-colors">
                    <td class="px-6 py-4 font-mono font-bold text-gray-800">${p.id}</td>
                    <td class="px-6 py-4 font-semibold text-gray-900">${p.subjectName}</td>
                    <td class="px-6 py-4">${p.name} (${p.msv})</td>
                    <td class="px-6 py-4 text-center font-mono">${p.originalPt1}</td>
                    <td class="px-6 py-4 text-center font-mono font-bold text-red-600">${p.ptFinal}</td>
                    <td class="px-6 py-4 text-center">${badge}</td>
                    <td class="px-6 py-4 text-right">${actionBtn}</td>
                </tr>
            `;
        });
    }

    function renderDuyetThuLao() {
        const tbody = document.getElementById('duyet-thulao-tbody');
        tbody.innerHTML = '';

        let grandTotalGV = canBoCoiThiData.length;
        let grandTotalCa = 0;
        let grandTotalGio = 0;
        let grandTotalMoney = 0;

        canBoCoiThiData.forEach(gv => {
            const confirmedShifts = gv.history.filter(h => h.confirmed);
            const totalCa = gv.history.length;
            const totalGio = confirmedShifts.reduce((sum, h) => sum + h.hours, 0);
            const totalMoney = totalGio * gv.pricePerHour;

            grandTotalCa += totalCa;
            grandTotalGio += totalGio;
            grandTotalMoney += totalMoney;

            tbody.innerHTML += `
                <tr class="hover:bg-gray-50 transition-colors text-xs">
                    <td class="px-4 py-2.5 font-mono font-bold text-gray-800">${gv.code}</td>
                    <td class="px-4 py-2.5 font-semibold text-gray-900">${gv.name}</td>
                    <td class="px-4 py-2.5 text-gray-600">${gv.donVi}</td>
                    <td class="px-4 py-2.5 text-center font-bold text-indigo-700">${totalCa} ca</td>
                    <td class="px-4 py-2.5 text-center font-bold text-blue-900">${totalGio} giờ</td>
                    <td class="px-4 py-2.5 text-right font-bold text-red-700">${totalMoney.toLocaleString()} VND</td>
                </tr>
            `;
        });

        tbody.innerHTML += `
            <tr class="bg-gray-50 text-xs font-bold border-t-2 border-gray-200">
                <td colspan="3" class="px-4 py-3 text-right uppercase text-gray-600">Tổng cộng quyết toán:</td>
                <td class="px-4 py-3 text-center text-indigo-700">${grandTotalCa} ca</td>
                <td class="px-4 py-3 text-center text-blue-900">${grandTotalGio} giờ</td>
                <td class="px-4 py-3 text-right text-red-700">${grandTotalMoney.toLocaleString()} VND</td>
            </tr>
        `;

        const stampDiv = document.getElementById('thulao-status-stamp');
        const btnDuyet = document.getElementById('btn-duyet-thulao-action');

        if (isThulaoApproved) {
            stampDiv.innerHTML = `
                <div class="border border-green-200 bg-green-50 p-4 rounded-lg flex items-center gap-3 text-green-800 text-xs font-semibold">
                    <i data-lucide="check-circle" class="w-5 h-5"></i>
                    <div>
                        <p class="font-bold">Đã ký duyệt quyết toán thù lao coi thi thành công!</p>
                        <p class="text-[10px] font-normal text-gray-500 mt-0.5">Ký điện tử bởi Trưởng phòng: <strong>${thulaoApprover}</strong> vào lúc ${thulaoApprovedAt}. Trạng thái đã chuyển sang kế toán chi trả.</p>
                    </div>
                </div>
            `;
            btnDuyet.classList.add('hidden-view');
        } else {
            stampDiv.innerHTML = `
                <div class="border border-yellow-200 bg-yellow-50 p-4 rounded-lg flex items-center gap-3 text-yellow-800 text-xs font-semibold">
                    <i data-lucide="alert-triangle" class="w-5 h-5 animate-bounce"></i>
                    <div>
                        <p class="font-bold">Bản tổng hợp thù lao đang chờ Trưởng phòng ký duyệt!</p>
                        <p class="text-[10px] font-normal text-gray-500 mt-0.5">Vui lòng kiểm tra kỹ số giờ trực của giảng viên trước khi thực hiện ký duyệt chi.</p>
                    </div>
                </div>
            `;
            btnDuyet.classList.remove('hidden-view');
        }
        initIcons();
    }

    function showDuyetModal(type, targetId, docName) {
        duyetTargetType = type;
        duyetTargetId = targetId;

        document.getElementById('duyet-doc-name').innerText = docName;
        document.getElementById('duyet-password').value = '';
        document.getElementById('duyet-error').classList.add('hidden-view');
        document.getElementById('modal-duyet').classList.remove('hidden-view');
    }

    function hideDuyetModal() {
        document.getElementById('modal-duyet').classList.add('hidden-view');
    }

    function confirmDuyetExecute() {
        const pw = document.getElementById('duyet-password').value;
        if (pw !== "123456") {
            document.getElementById('duyet-error').classList.remove('hidden-view');
            return;
        }

        hideDuyetModal();

        const timestamp = new Date().toLocaleString('vi-VN');
        const approverName = "ThS. Nguyễn Văn X";

        if (duyetTargetType === 'diem') {
            const t = tuiPhachData.find(x => x.id === duyetTargetId);
            if (t) {
                t.status = "Đã duyệt bảng điểm";
                t.approver = approverName;
                t.approvedAt = timestamp;
            }
            showGlobalToast("Ký duyệt thành công", `Đã phê duyệt bảng điểm ${duyetTargetId} thành công.`);
            renderDuyetDiem();
        } else if (duyetTargetType === 'pk') {
            const p = phucKhaoData.find(x => x.id === duyetTargetId);
            if (p) {
                p.status = "Đã phê duyệt phúc khảo";
                p.approver = approverName;
                p.approvedAt = timestamp;
            }
            showGlobalToast("Ký duyệt thành công", `Đã phê duyệt quyết định phúc khảo của SV ${p.name} thành công.`);
            renderDuyetPhucKhao();
        } else if (duyetTargetType === 'thulao') {
            isThulaoApproved = true;
            thulaoApprover = approverName;
            thulaoApprovedAt = timestamp;
            showGlobalToast("Ký duyệt thành công", "Đã phê duyệt quyết toán thù lao coi thi học kỳ III.");
            renderDuyetThuLao();
        }

        if (activeViewId === 'view-home') renderHome();
        saveStateToServer();
    }

    function showGlobalToast(title, msg, type = 'success') {
        const toast = document.getElementById('toast-global');
        const icon = document.getElementById('toast-global-icon');

        toast.className = "fixed bottom-6 right-6 text-white px-6 py-4 rounded shadow-xl flex items-center gap-3 animate-fade-in-up z-[200]";

        if (type === 'error') {
            toast.classList.add('bg-red-600');
            icon.setAttribute('data-lucide', 'alert-circle');
        } else {
            toast.classList.add('bg-green-600');
            icon.setAttribute('data-lucide', 'check-circle-2');
        }

        document.getElementById('toast-global-title').innerText = title;
        document.getElementById('toast-global-msg').innerText = msg || '';
        toast.classList.remove('hidden-view');
        initIcons();

        setTimeout(() => toast.classList.add('hidden-view'), 4000);
    }
</script>
