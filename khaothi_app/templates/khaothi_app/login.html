<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập Cổng thành viên - VNUK</title>
    <!-- Google Fonts & Tailwind -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .vnuk-burgundy { background-color: #9e1c22; }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col justify-between">

    <!-- Header Navbar -->
    <header class="bg-white px-8 py-4 flex justify-between items-center border-b-4 border-orange-500 shadow-sm relative">
        <div class="flex items-center gap-4">
            <a href="/">
                <img src="/static/khaothi_app/images/logo.png" alt="VNUK Logo" class="h-16 w-auto object-contain" />
            </a>
        </div>
        <a href="/" class="text-xs text-gray-500 hover:text-[#9e1c22] flex items-center gap-1.5 transition-colors font-semibold">
            <i data-lucide="arrow-left" class="w-4 h-4"></i> Quay lại Cổng chuyển giao  
        </a>
    </header>

    <!-- Centered Login Card -->
    <main class="flex-1 flex items-center justify-center p-6 my-4">
        <div class="w-full max-w-2xl bg-white rounded-2xl shadow-lg border p-12 flex flex-col gap-8">
            <div class="text-center">
                <h3 id="role-title" class="text-2xl font-black text-slate-800">Đăng nhập Cổng thành viên</h3>
                <p class="text-sm text-gray-400 mt-2">Xác thực mật khẩu bảo mật để truy cập cổng giao dịch.</p>
            </div>

            <!-- Error Alert Box -->
            <div id="login-error" class="hidden border border-red-200 bg-red-50 text-red-700 p-4 rounded-lg text-sm font-bold flex items-center gap-2.5">
                <i data-lucide="alert-circle" class="w-5 h-5"></i>
                <span>Mật khẩu bảo mật không chính xác!</span>
            </div>

            <!-- Input Form -->
            <form onsubmit="handleFormSubmit(event)" class="flex flex-col gap-6 text-sm">
                <div>
                    <label class="block font-bold text-gray-700 mb-1.5">Tài khoản truy cập</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-gray-400">
                            <i data-lucide="user" class="w-5 h-5"></i>
                        </span>
                        <input type="text" id="username-display" disabled class="w-full pl-11 p-4 border rounded-xl bg-gray-50 text-gray-500 font-bold outline-none cursor-not-allowed" />
                    </div>
                </div>

                <div>
                    <label class="block font-bold text-gray-700 mb-1.5">Mật khẩu</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-gray-400">
                            <i data-lucide="lock" class="w-5 h-5"></i>
                        </span>
                        <input type="password" id="password" required autofocus placeholder="Nhập mật khẩu truy cập" class="w-full pl-11 p-4 border rounded-xl outline-none focus:border-[#9e1c22] focus:ring-1 focus:ring-[#9e1c22]" />
                    </div>
                </div>

                <button type="submit" class="w-full vnuk-burgundy hover:bg-red-800 text-white font-extrabold py-4 rounded-xl shadow-md transition-colors flex items-center justify-center gap-2 mt-4 text-sm tracking-wider">
                    ĐĂNG NHẬP <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="max-w-[1200px] mx-auto w-full px-6 py-6 text-center text-slate-400 text-xs border-t border-gray-200">
        &copy; 2026 Viện Nghiên cứu và Đào tạo Việt - Anh (VNUK), Đại học Đà Nẵng.
    </footer>

    <script>
        // Bản đồ ánh xạ vai trò (role query strings) sang tên thân thiện với người dùng
        const roleNames = {
            "tkt": "Cổng Tổ Khảo thí (VNUK)",
            "tkct": "Cổng Thư ký Chấm thi",
            "ldp": "Cổng Lãnh đạo phòng Khảo thí",
            "dvcm": "Cổng Đơn vị Chuyên môn",
            "gv": "Cổng Giảng viên / CB Chấm thi",
            "tkcoithi": "Cổng Thư ký Coi thi",
            "cvht": "Cổng Chuyên viên Hệ thống"
        };

        // Get query parameters
        const urlParams = new URLSearchParams(window.location.search);
        const role = urlParams.get('role') || 'tkt';

        // Cập nhật các trường dựa trên vai trò (role)
        document.getElementById('role-title').innerText = `Đăng nhập ${roleNames[role] || 'Cổng thành viên'}`;
        document.getElementById('username-display').value = role;

        lucide.createIcons();

        function handleFormSubmit(event) {
            event.preventDefault();
            const pass = document.getElementById('password').value;
            const errBox = document.getElementById('login-error');

            errBox.classList.add('hidden');

            // Mật khẩu kiểm thử mặc định của hệ thống VNUK là '123456'
            if (pass !== "123456") {
                errBox.classList.remove('hidden');
                return;
            }

            if (role === "tkt") {
                window.location.replace("/tkt/");
            } else if (role === "tkct") {
                window.location.replace("/tkct/");
            } else if (role === "tkcoithi") {
                window.location.replace("/tkcoithi/");
            } else if (role === "gv") {
                window.location.replace("/gv/");
            } else if (role === "ldp") {
                window.location.replace("/ldp/");
            } else if (role === "dvcm") {
                window.location.replace("/dvcm/");
            } else if (role === "cvht") {
                window.location.replace("/cvht/");
            } else {
                window.location.replace("/");
            }
        }
    </script>
</body>
</html>
