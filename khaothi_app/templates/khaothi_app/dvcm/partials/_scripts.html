<!-- Scripts Section -->
<script>
    // Synced global variables
    let kyThiData = [];
    let caThiData = [];
    let lichThiData = [];
    let hocPhiData = [];
    let lopThiDiemData = [];

    let phongThiGocData = [];
    let tuiPhachData = [];
    let phieuGiaoNhanData = [];
    let canBoCoiThiData = [];
    let phucKhaoData = [];
    let deThiData = [];
    let hocPhanData = [];

    let isStateLoaded = false;
    let giaoNhanSelectedIds = new Set();
    let giaoNhanFilteredItems = [];
    let giaoNhanCurrentPage = 1;
    const giaoNhanPageSize = 10;
    let activeViewId = "view-home";
    let activeAssignTuiId = "";
    let activeNhapDiemTuiId = "";

    // Simulated grades entry object storage on client
    let tempGradesData = {}; // key: phachId -> {pt1: num, pt2: num}

    window.onload = async function() {
        initIcons();
        await loadStateFromServer();
        const savedViewId = sessionStorage.getItem('dvcm_activeViewId');
        navigate(savedViewId || 'view-home');
    };

    function initIcons() { lucide.createIcons(); }

    async function loadStateFromServer() {
        try {
            const res = await fetch('/api/get_state/');
            const data = await res.json();

            kyThiData = data.kyThiData || [];
            caThiData = data.caThiData || [];
            lichThiData = data.lichThiData || [];
            hocPhiData = data.hocPhiData || [];
            lopThiDiemData = data.lopThiDiemData || [];
            phongThiGocData = data.phongThiGocData;
            tuiPhachData = data.tuiPhachData;
            phieuGiaoNhanData = data.phieuGiaoNhanData;
            canBoCoiThiData = data.canBoCoiThiData;
            phucKhaoData = data.phucKhaoData;
            deThiData = data.deThiData || [];
            hocPhanData = data.hocPhanData || [];
            isStateLoaded = true;
        } catch(e) {
            console.error("Lỗi đồng bộ dữ liệu:", e);
        }
    }

    async function saveStateToServer() {
        try {
            await fetch('/api/save_state/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                        kyThiData,
                        caThiData,
                        lichThiData,
                        hocPhiData,
                        lopThiDiemData,
                    phongThiGocData,
                    tuiPhachData,
                    phieuGiaoNhanData,
                    canBoCoiThiData,
                    phucKhaoData,
                    deThiData,
                    hocPhanData
                })
            });
        } catch(e) {
            console.error("Lỗi lưu dữ liệu:", e);
        }
    }

    function navigate(viewId) {
        document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden-view'));
        const targetView = document.getElementById(viewId);
        if(targetView) targetView.classList.remove('hidden-view');
        sessionStorage.setItem('dvcm_activeViewId', viewId);

        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.classList.remove('bg-[#801418]', 'border-[#005691]', 'font-bold');
            btn.classList.add('border-transparent');
        });
        closeAllDropdowns();

        activeViewId = viewId;
        let activeBtnId = 'nav-btn-home';
        if (viewId.includes('giao-nhan') || viewId.includes('nhan-bai') || viewId.includes('ban-giao-bai')) activeBtnId = 'nav-btn-giao-nhan';
        else if (viewId === 'view-phan-cong') activeBtnId = 'nav-btn-phan-cong';
        else if (viewId === 'view-nhap-tra-diem') activeBtnId = 'nav-btn-phe-duyet';
        else if (viewId === 'view-de-thi') activeBtnId = 'nav-btn-de-thi';

        const activeBtn = document.getElementById(activeBtnId);
        if (activeBtn) {
            activeBtn.classList.remove('border-transparent');
            activeBtn.classList.add('bg-[#801418]', 'border-[#005691]', 'font-bold');
        }

        if(viewId === 'view-home') {
            renderHome();
        } else if(viewId.includes('giao-nhan') || viewId.includes('nhan-bai') || viewId.includes('ban-giao-bai')) {
            if (viewId === 'view-nhan-bai') hideDvcmGnDetailNhan();
            renderGiaoNhan();
        } else if(viewId === 'view-phan-cong') {
            switchPhanCongSubTab('main');
        } else if(viewId === 'view-nhap-tra-diem') {
            renderNhapTraDiem();
        } else if(viewId === 'view-de-thi') {
            switchTabDeThi('danh-sach');
        }
        initIcons();
    }

    function navigatePhanCong(subType = 'main') {
        closeAllDropdowns();
        navigate('view-phan-cong');
        switchPhanCongSubTab(subType);
    }
    window.navigatePhanCong = navigatePhanCong;

    function switchPhanCongSubTab(tab) {
        document.querySelectorAll('.sub-pc-view').forEach(el => el.classList.add('hidden-view'));
        const titleEl = document.getElementById('phan-cong-title-text');

        if (tab === 'main') {
            document.getElementById('sub-pc-main')?.classList.remove('hidden-view');
            if (titleEl) {
                titleEl.innerHTML = `<i data-lucide="user-check" class="text-[#9e1c22]"></i> Quản lý Phân công Chấm thi kết thúc học phần`;
            }
            renderPhanCong();
        } else {
            document.getElementById('sub-pc-pk')?.classList.remove('hidden-view');
            if (titleEl) {
                titleEl.innerHTML = `<i data-lucide="shield-alert" class="text-amber-700"></i> Quản lý Phân công Chấm Phúc khảo`;
            }
            renderPhanCongPhucKhao();
        }
        initIcons();
    }
    window.switchPhanCongSubTab = switchPhanCongSubTab;

    let selectedMainTuiIds = new Set();
    let selectedPkIds = new Set();
    let currentAssignMode = 'main'; // 'main' or 'pk'

    // ================================================================
    // SELECTION & BATCH HANDLING FOR MAIN PHÂN CÔNG
    // ================================================================
    function toggleSelectMainTui(tuiId) {
        if (selectedMainTuiIds.has(tuiId)) {
            selectedMainTuiIds.delete(tuiId);
        } else {
            selectedMainTuiIds.add(tuiId);
        }
        renderPhanCong();
    }
    window.toggleSelectMainTui = toggleSelectMainTui;

    function toggleSelectAllMain(chkHeader) {
        const keyword = (document.getElementById('filter-main-search')?.value || '').toLowerCase().trim();
        const statusVal = document.getElementById('filter-main-status')?.value || 'all';

        let filtered = tuiPhachData.filter(t => {
            const matchKw = !keyword || (t.subjectName || '').toLowerCase().includes(keyword) || (t.id || '').toLowerCase().includes(keyword);
            const isAssigned = !!t.grader1;
            let matchSt = true;
            if (statusVal === 'chua_phan_cong') matchSt = !isAssigned;
            if (statusVal === 'da_phan_cong') matchSt = isAssigned;
            return matchKw && matchSt;
        });

        if (chkHeader.checked) {
            filtered.forEach(t => selectedMainTuiIds.add(t.id));
        } else {
            filtered.forEach(t => selectedMainTuiIds.delete(t.id));
        }
        renderPhanCong();
    }
    window.toggleSelectAllMain = toggleSelectAllMain;

    function clearBatchMainSelection() {
        selectedMainTuiIds.clear();
        const headerChk = document.getElementById('select-all-main-tui');
        if (headerChk) headerChk.checked = false;
        renderPhanCong();
    }
    window.clearBatchMainSelection = clearBatchMainSelection;

    function updateBatchMainUI() {
        const badge = document.getElementById('panel-main-badge');
        const emptyState = document.getElementById('panel-main-empty');
        const activeState = document.getElementById('panel-main-active');
        const chipsContainer = document.getElementById('panel-main-chips');
        const papersSpan = document.getElementById('panel-main-papers-count');

        if (!badge || !emptyState || !activeState) return;

        const count = selectedMainTuiIds.size;
        badge.innerText = `Đã chọn ${count} túi`;

        if (count > 0) {
            emptyState.classList.add('hidden-view');
            activeState.classList.remove('hidden-view');

            const selectedList = tuiPhachData.filter(x => selectedMainTuiIds.has(x.id));
            let totalPapers = selectedList.reduce((sum, item) => sum + (item.papers || 0), 0);

            if (papersSpan) papersSpan.innerText = `(${totalPapers} bài thi)`;

            if (chipsContainer) {
                chipsContainer.innerHTML = selectedList.map(t => `
                    <span class="bg-white border border-red-200 text-[#9e1c22] font-mono font-bold px-2 py-0.5 rounded-md text-[11px] shadow-xs flex items-center gap-1">
                        ${t.id} (${t.papers}b)
                        <button onclick="removeMainTuiFromBatch('${t.id}')" class="text-gray-400 hover:text-red-700 font-extrabold text-xs ml-0.5" title="Bỏ túi này">✕</button>
                    </span>
                `).join('');
            }
            populateGvPanelMain();
        } else {
            emptyState.classList.remove('hidden-view');
            activeState.classList.add('hidden-view');
        }
    }

    function populateGvPanelMain() {
        const datalist = document.getElementById('gv-datalist-main');
        if (!datalist) return;
        datalist.innerHTML = '';

        let gvBagCounts = {};
        tuiPhachData.forEach(t => {
            if (t.grader1) gvBagCounts[t.grader1] = (gvBagCounts[t.grader1] || 0) + 1;
        });

        canBoCoiThiData.forEach(g => {
            const count = gvBagCounts[g.id] || 0;
            const countBadge = count > 0 ? `(Đang chấm ${count} túi)` : '(Chưa phụ trách túi nào)';
            datalist.innerHTML += `<option value="${g.name} - ${g.id} ${countBadge}"></option>`;
        });
    }

    function triggerSaveFromPanelMain() {
        const inputVal = (document.getElementById('select-gv-panel-main')?.value || '').trim();

        if (!inputVal) {
            showGlobalToast("Cảnh báo", "Vui lòng chọn hoặc gõ tên Giảng viên phụ trách", "warning");
            return;
        }

        const gvObj = canBoCoiThiData.find(g => 
            inputVal.includes(g.id) || 
            inputVal.toLowerCase().includes(g.name.toLowerCase()) || 
            g.name.toLowerCase().includes(inputVal.toLowerCase())
        );

        if (!gvObj) {
            showGlobalToast("Lỗi", "Không tìm thấy Giảng viên hợp lệ trong hệ thống", "error");
            return;
        }

        const count = selectedMainTuiIds.size;
        openConfirmModal(
            `Xác nhận phân công (${count} túi bài thi)`,
            `Bạn có chắc chắn muốn phân công ${count} túi bài thi đã chọn cho Giảng viên ${gvObj.name} (${gvObj.id}) không?`,
            () => executeSaveAssignMain(gvObj.id)
        );
    }
    window.triggerSaveFromPanelMain = triggerSaveFromPanelMain;

    function removeMainTuiFromBatch(tuiId) {
        selectedMainTuiIds.delete(tuiId);
        renderPhanCong();
    }
    window.removeMainTuiFromBatch = removeMainTuiFromBatch;

    let phanCongCurrentPage = 1;
    const phanCongPageSize = 8;

    let phanCongPkCurrentPage = 1;
    const phanCongPkPageSize = 8;

    function changePhanCongPage(delta) {
        phanCongCurrentPage += delta;
        renderPhanCong();
    }
    window.changePhanCongPage = changePhanCongPage;

    function changePhanCongPkPage(delta) {
        phanCongPkCurrentPage += delta;
        renderPhanCongPhucKhao();
    }
    window.changePhanCongPkPage = changePhanCongPkPage;

    // Use Case 8.1: Lọc danh sách Main
    function applyMainFilter() {
        phanCongCurrentPage = 1;
        renderPhanCong();
    }
    window.applyMainFilter = applyMainFilter;

    // Use Case 8.1: Render bảng Phân công Chấm thi kết thúc học phần
    function renderPhanCong() {
        const tbody = document.getElementById('phan-cong-tbody');
        if (!tbody) return;
        tbody.innerHTML = '';

        if (!tuiPhachData || tuiPhachData.length === 0) {
            tuiPhachData = [];
            for (let i = 0; i < 30; i++) {
                const subjects = [
                    'Cấu trúc dữ liệu và Giải thuật',
                    'Hệ quản trị Cơ sở dữ liệu',
                    'Lập trình Web & Ứng dụng',
                    'Quản trị Kinh doanh Đại cương',
                    'Marketing Căn bản & Kỹ thuật số',
                    'Quản trị Dự án Phần mềm',
                    'Trí tuệ nhân tạo & Học máy',
                    'Tiếng Anh Giao tiếp Quốc tế 3'
                ];
                const subj = subjects[i % subjects.length];
                const code = `TP-${String(i).padStart(3, '0')}`;
                const papers = 20 + ((i * 7) % 25);
                tuiPhachData.push({ id: code, subjectName: subj, papers: papers, grader1: '' });
            }
        }

        if (!canBoCoiThiData || canBoCoiThiData.length === 0) {
            canBoCoiThiData = [
                { id: 'GV001', name: 'ThS. Nguyễn Văn A' },
                { id: 'GV002', name: 'TS. Trần Thị B' },
                { id: 'GV003', name: 'ThS. Lê Hoàng C' },
                { id: 'GV004', name: 'PGS.TS. Phạm Văn D' }
            ];
        }

        const keyword = (document.getElementById('filter-main-search')?.value || '').toLowerCase().trim();
        const statusVal = document.getElementById('filter-main-status')?.value || 'all';

        let list = tuiPhachData.filter(t => {
            const matchKw = !keyword || (t.subjectName || '').toLowerCase().includes(keyword) || (t.id || '').toLowerCase().includes(keyword);
            const isAssigned = !!t.grader1;
            let matchSt = true;
            if (statusVal === 'chua_phan_cong') matchSt = !isAssigned;
            if (statusVal === 'da_phan_cong') matchSt = isAssigned;
            return matchKw && matchSt;
        });

        const totalItems = list.length;
        const totalPages = Math.ceil(totalItems / phanCongPageSize) || 1;
        if (phanCongCurrentPage > totalPages) phanCongCurrentPage = totalPages;
        if (phanCongCurrentPage < 1) phanCongCurrentPage = 1;

        const totalInfoSpan = document.getElementById('phan-cong-total-info');
        const pageNumSpan = document.getElementById('phan-cong-page-num');
        const btnPrev = document.getElementById('btn-main-prev-page');
        const btnNext = document.getElementById('btn-main-next-page');

        if (totalItems === 0) {
            tbody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-gray-400 italic">Không tìm thấy túi bài thi nào khớp bộ lọc.</td></tr>`;
            if (totalInfoSpan) totalInfoSpan.innerText = "Hiển thị 0 túi bài thi";
            if (pageNumSpan) pageNumSpan.innerText = "Trang 1 / 1";
            if (btnPrev) btnPrev.disabled = true;
            if (btnNext) btnNext.disabled = true;
            updateBatchMainUI();
            return;
        }

        const startIndex = (phanCongCurrentPage - 1) * phanCongPageSize;
        const pageList = list.slice(startIndex, startIndex + phanCongPageSize);

        // Sync header checkbox with pageList
        const headerChk = document.getElementById('select-all-main-tui');
        if (headerChk) {
            headerChk.checked = pageList.length > 0 && pageList.every(t => selectedMainTuiIds.has(t.id));
        }

        pageList.forEach(t => {
            const isChecked = selectedMainTuiIds.has(t.id);
            const gv = canBoCoiThiData.find(g => g.id === t.grader1)?.name || t.grader1 || '<span class="text-red-600 font-semibold italic">Chưa phân công</span>';
            const statusBadge = t.grader1 
                ? `<span class="bg-green-100 text-green-800 px-2.5 py-0.5 rounded-full text-[11px] font-bold">✓ Đã phân công</span>` 
                : `<span class="bg-red-100 text-red-800 px-2.5 py-0.5 rounded-full text-[11px] font-bold">● Chưa phân công</span>`;

            tbody.innerHTML += `
                <tr class="hover:bg-red-50/40 text-xs border-b border-gray-100 cursor-pointer ${isChecked ? 'bg-red-50/80 font-medium' : ''}" onclick="toggleSelectMainTui('${t.id}')">
                    <td class="px-3 py-3.5 text-center" onclick="event.stopPropagation()">
                        <input type="checkbox" value="${t.id}" ${isChecked ? 'checked' : ''} onchange="toggleSelectMainTui('${t.id}')" class="w-4 h-4 text-[#9e1c22] rounded cursor-pointer" />
                    </td>
                    <td class="px-4 py-3.5 text-center font-mono font-bold text-red-950">${t.id}</td>
                    <td class="px-4 py-3.5 text-left font-semibold text-gray-800">${t.subjectName}</td>
                    <td class="px-4 py-3.5 text-center font-bold text-gray-700">${t.papers} bài</td>
                    <td class="px-4 py-3.5 text-center">${statusBadge}</td>
                    <td class="px-4 py-3.5 text-center font-bold text-gray-900">${gv}</td>
                </tr>
            `;
        });

        // Update pagination UI controls
        if (totalInfoSpan) totalInfoSpan.innerText = `Hiển thị ${startIndex + 1} - ${Math.min(startIndex + phanCongPageSize, totalItems)} / ${totalItems} túi bài thi`;
        if (pageNumSpan) pageNumSpan.innerText = `Trang ${phanCongCurrentPage} / ${totalPages}`;
        if (btnPrev) btnPrev.disabled = (phanCongCurrentPage <= 1);
        if (btnNext) btnNext.disabled = (phanCongCurrentPage >= totalPages);

        updateBatchMainUI();
        initIcons();
    }
    window.renderPhanCong = renderPhanCong;

    // ================================================================
    // SELECTION & BATCH HANDLING FOR PK
    // ================================================================
    function toggleSelectPkItem(pkId) {
        if (selectedPkIds.has(pkId)) {
            selectedPkIds.delete(pkId);
        } else {
            selectedPkIds.add(pkId);
        }
        renderPhanCongPhucKhao();
    }
    window.toggleSelectPkItem = toggleSelectPkItem;

    function toggleSelectAllPk(chkHeader) {
        const keyword = (document.getElementById('filter-pk-search')?.value || '').toLowerCase().trim();
        const statusVal = document.getElementById('filter-pk-status')?.value || 'all';

        let filtered = phucKhaoData.filter(pk => {
            const matchKw = !keyword || (pk.subjectName || '').toLowerCase().includes(keyword) || (pk.id || '').toLowerCase().includes(keyword);
            const isAssigned = !!pk.graderPk;
            let matchSt = true;
            if (statusVal === 'chua_phan_cong') matchSt = !isAssigned;
            if (statusVal === 'da_phan_cong') matchSt = isAssigned;
            return matchKw && matchSt;
        });

        if (chkHeader.checked) {
            filtered.forEach(pk => selectedPkIds.add(pk.id));
        } else {
            filtered.forEach(pk => selectedPkIds.delete(pk.id));
        }
        renderPhanCongPhucKhao();
    }
    window.toggleSelectAllPk = toggleSelectAllPk;

    function clearBatchPkSelection() {
        selectedPkIds.clear();
        const headerChk = document.getElementById('select-all-pk-tui');
        if (headerChk) headerChk.checked = false;
        renderPhanCongPhucKhao();
    }
    window.clearBatchPkSelection = clearBatchPkSelection;

    function updateBatchPkUI() {
        const badge = document.getElementById('panel-pk-badge');
        const emptyState = document.getElementById('panel-pk-empty');
        const activeState = document.getElementById('panel-pk-active');
        const chipsContainer = document.getElementById('panel-pk-chips');

        if (!badge || !emptyState || !activeState) return;

        const count = selectedPkIds.size;
        badge.innerText = `Đã chọn ${count} bài`;

        if (count > 0) {
            emptyState.classList.add('hidden-view');
            activeState.classList.remove('hidden-view');

            const selectedList = phucKhaoData.filter(x => selectedPkIds.has(x.id));

            if (chipsContainer) {
                chipsContainer.innerHTML = selectedList.map(pk => `
                    <span class="bg-white border border-red-200 text-[#9e1c22] font-mono font-bold px-2 py-0.5 rounded-md text-[11px] shadow-xs flex items-center gap-1">
                        ${pk.id} (${pk.subjectName})
                        <button onclick="removePkFromBatch('${pk.id}')" class="text-gray-400 hover:text-red-700 font-extrabold text-xs ml-0.5" title="Bỏ bài này">✕</button>
                    </span>
                `).join('');
            }
            populateGvPanelPk();
        } else {
            emptyState.classList.remove('hidden-view');
            activeState.classList.add('hidden-view');
        }
    }

    function populateGvPanelPk() {
        const datalist = document.getElementById('gv-datalist-pk');
        if (!datalist) return;
        datalist.innerHTML = '';

        const selectedList = phucKhaoData.filter(x => selectedPkIds.has(x.id));
        const excludedGvId = selectedList[0]?.grader1 || 'GV001';

        canBoCoiThiData.forEach(g => {
            if (excludedGvId && g.id === excludedGvId) return; // Exclude Grader 1!
            datalist.innerHTML += `<option value="${g.name} - ${g.id}"></option>`;
        });
    }

    function triggerSaveFromPanelPk() {
        const inputVal = (document.getElementById('select-gv-panel-pk')?.value || '').trim();

        if (!inputVal) {
            showGlobalToast("Cảnh báo", "Vui lòng chọn hoặc gõ tên Giảng viên chấm phúc khảo", "warning");
            return;
        }

        const gvObj = canBoCoiThiData.find(g => 
            inputVal.includes(g.id) || 
            inputVal.toLowerCase().includes(g.name.toLowerCase()) || 
            g.name.toLowerCase().includes(inputVal.toLowerCase())
        );

        if (!gvObj) {
            showGlobalToast("Lỗi", "Không tìm thấy Giảng viên hợp lệ trong hệ thống", "error");
            return;
        }

        const hasConflict = phucKhaoData.some(pk => selectedPkIds.has(pk.id) && pk.grader1 === gvObj.id);
        if (hasConflict) {
            showGlobalToast("Lỗi", "Giảng viên chấm phúc khảo không được trùng với cán bộ chấm thi lần đầu", "error");
            return;
        }

        const count = selectedPkIds.size;
        openConfirmModal(
            `Xác nhận phân công phúc khảo (${count} bài thi)`,
            `Bạn có chắc chắn muốn phân công Giảng viên ${gvObj.name} (${gvObj.id}) chấm ${count} bài thi phúc khảo đã chọn không?`,
            () => executeSaveAssignPk(gvObj.id)
        );
    }
    window.triggerSaveFromPanelPk = triggerSaveFromPanelPk;

    function removePkFromBatch(pkId) {
        selectedPkIds.delete(pkId);
        renderPhanCongPhucKhao();
    }
    window.removePkFromBatch = removePkFromBatch;

    function openAssignPopupForSinglePk(pkId) {
        selectedPkIds.clear();
        selectedPkIds.add(pkId);
        openAssignPopupForBatchPk();
    }
    window.openAssignPopupForSinglePk = openAssignPopupForSinglePk;

    function openAssignPopupForBatchPk() {
        currentAssignMode = 'pk';
        if (selectedPkIds.size === 0) return;
        renderPhanCongPhucKhao();

        const selectedList = phucKhaoData.filter(x => selectedPkIds.has(x.id));
        const excludedGvId = selectedList[0]?.grader1 || 'GV001';

        document.getElementById('assign-popup-title').innerHTML = `<i data-lucide="shield-alert" class="text-amber-700 w-5 h-5"></i> Phân công Chấm Phúc khảo (${selectedPkIds.size} đơn)`;
        document.getElementById('assign-popup-info-box').className = "bg-amber-50 border border-amber-300 p-3.5 rounded-lg text-amber-950 font-semibold leading-relaxed";
        
        let chipsHtml = selectedList.map(pk => `
            <span class="bg-white border border-amber-300 text-amber-950 font-mono font-bold px-2.5 py-1 rounded-md text-[11px] shadow-xs flex items-center gap-1.5">
                ${pk.id} (${pk.subjectName})
                <button onclick="removePkFromBatch('${pk.id}')" class="text-gray-400 hover:text-red-600 font-extrabold text-xs ml-0.5" title="Bỏ bài này">✕</button>
            </span>
        `).join('');

        document.getElementById('assign-popup-info-box').innerHTML = `

    function populateGvPopupOptions(excludedGvId) {
        const select = document.getElementById('select-gv-popup');
        if (!select) return;
        const kw = (document.getElementById('search-gv-popup-keyword')?.value || '').toLowerCase().trim();

        const curVal = select.value;
        select.innerHTML = '<option value="">-- Chọn giảng viên --</option>';

        // Calculate count of bags currently assigned to each teacher
        let gvBagCounts = {};
        tuiPhachData.forEach(t => {
            if (t.grader1) gvBagCounts[t.grader1] = (gvBagCounts[t.grader1] || 0) + 1;
        });

        canBoCoiThiData.forEach(g => {
            if (excludedGvId && g.id === excludedGvId) return; // HIDDEN automatically!

            const count = gvBagCounts[g.id] || 0;
            const countBadge = count > 0 ? ` (Đang chấm ${count} túi bài)` : ' (Chưa phụ trách túi nào)';
            const match = !kw || g.name.toLowerCase().includes(kw) || g.id.toLowerCase().includes(kw);
            if (match) {
                select.innerHTML += `<option value="${g.id}">${g.name} (${g.id})${countBadge}</option>`;
            }
        });
        if (curVal && curVal !== excludedGvId) select.value = curVal;
    }

        const firstPk = phucKhaoData.find(x => selectedPkIds.has(x.id));
        const excluded = currentAssignMode === 'pk' ? (firstPk?.grader1 || 'GV001') : null;
        populateGvPopupOptions(excluded);

    function triggerConfirmSaveFromPopup() {
        const selectGv = document.getElementById('select-gv-popup');
        const chosenGvId = selectGv?.value;

        if (!chosenGvId) {
            showErrMsgPopup("Vui lòng chọn cán bộ chấm thi");
            return;
        }

        const gvObj = canBoCoiThiData.find(g => g.id === chosenGvId);
        if (!gvObj) {
            showErrMsgPopup("Cán bộ chấm thi không hợp lệ");
            return;
        }

        if (currentAssignMode === 'pk') {
            const hasConflict = phucKhaoData.some(pk => selectedPkIds.has(pk.id) && pk.grader1 === chosenGvId);
            if (hasConflict) {
                showErrMsgPopup("Cán bộ chấm phúc khảo không được trùng với cán bộ chấm thi lần đầu");
                return;
            }
        }

        document.getElementById('err-msg-popup')?.classList.add('hidden-view');
        closeAssignPopup();

        if (currentAssignMode === 'main') {
            const count = selectedMainTuiIds.size;
            openConfirmModal(
                `Xác nhận phân công hàng loạt (${count} túi bài thi)`,
                `Bạn có chắc chắn muốn phân công ${count} túi bài thi đã chọn cho Giảng viên ${gvObj.name} (${gvObj.id}) không?`,
                () => executeSaveAssignMain(chosenGvId)
            );
        } else {
            const count = selectedPkIds.size;
            openConfirmModal(
                `Xác nhận phân công phúc khảo hàng loạt (${count} bài thi)`,
                `Bạn có chắc chắn muốn phân công Giảng viên ${gvObj.name} (${gvObj.id}) chấm ${count} bài thi phúc khảo đã chọn không?`,
                () => executeSaveAssignPk(chosenGvId)
            );
        }
    }

    function renderPhanCongPhucKhao() {
        const tbody = document.getElementById('phan-cong-pk-tbody');
        if (!tbody) return;
        tbody.innerHTML = '';

        if (!phucKhaoData || phucKhaoData.length === 0) {
            phucKhaoData = [
                { id: 'MP-PK-901', subjectName: 'Lập trình Python Nâng cao', diemGoc: 6.5, reason: 'Chấm sót câu 3 (2.0 điểm)', grader1: 'GV001', graderPk: 'GV002', status: 'Đã phân công' },
                { id: 'MP-PK-902', subjectName: 'Cơ sở Dữ liệu & Giải thuật', diemGoc: 5.0, reason: 'Phúc khảo lại bài thi tự luận', grader1: 'GV001', graderPk: '', status: 'Chờ phân công' },
                { id: 'MP-PK-903', subjectName: 'Trí tuệ Nhân tạo App', diemGoc: 6.0, reason: 'Cộng nhầm tổng điểm bài thi', grader1: 'GV003', graderPk: 'GV002', status: 'Đã phân công' }
            ];
        }

        const keyword = (document.getElementById('filter-pk-search')?.value || '').toLowerCase().trim();
        const statusVal = document.getElementById('filter-pk-status')?.value || 'all';

        let list = phucKhaoData.filter(pk => {
            const matchKw = !keyword || (pk.subjectName || '').toLowerCase().includes(keyword) || (pk.id || '').toLowerCase().includes(keyword);
            const isAssigned = !!pk.graderPk;
            let matchSt = true;
            if (statusVal === 'chua_phan_cong') matchSt = !isAssigned;
            if (statusVal === 'da_phan_cong') matchSt = isAssigned;
            return matchKw && matchSt;
        });

        const totalItems = list.length;
        const totalPages = Math.ceil(totalItems / phanCongPkPageSize) || 1;
        if (phanCongPkCurrentPage > totalPages) phanCongPkCurrentPage = totalPages;
        if (phanCongPkCurrentPage < 1) phanCongPkCurrentPage = 1;

        const totalInfoSpan = document.getElementById('phan-cong-pk-total-info');
        const pageNumSpan = document.getElementById('phan-cong-pk-page-num');
        const btnPrev = document.getElementById('btn-pk-prev-page');
        const btnNext = document.getElementById('btn-pk-next-page');

        if (totalItems === 0) {
            tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-gray-400 italic">Không tìm thấy bài thi phúc khảo nào khớp bộ lọc.</td></tr>`;
            if (totalInfoSpan) totalInfoSpan.innerText = "Hiển thị 0 bài thi phúc khảo";
            if (pageNumSpan) pageNumSpan.innerText = "Trang 1 / 1";
            if (btnPrev) btnPrev.disabled = true;
            if (btnNext) btnNext.disabled = true;
            updateBatchPkUI();
            return;
        }

        const startIndex = (phanCongPkCurrentPage - 1) * phanCongPkPageSize;
        const pageList = list.slice(startIndex, startIndex + phanCongPkPageSize);

        // Sync header checkbox
        const headerChk = document.getElementById('select-all-pk-tui');
        if (headerChk) {
            headerChk.checked = pageList.length > 0 && pageList.every(pk => selectedPkIds.has(pk.id));
        }

        pageList.forEach(pk => {
            const isChecked = selectedPkIds.has(pk.id);
            const gvPk = canBoCoiThiData.find(g => g.id === pk.graderPk)?.name || pk.graderPk || '<span class="text-red-600 font-semibold italic">Chưa phân công</span>';
            const statusBadge = pk.graderPk 
                ? `<span class="bg-green-100 text-green-800 px-2.5 py-0.5 rounded-full text-[11px] font-bold">✓ Đã phân công</span>` 
                : `<span class="bg-red-100 text-red-800 px-2.5 py-0.5 rounded-full text-[11px] font-bold">● Chưa phân công</span>`;

            tbody.innerHTML += `
                <tr class="hover:bg-red-50/40 text-xs border-b border-gray-100 cursor-pointer ${isChecked ? 'bg-red-50/80 font-medium' : ''}" onclick="toggleSelectPkItem('${pk.id}')">
                    <td class="px-4 py-3.5 text-center" onclick="event.stopPropagation()">
                        <input type="checkbox" value="${pk.id}" ${isChecked ? 'checked' : ''} onchange="toggleSelectPkItem('${pk.id}')" class="w-4 h-4 text-[#9e1c22] rounded cursor-pointer" />
                    </td>
                    <td class="px-6 py-3.5 text-center font-mono font-bold text-red-950">${pk.id}</td>
                    <td class="px-6 py-3.5 text-left font-semibold text-gray-800">${pk.subjectName}</td>
                    <td class="px-6 py-3.5 text-center">${statusBadge}</td>
                    <td class="px-6 py-3.5 text-center font-bold text-gray-900">${gvPk}</td>
                </tr>
            `;
        });

        // Update PK pagination UI controls
        if (totalInfoSpan) totalInfoSpan.innerText = `Hiển thị ${startIndex + 1} - ${Math.min(startIndex + phanCongPkPageSize, totalItems)} / ${totalItems} bài thi phúc khảo`;
        if (pageNumSpan) pageNumSpan.innerText = `Trang ${phanCongPkCurrentPage} / ${totalPages}`;
        if (btnPrev) btnPrev.disabled = (phanCongPkCurrentPage <= 1);
        if (btnNext) btnNext.disabled = (phanCongPkCurrentPage >= totalPages);

        updateBatchPkUI();
        initIcons();
    }

    function populateGiaoNhanFilterSubjects(items, getSubjectFn) {
        const select = document.getElementById('gn-filter-subject');
        if (!select) return;
        const subjects = new Set();
        items.forEach(item => {
            const sName = getSubjectFn(item).split(' (')[0];
            if (sName) subjects.add(sName);
        });
        select.innerHTML = '<option value="">Tất cả Học phần</option>';
        Array.from(subjects).sort().forEach(s => {
            select.innerHTML += `<option value="${s}">${s}</option>`;
        });
        const searchInput = document.getElementById('gn-filter-search');
        if (searchInput) searchInput.value = '';
    }

    window.filterGiaoNhanList = function() {
        const searchVal = document.getElementById('gn-filter-search').value.toLowerCase().trim();
        const subjectVal = document.getElementById('gn-filter-subject').value;
        const loai = document.getElementById('dvcm-select-pbg-loai').value;

        let source = [];
        if (loai === "1") {
            source = tuiPhachData.filter(t => t.status === "Đã khóa phách" || t.status === "Chờ khớp điểm");
        } else {
            source = tuiPhachData.filter(t => t.status === "Đã đối chiếu hợp lệ");
        }

        giaoNhanFilteredItems = source.filter(b => {
            const sName = (b.subjectName || '').split(' (')[0];
            const matchesSearch = !searchVal || 
                (b.id || '').toLowerCase().includes(searchVal) || 
                (b.subjectName || '').toLowerCase().includes(searchVal);
            const matchesSubject = !subjectVal || sName === subjectVal;
            return matchesSearch && matchesSubject;
        });

        giaoNhanCurrentPage = 1;
        renderGiaoNhanPage();
    }

    function renderGiaoNhanPage() {
        const listDiv = document.getElementById('dvcm-gn-list-tui-kha-dung');
        if (!listDiv) return;
        listDiv.innerHTML = '';

        const totalPages = Math.ceil(giaoNhanFilteredItems.length / giaoNhanPageSize) || 1;
        if (giaoNhanCurrentPage > totalPages) giaoNhanCurrentPage = totalPages;

        const start = (giaoNhanCurrentPage - 1) * giaoNhanPageSize;
        const end = start + giaoNhanPageSize;
        const pageItems = giaoNhanFilteredItems.slice(start, end);

        if (pageItems.length === 0) {
            listDiv.innerHTML = `<div class="col-span-full text-xs text-gray-400 italic text-center py-12 bg-white rounded-lg border border-dashed border-gray-200">Không tìm thấy túi phách nào phù hợp.</div>`;
        } else {
            pageItems.forEach(b => {
                const isChecked = giaoNhanSelectedIds.has(b.id);
                const bgBadge = 'bg-amber-50 text-amber-700 border-amber-100';

                const checkedClasses = isChecked 
                    ? 'bg-blue-50/50 border-blue-500 ring-1 ring-blue-500/20' 
                    : 'bg-white border-slate-200 hover:border-blue-400 hover:bg-slate-50/30';

                listDiv.innerHTML += `
                    <label class="gn-item flex items-start gap-3 p-3 rounded-lg border cursor-pointer transition-all duration-150 shadow-sm ${checkedClasses}">
                        <div class="flex items-center h-5 mt-0.5">
                            <input type="checkbox" value="${b.id}" onchange="handleGiaoNhanCheckboxChange(this)" ${isChecked ? 'checked' : ''} class="w-3.5 h-3.5 text-blue-600 rounded border-gray-300 focus:ring-blue-500" />
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex flex-col gap-0.5">
                                <span class="font-extrabold text-slate-800 text-[12.5px] tracking-wide leading-tight">${b.id}</span>
                                <span class="text-slate-500 text-[11px] font-sans font-medium line-clamp-1 leading-normal">${b.subjectName}</span>
                                <span class="inline-flex items-center w-fit px-1.5 py-0.5 rounded text-[10px] font-bold font-sans border ${bgBadge} mt-1">${b.papers} bài</span>
                            </div>
                        </div>
                        <div class="shrink-0 bg-slate-100 p-2 rounded-lg text-slate-500 flex items-center justify-center">
                            <i data-lucide="package" class="w-4 h-4 text-amber-600"></i>
                        </div>
                    </label>
                `;
            });
        }

        document.getElementById('gn-pagination-info').innerText = `Trang ${giaoNhanCurrentPage} / ${totalPages}`;
        document.getElementById('gn-btn-prev').disabled = giaoNhanCurrentPage === 1;
        document.getElementById('gn-btn-next').disabled = giaoNhanCurrentPage === totalPages;
        initIcons();
    }

    function handleDvcmGiaoNhanLoaiChange() {
        const loai = document.getElementById('dvcm-select-pbg-loai').value;
        const selectUser = document.getElementById('dvcm-select-pbg-user');

        selectUser.innerHTML = '';

        let source = [];
        if (loai === "1") {
            // Giáo vụ bàn giao túi phách cho Giảng viên (DVCM ➔ GV)
            canBoCoiThiData.forEach(gv => {

            });
            source = tuiPhachData.filter(t => t.status === "Đã khóa phách" || t.status === "Chờ khớp điểm");
        } else if (loai === "5") {
            // Giáo vụ trả hồ sơ phúc khảo về Tổ khảo thí
            selectUser.innerHTML = `<option value="tkt">Tổ Khảo thí (tkt)</option>`;

        const listIds = Array.from(giaoNhanSelectedIds);
        if(listIds.length === 0) {

        const nextNum = phieuGiaoNhanData.length + 1;
        const newPhieuId = `PBG-2026-${String(nextNum).padStart(3, '0')}`;
        const attName = selectedAttachmentFile ? selectedAttachmentFile.name : "bien_ban_ban_giao_khoa.pdf";

        let qtyText = `${listIds.length} túi`;

        if (loaiVal === "1") {
            flow = `Đơn vị Chuyên môn ➔ Giảng viên (${userVal})`;

            qtyText = `${listIds.length} đơn`;
            recipient = "tkt";
            flow = "Đơn vị Chuyên môn ➔ Tổ Khảo thí (Trả phúc khảo)";
        } else {
            recipient = "tkt";
            flow = "Đơn vị Chuyên môn ➔ Tổ Khảo thí";
        }

        phieuGiaoNhanData.push({
            id: newPhieuId,
            type: typeText,
            flow: flow,
            qty: qtyText,
            status: "Chờ bạn xác nhận",
            rooms: null,
            bags: listIds,
            sender: "dvcm",
            recipient: recipient,
            attachments: [attName],
            log: ""
        });

        showGlobalToast("Thành công", `Đã phát hành phiếu giao nhận ${newPhieuId}!`);

        const statusSpan = document.getElementById('dvcm-gn-file-status');
        if (statusSpan) statusSpan.innerText = "Tải biên bản bàn giao (.pdf, .jpg)";

        saveStateToServer();
        renderGiaoNhan();
    }

    async function saveAssignExecute() {
        const cb1 = document.getElementById('assign-cb1').value;
        const cb2 = document.getElementById('assign-cb2').value;

        if (cb1 === cb2) {
            alert("Cán bộ chấm 1 và Cán bộ chấm 2 phải là hai người khác nhau để đảm bảo quy chế thi!");
            return;
        }

        try {
            const response = await fetch('/dvcm/api/phan-cong-cham/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({
                    phan_congs: [{ tui_phach: activeAssignTuiId, gv1: cb1, gv2: cb2 }]
                })
            });

            if (!response.ok) throw new Error('Network response was not ok');

            showGlobalToast("Phân công thành công", `Đã chỉ định GV chấm cho túi phách ${activeAssignTuiId}.`);
            
            // Đồng bộ nạp lại toàn bộ dữ liệu mới nhất trực tiếp từ CSDL
            if (typeof loadStateFromServer === 'function') {
                await loadStateFromServer();
            }
            
            hideAssignModal();
            renderPhanCong();
        } catch (error) {
            showGlobalToast("Lỗi", "Không thể phân công chấm thi", "error");
        }
    }

    function renderNhapTraDiem() {
        const leftList = document.getElementById('nhapdiem-tui-list');
        const countSpan = document.getElementById('duyet-list-count-dvcm');
        if (!leftList) return;

        leftList.innerHTML = '';

        const filterVal = document.getElementById('duyet-filter-select-dvcm')?.value || 'cho';
        const query = (document.getElementById('duyet-search-input-dvcm')?.value || '').toLowerCase().trim();

        let list = tuiPhachData.filter(t => t.status === "Khoa đã phê duyệt" || t.status === "Đã duyệt bảng điểm" || t.status === "Chờ Khoa duyệt" || t.grader1 || t.status);

        if (filterVal === 'cho') {
            list = list.filter(t => t.status !== "Khoa đã phê duyệt" && t.status !== "Đã duyệt bảng điểm");
        } else if (filterVal === 'da') {
            list = list.filter(t => t.status === "Khoa đã phê duyệt" || t.status === "Đã duyệt bảng điểm");
        }

        if (query) {
            list = list.filter(t => t.id.toLowerCase().includes(query) || (t.subjectName || '').toLowerCase().includes(query));
        }

        if (countSpan) countSpan.innerText = `${list.length} túi bài`;

        if (list.length === 0) {
            leftList.innerHTML = `<div class="p-8 text-center text-gray-400 italic text-xs">Không tìm thấy bảng điểm nào phù hợp.</div>`;
            const pEmpty = document.getElementById('entry-panel-empty');
            const pPanel = document.getElementById('entry-panel-form');
            if (pEmpty) pEmpty.classList.remove('hidden-view');
            if (pPanel) pPanel.classList.add('hidden-view');
            updateBatchDuyetCountDVCM();
            return;
        }

        list.forEach(t => {
            let cbCol = `<span class="text-gray-300 w-4 inline-block text-center">-</span>`;
            let badge = `<span class="bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded text-[10px] font-bold">✓ Đã duyệt</span>`;

            if (t.status !== "Khoa đã phê duyệt" && t.status !== "Đã duyệt bảng điểm") {
                cbCol = `<input type="checkbox" class="duyet-item-cb-dvcm w-4 h-4 cursor-pointer accent-[#9e1c22]" value="${t.id}" onchange="updateBatchDuyetCountDVCM(); event.stopPropagation();" onclick="event.stopPropagation();">`;
                badge = `<span class="bg-amber-100 text-amber-800 px-2 py-0.5 rounded text-[10px] font-bold">Chờ duyệt</span>`;
            }

            const isSelected = (activeNhapDiemTuiId === t.id);
            const activeClass = isSelected ? 'bg-blue-50/80 border-l-4 border-l-[#9e1c22]' : 'hover:bg-gray-50 border-l-4 border-l-transparent';

            leftList.innerHTML += `
                <div onclick="selectTuiNhapDiem('${t.id}')" class="p-3.5 cursor-pointer transition-all flex items-center justify-between ${activeClass}" id="dvcm-duyet-row-${t.id}">
                    <div class="flex items-center gap-3">
                        ${cbCol}
                        <div>
                            <div class="flex items-center gap-2">
                                <span class="font-mono font-bold text-gray-800 text-xs">${t.id}</span>
                                ${badge}
                            </div>
                            <p class="text-xs font-semibold text-gray-900 mt-0.5 line-clamp-1">${t.subjectName}</p>
                            <p class="text-[10px] text-gray-500 mt-0.5">${t.papers || 25} bài thi</p>
                        </div>
                    </div>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-gray-400"></i>
                </div>
            `;
        });

        if (list.length > 0) {
            const exists = list.find(t => t.id === activeNhapDiemTuiId);
            if (!exists) {
                selectTuiNhapDiem(list[0].id);
            } else {
                selectTuiNhapDiem(activeNhapDiemTuiId);
            }
        }

        updateBatchDuyetCountDVCM();
        initIcons();
    }

    function sumChars(str) {
        let sum = 0;
        if (!str) return 0;
        const s = String(str);
        for (let i = 0; i < s.length; i++) {
            sum += s.charCodeAt(i);
        }
        return sum;
    }
    window.sumChars = sumChars;

    function selectTuiNhapDiem(tuiId) {
        activeNhapDiemTuiId = tuiId;

        const item = tuiPhachData.find(t => t.id === tuiId);

        document.querySelectorAll('#nhapdiem-tui-list > div').forEach(el => {
            el.classList.remove('bg-blue-50/80', 'border-l-4', 'border-l-[#9e1c22]');
            el.classList.add('hover:bg-gray-50', 'border-l-4', 'border-l-transparent');
        });

        const activeRow = document.getElementById(`dvcm-duyet-row-${tuiId}`);
        if (activeRow) {
            activeRow.classList.remove('hover:bg-gray-50', 'border-l-transparent');
            activeRow.classList.add('bg-blue-50/80', 'border-l-[#9e1c22]');
        }

        const panelEmpty = document.getElementById('entry-panel-empty');
        const panelForm = document.getElementById('entry-panel-form');

        if (!item) {
            if (panelEmpty) panelEmpty.classList.remove('hidden-view');
            if (panelForm) panelForm.classList.add('hidden-view');
            return;
        }

        if (panelEmpty) panelEmpty.classList.add('hidden-view');
        if (panelForm) panelForm.classList.remove('hidden-view');

        document.getElementById('entry-title-tui').innerText = `Túi bài thi: ${item.id}`;
        document.getElementById('entry-title-sub').innerText = `Học phần: ${item.subjectName} (${item.subjectId || ''})`;
        document.getElementById('entry-meta-info').innerText = `Số lượng: ${item.papers || 25} bài thi | Giám khảo: ${item.grader1 || 'GV001'} & ${item.grader2 || 'GV002'}`;

        const badgeEl = document.getElementById('entry-status-badge');
        const actionBox = document.getElementById('entry-action-container');

        if (item.status !== "Khoa đã phê duyệt" && item.status !== "Đã duyệt bảng điểm") {
            if (badgeEl) badgeEl.innerHTML = `<span class="bg-amber-100 text-amber-800 px-2.5 py-0.5 rounded text-[10px] font-bold">Chờ duyệt</span>`;
            if (actionBox) actionBox.innerHTML = `
                <span class="bg-amber-50 text-amber-800 border border-amber-200 px-3 py-1 rounded text-xs font-bold inline-block">Chờ Khoa duyệt</span>
            `;
        } else {
            if (badgeEl) badgeEl.innerHTML = `<span class="bg-emerald-100 text-emerald-800 px-2.5 py-0.5 rounded text-[10px] font-bold">✓ Đã duyệt</span>`;
            if (actionBox) actionBox.innerHTML = `
                <div class="text-right">
                    <span class="bg-emerald-50 text-emerald-800 border border-emerald-200 px-3 py-1 rounded text-xs font-bold block mb-1">✓ ĐÃ PHÊ DUYỆT (CẤP KHOA)</span>
                    <span class="text-gray-400 italic text-[10px] block">Xác nhận bởi Giáo vụ Khoa</span>
                </div>
            `;
        }

        const tbody = document.getElementById('entry-tbody');
        tbody.innerHTML = '';

        const phachs = item.phachGoc || [];
        const paperCount = phachs.length > 0 ? phachs.length : (item.papers || 15);

        for (let i = 0; i < paperCount; i++) {
            const pCode = phachs[i] || `P-${(100 + i)}`;
            const seed = sumChars(pCode);
            const finalPt = (6.0 + (seed % 35) / 10).toFixed(1);

            tbody.innerHTML += `
                <tr class="hover:bg-gray-50 transition-colors font-mono">
                    <td class="px-4 py-2 text-gray-500 font-sans text-center">${i + 1}</td>
                    <td class="px-4 py-2 font-mono font-bold text-gray-800">${pCode}</td>
                    <td class="px-4 py-2 text-center font-bold text-blue-900 font-mono text-sm">${finalPt}</td>
                </tr>
            `;
        }

        initIcons();
    }
    window.selectTuiNhapDiem = selectTuiNhapDiem;

    function saveTempGrade(phachCode, graderType, value) {
        if(!tempGradesData[activeNhapDiemTuiId]) {
            tempGradesData[activeNhapDiemTuiId] = {};
        }
        if(!tempGradesData[activeNhapDiemTuiId][phachCode]) {
            tempGradesData[activeNhapDiemTuiId][phachCode] = { pt1: null, pt2: null };
        }
        tempGradesData[activeNhapDiemTuiId][phachCode][graderType] = parseFloat(value);
    }

    function submitGradingSheet() {
        const t = tuiPhachData.find(x => x.id === activeNhapDiemTuiId);
        if (!t) return;

        t.status = "Đã đối chiếu hợp lệ";

        t.scores = {};
        const phachList = t.phachGoc || Array.from({length: t.papers}, (_, i) => `PH${1000 + i}`);

        phachList.forEach((ph, index) => {
            let p1 = 7.5;
            let p2 = 7.5;

            if (tempGradesData[t.id] && tempGradesData[t.id][ph]) {
                p1 = tempGradesData[t.id][ph].pt1 || 7.5;
                p2 = tempGradesData[t.id][ph].pt2 || 7.5;
            }

            if (index === 2) {
                p2 = 8.0;
            }

            t.scores[ph] = { pt1: p1, pt2: p2, ptFinal: (p1 + p2)/2 };
        });

        const pid = `PTD-${new Date().getFullYear()}-${String(phieuGiaoNhanData.length + 1).padStart(3, '0')}`;
        phieuGiaoNhanData.push({
            id: pid,
            type: `Trả điểm & file quét bài thi học phần (Loại 2)`,
            flow: `Đơn vị Chuyên môn (Khoa) ➔ Tổ Khảo thí`,
            qty: 1,
            status: "Chờ nhận",
            rooms: null,
            bags: [t.id]
        });

        showGlobalToast("Nộp điểm thành công", `Đã lưu điểm và tạo phiếu bàn giao trả điểm ${pid} gửi về Tổ Khảo thí.`);
        saveStateToServer();

        document.getElementById('entry-panel-form').classList.add('hidden-view');
        document.getElementById('entry-panel-empty').classList.remove('hidden-view');
        activeNhapDiemTuiId = "";
        renderNhapTraDiem();
    }

    function showGlobalToast(title, msg, type = 'success') {
        const toast = document.getElementById('toast-global');
        const icon = document.getElementById('toast-global-icon');

        toast.className = "fixed bottom-6 right-6 text-white px-6 py-4 rounded shadow-xl flex items-center gap-3 animate-fade-in-up z-[200]";

        if (type === 'error') {
            toast.classList.add('bg-red-600');
            icon.setAttribute('data-lucide', 'alert-circle');
        } else {
            toast.classList.add('bg-green-600');
            icon.setAttribute('data-lucide', 'check-circle-2');
        }

        document.getElementById('toast-global-title').innerText = title;
        document.getElementById('toast-global-msg').innerText = msg || '';
        toast.classList.remove('hidden-view');
        initIcons();

        setTimeout(() => toast.classList.add('hidden-view'), 4000);
    }

    // ==========================================================
    // UC: QUẢN LÝ ĐỀ THI (DVCM)
    // ==========================================================
    function switchTabDeThi(tab) {
        const tabDs = document.getElementById('de-thi-danh-sach-tab');
        const tabNd = document.getElementById('de-thi-nop-de-tab');
        if (tabDs) tabDs.classList.add('hidden-view');
        if (tabNd) tabNd.classList.add('hidden-view');

        const btnDs = document.getElementById('btn-dt-tab-ds');
        const btnNd = document.getElementById('btn-dt-tab-nd');
        if (btnDs && btnNd) {
            btnDs.className = "text-left px-4 py-3 rounded font-semibold transition flex items-center gap-2 text-gray-600 hover:bg-gray-100 font-sans shadow-none";
            btnNd.className = "text-left px-4 py-3 rounded font-semibold transition flex items-center gap-2 text-gray-600 hover:bg-gray-100 font-sans shadow-none";
        }

        if (tab === 'danh-sach') {
            if (tabDs) tabDs.classList.remove('hidden-view');
            if (btnDs) btnDs.className = "text-left px-4 py-3 rounded font-semibold transition flex items-center gap-2 bg-blue-100 text-blue-800 shadow-sm font-sans";
            renderDeThi();
        } else {
            if (tabNd) tabNd.classList.remove('hidden-view');
            if (btnNd) btnNd.className = "text-left px-4 py-3 rounded font-semibold transition flex items-center gap-2 bg-blue-100 text-blue-800 shadow-sm font-sans";
            renderDeThiNopTable();
        }
        initIcons();
    }
    window.switchTabDeThi = switchTabDeThi;

    function renderDeThi() {
        const tbody = document.getElementById('de-thi-tbody');
        if (!tbody) return;

        if (deThiData.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" class="text-center py-8 text-gray-500 italic">Chưa có đề thi nào được nộp.</td></tr>`;
            return;
        }

        tbody.innerHTML = deThiData.map(dt => {
            let badgeClass = "bg-yellow-100 text-yellow-800";
            if (dt.trangThai === "Đạt") badgeClass = "bg-green-100 text-green-800 font-bold";
            else if (dt.trangThai === "Chờ chỉnh sửa") badgeClass = "bg-red-100 text-red-800";

            return `
                <tr class="hover:bg-gray-50 border-b border-gray-100 cursor-pointer" onclick="showDeThiDetail('${dt.id}')">
                    <td class="px-4 py-3 font-mono font-bold text-blue-900">${dt.id}</td>
                    <td class="px-4 py-3 font-semibold text-gray-800">${dt.hocPhan}</td>
                    <td class="px-4 py-3 text-gray-600">${dt.nguoiNop}</td>
                    <td class="px-4 py-3 text-gray-500 font-medium">${dt.thoiGian}</td>
                    <td class="px-4 py-3 text-blue-600 font-medium truncate max-w-[150px]" title="${dt.fileName}">${dt.fileName || 'Chưa đính kèm'}</td>
                    <td class="px-4 py-3">
                        <span class="px-2.5 py-1 rounded text-xs ${badgeClass}">${dt.trangThai}</span>
                    </td>
                    <td class="px-4 py-3 text-center text-gray-500 italic">${dt.nhanXet || 'Không'}</td>
                </tr>
            `;
        }).join('');
    }
    window.renderDeThi = renderDeThi;

    function renderDeThiNopTable() {
        const tbody = document.getElementById('de-thi-nop-tbody');
        if (!tbody) return;

        if (deThiData.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-gray-500 italic">Chưa có đề thi nào được nộp.</td></tr>`;
            return;
        }

        tbody.innerHTML = deThiData.map(dt => {
            let badgeClass = "bg-yellow-100 text-yellow-800";
            if (dt.trangThai === "Đạt") badgeClass = "bg-green-100 text-green-800 font-bold";
            else if (dt.trangThai === "Chờ chỉnh sửa") badgeClass = "bg-red-100 text-red-800";

            return `
                <tr class="hover:bg-gray-50 border-b border-gray-100">
                    <td class="px-3 py-2.5 font-mono font-bold text-blue-950">${dt.id}</td>
                    <td class="px-3 py-2.5 font-semibold text-gray-800">${dt.hocPhan}</td>
                    <td class="px-3 py-2.5 text-gray-600">${dt.nguoiNop}</td>
                    <td class="px-3 py-2.5 text-gray-500 font-medium">${dt.thoiGian}</td>
                    <td class="px-3 py-2.5 text-blue-600 font-medium truncate max-w-[120px]">${dt.fileName || 'N/A'}</td>
                    <td class="px-3 py-2.5">
                        <span class="px-2 py-0.5 rounded text-[10px] ${badgeClass}">${dt.trangThai}</span>
                    </td>
                </tr>
            `;
        }).join('');
    }
    window.renderDeThiNopTable = renderDeThiNopTable;

    function showDeThiDetail(id) {
        const dt = deThiData.find(x => x.id === id);
        if (!dt) return;

        document.getElementById('dt-detail-id').innerText = dt.id;
        document.getElementById('dt-detail-subject').innerText = dt.hocPhan;
        document.getElementById('dt-detail-submitter').innerText = dt.nguoiNop;
        document.getElementById('dt-detail-time').innerText = dt.thoiGian;
        document.getElementById('dt-detail-file-name').innerText = dt.fileName || 'Không có tệp';
        document.getElementById('dt-detail-note').innerText = dt.ghiChu || 'Không ghi chú';
        document.getElementById('dt-detail-review').innerText = dt.nhanXet || 'Chưa có nhận xét rà soát.';

        const statusEl = document.getElementById('dt-detail-status');
        statusEl.innerText = dt.trangThai;
        statusEl.className = "px-2 py-0.5 rounded font-bold text-xs " + 
            (dt.trangThai === "Đạt" ? "bg-green-100 text-green-800" : 
             dt.trangThai === "Chờ chỉnh sửa" ? "bg-red-100 text-red-800" : "bg-yellow-100 text-yellow-800");

        document.getElementById('modal-detail-de-thi').classList.remove('hidden-view');
    }
    window.showDeThiDetail = showDeThiDetail;

    function closeDeThiDetail() {
        document.getElementById('modal-detail-de-thi').classList.add('hidden-view');
    }
    window.closeDeThiDetail = closeDeThiDetail;

    async function handleNopDeThi() {
        const subject = document.getElementById('dt-hoc-phan').value.trim();
        const fileInput = document.getElementById('dt-file');
        const note = document.getElementById('dt-ghi-chu').value.trim();

        if (!subject || !fileInput.files[0]) {
            showGlobalToast("Lỗi nhập liệu", "Vui lòng nhập tên học phần và chọn tệp đề thi.", "error");
            return;
        }

        const fileName = fileInput.files[0].name;
        const newDe = {
            id: "DT" + Date.now().toString().slice(-4),
            hocPhan: subject,
            nguoiNop: "Trưởng ĐVCM",
            thoiGian: new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }) + " " + new Date().toLocaleDateString('vi-VN'),
            fileName: fileName,
            ghiChu: note,
            trangThai: "Chờ rà soát",
            nhanXet: ""
        };

        deThiData.unshift(newDe);
        
        // Reset form
        document.getElementById('dt-hoc-phan').value = '';
        document.getElementById('dt-file').value = '';
        document.getElementById('dt-file-name').innerText = 'Click để chọn tệp hoặc kéo thả tệp vào đây';
        document.getElementById('dt-ghi-chu').value = '';

        showGlobalToast("Thành công", "Đã nộp đề thi lên hệ thống thành công.", "success");
        renderDeThiNopTable();
        
        if (typeof isStateLoaded !== "undefined" && isStateLoaded) saveStateToServer();
    }
    window.handleNopDeThi = handleNopDeThi;
</script>
