<!-- Modal: Phân công cán bộ -->
<div id="modal-assign" class="hidden-view fixed inset-0 bg-black/60 z-[100] flex items-center justify-center animate-fade-in">
    <div class="bg-white rounded-lg shadow-xl max-w-md w-full overflow-hidden animate-fade-in-down flex flex-col">
        <div class="bg-emerald-900 text-white p-4 flex justify-between items-center rounded-t-lg border-b border-orange-500">
            <h3 class="font-bold text-sm flex items-center gap-1.5"><i data-lucide="user-plus" class="w-4 h-4 text-yellow-400"></i> PHÂN CÔNG CÁN BỘ CHẤM THI</h3>
            <button onclick="hideAssignModal()" class="text-white hover:text-gray-200"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        <div class="p-6 flex flex-col gap-4 text-xs font-sans">
            <h4 class="font-bold text-gray-800 text-xs">Chỉ định cán bộ chấm cho túi phách: <strong id="assign-tui-id" class="text-[#9e1c22] font-mono">...</strong></h4>

            <div>
                <label class="block font-bold text-gray-700 mb-1">Cán bộ chấm 1</label>
                <select id="assign-cb1" class="w-full p-2.5 border rounded outline-none">
                    <option value="GV001">Nguyễn Văn A (Khoa CNTT)</option>
                    <option value="GV002">Trần Thị B (Khoa QTKD)</option>
                    <option value="GV003">Lê Hoàng C (Khoa KHXH)</option>
                    <option value="GV004">Phạm Minh D (Khoa NN Anh)</option>
                    <option value="GV005">Đặng Thanh E (Khoa CNTT)</option>
                </select>
            </div>

            <div>
                <label class="block font-bold text-gray-700 mb-1">Cán bộ chấm 2 (phải khác Cán bộ chấm 1)</label>
                <select id="assign-cb2" class="w-full p-2.5 border rounded outline-none">
                    <option value="GV002">Trần Thị B (Khoa QTKD)</option>
                    <option value="GV001">Nguyễn Văn A (Khoa CNTT)</option>
                    <option value="GV003">Lê Hoàng C (Khoa KHXH)</option>
                    <option value="GV004">Phạm Minh D (Khoa NN Anh)</option>
                    <option value="GV005">Đặng Thanh E (Khoa CNTT)</option>
                </select>
            </div>
        </div>
        <div class="bg-gray-50 p-4 border-t flex justify-end gap-2 text-xs">
            <button onclick="hideAssignModal()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded font-bold">HỦY BỎ</button>
            <button onclick="saveAssignExecute()" class="bg-emerald-950 hover:bg-emerald-900 text-white px-4 py-2 rounded font-bold shadow">XÁC NHẬN PHÂN CÔNG</button>
        </div>
    </div>
</div>
