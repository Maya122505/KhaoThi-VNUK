<!-- VIEW: NHẬT KÝ HỆ THỐNG -->
<div id="view-home" class="view-section animate-fade-in flex flex-col h-full">
    <div class="flex justify-between items-end border-b border-gray-200 pb-4 mb-6">
        <div>
            <h2 class="text-2xl font-bold text-blue-900 mb-1 flex items-center gap-2"><i data-lucide="activity" class="text-blue-600"></i> Nhật ký hoạt động (Audit Transactions Log)</h2>
            <p class="text-sm text-gray-600">Giám sát toàn bộ các giao dịch lập phiếu, nhận bài, phân phách, chấm thi, ký duyệt số của tất cả các cán bộ liên quan.</p>
        </div>
        <button onclick="clearSystemLogs()" class="bg-red-50 hover:bg-red-100 text-red-700 border border-red-200 font-bold px-3 py-1.5 rounded text-xs transition-colors font-sans">XÓA NHẬT KÝ</button>
    </div>

    <!-- Logs Table -->
    <div class="bg-white border rounded-lg shadow-sm overflow-hidden mb-6">
        <table class="w-full text-left text-xs border-collapse">
            <thead class="bg-gray-100 text-gray-700 font-bold border-b">
                <tr>
                    <th class="px-6 py-3.5 w-44">Thời gian</th>
                    <th class="px-6 py-3.5 w-44">Cán bộ thực hiện (Actor)</th>
                    <th class="px-6 py-3.5">Hành động ghi nhận</th>
                </tr>
            </thead>
            <tbody id="logs-tbody" class="divide-y divide-gray-100 font-mono text-gray-700">
                <!-- Được điền tự động bằng JavaScript -->
            </tbody>
        </table>
    </div>
</div>
