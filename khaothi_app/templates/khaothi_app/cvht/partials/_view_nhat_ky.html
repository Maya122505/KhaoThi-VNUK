<!-- VIEW: NHẬT KÝ HỆ THỐNG -->
<div id="view-nhat-ky" class="view-section hidden-view animate-fade-in space-y-6">
    <div class="flex justify-between items-center border-b pb-4 mb-2">
        <div>
            <h2 class="text-xl font-bold text-blue-900 flex items-center gap-2">
                <i data-lucide="history"></i> Quản lý Nhật ký & Audit Logs Hệ thống
            </h2>
            <p class="text-xs text-gray-500 mt-1">Lưu trữ vết thao tác kỹ thuật của cán bộ, giảng viên và các sự kiện hệ thống tự động.</p>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="clearSystemLogs()" class="bg-red-50 text-red-700 border border-red-200 hover:bg-red-100 text-xs font-bold px-3 py-2 rounded flex items-center gap-1.5 transition-colors">
                <i data-lucide="trash-2" class="w-4 h-4"></i> Xóa lịch sử nhật ký
            </button>
        </div>
    </div>

    <!-- Audit Logs Section -->
    <div class="bg-white border rounded-xl shadow-sm overflow-hidden">
        <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center bg-gray-50">
            <h3 class="font-bold text-gray-900 text-base flex items-center gap-2">
                <i data-lucide="list-filter" class="w-5 h-5 text-red-800"></i>
                Danh sách Audit Log
            </h3>
            <span id="dash-log-count" class="text-xs font-bold text-gray-500">Hiển thị các sự kiện gần đây</span>
        </div>
        <div class="overflow-x-auto">
            <table class="w-full text-left text-sm text-gray-600">
                <thead class="bg-gray-100 text-gray-700 uppercase text-xs">
                    <tr>
                        <th class="px-6 py-3">Thời gian</th>
                        <th class="px-6 py-3">Tác nhân</th>
                        <th class="px-6 py-3">Hành động</th>
                        <th class="px-6 py-3 text-center">IP Address</th>
                    </tr>
                </thead>
                <tbody id="dash-audit-logs-tbody" class="divide-y divide-gray-200">
                    <!-- Rendered dynamically by JS -->
                </tbody>
            </table>
        </div>
    </div>
</div>
