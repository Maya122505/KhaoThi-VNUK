<!-- Scripts Section -->
<script>
    // Synced global variables
    let kyThiData = [];
    let caThiData = [];
    let lichThiData = [];
    let hocPhiData = [];
    let lopThiDiemData = [];

    let phongThiGocData = [];
    let tuiPhachData = [];
    let phieuGiaoNhanData = [];
    let canBoCoiThiData = [];
    let phucKhaoData = [];
    let auditLogsData = [];
    let systemConfigsData = {};
    let subjectsData = [];
    let roomsData = [];

    let isStateLoaded = false;
    let activeViewId = "view-home";
    let isSystemLocked = false;

    window.onload = async function() {
        initIcons();
        await loadStateFromServer();
        const savedViewId = sessionStorage.getItem('cvht_activeViewId');
        navigate(savedViewId || 'view-home');
    };

    function initIcons() { lucide.createIcons(); }

    async function loadStateFromServer() {
        try {
            const res = await fetch('/api/get_state/');
            const data = await res.json();

            kyThiData = data.kyThiData || [];
            caThiData = data.caThiData || [];
            lichThiData = data.lichThiData || [];
            hocPhiData = data.hocPhiData || [];
            lopThiDiemData = data.lopThiDiemData || [];
            phongThiGocData = data.phongThiGocData;
            tuiPhachData = data.tuiPhachData;
            phieuGiaoNhanData = data.phieuGiaoNhanData;
            canBoCoiThiData = data.canBoCoiThiData;
            phucKhaoData = data.phucKhaoData;
            auditLogsData = data.auditLogsData || [];
            systemConfigsData = data.systemConfigsData || {};
            subjectsData = data.subjectsData || [];
            roomsData = data.roomsData || [];
            isStateLoaded = true;
        } catch(e) {
            console.error("Lỗi đồng bộ dữ liệu:", e);
        }
    }

    async function saveStateToServer() {
        try {
            await fetch('/api/save_state/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                        kyThiData,
                        caThiData,
                        lichThiData,
                        hocPhiData,
                        lopThiDiemData,
                    phongThiGocData,
                    tuiPhachData,
                    phieuGiaoNhanData,
                    canBoCoiThiData,
                    phucKhaoData,
                    auditLogsData,
                    systemConfigsData
                })
            });
        } catch(e) {
            console.error("Lỗi lưu dữ liệu:", e);
        }
    }

    function navigate(viewId) {
        document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden-view'));
        const targetView = document.getElementById(viewId);
        if(targetView) targetView.classList.remove('hidden-view');
        sessionStorage.setItem('cvht_activeViewId', viewId);

        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.classList.remove('bg-[#801418]', 'border-b-white', 'font-bold');
            btn.classList.add('border-transparent');
        });

        activeViewId = viewId;
        const activeBtnMap = {
            'view-home': 'nav-btn-home',
            'view-danh-muc': 'nav-btn-danh-muc',
            'view-cau-hinh': 'nav-btn-cau-hinh'
        };
        const activeBtn = document.getElementById(activeBtnMap[viewId]);
        if (activeBtn) {
            activeBtn.classList.remove('border-transparent');
            activeBtn.classList.add('bg-[#801418]', 'border-b-white', 'font-bold');
        }

        if(viewId === 'view-home') {
            renderLogs();
        } else if(viewId === 'view-danh-muc') {
            renderDanhMuc();
        } else if(viewId === 'view-cau-hinh') {
            const selector = document.getElementById('config-type-selector');
            if (selector) {
                selector.value = "nhap_diem_hp";
                switchConfigType("nhap_diem_hp");
            }
        }
        initIcons();
    }
    window.navigate = navigate;

    function switchConfigType(val) {
        document.querySelectorAll('.config-sub-view').forEach(el => el.classList.add('hidden-view'));
        if(val === 'nhap_diem_hp') {
            document.getElementById('config-area-nhap-diem-hp').classList.remove('hidden-view');
            loadConfigNhapDiem();
        } else if(val === 'phuc_khao') {
            document.getElementById('config-area-phuc-khao').classList.remove('hidden-view');
            loadConfigPhucKhao();
        } else if(val === 'nop_de') {
            document.getElementById('config-area-nop-de').classList.remove('hidden-view');
        } else if(val === 'nhap_thanh_phan') {
            document.getElementById('config-area-nhap-thanh-phan').classList.remove('hidden-view');
        } else if(val === 'trong_so') {
            document.getElementById('config-area-trong-so').classList.remove('hidden-view');
        } else if(val === 'dieu_kien') {
            document.getElementById('config-area-dieu-kien').classList.remove('hidden-view');
        } else if(val === 'quy_doi') {
            document.getElementById('config-area-quy-doi').classList.remove('hidden-view');
        }
        initIcons();
    }
    window.switchConfigType = switchConfigType;

    function renderLogs() {
        const tbody = document.getElementById('logs-tbody');
        tbody.innerHTML = '';

        if(auditLogsData.length === 0) {
            tbody.innerHTML = `<tr><td colspan="3" class="px-6 py-12 text-center text-gray-400 italic">Nhật ký trống.</td></tr>`;
            return;
        }

        [...auditLogsData].reverse().forEach(log => {
            let badge = `<span class="text-blue-900 font-bold">${log.actor}</span>`;
            if(log.actor === 'Hệ thống') badge = `<span class="text-gray-500 font-bold">${log.actor}</span>`;
            if(log.actor === 'Thư ký Coi thi') badge = `<span class="text-sky-600 font-bold">${log.actor}</span>`;

            tbody.innerHTML += `
                <tr class="hover:bg-gray-50 text-xs border-b">
                    <td class="px-6 py-3 font-semibold text-gray-400">${log.time}</td>
                    <td class="px-6 py-3 font-bold">${badge}</td>
                    <td class="px-6 py-3 text-gray-700">${log.action}</td>
                </tr>
            `;
        });
    }

    function loadConfigNhapDiem() {
        const namHoc = document.getElementById('config-nd-namhoc')?.value || '2025-2026';
        const hocKy = document.getElementById('config-nd-hocky')?.value || 'Học kỳ I';
        const dotThi = document.getElementById('config-nd-dotthi')?.value || 'Đợt 1';
        const key = `${namHoc}_${hocKy}_${dotThi}`;

        const cfg = systemConfigsData.nhapDiem?.[key];
        const startEl = document.getElementById('config-nd-start');
        const endEl = document.getElementById('config-nd-end');
        const publishEl = document.getElementById('config-nd-publish');

        const btnSave = document.getElementById('btn-save-nd');
        const btnEdit = document.getElementById('btn-edit-nd');

        if (cfg && cfg.start) {
            startEl.value = cfg.start;
            endEl.value = cfg.end;
            publishEl.value = cfg.publish;

            [startEl, endEl, publishEl].forEach(el => {
                if (el) {
                    el.setAttribute('disabled', 'true');
                    el.classList.add('bg-gray-100', 'cursor-not-allowed');
                }
            });
            if (btnSave) {
                btnSave.classList.add('opacity-50', 'cursor-not-allowed');
                btnSave.setAttribute('disabled', 'true');
            }
            if (btnEdit) btnEdit.classList.remove('hidden-view');
        } else {
            startEl.value = "";
            endEl.value = "";
            publishEl.value = "";

            [startEl, endEl, publishEl].forEach(el => {
                if (el) {
                    el.removeAttribute('disabled');
                    el.classList.remove('bg-gray-100', 'cursor-not-allowed');
                }
            });
            if (btnSave) {
                btnSave.classList.remove('opacity-50', 'cursor-not-allowed');
                btnSave.removeAttribute('disabled');
            }
            if (btnEdit) btnEdit.classList.add('hidden-view');
        }
    }
    window.loadConfigNhapDiem = loadConfigNhapDiem;

    function loadConfigPhucKhao() {
        const namHoc = document.getElementById('config-pk-namhoc')?.value || '2025-2026';
        const hocKy = document.getElementById('config-pk-hocky')?.value || 'Học kỳ I';
        const dotThi = document.getElementById('config-pk-dotthi')?.value || 'Đợt 1';
        const key = `${namHoc}_${hocKy}_${dotThi}`;

        const cfg = systemConfigsData.phucKhao?.[key];
        const startEl = document.getElementById('config-pk-start');
        const endEl = document.getElementById('config-pk-end');
        const deadlineEl = document.getElementById('config-pk-deadline');

        const btnSave = document.getElementById('btn-save-pk');
        const btnEdit = document.getElementById('btn-edit-pk');

        if (cfg && cfg.start) {
            startEl.value = cfg.start;
            endEl.value = cfg.end;
            deadlineEl.value = cfg.deadline;

            [startEl, endEl, deadlineEl].forEach(el => {
                if (el) {
                    el.setAttribute('disabled', 'true');
                    el.classList.add('bg-gray-100', 'cursor-not-allowed');
                }
            });
            if (btnSave) {
                btnSave.classList.add('opacity-50', 'cursor-not-allowed');
                btnSave.setAttribute('disabled', 'true');
            }
            if (btnEdit) btnEdit.classList.remove('hidden-view');
        } else {
            startEl.value = "";
            endEl.value = "";
            deadlineEl.value = "";

            [startEl, endEl, deadlineEl].forEach(el => {
                if (el) {
                    el.removeAttribute('disabled');
                    el.classList.remove('bg-gray-100', 'cursor-not-allowed');
                }
            });
            if (btnSave) {
                btnSave.classList.remove('opacity-50', 'cursor-not-allowed');
                btnSave.removeAttribute('disabled');
            }
            if (btnEdit) btnEdit.classList.add('hidden-view');
        }
    }
    window.loadConfigPhucKhao = loadConfigPhucKhao;

    function validateNhapDiemDates() {
        const start = document.getElementById('config-nd-start').value;
        const end = document.getElementById('config-nd-end').value;
        const publish = document.getElementById('config-nd-publish').value;

        const errBox = document.getElementById('config-nd-error');
        const btn = document.getElementById('btn-save-nd');

        if (start && end && publish) {
            if (new Date(start) >= new Date(end) || new Date(end) >= new Date(publish)) {
                errBox.classList.remove('hidden-view');
                btn.setAttribute('disabled', 'true');
                btn.classList.add('opacity-50', 'cursor-not-allowed');
                return false;
            }
        }
        errBox.classList.add('hidden-view');
        btn.removeAttribute('disabled');
        btn.classList.remove('opacity-50', 'cursor-not-allowed');
        return true;
    }

    function validatePhucKhaoDates() {
        const start = document.getElementById('config-pk-start').value;
        const end = document.getElementById('config-pk-end').value;
        const deadline = document.getElementById('config-pk-deadline').value;

        const errBox = document.getElementById('config-pk-error');
        const warnBox = document.getElementById('config-pk-warning');
        const btn = document.getElementById('btn-save-pk');

        errBox.classList.add('hidden-view');
        warnBox.classList.add('hidden-view');
        btn.removeAttribute('disabled');
        btn.classList.remove('opacity-50', 'cursor-not-allowed');

        if (start && end) {
            if (new Date(end) <= new Date(start)) {
                errBox.classList.remove('hidden-view');
                btn.setAttribute('disabled', 'true');
                btn.classList.add('opacity-50', 'cursor-not-allowed');
                return false;
            }
        }

        if (end && deadline) {
            const diffTime = Math.abs(new Date(deadline) - new Date(end));
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            if (diffDays > 7) {
                warnBox.classList.remove('hidden-view');
            }
        }
        return true;
    }

    async function saveConfigNhapDiem() {
        const startEl = document.getElementById('config-nd-start');
        const endEl = document.getElementById('config-nd-end');
        const publishEl = document.getElementById('config-nd-publish');

        if (!startEl?.value || !endEl?.value || !publishEl?.value) {
            showGlobalToast("Cảnh báo", "Vui lòng nhập đầy đủ tất cả các mốc thời gian trước khi lưu cấu hình!", "error");
            return;
        }

        if (!validateNhapDiemDates()) return;

        const namHoc = document.getElementById('config-nd-namhoc')?.value || '2025-2026';
        const hocKy = document.getElementById('config-nd-hocky')?.value || 'Học kỳ I';
        const dotThi = document.getElementById('config-nd-dotthi')?.value || 'Đợt 1';
        const key = `${namHoc}_${hocKy}_${dotThi}`;

        if(!systemConfigsData.nhapDiem) systemConfigsData.nhapDiem = {};
        systemConfigsData.nhapDiem[key] = {
            start: startEl.value,
            end: endEl.value,
            publish: publishEl.value
        };

        // Lock inputs & toggle buttons
        [startEl, endEl, publishEl].forEach(el => {
            el.setAttribute('disabled', 'true');
            el.classList.add('bg-gray-100', 'cursor-not-allowed');
        });

        const btnSave = document.getElementById('btn-save-nd');
        const btnEdit = document.getElementById('btn-edit-nd');
        if (btnSave) {
            btnSave.classList.add('opacity-50', 'cursor-not-allowed');
            btnSave.setAttribute('disabled', 'true');
        }
        if (btnEdit) btnEdit.classList.remove('hidden-view');

        try {
            const response = await fetch('/cvht/api/configs/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({
                    systemConfigsData: systemConfigsData,
                    systemGlobals: systemGlobals
                })
            });
            if (!response.ok) throw new Error('Network response was not ok');
            showGlobalToast("Lưu cấu hình", `Đã lưu thành công & khóa chỉnh sửa cấu hình ${hocKy} (${namHoc} - ${dotThi}).`);
        } catch (error) {
            showGlobalToast("Lỗi", "Không thể lưu cấu hình hệ thống", "error");
        }
    }

    function editConfigNhapDiem() {
        const startEl = document.getElementById('config-nd-start');
        const endEl = document.getElementById('config-nd-end');
        const publishEl = document.getElementById('config-nd-publish');

        [startEl, endEl, publishEl].forEach(el => {
            if (el) {
                el.removeAttribute('disabled');
                el.classList.remove('bg-gray-100', 'cursor-not-allowed');
            }
        });

        const btnSave = document.getElementById('btn-save-nd');
        const btnEdit = document.getElementById('btn-edit-nd');
        if (btnSave) {
            btnSave.classList.remove('opacity-50', 'cursor-not-allowed');
            btnSave.removeAttribute('disabled');
        }
        if (btnEdit) btnEdit.classList.add('hidden-view');

        showGlobalToast("Thông báo", "Đã mở khóa. Bạn có thể thay đổi mốc thời gian và bấm 'Lưu cấu hình'.");
    }
    window.editConfigNhapDiem = editConfigNhapDiem;

    async function saveConfigPhucKhao() {
        const startEl = document.getElementById('config-pk-start');
        const endEl = document.getElementById('config-pk-end');
        const deadlineEl = document.getElementById('config-pk-deadline');

        if (!startEl?.value || !endEl?.value || !deadlineEl?.value) {
            showGlobalToast("Cảnh báo", "Vui lòng nhập đầy đủ tất cả các mốc thời gian nhận đơn, khóa cổng và hạn chấm phúc khảo!", "error");
            return;
        }

        if (!validatePhucKhaoDates()) return;

        const namHoc = document.getElementById('config-pk-namhoc')?.value || '2025-2026';
        const hocKy = document.getElementById('config-pk-hocky')?.value || 'Học kỳ I';
        const dotThi = document.getElementById('config-pk-dotthi')?.value || 'Đợt 1';
        const key = `${namHoc}_${hocKy}_${dotThi}`;

        if(!systemConfigsData.phucKhao) systemConfigsData.phucKhao = {};
        systemConfigsData.phucKhao[key] = {
            start: startEl.value,
            end: endEl.value,
            deadline: deadlineEl.value
        };

        // Lock inputs & toggle buttons
        [startEl, endEl, deadlineEl].forEach(el => {
            el.setAttribute('disabled', 'true');
            el.classList.add('bg-gray-100', 'cursor-not-allowed');
        });

        const btnSave = document.getElementById('btn-save-pk');
        const btnEdit = document.getElementById('btn-edit-pk');
        if (btnSave) {
            btnSave.classList.add('opacity-50', 'cursor-not-allowed');
            btnSave.setAttribute('disabled', 'true');
        }
        if (btnEdit) btnEdit.classList.remove('hidden-view');

        try {
            const response = await fetch('/cvht/api/configs/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({
                    systemConfigsData: systemConfigsData,
                    systemGlobals: systemGlobals
                })
            });
            if (!response.ok) throw new Error('Network response was not ok');
            showGlobalToast("Lưu cấu hình", `Đã lưu thành công & khóa chỉnh sửa cấu hình phúc khảo ${hocKy} (${namHoc} - ${dotThi}).`);
        } catch (error) {
            showGlobalToast("Lỗi", "Không thể lưu cấu hình hệ thống", "error");
        }
    }

    function editConfigPhucKhao() {
        const startEl = document.getElementById('config-pk-start');
        const endEl = document.getElementById('config-pk-end');
        const deadlineEl = document.getElementById('config-pk-deadline');

        [startEl, endEl, deadlineEl].forEach(el => {
            if (el) {
                el.removeAttribute('disabled');
                el.classList.remove('bg-gray-100', 'cursor-not-allowed');
            }
        });

        const btnSave = document.getElementById('btn-save-pk');
        const btnEdit = document.getElementById('btn-edit-pk');
        if (btnSave) {
            btnSave.classList.remove('opacity-50', 'cursor-not-allowed');
            btnSave.removeAttribute('disabled');
        }
        if (btnEdit) btnEdit.classList.add('hidden-view');

        showGlobalToast("Thông báo", "Đã mở khóa. Bạn có thể thay đổi mốc thời gian và bấm 'Lưu cấu hình'.");
    }
    window.editConfigPhucKhao = editConfigPhucKhao;

    function renderLogs() {
        const tbody = document.getElementById('dash-audit-logs-tbody');
        const countEl = document.getElementById('dash-log-count');
        if (!tbody) return;

        const defaultLogs = [
            { timestamp: '2026-07-22 19:35:12', actor: 'cvht01 (Nguyễn Văn Quản Trị)', action: 'Lưu cấu hình mốc thời gian nhập điểm Học kỳ I (2025-2026 - Đợt 1)', ip: '192.168.1.10' },
            { timestamp: '2026-07-22 18:20:45', actor: 'tkt01 (Lê Thị Thu)', action: 'Duyệt đợt rút phách & gộp 4 bài thi cho đơn PK001', ip: '192.168.1.15' },
            { timestamp: '2026-07-22 17:15:30', actor: 'gv002 (Trần Thị B)', action: 'Ký xác nhận lịch trực giám thị ca 2 phòng P.301', ip: '192.168.1.22' },
            { timestamp: '2026-07-22 15:40:00', actor: 'system (Tự động)', action: 'Kiểm tra trạng thái đối soát dữ liệu & đồng bộ CSDL', ip: '127.0.0.1' }
        ];

        const logsToRender = (auditLogsData && auditLogsData.length > 0) ? auditLogsData : defaultLogs;
        if (countEl) countEl.innerText = `${logsToRender.length} sự kiện`;

        tbody.innerHTML = '';
        logsToRender.forEach(log => {
            tbody.innerHTML += `
                <tr class="hover:bg-gray-50 border-b border-gray-100">
                    <td class="px-4 py-3 font-mono font-bold text-gray-700">${log.timestamp || log.time || '2026-07-22 19:00'}</td>
                    <td class="px-4 py-3 font-semibold text-blue-900">${log.actor || log.user || 'Admin'}</td>
                    <td class="px-4 py-3 text-gray-800">${log.action || log.content || 'Đăng nhập hệ thống'}</td>
                    <td class="px-4 py-3 text-center font-mono text-gray-500">${log.ip || '127.0.0.1'}</td>
                </tr>
            `;
        });
    }
    window.renderLogs = renderLogs;

    function clearSystemLogs() {
        if(confirm("Bạn có chắc chắn muốn xóa toàn bộ lịch sử nhật ký hệ thống?")) {
            auditLogsData = [];
            showGlobalToast("Xóa nhật ký", "Đã xóa toàn bộ nhật ký sự kiện hệ thống trên giao diện.");
            renderLogs();
        }
    }

    async function toggleSystemLock() {
        isSystemLocked = !isSystemLocked;
        const btn = document.getElementById('btn-lock-system');
        const text = document.getElementById('system-lock-text');

        if(isSystemLocked) {
            btn.innerText = "MỞ KHÓA CỔNG";
            btn.className = "bg-green-50 text-green-700 border border-green-200 hover:bg-green-100 font-bold px-4 py-2 rounded";
            text.innerText = "● TOÀN BỘ CỔNG GIAO DỊCH ĐANG KHÓA (LOCKED)";
            text.className = "text-red-600 font-mono font-bold text-[10px] block mt-0.5";
            showGlobalToast("Khóa hệ thống", "Đã khóa toàn bộ cổng giao dịch khảo thí thành công.", "error");
        } else {
            btn.innerText = "TẠM KHÓA CỔNG";
            btn.className = "bg-red-50 text-red-700 border border-red-200 hover:bg-red-100 font-bold px-4 py-2 rounded";
            text.innerText = "● HỆ THỐNG ĐANG MỞ (OPERATIONAL)";
            text.className = "text-green-600 font-mono font-bold text-[10px] block mt-0.5";
            showGlobalToast("Mở hệ thống", "Hệ thống đã phục hồi trạng thái hoạt động bình thường.");
        }

        systemGlobals.isSystemLocked = isSystemLocked;
        
        try {
            await fetch('/cvht/api/configs/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({
                    systemConfigsData: systemConfigsData,
                    systemGlobals: systemGlobals
                })
            });
        } catch (error) {
            console.error("Lỗi khi lưu trạng thái khóa:", error);
        }
    }

    async function resetDatabaseToSeed() {
        if(confirm("CẢNH BÁO: Thao tác này sẽ làm mới toàn bộ database về trạng thái mặc định của VNUK. Bạn có chắc chắn muốn khôi phục?")) {
            try {
                await fetch('/api/save_state/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ reset: true })
                });
                window.location.reload();
            } catch(e) {
                console.error(e);
            }
        }
    }

    function renderDanhMuc() {
        const subList = document.getElementById('danh-muc-subjects-list');
        const roomList = document.getElementById('danh-muc-rooms-list');
        if (subList) {
            subList.innerHTML = '';
            if (subjectsData.length === 0) {
                subList.innerHTML = '<div class="p-2.5 bg-gray-50 border rounded text-center italic text-gray-400">Không có dữ liệu học phần.</div>';
            } else {
                subjectsData.forEach(sub => {
                    subList.innerHTML += `
                        <div class="p-2.5 bg-gray-50 border rounded flex justify-between">
                            <span>${sub.name}</span><span class="text-[#9e1c22] font-bold">${sub.code}</span>
                        </div>`;
                });
            }
        }
        if (roomList) {
            roomList.innerHTML = '';
            if (roomsData.length === 0) {
                roomList.innerHTML = '<div class="p-2.5 bg-gray-50 border rounded text-center italic text-gray-400">Không có dữ liệu phòng thi.</div>';
            } else {
                roomsData.forEach(room => {
                    roomList.innerHTML += `
                        <div class="p-2.5 bg-gray-50 border rounded flex justify-between">
                            <span>${room.name}</span><span class="text-gray-500 font-sans">Sức chứa: ${room.capacity} SV</span>
                        </div>`;
                });
            }
        }
    }

    function populateConfigSubjects() {
        const ndSelect = document.getElementById('config-nd-subject');
        const pkSelect = document.getElementById('config-pk-subject');
        if (ndSelect && pkSelect) {
            const valNd = ndSelect.value;
            const valPk = pkSelect.value;
            ndSelect.innerHTML = '';
            pkSelect.innerHTML = '';
            subjectsData.forEach(sub => {
                ndSelect.innerHTML += `<option value="${sub.code}">${sub.name} (${sub.code})</option>`;
                pkSelect.innerHTML += `<option value="${sub.code}">${sub.name} (${sub.code})</option>`;
            });
            if (valNd && subjectsData.some(s => s.code === valNd)) ndSelect.value = valNd;
            if (valPk && subjectsData.some(s => s.code === valPk)) pkSelect.value = valPk;
        }
    }

    function showGlobalToast(title, msg, type = 'success') {
        const toast = document.getElementById('toast-global');
        const icon = document.getElementById('toast-global-icon');

        toast.className = "fixed bottom-6 right-6 text-white px-6 py-4 rounded shadow-xl flex items-center gap-3 animate-fade-in-up z-[200]";

        if (type === 'error') {
            toast.classList.add('bg-red-600');
            icon.setAttribute('data-lucide', 'alert-circle');
        } else {
            toast.classList.add('bg-green-600');
            icon.setAttribute('data-lucide', 'check-circle-2');
        }

        document.getElementById('toast-global-title').innerText = title;
        document.getElementById('toast-global-msg').innerText = msg || '';
        toast.classList.remove('hidden-view');
        initIcons();

        setTimeout(() => toast.classList.add('hidden-view'), 4000);
    }
</script>
