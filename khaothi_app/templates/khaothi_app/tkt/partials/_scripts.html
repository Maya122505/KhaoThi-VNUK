			st === "Khả dụng" || st === "KhaDung" || st === "Available";

		document.getElementById("pt-detail-ma").innerText = roomCode;

	function hidePhongThiDetailModal() {

			.getElementById("modal-phong-thi-detail")
			.classList.add("hidden-view");

	function showPhongThiEditModal(code) {
		const pt = phongThiData.find(
			(p) =>
				p.ma === code || p.id === code || p.name === code || p.ten === code,
		);
		if (!pt) {
			showGlobalToast(
				"Thông báo",
				"Không tìm thấy dữ liệu phòng thi.",
				"warning",
			);
			return;
		}
		switchTabPhongThi("danh-sach");
		const tenEl = document.getElementById("pt-ten");
		const capEl = document.getElementById("pt-suc-chua");
		const locEl = document.getElementById("pt-vi-tri");
		const typeEl = document.getElementById("pt-loai");
		const stEl = document.getElementById("pt-trang-thai");

		if (tenEl) tenEl.value = pt.ten || pt.name || "";
		if (capEl) capEl.value = pt.sucChua || pt.capacity || 40;
		if (locEl) locEl.value = pt.viTri || "Toà nhà A";
		if (typeEl) typeEl.value = pt.loai || "Phòng thường";
		if (stEl) stEl.value = pt.trangThai || "Khả dụng";

		showGlobalToast(
			"Thông tin phòng thi",
			`Đã đưa thông tin phòng ${pt.ten || pt.name} lên form để chỉnh sửa.`,
			"info",

	}

	function handleDeletePhongThi(code) {
		const pt = phongThiData.find(
			(p) =>
				p.ma === code || p.id === code || p.name === code || p.ten === code,
		);
		const roomName = pt ? pt.ten || pt.name || code : code;
		showDeleteConfirmModal(
			`Bạn có chắc chắn muốn xóa phòng thi "${roomName}" (${code})? Hành động này không thể hoàn tác.`,
			function () {
				phongThiData = phongThiData.filter(
					(p) =>
						p.ma !== code && p.id !== code && p.name !== code && p.ten !== code,
				);
				renderPhongThiTable();
				showGlobalToast(
					"Thành công",
					`Đã xóa phòng thi ${roomName} thành công.`,
					"success",
				);
				if (typeof isStateLoaded !== "undefined" && isStateLoaded)
					saveStateToServer();
			},
		);
	}
	window.handleDeletePhongThi = handleDeletePhongThi;

	function handleCreatePhongThi() {
		const ten = document.getElementById("pt-ten").value.trim();
		const sucChua = parseInt(document.getElementById("pt-suc-chua").value);
		const viTri = document.getElementById("pt-vi-tri").value;
		const loai = document.getElementById("pt-loai").value;
		const trangThai = document.getElementById("pt-trang-thai").value;

		if (!ten || !sucChua || sucChua <= 0) {
			showGlobalToast(
				"Thêm thất bại",
				"Vui lòng nhập tên phòng và sức chứa hợp lệ.",
				"error",
			);
			return;
		}
		if (
			phongThiData.some(
				(p) => (p.ten || p.name || "").toLowerCase() === ten.toLowerCase(),
			)
		) {
			showGlobalToast(
				"Thêm thất bại",
				"Tên phòng thi này đã tồn tại trong hệ thống.",
				"error",
			);
			return;
		}

		const ma = "PT" + Date.now().toString().slice(-4);
		phongThiData.unshift({ id: ma, ma, ten, sucChua, viTri, loai, trangThai });

		document.getElementById("pt-ten").value = "";
		document.getElementById("pt-suc-chua").value = "";
		renderPhongThiTable();
		showGlobalToast(
			"Thành công",
			`Đã thêm phòng thi ${ten} (${ma}) thành công.`,
			"success",
		);

		if (typeof isStateLoaded !== "undefined" && isStateLoaded)
			saveStateToServer();
	}

	function renderPCLichThi() {
		const sel = document.getElementById("pc-lich-thi");
		if (!sel) return;
		sel.innerHTML =
			'<option value="">-- Chọn ca thi / lịch thi --</option>' +
			lichThiData
				.map(
					(lt) =>
						`<option value="${lt.id}">${lt.subjectName} - ${lt.time || "Ca thi"} (${lt.id})</option>`,
				)
				.join("");
	}

	function updatePCInfo() {
		const selId = document.getElementById("pc-lich-thi").value;
		const lt = lichThiData.find((l) => l.id === selId);

		document.getElementById("pc-so-luong").innerText = lt ? lt.soLuong : "0";
		document.getElementById("pc-ngay-thi").innerText = lt ? lt.date : "-";
		document.getElementById("pc-ca-thi").innerText = lt ? lt.time : "-";

		const pSel = document.getElementById("pc-phong-thi");
		if (!pSel) return;
		pSel.innerHTML = phongThiData
			.filter((p) => (p.trangThai || p.status) === "Khả dụng")
			.map(
				(p) =>
					`<option value="${p.id || p.ma}" data-cap="${p.sucChua || p.capacity}">${p.ten || p.name} (Chứa: ${p.sucChua || p.capacity} SV) - ${p.viTri || "Toà nhà A"}</option>`,
			)
			.join("");
		const lbl = document.getElementById("pc-tong-suc-chua");
		if (lbl) lbl.innerText = "0";
	}

	function updatePCCapacity() {
		const pSel = document.getElementById("pc-phong-thi");
		let total = 0;
		Array.from(pSel.selectedOptions).forEach(
			(opt) => (total += parseInt(opt.getAttribute("data-cap") || 0)),
		);
		const lbl = document.getElementById("pc-tong-suc-chua");
		if (lbl) {
			lbl.innerText = total;
			const required =
				parseInt(document.getElementById("pc-so-luong").innerText) || 0;
			if (total >= required && required > 0)
				lbl.classList.replace("text-blue-700", "text-green-600");
			else lbl.classList.replace("text-green-600", "text-blue-700");
		}
	}

	function handlePhanCongPhong() {
		const ltId = document.getElementById("pc-lich-thi").value;
		const pSel = document.getElementById("pc-phong-thi");
		const selectedRooms = Array.from(pSel.selectedOptions).map(
			(opt) => opt.value,
		);

		if (!ltId)
			return showGlobalToast(
				"Lỗi",
				"Vui lòng chọn ca thi / lịch thi cần phân công.",
				"error",
			);
		if (selectedRooms.length === 0)
			return showGlobalToast(
				"Lỗi",
				"Vui lòng chọn ít nhất một phòng thi.",
				"error",
			);

		const lt = lichThiData.find((l) => l.id === ltId);

		const mappedRoomNames = selectedRooms
			.map((rid) => {
				const p = phongThiData.find((x) => x.id === rid || x.ma === rid);
				return p ? p.ten || p.name : rid;
			})
			.join(", ");

		if (lt) lt.room = mappedRoomNames;

		let existIndex = phanCongPhongData.findIndex((pc) => pc.ltId === ltId);
		let phanCongObj = {
			id: "PC" + Date.now().toString().slice(-4),
			ltId: ltId,
			subjectName: lt ? lt.subjectName : "Học phần",
			date: lt ? lt.date : "",
			caThi: lt ? lt.time : "Ca 1",
			soLuong: lt ? lt.soLuong : 40,
			roomIds: selectedRooms,
			roomNames: mappedRoomNames,
		};

		if (existIndex > -1) {
			phanCongPhongData[existIndex] = phanCongObj;
		} else {
			phanCongPhongData.unshift(phanCongObj);
		}

		renderPhanCongTable();
		if (typeof renderLichThiTable === "function") renderLichThiTable();
		showGlobalToast(
			"Thành công",
			`Đã phân công ${selectedRooms.length} phòng cho ca thi ${lt ? lt.subjectName : ""}.`,
			"success",
		);

		if (typeof isStateLoaded !== "undefined" && isStateLoaded)
			saveStateToServer();
	}

	function renderPhanCongTable() {
		const tbody = document.getElementById("phan-cong-tbody");
		if (!tbody) return;

		if (!phanCongPhongData) phanCongPhongData = [];

		tbody.innerHTML =
			phanCongPhongData
				.map((pc) => {
					const pcId = pc.id || pc.ltId || "PC001";
					return `

                    <td class="select-col-phan-cong ${selectModesState["phan-cong"] > 0 ? "" : "hidden"} px-3 py-3 text-center" onclick="event.stopPropagation();">
                        ${renderSelectCheckbox("phan-cong", "", pcId)}
                    </td>
                    <td class="px-4 py-3 font-bold text-gray-900">${pc.subjectName || ""}</td>

                    <td class="px-4 py-3 text-gray-700 font-medium whitespace-nowrap">${pc.caThi || "Ca 1"}</td>
                    <td class="px-4 py-3 text-center font-bold text-gray-800 whitespace-nowrap">${pc.soLuong || 40} SV</td>
                    <td class="px-4 py-3 text-blue-700 font-bold whitespace-nowrap">${pc.roomNames || "Chưa xếp"}</td>
                    <td class="px-4 py-3 text-center whitespace-nowrap" onclick="event.stopPropagation();">

                            <button class="text-blue-600 hover:text-blue-800 p-1.5 rounded hover:bg-blue-50 transition-colors" title="Chỉnh sửa phân công" onclick="showPhanCongEditModal('${pcId}')">
                                <i data-lucide="edit-2" class="w-4 h-4 pointer-events-none"></i>
                            </button>
                            <button class="text-rose-600 hover:text-rose-800 p-1.5 rounded hover:bg-rose-50 transition-colors" title="Xóa phân công" onclick="handleDeletePhanCong('${pcId}')">

		if (typeof initIcons !== "undefined") initIcons();
	}

	function showPhanCongEditModal(pcId) {

		if (!pc) {
			showGlobalToast(
				"Lỗi",
				"Không tìm thấy thông tin phân công phòng thi.",

	}

	function handleSavePhanCongEdit() {
		const pcId = document.getElementById("edit-pc-id").value;
		const pc = phanCongPhongData.find((x) => x.id === pcId || x.ltId === pcId);
		if (!pc) return;

		const countVal =
			parseInt(document.getElementById("edit-pc-count").value) || 40;
		const roomsSelect = document.getElementById("edit-pc-rooms");
		const selectedOptions = Array.from(roomsSelect.selectedOptions);
		const selectedRoomIds = selectedOptions.map((opt) => opt.value);

		if (selectedRoomIds.length === 0) {
			showGlobalToast("Lỗi", "Vui lòng chọn ít nhất một phòng thi.", "error");
			return;
		}

		const mappedRoomNames = selectedRoomIds
			.map((rid) => {
				const p = phongThiData.find((x) => x.id === rid || x.ma === rid);
				return p ? p.ten || p.name : rid;
			})
			.join(", ");

		pc.soLuong = countVal;
		pc.roomIds = selectedRoomIds;
		pc.roomNames = mappedRoomNames;

		const lt = lichThiData.find((l) => l.id === pc.ltId || l.id === pcId);
		if (lt) {
			lt.soLuong = countVal;
			lt.room = mappedRoomNames;
		}

		renderPhanCongTable();
		if (typeof renderLichThiTable === "function") renderLichThiTable();
		hidePhanCongEditModal();
		showGlobalToast(
			"Thành công",
			`Đã cập nhật phân công phòng cho môn ${pc.subjectName}.`,
			"success",
		);

		if (typeof isStateLoaded !== "undefined" && isStateLoaded)
			saveStateToServer();
	}

	function handleDeletePhanCong(pcId) {
		const pc = phanCongPhongData.find((x) => x.id === pcId || x.ltId === pcId);
		if (!pc) return;
		showDeleteConfirmModal(
			`Bạn có chắc chắn muốn xóa phân bổ phòng cho môn ${pc.subjectName}? Hành động này không thể hoàn tác.`,
			function () {
				phanCongPhongData = phanCongPhongData.filter(
					(x) => x.id !== pcId && x.ltId !== pcId,
				);
				const lt = lichThiData.find((l) => l.id === pc.ltId || l.id === pcId);
				if (lt) lt.room = "Chưa phân công";
				renderPhanCongTable();
				if (typeof renderLichThiTable === "function") renderLichThiTable();
				showGlobalToast(
					"Thành công",
					`Đã xóa phân bổ phòng của môn ${pc.subjectName} thành công.`,
					"success",
				);
				if (typeof isStateLoaded !== "undefined" && isStateLoaded)
					saveStateToServer();
			},
		);
	}
	window.handleDeletePhanCong = handleDeletePhanCong;

	function handleCreateInSao() {
		const sel = document.getElementById("is-lich-thi");
		const ltId = sel.value;
		const soLuong = parseInt(document.getElementById("is-so-luong").value);
		const ngay = document.getElementById("is-ngay").value;
		const noiIn = document.getElementById("is-noi-in").value.trim();
		const giamSat = document.getElementById("is-giam-sat").value.trim();
		const ghiChu = document.getElementById("is-ghi-chu").value.trim();

		if (!soLuong || soLuong <= 0 || !ngay || !noiIn || !giamSat) {
			showGlobalToast(
				"Lỗi nhập liệu",
				"Vui lòng nhập đầy đủ các trường bắt buộc (số lượng, ngày, nơi in, cán bộ giám sát).",
				"error",
			);
			return;
		}

		// Lấy tên học phần và kỳ thi
		let subjectName = "Không xác định";
		let kyThiTen = "";
		if (ltId) {
			const lt = lichThiData.find((l) => l.id === ltId);
			subjectName = lt
				? lt.subjectName
				: sel.options[sel.selectedIndex]
					? sel.options[sel.selectedIndex].text
					: "Không xác định";
			if (lt && lt.kyThiId) {
				const kt = kyThiData.find((k) => k.id === lt.kyThiId);
				if (kt) kyThiTen = kt.name || "";
			}
			if (!kyThiTen && kyThiData.length > 0) {
				kyThiTen = kyThiData[0].name || "";
			}
		} else if (kyThiData.length > 0) {
			kyThiTen = kyThiData[0].name || "";
		}

		const ma = "IS" + Date.now().toString().slice(-4);

		inSaoData.unshift({
			id: ma,
			ltId: ltId || "",
			subjectName: subjectName,
			kyThiTen: kyThiTen,
			soLuong: soLuong,
			ngay: ngay,
			noiIn: noiIn,
			giamSat: giamSat,
			ghiChu: ghiChu,
			trangThai: "Chờ cập nhật",
		});

		document.getElementById("is-so-luong").value = "";
		document.getElementById("is-ngay").value = "";
		document.getElementById("is-noi-in").value = "";
		document.getElementById("is-giam-sat").value = "";
		document.getElementById("is-ghi-chu").value = "";

		renderInSaoListPanel();
		showGlobalToast(
			"Thành công",
			`Đã lập đợt in sao ${ma} thành công. Vui lòng cập nhật nhật ký khi thực hiện.`,
			"success",
		);

		if (typeof isStateLoaded !== "undefined" && isStateLoaded)
			saveStateToServer();
	}

	function autoCreateInSao() {
		let targetList = lichThiData || [];
		let createdCount = 0;

		targetList.forEach((item, idx) => {
			const shiftName = item.time || item.caThi || `Ca ${idx + 1}`;
			const subjName = item.subjectName || `Học phần Ca ${idx + 1}`;
			const exists = inSaoData.some(
				(is) =>
					is.ltId === item.id ||
					(is.subjectName === subjName && is.caThi === shiftName),
			);

			if (!exists) {
				const ma = "IS" + (1000 + inSaoData.length + createdCount);
				let ktTen = "";
				if (item.kyThiId) {
					const kt = kyThiData.find((k) => k.id === item.kyThiId);
					if (kt) ktTen = kt.name || "";
				}
				if (!ktTen && kyThiData.length > 0) ktTen = kyThiData[0].name || "";
				inSaoData.unshift({
					id: ma,
					ltId: item.id || `LT-AUTO-${idx + 1}`,
					subjectName: subjName,
					kyThiTen: ktTen,
					caThi: shiftName,
					soLuong: (item.soLuong || 40) + 5,
					ngay: item.date || "2026-08-15",
					noiIn: "Phòng khảo thí",
					giamSat: "Trần Văn Vũ",
					ghiChu: "",
					trangThai: "Chờ cập nhật",
				});
				createdCount++;
			}
		});

		if (createdCount > 0) {
			renderInSaoListPanel();
			showGlobalToast(
				"Thành công",
				`Đã tự động tạo đầy đủ ${createdCount} đợt in sao đề thi cho tất cả các ca thi!`,
				"success",
			);
			if (typeof isStateLoaded !== "undefined" && isStateLoaded)
				saveStateToServer();
		} else {
			showGlobalToast(
				"Thông báo",
				"Tất cả các ca thi hiện tại đều đã được tạo đợt in sao đề thi.",
				"info",
			);
		}
	}

	// Render danh sách đợt in sao bên cạnh form
	function renderInSaoListPanel() {
		const listItems = document.getElementById("in-sao-list-items");
		const emptyEl = document.getElementById("in-sao-list-empty");
		const countEl = document.getElementById("in-sao-list-count");
		if (!listItems || !emptyEl || !countEl) return;

		countEl.textContent = inSaoData.length;

		if (inSaoData.length === 0) {
			listItems.innerHTML = "";
			emptyEl.style.display = "flex";
			return;
		}
		emptyEl.style.display = "none";

		listItems.innerHTML = inSaoData
			.map((is) => {
				let statusClass = "bg-gray-100 text-gray-600";
				let statusIcon = "clock";
				if (is.trangThai === "Chờ cập nhật") {
					statusClass = "bg-yellow-100 text-yellow-700";
					statusIcon = "clock";
				} else if (is.trangThai === "Chờ xác nhận") {
					statusClass = "bg-blue-100 text-blue-700";
					statusIcon = "loader";
				} else if (is.trangThai === "Hoàn tất") {
					statusClass = "bg-green-100 text-green-700";
					statusIcon = "check-circle";
				}

				return `
                <div class="px-4 py-3 cursor-pointer hover:bg-blue-50 transition-colors flex items-center gap-3" onclick="showInSaoDetail('${is.id}')">
                    ${renderSelectCheckbox("in-sao", "", is.id)}
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-sm text-gray-800">${is.id}</span>
                            <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${statusClass}">${is.trangThai}</span>
                        </div>
                        <p class="text-xs text-gray-500 truncate mt-0.5">${is.subjectName} · ${is.soLuong} bản · ${is.ngay}</p>
                    </div>
                    <button class="del-btn-in-sao text-red-600 hover:text-red-800 p-1 hover:bg-red-50 rounded transition-all shrink-0" onclick="event.stopPropagation(); handleDeleteInSao('${is.id}')" title="Xóa đợt in sao">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-gray-400 shrink-0"></i>
                </div>
            `;
			})
			.join("");
		initIcons();
	}

	function showInSaoDetail(id) {
		const is = inSaoData.find((x) => x.id === id);
		if (!is) return;

		const detailPanel = document.getElementById("in-sao-detail-panel");
		if (!detailPanel) return;

		const idEl = document.getElementById("is-detail-id");
		const statusEl = document.getElementById("is-detail-status");
		const subjectEl = document.getElementById("is-detail-subject");
		const countEl = document.getElementById("is-detail-count");
		const dateEl = document.getElementById("is-detail-date");
		const placeEl = document.getElementById("is-detail-place");
		const supervisorEl = document.getElementById("is-detail-supervisor");
		const noteEl = document.getElementById("is-detail-note");

		if (idEl) idEl.textContent = is.id;
		if (statusEl) {
			let statusClass = "bg-gray-100 text-gray-700";
			if (is.trangThai === "Chờ cập nhật")
				statusClass = "bg-yellow-100 text-yellow-700";
			else if (is.trangThai === "Chờ xác nhận")
				statusClass = "bg-blue-100 text-blue-700";
			else if (is.trangThai === "Hoàn tất")
				statusClass = "bg-green-100 text-green-700";
			else if (is.trangThai === "Cần xử lý lại")
				statusClass = "bg-red-100 text-red-700";
			statusEl.className = `px-2 py-0.5 rounded-full text-[10px] font-bold ${statusClass}`;
			statusEl.textContent = is.trangThai;
		}
		if (subjectEl) subjectEl.textContent = is.subjectName || "N/A";
		if (countEl)
			countEl.textContent = is.soLuong ? `${is.soLuong} bản` : "0 bản";
		if (dateEl) dateEl.textContent = is.ngay || "N/A";
		if (placeEl) placeEl.textContent = is.noiIn || "N/A";
		if (supervisorEl) supervisorEl.textContent = is.giamSat || "N/A";
		if (noteEl) noteEl.textContent = is.ghiChu || "Không có";

		detailPanel.classList.remove("hidden");
		detailPanel.style.display = "block";
		initIcons();
	}

	function closeInSaoDetail() {
		const detailPanel = document.getElementById("in-sao-detail-panel");
		if (detailPanel) {
			detailPanel.classList.add("hidden");
			detailPanel.style.display = "none";
		}
	}

	function handleDeleteInSao(id) {
		showDeleteConfirmModal(
			`Bạn có chắc chắn muốn xóa đợt in sao "${id}" không? Toàn bộ dữ liệu đợt in sao này sẽ bị xóa khỏi hệ thống.`,
			function () {
				inSaoData = inSaoData.filter((x) => x.id !== id);

				const currentDetailId = document.getElementById("is-detail-id");
				if (currentDetailId && currentDetailId.textContent === id) {
					closeInSaoDetail();
				}

				renderInSaoListPanel();
				if (typeof renderInSaoNKList === "function") renderInSaoNKList();
				if (typeof renderInSaoBBList === "function") renderInSaoBBList();

				showGlobalToast(
					"Thành công",
					`Đã xóa thành công đợt in sao ${id}.`,
					"success",
				);
				if (typeof isStateLoaded !== "undefined" && isStateLoaded)
					saveStateToServer();
			},
		);
	}
	window.handleDeleteInSao = handleDeleteInSao;

	function openModalBulkNhanThongTin() {
		const checkedCbs = document.querySelectorAll(

		if (checkedCbs.length > 0) {
			const ids = Array.from(checkedCbs)
				.map((cb) => cb.getAttribute("data-id"))
				.filter((id) => id);
			const validIds = ids.filter((id) => {
				const item = inSaoData.find((x) => x.id === id);

			});

			if (validIds.length === 0) {
				showGlobalToast(
					"Cảnh báo",
					"Không có đợt in sao nào trong các mục đã chọn đã hoàn tất đối chiếu để xuất nhãn.",
					"warning",
				);
				return;
			}
			printNhanThongTin(validIds.join(","));
			return;
		}

		const completedItems = inSaoData.filter(
			(is) => is.trangThai === "Hoàn tất",
		);
		if (completedItems.length === 0) {
			showGlobalToast(
				"Thông báo",
				"Chưa có đợt in sao nào được đối chiếu hoàn tất để xuất nhãn thông tin.",
				"warning",
			);
			return;
		}

		printNhanThongTin(completedItems.map((x) => x.id).join(","));

	function printNhanThongTin(rawId) {
		if (!rawId) return;
		const ids = rawId
			.split(",")
			.map((s) => s.trim())
			.filter((s) => s);

			"nhan-thong-tin-preview-container",

			const is = inSaoData.find((x) => x.id === id);

				showGlobalToast(
					"Cảnh báo",

					"warning",
				);
				return;

			const totalQty = parseInt(is.nkSoLuong || is.soLuong || 0);

                <div class="printable-label bg-white border-2 border-dashed border-gray-400 p-4 rounded-lg space-y-2 text-xs font-sans max-w-lg mx-auto">

                    </div>
                    <div class="grid grid-cols-2 gap-x-3 gap-y-1.5 pt-1 text-gray-800">
                        <div class="col-span-2"><span class="font-bold text-gray-600">Kỳ thi:</span> <span class="font-semibold text-gray-900">${is.kyThiTen || is.kyThi || "—"}</span></div>
                        <div class="col-span-2"><span class="font-bold text-gray-600">Học phần:</span> <span class="font-bold text-gray-900">${is.subjectName || "—"}</span></div>
                        <div><span class="font-bold text-gray-600">Mã đợt in sao:</span> <span class="font-bold text-indigo-900">${is.id}</span></div>
                        <div><span class="font-bold text-gray-600">Số túi niêm phong:</span> <span class="font-extrabold text-red-800">${totalBags > 0 ? totalBags + " túi" : "—"}</span></div>

                        <div><span class="font-bold text-gray-600">Thời gian in sao:</span> <span>${is.nkThoiGian ? String(is.nkThoiGian).replace("T", " ").slice(0, 16) : "N/A"}</span></div>
                        <div><span class="font-bold text-gray-600">CB thực hiện in:</span> <span>${is.nkNguoiIn || "—"}</span></div>
                        <div><span class="font-bold text-gray-600">CB Giám sát đối chiếu:</span> <span>${is.giamSat || "N/A"}</span></div>
                        <div class="col-span-2 border-t border-gray-200 pt-1.5 mt-1">

                        </div>
                    </div>
                </div>
            `;
		});

		if (validCount === 0) return;

		container.innerHTML = labelHtml;
		const modal = document.getElementById("modal-nhan-thong-tin");
		if (modal) modal.classList.remove("hidden-view");
		initIcons();

	function triggerPrintLabel() {
		const printContainer = document.getElementById(

		const win = window.open("", "", "height=650,width=850");

		win.document.write(

				.map((tc, idx) => {
					const code = tc.ma_muc || tc.maMuc || tc.id || `TC_0${idx + 1}`;
					const title = tc.ten_muc || tc.tenMuc || tc.title;

	function handleSaveNhatKy() {
		const rawId = document.getElementById("nk-is-id")
			? document.getElementById("nk-is-id").value
			: "";
		if (!rawId) return;

		const ids = rawId
			.split(",")
			.map((s) => s.trim())
			.filter((s) => s);
		const nhomDeEl = document.getElementById("nk-nhom-de");
		const nhomDe = nhomDeEl ? nhomDeEl.value.trim() : "";
		const thoiGian = document.getElementById("nk-thoi-gian")
			? document.getElementById("nk-thoi-gian").value
			: "";
		const soLuong = document.getElementById("nk-so-luong")
			? document.getElementById("nk-so-luong").value
			: "";
		const niemPhong = document.getElementById("nk-niem-phong")
			? document.getElementById("nk-niem-phong").value
			: "";
		const nguoiIn = document.getElementById("nk-nguoi-in")
			? document.getElementById("nk-nguoi-in").value.trim()
			: "";
		const ghiChu = document.getElementById("nk-ghi-chu")
			? document.getElementById("nk-ghi-chu").value.trim()
			: "";

		const checkedCriteria = Array.from(
			document.querySelectorAll(".nk-tc-cb:checked"),
		).map((cb) => cb.value);

		if (
			!thoiGian ||
			!soLuong ||
			!niemPhong ||
			parseInt(soLuong) <= 0 ||
			parseInt(niemPhong) <= 0
		) {
			showGlobalToast(
				"Thông tin không hợp lệ",
				"Vui lòng nhập đầy đủ: số lượng bản in, số túi niêm phong và thời gian thực hiện.",
				"error",
			);
			return;
		}

		let count = 0;
		ids.forEach((id) => {
			const is = inSaoData.find((x) => x.id === id);
			if (is) {
				is.nkThoiGian = thoiGian;
				is.nkSoLuong = soLuong;
				is.nkNiemPhong = niemPhong;
				is.nkNguoiIn = nguoiIn;
				is.nkGhiChu = ghiChu;
				if (nhomDe) is.nhomDe = nhomDe;
				is.tieuChiChecked = checkedCriteria;
				is.trangThai = "Chờ xác nhận";
				count++;
			}
		});

		if (count === 0) {
			showGlobalToast("Lỗi", "Không tìm thấy đợt in sao để cập nhật.", "error");
			return;
		}

		if (selectModesState["in-sao-nk"]) {
			selectModesState["in-sao-nk"] = 0;
			const btn = document.getElementById("btn-select-in-sao-nk");
			const btnSpan = btn ? btn.querySelector("span") : null;
			if (btnSpan) btnSpan.innerText = "Chọn";
			document
				.querySelectorAll(".select-cb-in-sao-nk, .select-col-in-sao-nk")
				.forEach((el) => el.classList.add("hidden"));
			const bulkBtn = document.getElementById("btn-update-all-in-sao-nk");
			if (bulkBtn) bulkBtn.classList.add("hidden");
		}

		closeModalNhatKy();
		renderInSaoNKList();
		if (typeof renderInSaoBBList === "function") renderInSaoBBList();

		showGlobalToast(
			"Thành công",
			`Đã lưu nhật ký cho ${count} đợt in sao. Trạng thái chuyển sang "Chờ xác nhận".`,
			"success",
		);
		if (typeof isStateLoaded !== "undefined" && isStateLoaded)
			saveStateToServer();
	}

		} else {
			if (ktSaveBtn) ktSaveBtn.classList.remove("hidden");
			if (ktNotice) ktNotice.classList.add("hidden-view");
		}

		const modal = document.getElementById("modal-kiem-tra-in-sao");
		if (modal) modal.classList.remove("hidden-view");
		initIcons();
	}

	function closeModalKiemTraInSao() {

			.getElementById("modal-kiem-tra-in-sao")

	}

	function handleSaveKiemTraInSao() {
		const rawId = document.getElementById("kt-is-id")
			? document.getElementById("kt-is-id").value
			: "";
		if (!rawId) return;

		const ids = rawId
			.split(",")
			.map((s) => s.trim())
			.filter((s) => s);
		const firstIs = inSaoData.find((x) => x.id === ids[0]);
		const isLocked = firstIs && firstIs.trangThai === "Hoàn tất";

		if (!isLocked) {
			const pwInput = document.getElementById("kt-confirm-password");
			const pwVal = pwInput ? pwInput.value.trim() : "";
			const pwError = document.getElementById("kt-confirm-password-error");

			if (!pwVal) {
				showGlobalToast(
					"Lỗi xác nhận",
					"Vui lòng nhập mật khẩu xác nhận.",
					"error",
				);
				if (pwError) {
					pwError.textContent = "Mật khẩu không được để trống!";
					pwError.classList.remove("hidden-view");
				}
				return;
			}
			if (pwVal !== "123456") {
				showGlobalToast(
					"Lỗi xác nhận",
					"Mật khẩu xác nhận không chính xác!",
					"error",
				);
				if (pwError) {
					pwError.textContent =
						"Mật khẩu xác nhận không chính xác! Hãy kiểm tra lại";
					pwError.classList.remove("hidden-view");
				}
				return;
			}
		}

		const radioChecked = document.querySelector(
			'input[name="kt-res-radio"]:checked',
		);
		const ketQua = radioChecked ? radioChecked.value : "Khop";
		const ghiChuKT = document.getElementById("kt-ghi-chu-input")
			? document.getElementById("kt-ghi-chu-input").value.trim()
			: "";

		let count = 0;
		ids.forEach((id) => {
			const is = inSaoData.find((x) => x.id === id);
			if (!is) return;

			is.ketQuaKiemTra = ketQua;
			is.ghiChuKiemTra = ghiChuKT;

			if (ketQua === "Khop") {
				is.trangThai = "Hoàn tất";
			} else {
				is.trangThai = "Cần xử lý lại";
			}
			count++;
		});

		if (count === 0) {
			showGlobalToast(
				"Lỗi",
				"Không tìm thấy đợt in sao để lưu kết quả.",
				"error",
			);
			return;
		}

		if (selectModesState["in-sao-bb"]) {
			selectModesState["in-sao-bb"] = 0;
			const btn = document.getElementById("btn-select-in-sao-bb");
			const btnSpan = btn ? btn.querySelector("span") : null;
			if (btnSpan) btnSpan.innerText = "Chọn";
			document
				.querySelectorAll(".select-cb-in-sao-bb, .select-col-in-sao-bb")
				.forEach((el) => el.classList.add("hidden"));
			const bulkBtnKT = document.getElementById("btn-update-all-in-sao-bb");
			if (bulkBtnKT) bulkBtnKT.classList.add("hidden");
		}

		closeModalKiemTraInSao();
		renderInSaoNKList();
		renderInSaoBBList();

		if (ketQua === "Khop") {
			showGlobalToast(
				"Thành công",
				`Đã đối chiếu & kiểm tra chất lượng: Kết quả KHỚP. ${count > 1 ? count + " đợt" : "Đợt"} in sao chuyển sang trạng thái Hoàn tất.`,
				"success",
			);
		} else {
			showGlobalToast(
				"Cần xử lý lại",
				`Phát hiện sai lệch! Đã chuyển ${count > 1 ? count + " đợt" : "đợt"} in sao về trạng thái Cần xử lý lại.`,
				"warning",
			);
		}

		if (typeof isStateLoaded !== "undefined" && isStateLoaded)
			saveStateToServer();
	}

	function confirmIsKyXacNhanExecute() {
		const id = document.getElementById("ky-xn-is-id").value;
		const pw = document.getElementById("ky-xn-is-pw").value;
		const nhanXet = document.getElementById("ky-xn-is-nhan-xet").value;

		if (pw === "123456") {
			const is = inSaoData.find((x) => x.id === id);
			if (is) {
				const signTime = new Date().toISOString();
				const signData = `${id}-${is.nkSoLuong || 0}-${is.nkNiemPhong || 0}-${signTime}`;
				let hash = 0;
				for (let i = 0; i < signData.length; i++) {
					hash = (hash << 5) - hash + signData.charCodeAt(i);
					hash |= 0;
				}
				const cryptoSignature =
					"SHA256-RSA:" + btoa(signData + hash).slice(-30);

				is.trangThai = "Hoàn tất";
				is.chuKySo = cryptoSignature;
				is.nhanXetGiamSat = nhanXet;

				hideIsKyXacNhanModal();
				showGlobalToast(
					"Thành công",
					"Đã xác nhận biên bản giám sát in sao.",
					"success",
				);
				renderInSaoBBList();

				if (typeof isStateLoaded !== "undefined" && isStateLoaded)
					saveStateToServer();
			}
		} else {
			document.getElementById("ky-xn-is-error").classList.remove("hidden-view");
		}
	}

	function renderRasoatDeList() {
		const tbody = document.getElementById("rasoat-de-tbody");
		if (!tbody) return;

		tbody.innerHTML =
			deThiData
				.map((dt) => {
					let statusClass = "bg-gray-100 text-gray-700";
					if (dt.trangThai === "Chờ rà soát")
						statusClass = "bg-yellow-100 text-yellow-700";
					else if (dt.trangThai === "Đạt")
						statusClass = "bg-green-100 text-green-700";
					else if (dt.trangThai === "Chờ chỉnh sửa")
						statusClass = "bg-red-100 text-red-700";

					let actionBtn = "";
					if (
						dt.trangThai === "Chờ rà soát" ||
						dt.trangThai === "Chờ chỉnh sửa"
					) {
						actionBtn = `<button class="text-blue-600 hover:text-blue-800 font-bold" onclick="openModalRasoat('${dt.id}', '${dt.hocPhan}')">Rà soát</button>`;
					} else {
						actionBtn = `<span class="text-green-600 font-bold"><i data-lucide="check" class="w-4 h-4 inline"></i></span>`;
					}

					return `
                <tr class="bg-white border-b border-gray-100 hover:bg-gray-50 transition-colors cursor-pointer" onclick="showDeThiDetail('${dt.id}')">
                    <td class="select-col-rasoat-de ${selectModesState["rasoat-de"] > 0 ? "" : "hidden"} px-3 py-3 text-center" onclick="event.stopPropagation();">
                        ${renderSelectCheckbox("rasoat-de")}
                    </td>
                    <td class="px-4 py-3 font-bold">${dt.id}</td>
                    <td class="px-4 py-3">${dt.hocPhan}</td>
                    <td class="px-4 py-3">${dt.nguoiNop}</td>
                    <td class="px-4 py-3 text-blue-600 font-medium hover:underline" onclick="event.stopPropagation();"><i data-lucide="file-text" class="w-4 h-4 inline mr-1"></i>${dt.fileName}</td>
                    <td class="px-4 py-3 text-xs text-gray-600 max-w-[200px] truncate" title="${dt.ghiChu || "-"}">${dt.ghiChu || "-"}</td>
                    <td class="px-4 py-3 text-center">
                        <span class="px-2 py-1 rounded-full text-[10px] font-bold ${statusClass}">${dt.trangThai}</span>
                    </td>
                    <td class="px-4 py-3 text-center" onclick="event.stopPropagation();">
                        ${actionBtn}
                    </td>
                </tr>
            `;
				})
				.join("") ||
			`<tr><td colspan="7" class="text-center py-4 text-gray-500 text-xs italic">Không có đề thi nào đang chờ rà soát.</td></tr>`;
		initIcons();
	}

				`Đã gửi yêu cầu chỉnh sửa đề thi môn ${dt.hocPhan}.`,
				"warning",
			);
		}

		if (typeof isStateLoaded !== "undefined" && isStateLoaded)
			saveStateToServer();
	}

	function handleSavePhongThiEdit() {
		const ma = document.getElementById("edit-pt-ma").value;
		const ten = document.getElementById("edit-pt-ten").value.trim();
		const sucChua = parseInt(document.getElementById("edit-pt-suc-chua").value);
		const viTri = document.getElementById("edit-pt-vi-tri").value;
		const loai = document.getElementById("edit-pt-loai").value;
		const trangThai = document.getElementById("edit-pt-trang-thai").value;

		if (!ten || !sucChua || sucChua <= 0) {
			showGlobalToast(
				"Cập nhật thất bại",
				"Vui lòng nhập tên phòng và sức chứa hợp lệ.",
				"error",
			);
			return;
		}

		// Kiểm tra trùng lặp tên phòng mới với các phòng khác
		if (
			phongThiData.some(
				(p) =>
					p.ma !== ma &&
					p.id !== ma &&
					p.ten.toLowerCase() === ten.toLowerCase(),
			)
		) {
			showGlobalToast(
				"Cập nhật thất bại",
				"Tên phòng thi này đã tồn tại trong hệ thống.",
				"error",
			);
			return;
		}

		const ptIndex = phongThiData.findIndex((x) => x.ma === ma || x.id === ma);
		if (ptIndex !== -1) {
			phongThiData[ptIndex].ten = ten;
			phongThiData[ptIndex].sucChua = sucChua;
			phongThiData[ptIndex].viTri = viTri;
			phongThiData[ptIndex].loai = loai;
			phongThiData[ptIndex].trangThai = trangThai;

			renderPhongThiTable();
			showGlobalToast(
				"Thành công",
				`Đã cập nhật phòng thi ${ten} thành công.`,
				"success",
			);
			hidePhongThiEditModal();

			if (typeof isStateLoaded !== "undefined" && isStateLoaded)
				saveStateToServer();
		} else {
			showGlobalToast(
				"Cập nhật thất bại",
				"Không tìm thấy phòng thi cần chỉnh sửa.",
				"error",
			);
		}
	}
