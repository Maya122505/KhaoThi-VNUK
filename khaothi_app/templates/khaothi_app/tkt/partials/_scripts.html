<script>
	// ==========================================================
	// DỮ LIỆU MOCK (STATE MANAGEMENT)
	// ==========================================================
	let kyThiData = [];
	let caThiData = [];
	let phongThiGocData = [];
	let lichThiData = [];
	let hocPhiData = [];
	let lopThiDiemData = {};
	let phucKhaoData = [];
	let phieuGiaoNhanData = [];
	let tuiPhachData = [];
	let tuiPhachChiTietData = {};
	let canBoCoiThiData = [];
	let danhSachThiData = [];

	// New States
	let phongThiData = [];
	let phanCongPhongData = [];
	let inSaoData = [];
	let deThiData = [];
	let hocPhanData = [];
	let donGiaRulesData = [
		{
			id: "RULE-2026-2027",
			namHoc: "2026-2027",
			kyThi: "Tất cả các kỳ thi",
			donGia: 120000,
			heSo: 1.0,
			moTa: "Điều chỉnh thù lao năm học 2026-2027",
			trangThai: "Kích hoạt",
		},
		{
			id: "RULE-2025-2026",
			namHoc: "2025-2026",
			kyThi: "Tất cả các kỳ thi",
			donGia: 100000,
			heSo: 1.0,
			moTa: "Quyết định 154/QĐ-VNUK năm học 2025-2026",
			trangThai: "Kích hoạt",
		},
		{
			id: "RULE-2024-2025",
			namHoc: "2024-2025",
			kyThi: "Tất cả các kỳ thi",
			donGia: 80000,
			heSo: 1.0,
			moTa: "Quyết định 120/QĐ-VNUK năm học 2024-2025",
			trangThai: "Kích hoạt",
		},
	];

	let activeViewId = "view-home";
	let activeDslTab = "ds";
	let activeNhapDiemClassId = null;
	let activeNhapDiemBagId = null;
	let activePhucKhaoId = null;
	let activeGiaoNhanTab = "tao";
	let isNhapDiemCompared = false;
	let isNhapDiemPhachCompared = false;
	let activeNdMode = "phach";
	let isStateLoaded = false;
	let giaoNhanSelectedIds = new Set();
	let giaoNhanFilteredItems = [];
	let giaoNhanCurrentPage = 1;
	const giaoNhanPageSize = 10;

	async function loadStateFromServer() {
		try {
			const res = await fetch("/api/get_state/");
			const data = await res.json();

			phongThiGocData = data.phongThiGocData;
			tuiPhachData = data.tuiPhachData;
			phieuGiaoNhanData = data.phieuGiaoNhanData;
			canBoCoiThiData = data.canBoCoiThiData || [];
			phucKhaoData = data.phucKhaoData;
			kyThiData = data.kyThiData || [];
			caThiData = data.caThiData || [];
			lichThiData = data.lichThiData || [];
			hocPhiData = data.hocPhiData || [];
			lopThiDiemData = data.lopThiDiemData || {};
			phongThiData = data.phongThiData || data.phongThiGocData || [];
			phanCongPhongData = data.phanCongPhongData || [];
			inSaoData = data.inSaoData || [];
			deThiData = data.deThiData || [];
			hocPhanData = data.hocPhanData || [];
			if (data.donGiaRulesData && data.donGiaRulesData.length > 0) {
				donGiaRulesData = data.donGiaRulesData;
			}
			danhSachThiData = data.danhSachThiData || [];
			isStateLoaded = true;

			// Xây dựng dữ liệu chi tiết túi phách (tuiPhachChiTietData) động từ tuiPhachData
			tuiPhachChiTietData = {};
			(tuiPhachData || []).forEach((bag) => {
				if (!bag) return;
				const phachList = bag.phachGoc || [];
				tuiPhachChiTietData[bag.id] = {
					password: bag.password || "123",
					subjectName: bag.subjectName,
					papers: phachList.map((phach, idx) => {
						const scoreObj = (bag.scores && bag.scores[phach]) || {
							grader1: null,
							grader2: null,
						};
						return {
							stt: idx + 1,
							phach: phach,
							pt1: scoreObj.grader1,
							pt2: scoreObj.grader2,
							ptFinal: scoreObj.final || null,
							originalPt1: scoreObj.grader1,
							msv: `SV${(idx + 1).toString().padStart(3, "0")}`,
							name: `Sinh viên ${(idx + 1).toString().padStart(3, "0")}`,
						};
					}),
				};
			});
		} catch (e) {
			console.error("Lỗi đồng bộ dữ liệu từ server:", e);
		}
	}

	let saveStateTimer = null;

	function saveStateToServer() {
		if (saveStateTimer) {
			clearTimeout(saveStateTimer);
		}
		saveStateTimer = setTimeout(async () => {
			try {
				// Đồng bộ chi tiết từ tuiPhachChiTietData ngược lại tuiPhachData
				(tuiPhachData || []).forEach((bag) => {
					if (!bag) return;
					const detail = tuiPhachChiTietData[bag.id];
					if (detail && detail.papers) {
						bag.scores = bag.scores || {};
						detail.papers.forEach((p) => {
							bag.scores[p.phach] = bag.scores[p.phach] || {
								grader1: p.pt1,
								grader2: p.pt2,
							};
							bag.scores[p.phach].grader1 = p.pt1;
							bag.scores[p.phach].grader2 = p.pt2;
							if (p.ptFinal !== null) {
								bag.scores[p.phach].final = p.ptFinal;
							}
						});
					}
				});

				const res = await fetch("/api/save_state/", {
					method: "POST",
					headers: {
						"Content-Type": "application/json",
					},
					body: JSON.stringify({
						phongThiGocData,
						tuiPhachData,
						phieuGiaoNhanData,
						canBoCoiThiData,
						phucKhaoData,
						kyThiData,
						caThiData,
						lichThiData,
						hocPhiData,
						lopThiDiemData,
						phongThiData,
						phanCongPhongData,
						inSaoData,
						deThiData,
						donGiaRulesData,
						danhSachThiData,
					}),
				});
				if (!res.ok) {
					const errData = await res.json().catch(() => ({}));
					console.error("Server trả về lỗi:", res.status, errData);
					showGlobalToast(
						"Lỗi đồng bộ",
						"Không thể lưu dữ liệu lên server. Vui lòng thử lại!",
						"error",
					);
				}
			} catch (e) {
				console.error("Lỗi lưu dữ liệu lên server:", e);
				showGlobalToast(
					"Lỗi đồng bộ",
					"Không thể kết nối đến server để lưu dữ liệu!",
					"error",
				);
			}
		}, 400);
	}
	window.onload = async function () {
		initIcons();
		try {
			await loadStateFromServer();
		} catch (err) {
			console.error("Lỗi loadStateFromServer:", err);
		}
		if (typeof populateCaThiSelectOptions === "function")
			populateCaThiSelectOptions();

		const hash = window.location.hash.replace("#", "");
		const initialView = (hash && document.getElementById(`view-${hash}`)) ? `view-${hash}` : "view-home";
		navigate(initialView, false);
	};

	window.addEventListener("popstate", function () {
		const hash = window.location.hash.replace("#", "");
		const targetView = (hash && document.getElementById(`view-${hash}`)) ? `view-${hash}` : "view-home";
		if (activeViewId !== targetView) {
			navigate(targetView, false);
		}
	});

	function initIcons() {
		lucide.createIcons();
	}

	function navigate(viewId, updateHash = true) {
		document
			.querySelectorAll(".view-section")
			.forEach((el) => el.classList.add("hidden-view"));
		const targetView = document.getElementById(viewId);
		if (targetView) targetView.classList.remove("hidden-view");

		document
			.querySelectorAll(".nav-btn")
			.forEach((btn) => btn.classList.remove("bg-red-800"));

		activeViewId = viewId;
		const activeKey = viewId.replace("view-", "");
		const activeBtn = document.getElementById(`nav-btn-${activeKey}`);
		if (activeBtn) activeBtn.classList.add("bg-red-800");

		if (updateHash) {
			const hashStr = "#" + activeKey;
			if (window.location.hash !== hashStr) {
				history.pushState(null, "", hashStr);
			}
		}

		if (viewId === "view-home") renderDashboard();
		else if (viewId === "view-ky-thi") {
			renderKyThiList();
		} else if (viewId === "view-ca-thi") {
			populateCaThiSelectOptions();
			renderCaThiList();
		} else if (viewId === "view-danh-sach-lich") {
			populateCaThiSelectOptions();
			switchDslTab("ds");
		} else if (viewId === "view-nhap-diem") {
			resetViewNhapDiem();
		} else if (viewId === "view-phuc-khao") {
			renderPhucKhaoList();
		} else if (viewId === "view-giao-nhan") {
			switchGiaoNhanTab("tao");
			renderGiaoNhan();
		} else if (viewId === "view-gio-coi") {
			renderGioCoiThongKe();
		} else if (viewId === "view-phong-thi") {
			switchTabPhongThi("danh-sach");
		} else if (viewId === "view-in-sao") {
			switchTabInSao("lap-dot");
		} else if (viewId === "view-rasoat-de") {
			if (typeof renderRasoatDeList === "function") renderRasoatDeList();
		}

		if (typeof filterDslStudents === "function")
			filterDslStudents();
		if (typeof updateSendLichThiButtonState === "function")
			updateSendLichThiButtonState();
		if (typeof updateSendDanhSachThiButtonState === "function")
			updateSendDanhSachThiButtonState();

		initIcons();
	}

	// ==========================================================
	// DASHBOARD RENDERING
	// ==========================================================
	function renderDashboard() {
		const countKyThi = kyThiData.length;
		const countLopChoLich = phongThiGocData.filter(
			(p) => p.status === "Chưa nhận bài",
		).length;
		const countPhucKhaoPending = phucKhaoData.filter(
			(p) => p.status === "Chờ xử lý",
		).length;
		const countPhieuChoNhan = phieuGiaoNhanData.filter(
			(p) => p.recipient === "tkt" && p.status === "Chờ bạn xác nhận",
		).length;

		document.getElementById("dash-so-ky-thi").innerText = countKyThi;
		document.getElementById("dash-lop-cho-lich").innerText = countLopChoLich;
		document.getElementById("dash-don-phuc-khao").innerText =
			countPhucKhaoPending;
		document.getElementById("dash-phieu-cho-nhan").innerText =
			countPhieuChoNhan;

		const tbody = document.getElementById("dash-ky-thi-tbody");
		tbody.innerHTML = "";
		kyThiData.forEach((kt) => {
			tbody.innerHTML += `
                <tr class="hover:bg-gray-50 cursor-pointer" onclick="showKyThiDetailModal('${kt.id}')">
                    <td class="px-4 py-2.5 font-semibold text-[#9e1c22]">${kt.name}</td>
                    <td class="px-4 py-2.5 text-gray-700">${kt.year}</td>
                    <td class="px-4 py-2.5 text-center font-medium">${kt.semester}</td>
                    <td class="px-4 py-2.5 text-center font-bold">${kt.shiftsCount} ca thi</td>
                </tr>
            `;
		});
		if (typeof isStateLoaded !== "undefined" && isStateLoaded)
			saveStateToServer();
	}

	// ==========================================================
	// UC 2.1 & 2.3: KỲ THI & CA THI
	// ==========================================================
	function handleCreateKyThi() {
		const ten = document.getElementById("kt-ten").value.trim();
		const nam = document.getElementById("kt-nam").value.trim();
		const hocky = document.getElementById("kt-hocky").value;
		const dot = document.getElementById("kt-dot").value.trim();
		const thoigianBd = document.getElementById("kt-thoigian-bd").value;
		const thoigianKt = document.getElementById("kt-thoigian-kt").value;

		if (!thoigianBd || !thoigianKt) {
			showGlobalToast(
				"Lỗi nhập liệu",
				"Vui lòng chọn đầy đủ thời gian bắt đầu và kết thúc!",
				"error",
			);
			return;
		}

		const bdParts = thoigianBd.split("-");
		const ktParts = thoigianKt.split("-");
		const yearBd = parseInt(bdParts[0]);
		const yearKt = parseInt(ktParts[0]);

		if (
			isNaN(yearBd) ||
			yearBd < 2000 ||
			yearBd > 2100 ||
			isNaN(yearKt) ||
			yearKt < 2000 ||
			yearKt > 2100
		) {
			showGlobalToast(
				"Lỗi nhập liệu",
				"Năm của thời gian áp dụng phải nằm trong khoảng từ 2000 đến 2100!",
				"error",
			);
			return;
		}

		if (new Date(thoigianBd) > new Date(thoigianKt)) {
			showGlobalToast(
				"Lỗi nhập liệu",
				"Thời gian bắt đầu không được lớn hơn thời gian kết thúc!",
				"error",
			);
			return;
		}

		const thoigian = `${bdParts[2]}/${bdParts[1]}/${bdParts[0]} - ${ktParts[2]}/${ktParts[1]}/${ktParts[0]}`;
		const mota = document.getElementById("kt-mota").value.trim();

		if (!ten || !nam || !dot || !thoigian) {
			showGlobalToast(
				"Lỗi nhập liệu",
				"Vui lòng nhập đầy đủ các trường bắt buộc!",
				"error",
			);
			return;
		}

		const newId = `KT-${hocky.replace(" ", "")}-${Math.floor(100 + Math.random() * 900)}`;
		kyThiData.unshift({
			id: newId,
			name: ten,
			year: nam,
			semester: hocky,
			duration: thoigian,
			dot: dot,
			mota: mota,
			shiftsCount: 0,
		});

		showGlobalToast("Thành công", "Tạo kỳ thi mới thành công!");
		populateCaThiSelectOptions();
		renderKyThiList();

		// Khôi phục các menu thả xuống (select) về giá trị mặc định
		document.getElementById("kt-ten").selectedIndex = 0;
		const currentYear = new Date().getFullYear();
		document.getElementById("kt-nam").value =
			`${currentYear}-${currentYear + 1}`;
		document.getElementById("kt-hocky").value = "Học kỳ III";
		document.getElementById("kt-dot").selectedIndex = 0;

		document.getElementById("kt-thoigian-bd").value = "";
		document.getElementById("kt-thoigian-kt").value = "";
		document.getElementById("kt-mota").value = "";

		if (typeof isStateLoaded !== "undefined" && isStateLoaded)
			saveStateToServer();
	}

	function stripAcademicTitles(name) {
		if (!name) return "";
		return name
			.replace(/^(TS\.|ThS\.|GS\.|PGS\.|TP\.|PP\.|TK\.|PK\.|TT\.)\s*/gi, "")
			.replace(/^(TS\.|ThS\.|GS\.|PGS\.|TP\.|PP\.|TK\.|PK\.|TT\.)\s*/gi, "")
			.replace(/^(phụ trách:|TP:|PP:|TK:|PK:|TT:)\s*/gi, "")
			.trim();
	}

	function populateGiamThiDropdown() {
		const select = document.getElementById("dsl-lich-giám-thị");
		if (!select) return;
		if (canBoCoiThiData && canBoCoiThiData.length > 0) {
			select.innerHTML = "";
			canBoCoiThiData.forEach((gv) => {
				const cleanName = stripAcademicTitles(gv.name);
				select.innerHTML += `<option value="${gv.code}">${cleanName} (${gv.code})</option>`;
			});
		}
	}

	function populateSubjectDropdowns() {
		const selectLich = document.getElementById("dsl-lich-subject");
		if (selectLich) {
			selectLich.innerHTML = hocPhanData
				.map(
					(hp) => `<option value="${hp.code}">${hp.name} (${hp.code})</option>`,
				)
				.join("");
		}

		const selectFilter = document.getElementById("dsl-subject-select");
		if (selectFilter) {
			selectFilter.innerHTML =
				'<option value="ALL">-- Tất cả học phần --</option>' +
				hocPhanData
					.map(
						(hp) =>
							`<option value="${hp.code}">${hp.name} (${hp.code})</option>`,
					)
					.join("");
		}
	}

	function populateRoomDropdown() {
		const select = document.getElementById("dsl-lich-phong");
		if (!select) return;
		if (phongThiData && phongThiData.length > 0) {
			// Sort rooms naturally by room name/code
			const sortedRooms = [...phongThiData].sort((a, b) =>
				a.ten.localeCompare(b.ten, undefined, {
					numeric: true,
					sensitivity: "base",
				}),
			);
			select.innerHTML = sortedRooms
				.map((p) => `<option value="${p.ma}">${p.ten}</option>`)
				.join("");
		}
	}

	function populateCaThiSelectOptions() {
		const select = document.getElementById("ct-kythi-select");
		if (select) {
			select.innerHTML = "";
			kyThiData.forEach((kt) => {
				select.innerHTML += `<option value="${kt.id}">${kt.name} (${kt.semester})</option>`;
			});
		}

		// Lịch thi tab selectors as well
		const selectLich = document.getElementById("dsl-lich-kythi");
		if (selectLich) {
			selectLich.innerHTML = "";
			kyThiData.forEach((kt) => {
				selectLich.innerHTML += `<option value="${kt.id}">${kt.name} (${kt.semester})</option>`;
			});
		}
		populateCaThiDropdown();
		populateGiamThiDropdown();
		populateSubjectDropdowns();
		populateRoomDropdown();
	}

	function timeToMinutes(t) {
		if (!t) return 0;
		const parts = t.split(":");
		const h = parseInt(parts[0], 10) || 0;
		const m = parseInt(parts[1], 10) || 0;
		return h * 60 + m;
	}

	function minutesToTime(m) {
		const h = Math.floor(m / 60)
			.toString()
			.padStart(2, "0");
		const min = (m % 60).toString().padStart(2, "0");
		return `${h}:${min}`;
	}

	function handleCreateCaThi() {
		const kyThiId = document.getElementById("ct-kythi-select").value;
		const ten = document.getElementById("ct-ten").value.trim();
		const ngay = document.getElementById("ct-ngay").value;
		const gioBd = document.getElementById("ct-gio-bd").value;
		const gioKt = document.getElementById("ct-gio-kt").value;
		const ghiChu = document.getElementById("ct-ghichu").value.trim();

		if (!ten || !ngay || !gioBd || !gioKt) {
			showGlobalToast(
				"Lỗi nhập liệu",
				"Vui lòng nhập đầy đủ các trường bắt buộc!",
				"error",
			);
			return;
		}

		const newStartMin = timeToMinutes(gioBd);
		const newEndMin = timeToMinutes(gioKt);
		const newDuration = newEndMin - newStartMin;

		if (newDuration <= 0) {
			showGlobalToast(
				"Lỗi nhập liệu",
				"Giờ kết thúc phải lớn hơn giờ bắt đầu!",
				"error",
			);
			return;
		}

		// Tìm tất cả ca thi trên cùng ngày có khoảng thời gian giao nhau
		const overlappingShifts = caThiData.filter((c) => {
			if (c.date !== ngay) return false;
			const s = timeToMinutes(c.start);
			const e = timeToMinutes(c.end);
			return Math.max(newStartMin, s) < Math.min(newEndMin, e);
		});

		if (overlappingShifts.length > 0) {
			let mergedStartMin = newStartMin;
			let mergedEndMin = newEndMin;
			overlappingShifts.forEach((c) => {
				const s = timeToMinutes(c.start);
				const e = timeToMinutes(c.end);
				if (s < mergedStartMin) mergedStartMin = s;
				if (e > mergedEndMin) mergedEndMin = e;
			});

			let maxDur = newDuration;
			let bestName = ten;
			let bestNote = ghiChu;
			let bestKyThiId = kyThiId;

			overlappingShifts.forEach((c) => {
				const s = timeToMinutes(c.start);
				const e = timeToMinutes(c.end);
				const dur = e - s;
				if (dur > maxDur) {
					maxDur = dur;
					bestName = c.name;
					bestNote = c.note;
					bestKyThiId = c.kyThiId;
				}
			});

			const mergedStart = minutesToTime(mergedStartMin);
			const mergedEnd = minutesToTime(mergedEndMin);

			const mainShift = overlappingShifts[0];
			const oldMainId = mainShift.id;

			mainShift.start = mergedStart;
			mainShift.end = mergedEnd;
			mainShift.name = bestName;
			mainShift.note = bestNote;
			mainShift.kyThiId = bestKyThiId;

			const otherOverlapping = overlappingShifts.slice(1);
			otherOverlapping.forEach((c) => {
				lichThiData.forEach((l) => {
					if (l.caThiId === c.id) {
						l.caThiId = oldMainId;
						l.shiftName = bestName;
					}
				});
				caThiData = caThiData.filter((x) => x.id !== c.id);
			});

			lichThiData.forEach((l) => {
				if (l.caThiId === oldMainId) {
					l.shiftName = bestName;
				}
			});

			showGlobalToast(
				"Thành công",
				`Đã tự động gộp vào ca thi lớn hơn (${mergedStart} - ${mergedEnd})!`,
			);
		} else {
			const newId = `CT-${Math.floor(100 + Math.random() * 900)}`;
			caThiData.unshift({
				id: newId,
				kyThiId: kyThiId,
				name: ten,
				date: ngay,
				start: gioBd,
				end: gioKt,
				note: ghiChu,
			});

			const kt = kyThiData.find((x) => x.id === kyThiId);
			if (kt) kt.shiftsCount++;

			showGlobalToast("Thành công", "Tạo ca thi mới thành công!");
		}

		document.getElementById("ct-ten").selectedIndex = 0;
		document.getElementById("ct-ngay").value = "";
		document.getElementById("ct-gio-bd").value = "";

	// ==========================================================
	// QUẢN LÝ CHẾ ĐỘ CHỌN & CHỌN TẤT CẢ (MULTI-SELECT SYSTEM)
	// ==========================================================
	const selectModesState = {}; // key -> 0: Off ("Chọn"), 1: On ("Chọn tất cả"), 2: All Checked ("Bỏ chọn tất cả")

	function toggleSelectMode(key) {
		const btn = document.getElementById(`btn-select-${key}`);
		const btnSpan = btn ? btn.querySelector("span") : null;
		const currentState = selectModesState[key] || 0;

		if (currentState === 0) {
			// Bước 1: Bấm "Chọn" -> Hiện ô vuông tích chọn & Đổi nhãn thành "Chọn tất cả"
			selectModesState[key] = 1;
			if (btnSpan) btnSpan.innerText = "Chọn tất cả";
			document
				.querySelectorAll(`.select-cb-${key}, .select-col-${key}`)
				.forEach((el) => {
					el.classList.remove("hidden");
				});
			// Hide global action buttons initially on "Chọn", hide individual delete buttons
			const globalDelBtn = document.getElementById(`btn-delete-all-${key}`);
			if (globalDelBtn) globalDelBtn.classList.add("hidden");
			const globalUpdateBtn = document.getElementById(`btn-update-all-${key}`);
			if (globalUpdateBtn) globalUpdateBtn.classList.add("hidden");
			document
				.querySelectorAll(`.del-btn-${key}`)
				.forEach((el) => el.classList.add("hidden"));
			if (key === "dsl-lich") {
				document
					.querySelectorAll(".del-col-dsl-lich")
					.forEach((el) => el.classList.add("hidden"));
			}
		} else if (currentState === 1) {
			// Bước 2: Bấm "Chọn tất cả" -> Tích chọn toàn bộ & Đổi nhãn thành "Bỏ chọn tất cả"
			selectModesState[key] = 2;
			if (btnSpan) btnSpan.innerText = "Bỏ chọn tất cả";
			document.querySelectorAll(`.select-cb-${key}`).forEach((cb) => {
				cb.checked = true;
			});
			// Show global action buttons after "Chọn tất cả" is clicked
			const globalDelBtn = document.getElementById(`btn-delete-all-${key}`);
			if (globalDelBtn) globalDelBtn.classList.remove("hidden");
			const globalUpdateBtn = document.getElementById(`btn-update-all-${key}`);
			if (globalUpdateBtn) globalUpdateBtn.classList.remove("hidden");
		} else {
			// Bước 3: Bấm "Bỏ chọn tất cả" -> Bỏ tích, ẩn ô vuông & Quay về nhãn "Chọn" ban đầu
			selectModesState[key] = 0;
			if (btnSpan) btnSpan.innerText = "Chọn";
			document.querySelectorAll(`.select-cb-${key}`).forEach((cb) => {
				cb.checked = false;
			});
			document
				.querySelectorAll(`.select-cb-${key}, .select-col-${key}`)
				.forEach((el) => {
					el.classList.add("hidden");
				});
			// Hide global action buttons and show individual delete buttons
			const globalDelBtn = document.getElementById(`btn-delete-all-${key}`);
			if (globalDelBtn) globalDelBtn.classList.add("hidden");
			const globalUpdateBtn = document.getElementById(`btn-update-all-${key}`);
			if (globalUpdateBtn) globalUpdateBtn.classList.add("hidden");
			document
				.querySelectorAll(`.del-btn-${key}`)
				.forEach((el) => el.classList.remove("hidden"));
			if (key === "dsl-lich") {
				document
					.querySelectorAll(".del-col-dsl-lich")
					.forEach((el) => el.classList.remove("hidden"));
			}
		}
		if (typeof initIcons !== "undefined") initIcons();
	}

	function updateDeleteAllBtnVisibility(key) {
		const globalDelBtn = document.getElementById(`btn-delete-all-${key}`);
		const globalUpdateBtn = document.getElementById(`btn-update-all-${key}`);
		const checkedCount = document.querySelectorAll(
			`.select-cb-${key}:checked`,
		).length;
		if (checkedCount > 0 && (selectModesState[key] || 0) > 0) {
			if (globalDelBtn) globalDelBtn.classList.remove("hidden");
			if (globalUpdateBtn) globalUpdateBtn.classList.remove("hidden");
		} else if ((selectModesState[key] || 0) < 2 && checkedCount === 0) {
			if (globalDelBtn) globalDelBtn.classList.add("hidden");
			if (globalUpdateBtn) globalUpdateBtn.classList.add("hidden");
		}
	}

	function renderSelectCheckbox(key, extraClass = "", itemId = "") {
		const isVisible = selectModesState[key] > 0;
		const isChecked = selectModesState[key] === 2;
		return `<input type="checkbox" data-id="${itemId}" class="select-cb-${key} ${isVisible ? "" : "hidden"} ${extraClass} w-4 h-4 text-red-600 rounded border-gray-300 focus:ring-red-500 cursor-pointer shrink-0" ${isChecked ? "checked" : ""} onclick="event.stopPropagation()" onchange="updateDeleteAllBtnVisibility('${key}')">`;
	}

			} else if (key === "in-sao") {
				inSaoData = inSaoData.filter((is) => !idsToDelete.includes(is.id));
				renderInSaoListPanel();
				if (typeof renderInSaoNKList === "function") renderInSaoNKList();
				if (typeof renderInSaoBBList === "function") renderInSaoBBList();

			} else if (key === "phong-thi") {
				phongThiData = phongThiData.filter(
					(p) => !idsToDelete.includes(p.ma) && !idsToDelete.includes(p.id),
				);
				renderPhongThiTable();
			} else if (key === "phan-cong") {
				phanCongPhongData = phanCongPhongData.filter(
					(pc) =>
						!idsToDelete.includes(pc.id) && !idsToDelete.includes(pc.ltId),
				);

						(d) => !idsToDelete.includes(d.id) && !idsToDelete.includes(d.maDe),

				if (typeof renderRasoatDeList === "function") renderRasoatDeList();

						(p) => !idsToDelete.includes(p.id),
					);
				if (typeof renderPhucKhaoList === "function") renderPhucKhaoList();
			} else if (key === "dsl-sv") {
				if (typeof hocPhiData !== "undefined")
					hocPhiData = hocPhiData.filter(
						(s) => !idsToDelete.includes(s.id) && !idsToDelete.includes(s.msv),
					);
				if (typeof filterDslStudents === "function") filterDslStudents();
			} else if (key === "cbct-phan-cong") {
				if (typeof canBoCoiThiData !== "undefined") {
					canBoCoiThiData.forEach((gv) => {
						if (gv.history)
							gv.history = gv.history.filter(
								(h, idx) => !idsToDelete.includes(`${gv.code}-${idx}`),

				if (typeof renderGioCoiThongKe === "function") renderGioCoiThongKe();
			} else if (key === "cbct-tong-hop") {
				if (typeof canBoCoiThiData !== "undefined")
					canBoCoiThiData = canBoCoiThiData.filter(
						(c) => !idsToDelete.includes(c.code) && !idsToDelete.includes(c.id),
					);
				if (typeof renderGioCoiThongKe === "function") renderGioCoiThongKe();

				"Thành công",
				`Đã xóa ${idsToDelete.length} mục thành công.`,
			);
			if (typeof isStateLoaded !== "undefined" && isStateLoaded)
				saveStateToServer();
		});

	function openKyThiEditModal(ktId) {
		const kt = kyThiData.find((x) => x.id === ktId);
		if (!kt) return;
		document.getElementById("edit-kt-id").value = kt.id;

		// Populate Years dropdown
		const selectNamHoc = document.getElementById("edit-kt-nam");
		if (selectNamHoc) {
			selectNamHoc.innerHTML = "";
			const currentYear = new Date().getFullYear();
			for (let year = 2023; year <= currentYear + 1; year++) {
				const optVal = `${year}-${year + 1}`;
				selectNamHoc.innerHTML += `<option value="${optVal}" ${kt.year === optVal ? "selected" : ""}>${optVal}</option>`;
			}
		}

		document.getElementById("edit-kt-ten").value = kt.name || "Thi giữa kỳ";
		document.getElementById("edit-kt-hocky").value =
			kt.semester || "Học kỳ III";
		document.getElementById("edit-kt-dot").value = kt.dot || "Đợt 1";
		document.getElementById("edit-kt-mota").value = kt.mota || "";

		// Parse duration date strings if available (format "DD/MM/YYYY - DD/MM/YYYY")
		if (kt.duration && kt.duration.includes(" - ")) {
			const parts = kt.duration.split(" - ");
			const bdParts = parts[0].trim().split("/");
			const ktParts = parts[1].trim().split("/");
			if (bdParts.length === 3) {
				document.getElementById("edit-kt-thoigian-bd").value =
					`${bdParts[2]}-${bdParts[1].padStart(2, "0")}-${bdParts[0].padStart(2, "0")}`;
			}
			if (ktParts.length === 3) {
				document.getElementById("edit-kt-thoigian-kt").value =
					`${ktParts[2]}-${ktParts[1].padStart(2, "0")}-${ktParts[0].padStart(2, "0")}`;
			}
		} else {
			document.getElementById("edit-kt-thoigian-bd").value = "";
			document.getElementById("edit-kt-thoigian-kt").value = "";
		}

		document
			.getElementById("modal-ky-thi-edit")
			.classList.remove("hidden-view");
		if (typeof initIcons !== "undefined") initIcons();
	}

	function hideKyThiEditModal() {
		document.getElementById("modal-ky-thi-edit").classList.add("hidden-view");
	}

	function handleSaveKyThiEdit() {
		const ktId = document.getElementById("edit-kt-id").value;
		const ten = document.getElementById("edit-kt-ten").value;
		const nam = document.getElementById("edit-kt-nam").value;
		const hocky = document.getElementById("edit-kt-hocky").value;
		const dot = document.getElementById("edit-kt-dot").value;
		const bd = document.getElementById("edit-kt-thoigian-bd").value;
		const ktDate = document.getElementById("edit-kt-thoigian-kt").value;
		const mota = document.getElementById("edit-kt-mota").value.trim();

		if (!bd || !ktDate) {
			showGlobalToast(
				"Lỗi nhập liệu",
				"Vui lòng chọn đầy đủ thời gian bắt đầu và kết thúc!",
				"error",
			);
			return;
		}

		const bdParts = bd.split("-");
		const ktParts = ktDate.split("-");
		if (new Date(bd) > new Date(ktDate)) {
			showGlobalToast(
				"Lỗi nhập liệu",
				"Thời gian bắt đầu không được lớn hơn thời gian kết thúc!",
				"error",
			);
			return;
		}

		const thoigian = `${bdParts[2]}/${bdParts[1]}/${bdParts[0]} - ${ktParts[2]}/${ktParts[1]}/${ktParts[0]}`;

		const kt = kyThiData.find((x) => x.id === ktId);
		if (kt) {
			kt.name = ten;
			kt.year = nam;
			kt.semester = hocky;
			kt.dot = dot;
			kt.duration = thoigian;
			kt.mota = mota;

			renderKyThiList();
			populateCaThiSelectOptions();
			hideKyThiEditModal();
			showGlobalToast("Thành công", `Đã cập nhật thông tin kỳ thi "${ten}".`);
			if (typeof isStateLoaded !== "undefined" && isStateLoaded)
				saveStateToServer();
		}
	}

	function openCaThiEditModal(cId) {
		const c = caThiData.find((x) => x.id === cId);

	function handleSaveCaThiEdit() {
		const cId = document.getElementById("edit-ct-id").value;
		const kyThiId = document.getElementById("edit-ct-kythi").value;
		const name = document.getElementById("edit-ct-name").value.trim();
		const date = document.getElementById("edit-ct-date").value;
		const start = document.getElementById("edit-ct-start").value;
		const end = document.getElementById("edit-ct-end").value;
		const note = document.getElementById("edit-ct-note").value.trim();

		if (!name || !date || !start || !end) {
			showGlobalToast(
				"Lỗi nhập liệu",
				"Vui lòng điền đầy đủ thông tin tên ca, ngày thi, giờ bắt đầu và kết thúc!",
				"error",
			);
			return;
		}

		const editStartMin = timeToMinutes(start);
		const editEndMin = timeToMinutes(end);
		const editDuration = editEndMin - editStartMin;

		if (editDuration <= 0) {
			showGlobalToast(
				"Lỗi nhập liệu",
				"Giờ kết thúc phải lớn hơn giờ bắt đầu!",
				"error",
			);
			return;
		}

		const c = caThiData.find((x) => x.id === cId);
		if (c) {
			const overlappingShifts = caThiData.filter((x) => {
				if (x.id === cId || x.date !== date) return false;
				const s = timeToMinutes(x.start);
				const e = timeToMinutes(x.end);
				return Math.max(editStartMin, s) < Math.min(editEndMin, e);
			});

			if (overlappingShifts.length > 0) {
				let mergedStartMin = editStartMin;
				let mergedEndMin = editEndMin;
				overlappingShifts.forEach((x) => {
					const s = timeToMinutes(x.start);
					const e = timeToMinutes(x.end);
					if (s < mergedStartMin) mergedStartMin = s;
					if (e > mergedEndMin) mergedEndMin = e;
				});

				let maxDur = editDuration;
				let bestName = name;
				let bestNote = note;
				let bestKyThiId = kyThiId;

				overlappingShifts.forEach((x) => {
					const s = timeToMinutes(x.start);
					const e = timeToMinutes(x.end);
					const dur = e - s;
					if (dur > maxDur) {
						maxDur = dur;
						bestName = x.name;
						bestNote = x.note;
						bestKyThiId = x.kyThiId;
					}
				});

				const mergedStart = minutesToTime(mergedStartMin);
				const mergedEnd = minutesToTime(mergedEndMin);

				c.kyThiId = bestKyThiId;
				c.name = bestName;
				c.date = date;
				c.start = mergedStart;
				c.end = mergedEnd;
				c.note = bestNote;

				overlappingShifts.forEach((x) => {
					lichThiData.forEach((l) => {
						if (l.caThiId === x.id) {
							l.caThiId = cId;
							l.shiftName = bestName;
						}
					});
					caThiData = caThiData.filter((ct) => ct.id !== x.id);
				});

				lichThiData.forEach((l) => {
					if (l.caThiId === cId) {
						l.shiftName = bestName;
					}
				});

				showGlobalToast(
					"Thành công",
					`Đã tự động gộp các ca thi trùng thành ca lớn hơn (${mergedStart} - ${mergedEnd})!`,
				);
			} else {
				c.kyThiId = kyThiId;
				c.name = name;
				c.date = date;
				c.start = start;
				c.end = end;
				c.note = note;

				lichThiData.forEach((l) => {
					if (l.caThiId === cId) {
						l.shiftName = name;
					}
				});

				showGlobalToast(
					"Thành công",
					`Đã cập nhật thông tin ca thi "${name}".`,
				);
			}

			renderCaThiList();
			hideCaThiEditModal();
			if (typeof isStateLoaded !== "undefined" && isStateLoaded)
				saveStateToServer();
		}
	}

	function processUploadHocPhiFile() {
		if (!selectedHocPhiFile) {
			// Exception flow 2b
			showGlobalToast(
				"Lỗi đồng bộ",
				"Vui lòng chọn tệp danh sách nợ học phí từ Tổ tài vụ trước khi tải lên.",
				"error",
			);
			return;
		}

		const reader = new FileReader();
		const isExcel =
			selectedHocPhiFile.name.endsWith(".xlsx") ||
			selectedHocPhiFile.name.endsWith(".xls");

		reader.onload = function (e) {
			try {
				let parsedList = [];

				if (isExcel) {
					const data = new Uint8Array(e.target.result);
					const workbook = XLSX.read(data, { type: "array" });
					const firstSheetName = workbook.SheetNames[0];
					const worksheet = workbook.Sheets[firstSheetName];
					const json = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

					if (json.length > 1) {
						const headers = json[0].map((h) =>
							String(h || "")
								.trim()
								.toLowerCase(),
						);
						const msvIdx = headers.indexOf("masv");
						const nameIdx = headers.indexOf("hoten");
						const classIdx = headers.indexOf("lop");
						const subjectIdx = headers.indexOf("hocphan");
						const debtIdx = headers.indexOf("nohocphi");

						for (let i = 1; i < json.length; i++) {
							const row = json[i];
							if (row && row.length >= 3) {
								parsedList.push({
									msv: String(row[msvIdx !== -1 ? msvIdx : 0] || "").trim(),
									name: String(row[nameIdx !== -1 ? nameIdx : 1] || "").trim(),
									class: String(
										row[classIdx !== -1 ? classIdx : 2] || "",
									).trim(),
									subject: String(
										row[subjectIdx !== -1 ? subjectIdx : 3] || "ENG101",
									).trim(),
									debt: parseInt(row[debtIdx !== -1 ? debtIdx : 4] || 0) || 0,
								});
							}
						}
					}
				} else {
					const text = e.target.result;
					const lines = text
						.split("\n")
						.map((l) => l.trim())
						.filter((l) => l.length > 0);

					if (lines.length <= 1) {
						showGlobalToast(
							"Không thể đồng bộ dữ liệu học phí",
							"File rỗng hoặc không chứa dữ liệu nợ học phí hợp lệ.",
							"error",
						);
						return;
					}

					for (let i = 1; i < lines.length; i++) {
						const cols = lines[i].split(",");
						if (cols.length >= 3) {
							parsedList.push({
								msv: cols[0].replace(/"/g, "").trim(),
								name: cols[1].replace(/"/g, "").trim(),
								class: cols[2].replace(/"/g, "").trim(),
								subject: cols[3] ? cols[3].replace(/"/g, "").trim() : "ENG101",
								debt: parseInt(cols[4] || cols[3] || 0) || 0,
							});
						}
					}
				}

				if (parsedList.length > 0) {
					const existingMap = {};
					hocPhiData.forEach((s) => {
						existingMap[s.msv] = s;
					});

					parsedList.forEach((newSv) => {
						if (existingMap[newSv.msv]) {
							existingMap[newSv.msv].debt = newSv.debt;
							if (newSv.class) existingMap[newSv.msv].class = newSv.class;
							if (newSv.subject) existingMap[newSv.msv].subject = newSv.subject;
							if (newSv.name) existingMap[newSv.msv].name = newSv.name;
						} else {
							hocPhiData.unshift(newSv);
						}
					});
				} else {
					showGlobalToast(
						"Không thể đồng bộ dữ liệu học phí",
						"Không tìm thấy dữ liệu hợp lệ trong tệp.",
						"error",
					);
					return;
				}

				hideUploadHocPhiModal();
				handleSyncDoiChieuHocPhi();
				showGlobalToast(
					"Thành công",
					`Đã đồng bộ ${hocPhiData.length} sinh viên từ danh sách Tổ tài vụ.`,
				);
			} catch (err) {
				console.error(err);
				showGlobalToast(
					"Không thể đồng bộ dữ liệu học phí",
					"Lỗi định dạng tệp tải lên.",
					"error",
				);
			}
		};

		if (isExcel) {
			reader.readAsArrayBuffer(selectedHocPhiFile);
		} else {
			reader.readAsText(selectedHocPhiFile);
		}
	}

			return;
		}

				"Khôi phục thành công",

			showGlobalToast(
				"Lỗi",
				"Không thể khôi phục dữ liệu học phí mặc định.",
				"error",
			);
		}

	function filterDslStudents() {
		const subjectSelect = document.getElementById("dsl-subject-select")
			? document.getElementById("dsl-subject-select").value
			: "ALL";
		const classSelect = document.getElementById("dsl-class-filter")
			? document.getElementById("dsl-class-filter").value
			: "ALL";
		const searchInput = document.getElementById("dsl-search-input")
			? document.getElementById("dsl-search-input").value.toLowerCase().trim()
			: "";

		const tbody = document.getElementById("dsl-students-tbody");
		if (!tbody) return;

		let filtered = hocPhiData.filter((s) => {
			const matchSubject =
				subjectSelect === "ALL" || !s.subject || s.subject === subjectSelect;
			const matchClass =
				classSelect === "ALL" || !s.class || s.class === classSelect;
			const matchSearch =
				!searchInput ||
				s.msv.toLowerCase().includes(searchInput) ||
				s.name.toLowerCase().includes(searchInput) ||
				(s.class && s.class.toLowerCase().includes(searchInput));
			return matchSubject && matchClass && matchSearch;
		});

		if (filtered.length === 0) {
			tbody.innerHTML = `<tr><td colspan="7" class="text-center text-gray-400 py-8 italic">Không tìm thấy sinh viên phù hợp. Bấm "Đồng bộ" hoặc "Upload tệp" để tải dữ liệu.</td></tr>`;
			const subjSelect = document.getElementById("dsl-subject-select");
			const subjVal = subjSelect ? subjSelect.value : "ALL";
			if (!subjVal || subjVal === "ALL") {
				dslCurrentStatus = "Chưa lập";
			} else {
				const currentDs = (danhSachThiData || []).find(x => x.id === `DS-${subjVal}` || x.subjectCode === subjVal);
				if (currentDs && currentDs.status) {
					dslCurrentStatus = currentDs.status;
				} else {
					dslCurrentStatus = "Chưa lập";
				}
			}
			updateDslStats(0, 0, 0);
			updateSendDanhSachThiButtonState();
			return;
		}

		let totalEligible = 0;
		let totalDebt = 0;
		let htmlRows = [];

		filtered.forEach((s, idx) => {
			let statusBadge = `<span class="bg-green-100 text-green-800 px-2 py-0.5 rounded font-bold">Hoàn thành</span>`;
			let eligibleBadge = `<span class="text-green-600 font-bold flex items-center justify-center gap-1">✓ ĐỦ ĐK THI</span>`;

			if (s.debt > 0) {
				totalDebt++;
				statusBadge = `<span class="bg-red-100 text-red-800 px-2 py-0.5 rounded font-bold">Nợ ${s.debt.toLocaleString()}đ</span>`;
				eligibleBadge = `<span class="text-red-600 font-bold flex items-center justify-center gap-1">✗ CẤM THI</span>`;
			} else {
				totalEligible++;
			}

			htmlRows.push(`
                <tr class="hover:bg-gray-50 transition-colors">
                    <td class="select-col-dsl-sv ${selectModesState["dsl-sv"] > 0 ? "" : "hidden"} px-3 py-2.5 text-center">
                        ${renderSelectCheckbox("dsl-sv")}
                    </td>
                    <td class="px-3 py-2.5 text-center font-mono text-gray-400">${idx + 1}</td>
                    <td class="px-4 py-2.5 font-mono font-bold text-gray-800">${s.msv}</td>
                    <td class="px-4 py-2.5 font-medium text-gray-900">${s.name}</td>
                    <td class="px-4 py-2.5 font-mono text-gray-600">${s.class || "K18-CNTT"}</td>
                    <td class="px-4 py-2.5 text-center font-mono font-bold ${s.debt > 0 ? "text-red-600" : "text-gray-400"}">${s.debt > 0 ? s.debt.toLocaleString() + "đ" : "0đ"}</td>
                    <td class="px-4 py-2.5 text-center">${statusBadge}</td>
                    <td class="px-4 py-2.5 text-center">${eligibleBadge}</td>
                </tr>
            `);
		});

		tbody.innerHTML = htmlRows.join("");

		const subjSelect = document.getElementById("dsl-subject-select");
		const subjVal = subjSelect ? subjSelect.value : "ALL";
		if (!subjVal || subjVal === "ALL") {
			dslCurrentStatus = "Chưa lập";
		} else {
			const currentDs = (danhSachThiData || []).find(x => x.id === `DS-${subjVal}` || x.subjectCode === subjVal);
			if (currentDs && currentDs.status) {
				dslCurrentStatus = currentDs.status;
			} else {
				dslCurrentStatus = "Chưa lập";
			}
		}

		updateDslStats(filtered.length, totalEligible, totalDebt);
		updateSendDanhSachThiButtonState();

		if (typeof initIcons !== "undefined") initIcons();
	}

	function updateDslStats(total, eligible, debt) {
		const totalEl = document.getElementById("stat-total-sv");
		const eligibleEl = document.getElementById("stat-eligible-sv");
		const debtEl = document.getElementById("stat-debt-sv");
		const badgeEl = document.getElementById("dsl-status-badge");

		if (totalEl) totalEl.innerText = `Tổng: ${total} SV`;
		if (eligibleEl) eligibleEl.innerText = `Đủ ĐK: ${eligible}`;
		if (debtEl) debtEl.innerText = `Cấm thi: ${debt}`;
		if (badgeEl) {
			badgeEl.innerText = dslCurrentStatus;
			if (dslCurrentStatus === "Lưu nháp") {
				badgeEl.className =
					"bg-gray-200 text-gray-800 border border-gray-300 px-2.5 py-1 rounded-full font-bold text-[11px]";
			} else if (dslCurrentStatus === "Chờ duyệt") {
				badgeEl.className =
					"bg-amber-100 text-amber-900 border border-amber-300 px-2.5 py-1 rounded-full font-bold text-[11px] animate-pulse";
			} else if (dslCurrentStatus === "Đã đối chiếu") {
				badgeEl.className =
					"bg-blue-100 text-blue-900 border border-blue-300 px-2.5 py-1 rounded-full font-bold text-[11px]";
			}
		}
	}

	function handleSaveDraftDanhSachThi() {
		if (!hocPhiData || hocPhiData.length === 0) {
			showGlobalToast(
				"Không thể lập danh sách thi",
				"Không thể lưu nháp khi chưa có dữ liệu sinh viên.",
				"error",
			);
			return;
		}

		const subjSelect = document.getElementById("dsl-subject-select");
		const subjVal = subjSelect ? subjSelect.value : "ALL";

		let subjectsToProcess = [];
		if (subjVal && subjVal !== "ALL") {
			const subjText = subjSelect && subjSelect.options[subjSelect.selectedIndex] ? subjSelect.options[subjSelect.selectedIndex].text : "";
			subjectsToProcess.push({ code: subjVal, name: subjText });
		} else {
			if (subjSelect) {
				for (let i = 0; i < subjSelect.options.length; i++) {
					const opt = subjSelect.options[i];
					if (opt.value && opt.value !== "ALL") {
						subjectsToProcess.push({ code: opt.value, name: opt.text });
					}
				}
			}
			if (subjectsToProcess.length === 0 && typeof hocPhanData !== "undefined" && hocPhanData.length > 0) {
				subjectsToProcess = hocPhanData.map(hp => ({ code: hp.code, name: hp.name }));
			}
		}

		if (subjectsToProcess.length === 0) {
			showGlobalToast(
				"Vui lòng chọn học phần",
				"Không tìm thấy học phần nào để lưu nháp.",
				"warning",
			);
			return;
		}

		const nowStr = new Date().toLocaleString("vi-VN");
		let countSaved = 0;
		let countSkipped = 0;

		subjectsToProcess.forEach(subj => {
			const subjCode = subj.code;
			const subjText = subj.name;
			const dsId = "DS-" + subjCode;

			const subjectStudents = hocPhiData.filter((x) => !x.subject || x.subject === subjCode);
			const total = subjectStudents.length;
			const eligible = subjectStudents.filter((x) => x.debt === 0).length;
			const banned = subjectStudents.filter((x) => x.debt > 0).length;

			let existing = (danhSachThiData || []).find(
				(x) => x.id === dsId || x.subjectCode === subjCode,
			);

			if (existing) {
				if (existing.status === "Đã phê duyệt" || existing.status === "Đã duyệt") {
					countSkipped++;
					if (subjVal !== "ALL") {
						showGlobalToast(
							"Đã được phê duyệt",
							`Danh sách thi cho học phần này (${subjText}) đã được Lãnh đạo phòng phê duyệt trước đó.`,
							"info",
						);
					}
					return;
				}
				existing.status = "Lưu nháp";
				existing.totalStudents = total;
				existing.eligibleStudents = eligible;
				existing.bannedStudents = banned;
				existing.createdAt = nowStr;
				countSaved++;
			} else {
				danhSachThiData = danhSachThiData || [];
				danhSachThiData.unshift({
					id: dsId,
					subjectCode: subjCode,
					subjectName: subjText,
					totalStudents: total,
					eligibleStudents: eligible,
					bannedStudents: banned,
					creator: "Tổ Khảo thí",
					createdAt: nowStr,
					status: "Lưu nháp",
					lyDoTuChoi: "",
					approver: "",
					approvedAt: "",
				});
				countSaved++;
			}
		});

		if (countSaved > 0) {
			dslCurrentStatus = "Lưu nháp";
			if (subjVal !== "ALL") {
				const singleSub = subjectsToProcess[0];
				const singleStudents = hocPhiData.filter((x) => !x.subject || x.subject === singleSub.code);
				updateDslStats(singleStudents.length, singleStudents.filter((x) => x.debt === 0).length, singleStudents.filter((x) => x.debt > 0).length);
			} else {
				updateDslStats(hocPhiData.length, hocPhiData.filter((x) => x.debt === 0).length, hocPhiData.filter((x) => x.debt > 0).length);
			}

			showGlobalToast(
				"Đã lưu nháp",
				subjVal === "ALL"
					? `Đã lưu nháp danh sách thi cho ${countSaved} học phần.`
					: "Danh sách thi đã được lưu tạm ở trạng thái Nháp (Flow 7a).",
			);
		} else if (countSkipped > 0 && subjVal === "ALL") {
			showGlobalToast(
				"Không có thay đổi",
				"Tất cả học phần đều đã được phê duyệt trước đó.",
				"info",
			);
		}

		updateSendDanhSachThiButtonState();
		if (typeof isStateLoaded !== "undefined" && isStateLoaded)
			saveStateToServer();
	}

	function downloadExportDslCSV() {
		if (!hocPhiData || hocPhiData.length === 0) {
			showGlobalToast(
				"Không có dữ liệu",
				"Vui lòng đồng bộ dữ liệu trước khi xuất danh sách.",
				"error",
			);
			return;
		}
		let csv = "\uFEFFSTT,MaSV,HoTen,Lop,NoHocPhi,DieuKienThi\n";
		hocPhiData.forEach((s, idx) => {
			const dk = s.debt > 0 ? "CAM THI" : "DU DIEU KIEN";
			csv += `${idx + 1},${s.msv},"${s.name}",${s.class || "N/A"},${s.debt},${dk}\n`;
		});
		const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
		const link = document.createElement("a");
		link.href = URL.createObjectURL(blob);
		link.setAttribute("download", "Danh_Sach_Du_Thi_Hoc_Phan.csv");
		document.body.appendChild(link);
		link.click();
		document.body.removeChild(link);
		showGlobalToast(
			"Đã xuất danh sách",
			"Tệp CSV danh sách thi đã được tải về thành công.",
		);
	}

	function handleLapLichThiSubmit() {
		const cathiId = document.getElementById("dsl-lich-cathi").value;
		const subCode = document.getElementById("dsl-lich-subject").value;
		const subName =
			document.getElementById("dsl-lich-subject").options[
				document.getElementById("dsl-lich-subject").selectedIndex
			].text;
		const gvSelect = document.getElementById("dsl-lich-giám-thị");
		const gvId = gvSelect.value;
		const gvName = stripAcademicTitles(
			gvSelect.options[gvSelect.selectedIndex].text,
		);

		const ca = caThiData.find((x) => x.id === cathiId);
		if (!ca) {
			showGlobalToast("Lỗi", "Vui lòng chọn ca thi!", "error");
			return;
		}

		// Kiểm tra trùng lịch giảng viên trong ca thi đó
		const conflict = lichThiData.some(
			(l) =>
				l.date === ca.date &&
				l.shiftName === ca.name &&
				l.teacher.includes(gvName),
		);
		if (conflict) {
			showGlobalToast(
				"Xung đột giảng viên",
				"Giảng viên này đã được phân công trong khung giờ thi đó!",
				"error",
			);
			return;
		}

		const id = `LT-${subCode}-${cathiId}`;
		lichThiData.unshift({
			id: id,
			subjectCode: subCode,
			subjectName: subName,
			date: ca.date,
			shiftName: ca.name,
			caThiId: cathiId,
			room: "Chưa phân công",
			teacher: gvName,
			teacherId: gvId,
			status: "Đang lập",
		});

		showGlobalToast("Thành công", "Lập lịch ca thi thành công!");
		renderLichThiTable();
		renderDashboard();

		if (typeof isStateLoaded !== "undefined" && isStateLoaded)
			saveStateToServer();
	}

			{ code: "BUS201", name: "Quản trị dự án" },
			{ code: "CS101", name: "Nhập môn Lập trình" },
			{ code: "MATH102", name: "Toán Giải tích" },
			{ code: "WEB301", name: "Phát triển Web Django" },
		];

		const teachers = [
			"Lê Đình Dũng",
			"Đàm Minh Tùng",
			"Ngô Nguyễn Bảo Trân",
			"Lộc Tiên",
			"Thủy Tiên",
			"Thúy Uyên",
			"Lê Hoàng Sinh",
			"Trần Thanh Hòa",
		];

		let createdCount = 0;
		let gvCounter = 0;

		subjects.forEach((sub, subIdx) => {
			caThiData.forEach((ca, caIdx) => {
				const scheduleId = `LT-${sub.code}-${ca.id}`;
				const existingIdx = lichThiData.findIndex(
					(l) =>
						l.id === scheduleId ||
						(l.subjectCode === sub.code && l.caThiId === ca.id),
				);

				let gvName = teachers[gvCounter % teachers.length];
				if (canBoCoiThiData && canBoCoiThiData.length > 0) {
					const gv = canBoCoiThiData[gvCounter % canBoCoiThiData.length];
					if (gv && gv.name) gvName = gv.name;
				}
				gvCounter++;

				if (existingIdx === -1) {
					lichThiData.push({
						id: scheduleId,
						subjectCode: sub.code,
						subjectName: sub.name,
						date: ca.date,
						shiftName: ca.name,
						caThiId: ca.id,
						room: "Chưa phân công",
						teacher: gvName,
						teacherId: `GV00${(gvCounter % 20) + 1}`,
						status: "Đang lập",
					});
					createdCount++;
				}
			});
		});

		showGlobalToast(
			"Tự động lập lịch thành công",
			`Đã tự động xếp lịch thi toàn bộ ${subjects.length} học phần và ${caThiData.length} ca thi!`,
		);
		renderLichThiTable();
		renderDashboard();
		if (typeof isStateLoaded !== "undefined" && isStateLoaded)
			saveStateToServer();
	}

	function autoAssignPhongThi() {
		if (!lichThiData || lichThiData.length === 0) {
			autoCreateLichThi();
		}

		const roomList =
			phongThiData && phongThiData.length > 0
				? phongThiData
				: phongThiGocData && phongThiGocData.length > 0
					? phongThiGocData
					: [
							{ id: "P101", ma: "P101", ten: "P.101", capacity: 40 },
							{ id: "P102", ma: "P102", ten: "P.102", capacity: 40 },
							{ id: "P201", ma: "P201", ten: "P.201", capacity: 50 },
							{ id: "P202", ma: "P202", ten: "P.202", capacity: 50 },
							{ id: "P301", ma: "P301", ten: "P.301", capacity: 60 },
						];

		let assignedCount = 0;
		phanCongPhongData = [];

		lichThiData.forEach((l, idx) => {
			const rObj = roomList[idx % roomList.length];
			const roomName = rObj.ten || rObj.name || `P.${101 + (idx % 5)}`;
			l.room = roomName;
			assignedCount++;

			phanCongPhongData.push({
				id: l.id,
				ltId: l.id,
				subjectName: l.subjectName,
				date: l.date,
				caThi: l.time || l.shiftName || "Ca 1",
				soLuong: l.soLuong || 40,
				roomNames: roomName,
			});
		});

		showGlobalToast(
			"Phân công phòng tự động",
			`Đã tự động xếp phòng thi cho toàn bộ ${assignedCount} lịch thi!`,
		);
		renderLichThiTable();
		if (typeof renderPhanCongTable === "function") renderPhanCongTable();
		if (typeof isStateLoaded !== "undefined" && isStateLoaded)
			saveStateToServer();
	}

	function updateSendLichThiButtonState() {
		const isAlreadySent =
			lichThiData &&
			lichThiData.length > 0 &&
			lichThiData.some(
				(l) =>
					l.status === "Chờ phê duyệt" ||
					l.status === "Chờ duyệt" ||
					l.status === "Đã phê duyệt" ||
					l.status === "Đã duyệt",
			);
		const btns = document.querySelectorAll(
			'#btn-send-lich-thi, button[onclick*="handleSendLichThiForApproval"]',
		);
		btns.forEach((btn) => {
			if (isAlreadySent) {
				btn.disabled = true;
				btn.className =
					"bg-gray-300 text-gray-500 font-bold px-3 py-1.5 text-xs rounded cursor-not-allowed flex items-center gap-1.5 shadow-none opacity-80";
				btn.innerHTML = `<i data-lucide="check-circle" class="w-3.5 h-3.5 text-gray-500"></i> <span>Đã gửi duyệt Lịch thi</span>`;
				btn.title = "Kế hoạch lịch thi đã được gửi duyệt cho Lãnh đạo phòng.";
			} else {
				btn.disabled = false;
				btn.className =
					"bg-[#9e1c22] hover:bg-red-800 text-white font-bold px-3 py-1.5 text-xs rounded transition-colors flex items-center gap-1.5 shadow-xs";
				btn.innerHTML = `<i data-lucide="send" class="w-3.5 h-3.5"></i> <span>Gửi duyệt Lịch thi</span>`;
				btn.title =
					"Gửi danh sách lịch thi đã xếp phòng cho Lãnh đạo phòng duyệt";
			}
		});
		if (typeof initIcons !== "undefined") initIcons();
	}

	function handleSendLichThiForApproval() {
		if (!lichThiData || lichThiData.length === 0) {
			showGlobalToast(
				"Lỗi gửi duyệt",
				"Vui lòng lập lịch thi trước khi gửi duyệt!",
				"error",
			);
			return;
		}

		const timestamp = new Date().toLocaleString("vi-VN");
		lichThiData.forEach((l) => {
			if (!l.status || l.status === "Đang lập" || l.status === "Chờ duyệt") {
				l.status = "Chờ phê duyệt";
				l.submittedAt = timestamp;
			}
		});

		showGlobalToast(
			"Gửi duyệt thành công",
			`Đã gửi ${lichThiData.length} kế hoạch lịch thi cho Lãnh đạo phòng duyệt.`,
			"success",
		);
		renderLichThiTable();
		renderDashboard();
		updateSendLichThiButtonState();
		if (typeof isStateLoaded !== "undefined" && isStateLoaded)
			saveStateToServer();
	}

	function renderLichThiTable() {
		const tbody = document.getElementById("dsl-lich-tbody");
		if (!tbody) return;
		tbody.innerHTML = "";
		if (lichThiData.length === 0) {
			tbody.innerHTML = `<tr><td colspan="7" class="text-center text-gray-400 py-6 italic">Chưa có lịch thi nào được xếp.</td></tr>`;
			return;
		}
		lichThiData.forEach((l) => {
			const st = l.status || "Đang lập";
			let badge = `<span class="bg-gray-100 text-gray-700 px-2 py-0.5 rounded text-[10px] font-bold">Đang lập</span>`;
			if (st === "Chờ phê duyệt" || st === "Chờ duyệt") {
				badge = `<span class="bg-amber-100 text-amber-900 border border-amber-200 px-2 py-0.5 rounded text-[10px] font-bold">Chờ phê duyệt</span>`;
			} else if (st === "Đã phê duyệt" || st === "Đã duyệt") {
				badge = `<span class="bg-green-100 text-green-800 border border-green-200 px-2 py-0.5 rounded text-[10px] font-bold">✓ Đã phê duyệt</span>`;
			} else if (st === "Từ chối" || st === "Từ chối phê duyệt") {
				badge = `<span class="bg-red-100 text-red-800 border border-red-200 px-2 py-0.5 rounded text-[10px] font-bold" title="${l.lyDoTuChoi || ""}">✗ Từ chối</span>`;
			}

			tbody.innerHTML += `
                <tr class="hover:bg-gray-50">
                    <td class="select-col-dsl-lich ${selectModesState["dsl-lich"] > 0 ? "" : "hidden"} px-3 py-2.5 text-center">
                        ${renderSelectCheckbox("dsl-lich", "", l.id)}
                    </td>
                    <td class="px-4 py-2.5 font-medium text-gray-800">${l.subjectName}</td>
                    <td class="px-4 py-2.5 font-mono text-gray-600">${l.date}</td>
                    <td class="px-4 py-2.5 font-semibold text-blue-900">${l.shiftName}</td>
                    <td class="px-4 py-2.5 text-gray-700">${l.teacher}</td>
                    <td class="px-4 py-2.5 text-center">${badge}</td>
                    <td class="px-4 py-2.5 text-center del-col-dsl-lich ${selectModesState["dsl-lich"] > 0 ? "hidden" : ""}">
                        <button onclick="handleDeleteLichThi('${l.id}')" class="del-btn-dsl-lich text-red-600 hover:text-red-800 font-semibold p-1 hover:bg-red-50 rounded transition-all" title="Xóa lịch thi">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </td>
                </tr>
            `;
		});
		if (typeof initIcons !== "undefined") initIcons();
	}

	function handleComparePhachPoints() {
		const list = tuiPhachChiTietData[activeNhapDiemBagId].papers;
		let hasBlank = false;
		let hasRangeError = false;

		for (let i = 0; i < list.length; i++) {
			const val = document.getElementById(`nd-phach-input-${i}`).value;
			if (val === "") {
				hasBlank = true;
			} else {
				const point = parseFloat(val);
				if (point < 0 || point > 10) hasRangeError = true;
			}
		}

		if (hasBlank) {
			showGlobalToast(
				"Lỗi nhập điểm",
				"Không được bỏ trống điểm của bất kỳ mã phách nào!",
				"error",
			);
			return;
		}
		if (hasRangeError) {
			showGlobalToast(
				"Lỗi nhập điểm",
				"Điểm số nhập vào bắt buộc phải từ 0 đến 10!",
				"error",
			);
			return;
		}

		let hasMismatch = false;

		for (let i = 0; i < list.length; i++) {
			const pt1Text = document.getElementById(`nd-phach-pt1-${i}`);
			const pt2Input = document.getElementById(`nd-phach-input-${i}`);
			const ptFinalInput = document.getElementById(`nd-phach-final-${i}`);

			pt1Text.innerText = list[i].pt1.toFixed(1);
			pt1Text.classList.remove("text-gray-400", "italic");
			pt1Text.classList.add("text-gray-800");

			const pt2Val = parseFloat(pt2Input.value);
			list[i].pt2 = pt2Val;

			pt2Input.disabled = true;

			if (list[i].pt1 !== pt2Val) {
				hasMismatch = true;
				document.getElementById(`nd-phach-row-${i}`).className =
					"bg-red-50 hover:bg-red-100 transition-colors";
				ptFinalInput.disabled = false;
				ptFinalInput.classList.remove("bg-gray-50");
				ptFinalInput.classList.add(
					"bg-white",
					"border-red-500",
					"ring-1",
					"ring-red-400",
				);
				ptFinalInput.value = "";
			} else {
				ptFinalInput.value = list[i].pt1.toFixed(1);
				list[i].ptFinal = list[i].pt1;
				document.getElementById(`nd-phach-row-${i}`).className =
					"hover:bg-gray-50 transition-colors";
			}
		}

		if (hasMismatch) {
			document
				.getElementById("nd-phach-error-block")
				.classList.remove("hidden-view");
			document
				.getElementById("nd-phach-success-block")
				.classList.add("hidden-view");
		} else {
			document
				.getElementById("nd-phach-error-block")
				.classList.add("hidden-view");
			document
				.getElementById("nd-phach-success-block")
				.classList.remove("hidden-view");
		}

		document.getElementById("nd-phach-btn-compare").disabled = true;
		document.getElementById("nd-phach-btn-compare").className =
			"flex-1 bg-gray-400 text-white font-bold py-3 rounded cursor-not-allowed flex justify-center items-center gap-2 text-xs";

		const btnSave = document.getElementById("nd-phach-btn-save");
		btnSave.disabled = false;
		btnSave.className =
			"flex-1 bg-[#9e1c22] text-white font-bold py-3 rounded shadow hover:bg-red-800 flex justify-center items-center gap-2 text-xs";
		isNhapDiemPhachCompared = true;

		if (typeof isStateLoaded !== "undefined" && isStateLoaded)
			saveStateToServer();
	}

	function handleSavePhachFinalPoints() {
		const list = tuiPhachChiTietData[activeNhapDiemBagId].papers;
		let hasBlankFinal = false;
		let hasRangeError = false;

		for (let i = 0; i < list.length; i++) {
			const finalVal = document.getElementById(`nd-phach-final-${i}`).value;
			if (finalVal === "") {
				hasBlankFinal = true;
			} else {
				const val = parseFloat(finalVal);
				if (val < 0 || val > 10) hasRangeError = true;
			}

		if (hasBlankFinal) {
			showGlobalToast(
				"Lỗi chốt điểm",
				"Vui lòng nhập điểm chốt cuối cùng cho các dòng phách bị lệch điểm!",
				"error",
			);
			return;
		}
		if (hasRangeError) {
			showGlobalToast(
				"Lỗi chốt điểm",
				"Điểm số chốt cuối cùng bắt buộc phải từ 0 đến 10!",
				"error",
			);
			return;
		}

		for (let i = 0; i < list.length; i++) {
			const finalVal = parseFloat(
				document.getElementById(`nd-phach-final-${i}`).value,
			);
			list[i].ptFinal = finalVal;

			.getElementById("nd-phach-decrypted-block")
			.classList.remove("hidden-view");
		showGlobalToast(
			"Khớp phách thành công",
			"Đã lưu điểm và thực hiện thuật toán khớp phách tự động giải mã danh sách sinh viên.",
		);

		// disable chốt lại
		const btnSave = document.getElementById("nd-phach-btn-save");
		btnSave.disabled = true;
		btnSave.className =
			"flex-1 bg-gray-400 text-white font-bold py-3 rounded cursor-not-allowed flex justify-center items-center gap-2 text-xs";

		if (typeof isStateLoaded !== "undefined" && isStateLoaded)
			saveStateToServer();
	}

	function handleCompareAndValidatePoints() {
		const list = lopThiDiemData[activeNhapDiemClassId];
		let hasBlank = false;
		let hasRangeError = false;

		// Validate inputs
		for (let i = 0; i < list.length; i++) {
			const val = document.getElementById(`nd-input-${i}`).value;
			if (val === "") {
				hasBlank = true;
			} else {
				const point = parseFloat(val);
				if (point < 0 || point > 10) hasRangeError = true;
			}
		}

		if (hasBlank) {
			showGlobalToast(
				"Lỗi nhập điểm",
				"Không được bỏ trống điểm của bất kỳ sinh viên nào!",
				"error",
			);
			return;
		}
		if (hasRangeError) {
			showGlobalToast(
				"Lỗi nhập điểm",
				"Điểm số nhập vào bắt buộc phải từ 0 đến 10!",
				"error",
			);
			return;
		}

		let hasMismatch = false;

		for (let i = 0; i < list.length; i++) {
			const pt1Text = document.getElementById(`nd-pt1-${i}`);
			const pt2Input = document.getElementById(`nd-input-${i}`);
			const ptFinalInput = document.getElementById(`nd-final-${i}`);

			// Tiết lộ điểm lần 1
			pt1Text.innerText = list[i].pt1.toFixed(1);
			pt1Text.classList.remove("text-gray-400", "italic");
			pt1Text.classList.add("text-gray-800");

			const pt2Val = parseFloat(pt2Input.value);
			list[i].pt2 = pt2Val;

			// Khóa điểm lần 2
			pt2Input.disabled = true;

			if (list[i].pt1 !== pt2Val) {
				hasMismatch = true;
				// Bôi đỏ dòng bị lệch
				document.getElementById(`nd-row-${i}`).className =
					"bg-red-50 hover:bg-red-100 transition-colors";
				// Mở khóa cột điểm cuối cho cán bộ chấm khảo thí chốt
				ptFinalInput.disabled = false;
				ptFinalInput.classList.remove("bg-gray-50");
				ptFinalInput.classList.add(
					"bg-white",
					"border-red-500",
					"ring-1",
					"ring-red-400",
				);
				ptFinalInput.value = "";
			} else {
				// Trùng điểm tự động điền cột điểm cuối và giữ khóa
				ptFinalInput.value = list[i].pt1.toFixed(1);
				list[i].ptFinal = list[i].pt1;
				document.getElementById(`nd-row-${i}`).className =
					"hover:bg-gray-50 transition-colors";
			}
		}

		if (hasMismatch) {
			document.getElementById("nd-error-block").classList.remove("hidden-view");
			document.getElementById("nd-success-block").classList.add("hidden-view");
		} else {
			document.getElementById("nd-error-block").classList.add("hidden-view");
			document
				.getElementById("nd-success-block")
				.classList.remove("hidden-view");
		}

		document.getElementById("nd-btn-compare").disabled = true;
		document.getElementById("nd-btn-compare").className =
			"flex-1 bg-gray-400 text-white font-bold py-3 rounded cursor-not-allowed flex justify-center items-center gap-2 text-xs";

		const btnSave = document.getElementById("nd-btn-save");
		btnSave.disabled = false;
		btnSave.className =
			"flex-1 bg-[#9e1c22] text-white font-bold py-3 rounded shadow hover:bg-red-800 flex justify-center items-center gap-2 text-xs";
		isNhapDiemCompared = true;

		if (typeof isStateLoaded !== "undefined" && isStateLoaded)
			saveStateToServer();
	}

		const mockRows = [
			{ phach: pk.phach, oldPt: pk.oldPt, isTarget: true },
			{
				phach: "PH" + (parseInt(pk.phach.replace("PH", "")) - 1),

	window.filterGiaoNhanList = function () {
		const searchVal = document
			.getElementById("gn-filter-search")
			.value.toLowerCase()
			.trim();
		const subjectVal = document.getElementById("gn-filter-subject").value;
		const loai = document.getElementById("select-pbg-loai").value;

		let source = [];
		if (loai === "1") {
			source = phongThiGocData.filter((p) => p.status === "Chưa nhận bài");
		} else if (loai === "2") {
			source = tuiPhachData;
		} else if (loai === "7") {
			source = phucKhaoData;
		}

		giaoNhanFilteredItems = source.filter((item) => {
			const sName = (item.subjectName || "").split(" (")[0];
			const matchesSearch =
				!searchVal ||
				(item.id || "").toLowerCase().includes(searchVal) ||
				(item.subjectName || "").toLowerCase().includes(searchVal) ||
				(item.phach || "").toLowerCase().includes(searchVal);
			const matchesSubject = !subjectVal || sName === subjectVal;
			return matchesSearch && matchesSubject;
		});

		giaoNhanCurrentPage = 1;
		renderGiaoNhanPage();
	};

					? "bg-blue-50/50 border-blue-500 ring-1 ring-blue-500/20"

	// ==========================================================
	// TOAST NOTIFICATION SYSTEM
	// ==========================================================
	function showGlobalToast(title, msg, type = "success") {
		const toast = document.getElementById("toast-global");
		const icon = document.getElementById("toast-global-icon");

		toast.className =
			"hidden-view fixed bottom-6 right-6 text-white px-6 py-4 rounded shadow-xl flex items-center gap-3 animate-fade-in-up z-[200]";

		if (type === "error") {
			toast.classList.add("bg-red-600");
			icon.setAttribute("data-lucide", "alert-circle");
		} else if (type === "warning") {
			toast.classList.add("bg-yellow-500");
			icon.setAttribute("data-lucide", "alert-triangle");
		} else {
			toast.classList.add("bg-green-600");
			icon.setAttribute("data-lucide", "check-circle-2");
		}

		document.getElementById("toast-global-title").innerText = title;
		document.getElementById("toast-global-msg").innerText = msg || "";
		toast.classList.remove("hidden-view");
		initIcons();

		setTimeout(() => toast.classList.add("hidden-view"), 4000);
		if (activeViewId === "view-home") renderDashboard();
	}

	let activeEmergencyGvCode = null;
	let activeEmergencyShiftIndex = null;

	function showCbctEmergencyModal(gvCode, shiftIndex) {
		activeEmergencyGvCode = gvCode;
		activeEmergencyShiftIndex = shiftIndex;

		const gv = canBoCoiThiData.find((x) => x.code === gvCode);
		if (!gv || !gv.history[shiftIndex]) return;

		const h = gv.history[shiftIndex];

		document.getElementById("emergency-old-gv").value =
			`${gv.name} (${gv.code}) - ${h.room}`;
		document.getElementById("emergency-new-code").value = "";
		document.getElementById("emergency-new-name").value = "";
		document.getElementById("emergency-reason").value = "";

		document
			.getElementById("modal-cbct-emergency")
			.classList.remove("hidden-view");
		if (typeof initIcons !== "undefined") initIcons();
	}

			.getElementById("modal-cbct-emergency")
			.classList.add("hidden-view");
	}

	function autocompleteEmergencyGvName() {
		const code = document
			.getElementById("emergency-new-code")
			.value.trim()
			.toUpperCase();
		if (code === activeEmergencyGvCode) {
			document.getElementById("emergency-new-name").value =
				"Trùng với giám thị hiện tại!";
			return;
		}
		const gv = canBoCoiThiData.find((x) => x.code === code);
		if (gv) {
			document.getElementById("emergency-new-name").value = gv.name;
		} else {
			document.getElementById("emergency-new-name").value = "";
		}
	}

	function confirmCbctEmergencyExecute() {
		const newCode = document
			.getElementById("emergency-new-code")
			.value.trim()
			.toUpperCase();
		const newName = document.getElementById("emergency-new-name").value.trim();
		const reason = document.getElementById("emergency-reason").value.trim();

		if (newCode === "" || newName === "" || reason === "") {
			showGlobalToast(
				"Lỗi nhập liệu",
				"Vui lòng điền đầy đủ thông tin giảng viên thay thế và lý do!",
				"error",
			);
			return;
		}

		const oldGv = canBoCoiThiData.find((x) => x.code === activeEmergencyGvCode);
		if (
			!oldGv ||
			activeEmergencyShiftIndex === null ||
			!oldGv.history[activeEmergencyShiftIndex]
		)
			return;

		const targetShift = oldGv.history[activeEmergencyShiftIndex];

		// Xóa ca thi khỏi giảng viên cũ
		oldGv.history.splice(activeEmergencyShiftIndex, 1);

		// Thêm ca thi sang giảng viên mới
		let newGv = canBoCoiThiData.find((x) => x.code === newCode);
		if (!newGv) {
			newGv = {
				code: newCode,
				name: newName,
				donVi: "Giảng viên thỉnh giảng / Ngoại viện",
				pricePerHour: 100000,
				history: [],
			};
			canBoCoiThiData.push(newGv);
		}
		targetShift.confirmed = false; // Reset trạng thái xác nhận khi thay thế giám thị
		newGv.history.unshift(targetShift);

		hideCbctEmergencyModal();
		showGlobalToast(
			"Thành công",
			`Đã điều động cán bộ khẩn cấp ${newName} thay thế cho ca trực.`,
		);
		renderCbctPhanCong();
	}

	function handleSaveRuleDonGia() {
		const editId = document.getElementById("rule-edit-id").value;
		const namHoc = document.getElementById("rule-nam-hoc").value;
		const kyThi = document.getElementById("rule-ky-thi").value;
		const donGia = parseInt(document.getElementById("rule-don-gia").value);
		const heSo = parseFloat(document.getElementById("rule-he-so").value) || 1.0;
		const moTa = document.getElementById("rule-mo-ta").value.trim();

		if (!donGia || donGia <= 0) {
			showGlobalToast(
				"Lỗi nhập liệu",
				"Vui lòng nhập đơn giá giờ coi thi hợp lệ!",
				"error",
			);
			return;
		}

		if (editId) {
			const rule = donGiaRulesData.find((r) => r.id === editId);
			if (rule) {
				rule.namHoc = namHoc;
				rule.kyThi = kyThi;
				rule.donGia = donGia;
				rule.heSo = heSo;
				rule.moTa = moTa;
				showGlobalToast(
					"Thành công",
					`Đã cập nhật quy tắc đơn giá năm học ${namHoc}.`,
					"success",
				);
			}
		} else {
			const newId = "RULE-" + Date.now().toString().slice(-4);
			donGiaRulesData.unshift({
				id: newId,
				namHoc: namHoc,
				kyThi: kyThi,
				donGia: donGia,
				heSo: heSo,
				moTa: moTa || `Đơn giá thù lao năm học ${namHoc}`,
				trangThai: "Kích hoạt",
			});
			showGlobalToast(
				"Thành công",
				`Đã thêm quy tắc đơn giá mới cho năm học ${namHoc}.`,
				"success",
			);
		}

		resetRuleForm();
		renderRuleDonGiaList();
		filterGioCoiData();
		if (typeof isStateLoaded !== "undefined" && isStateLoaded)
			saveStateToServer();
	}

		document.getElementById("rule-ky-thi").value = rule.kyThi;

	function deleteRuleDonGia(id) {
		if (!confirm(`Bạn có chắc chắn muốn xóa quy tắc đơn giá này không?`))
			return;
		donGiaRulesData = donGiaRulesData.filter((r) => r.id !== id);
		renderRuleDonGiaList();
		filterGioCoiData();
		showGlobalToast("Thành công", "Đã xóa quy tắc đơn giá.", "success");
	}

	function getAppliedDonGiaRule(selectedHocKy, selectedKyThi) {
		let yearMatch = (selectedHocKy || "").match(/\d{4}-\d{4}/);
		let targetYear = yearMatch ? yearMatch[0] : "2025-2026";

		let rule = donGiaRulesData.find(
			(r) => r.trangThai === "Kích hoạt" && r.namHoc === targetYear,
		);
		if (!rule) {
			rule = donGiaRulesData.find((r) => r.trangThai === "Kích hoạt") || {
				namHoc: targetYear,
				kyThi: "Mặc định",
				donGia: 100000,
				heSo: 1.0,
				moTa: "Đơn giá tiêu chuẩn mặc định",
			};
		}
		return rule;
	}

	function filterGioCoiData() {
		const donVi = document.getElementById("gc-filter-donvi")
			? document.getElementById("gc-filter-donvi").value
			: "";
		const search = document.getElementById("gc-search-gv")
			? document.getElementById("gc-search-gv").value.trim().toLowerCase()
			: "";
		const hocKyVal = document.getElementById("gc-filter-hocky")
			? document.getElementById("gc-filter-hocky").value
			: "";
		const kyThiVal = document.getElementById("gc-filter-kythi")
			? document.getElementById("gc-filter-kythi").value
			: "";

		// Tự động tra cứu Rule Đơn giá đang áp dụng theo năm học/kỳ thi
		const appliedRule = getAppliedDonGiaRule(hocKyVal, kyThiVal);
		const effectivePrice = Math.round(
			appliedRule.donGia * (appliedRule.heSo || 1.0),
		);

		// Cập nhật Banner hiển thị Rule đang áp dụng
		const ruleNameEl = document.getElementById("gc-rule-name-active");
		const rulePriceEl = document.getElementById("gc-rule-price-active");
		if (ruleNameEl)
			ruleNameEl.textContent = `${appliedRule.moTa || "Năm học " + appliedRule.namHoc}`;
		if (rulePriceEl)
			rulePriceEl.textContent = `${effectivePrice.toLocaleString()} VND / giờ ${appliedRule.heSo > 1 ? "(Hệ số " + appliedRule.heSo + ")" : ""}`;

		const tbody = document.getElementById("gc-table-tbody");
		if (!tbody) return;
		tbody.innerHTML = "";

		let filtered = canBoCoiThiData.filter((gv) => {
			const matchDonVi = donVi === "" || gv.donVi === donVi;
			const matchSearch =
				gv.name.toLowerCase().includes(search) ||
				gv.code.toLowerCase().includes(search);
			return matchDonVi && matchSearch;
		});

		let grandTotalGV = filtered.length;
		let grandTotalCa = 0;
		let grandTotalGio = 0;
		let grandTotalMoney = 0;
		let hasUnconfirmed = false;

		filtered.forEach((gv) => {
			gv.history.forEach((h) => {
				if (!h.confirmed) hasUnconfirmed = true;
			});
		});

		const warningEl = document.getElementById("gc-warning-unconfirmed");
		const btnExcel = document.getElementById("btn-export-excel");
		const btnPdf = document.getElementById("btn-export-pdf");

		if (warningEl && btnExcel && btnPdf) {
			if (hasUnconfirmed) {
				warningEl.classList.remove("hidden-view");
				btnExcel.className =
					"bg-gray-400 text-white font-bold px-3 py-1.5 rounded text-xs cursor-not-allowed flex items-center gap-1.5 font-sans shadow-none";
				btnPdf.className =
					"bg-gray-400 text-white font-bold px-3 py-1.5 rounded text-xs cursor-not-allowed flex items-center gap-1.5 font-sans shadow-none";
			} else {
				warningEl.classList.add("hidden-view");
				btnExcel.className =
					"bg-green-600 text-white font-bold px-3 py-1.5 rounded text-xs shadow hover:bg-green-700 transition flex items-center gap-1.5 font-sans";
				btnPdf.className =
					"bg-[#9e1c22] text-white font-bold px-3 py-1.5 rounded text-xs shadow hover:bg-red-800 transition flex items-center gap-1.5 font-sans";
			}
		}

		if (filtered.length === 0) {
			tbody.innerHTML = `<tr><td colspan="9" class="px-6 py-12 text-center text-gray-400 italic">Không tìm thấy cán bộ coi thi nào thỏa mãn bộ lọc.</td></tr>`;
		} else {
			filtered.forEach((gv) => {
				const confirmedShifts = gv.history.filter((h) => h.confirmed);
				const totalCa = gv.history.length;
				const totalGio = confirmedShifts.reduce((sum, h) => sum + h.hours, 0);
				const totalMoney = totalGio * effectivePrice;

				grandTotalCa += totalCa;
				grandTotalGio += totalGio;
				grandTotalMoney += totalMoney;

				tbody.innerHTML += `
                    <tr class="hover:bg-blue-50/50 transition-colors cursor-pointer" onclick="showGioCoiDetails('${gv.code}')" title="Nhấn vào dòng này để xem chi tiết giờ coi thi">
                        <td class="select-col-cbct-tong-hop ${selectModesState["cbct-tong-hop"] > 0 ? "" : "hidden"} px-3 py-4 text-center whitespace-nowrap" onclick="event.stopPropagation();">
                            ${renderSelectCheckbox("cbct-tong-hop")}
                        </td>
                        <td class="px-6 py-4 font-mono font-bold text-gray-800 whitespace-nowrap">${gv.code}</td>
                        <td class="px-6 py-4 font-semibold text-gray-900 whitespace-nowrap">${gv.name}</td>
                        <td class="px-6 py-4 text-gray-600 whitespace-nowrap">${gv.donVi}</td>
                        <td class="px-6 py-4 text-center font-bold text-indigo-700 whitespace-nowrap">${totalCa} ca</td>
                        <td class="px-6 py-4 text-center font-bold text-blue-900 whitespace-nowrap">${totalGio} giờ</td>
                        <td class="px-6 py-4 text-right text-gray-600 font-mono whitespace-nowrap">${effectivePrice.toLocaleString()} VND</td>
                        <td class="px-6 py-4 text-right font-bold text-red-700 font-mono whitespace-nowrap">${totalMoney.toLocaleString()} VND</td>
                        <td class="px-6 py-4 text-center whitespace-nowrap" onclick="event.stopPropagation()">
                            <button onclick="showGioCoiDetails('${gv.code}')" class="bg-blue-100 hover:bg-blue-200 text-blue-700 px-3 py-1 rounded font-bold text-[10px] transition-colors uppercase">Chi tiết</button>
                        </td>
                    </tr>
                `;
			});
		}

		const totalGvEl = document.getElementById("gc-stat-total-gv");
		const totalCaEl = document.getElementById("gc-stat-total-ca");
		const totalGioEl = document.getElementById("gc-stat-total-gio");
		const totalMoneyEl = document.getElementById("gc-stat-total-money");

		if (totalGvEl) totalGvEl.innerText = `${grandTotalGV} người`;
		if (totalCaEl) totalCaEl.innerText = `${grandTotalCa} ca`;
		if (totalGioEl) totalGioEl.innerText = `${grandTotalGio} giờ`;
		if (totalMoneyEl)
			totalMoneyEl.innerText = `${grandTotalMoney.toLocaleString()} VND`;
		if (typeof isStateLoaded !== "undefined" && isStateLoaded)
			saveStateToServer();
	}

	function switchTabPhongThi(tab) {
		const tabDs = document.getElementById("phong-thi-danh-sach-tab");
		const tabPc = document.getElementById("phong-thi-phan-cong-tab");
		if (tabDs) tabDs.classList.add("hidden-view");
		if (tabPc) tabPc.classList.add("hidden-view");

		const btnDs = document.getElementById("btn-pt-tab-ds");
		const btnPc = document.getElementById("btn-pt-tab-pc");
		if (btnDs && btnPc) {
			btnDs.className =
				"px-4 py-2 rounded-md font-bold text-xs transition flex items-center gap-2 text-gray-600 hover:bg-gray-200 shadow-none";
			btnPc.className =
				"px-4 py-2 rounded-md font-bold text-xs transition flex items-center gap-2 text-gray-600 hover:bg-gray-200 shadow-none";
		}

		if (tab === "danh-sach") {
			if (tabDs) tabDs.classList.remove("hidden-view");
			if (btnDs)
				btnDs.className =
					"px-4 py-2 rounded-md font-bold text-xs transition flex items-center gap-2 bg-blue-100 text-blue-800 shadow-xs";
			renderPhongThiTable();
		} else {
			if (tabPc) tabPc.classList.remove("hidden-view");
			if (btnPc)
				btnPc.className =
					"px-4 py-2 rounded-md font-bold text-xs transition flex items-center gap-2 bg-blue-100 text-blue-800 shadow-xs";
			renderPCLichThi();
			renderPhanCongTable();
		}
		if (typeof initIcons !== "undefined") initIcons();
	}

	function renderPhongThiTable() {
		const tbody = document.getElementById("phong-thi-tbody");
		if (!tbody) return;
		const search = (document.getElementById("pt-search")?.value || "")
			.toLowerCase()
			.trim();

		const filtered = phongThiData.filter((pt) => {
			const ten = (pt.ten || pt.name || "").toLowerCase();
			const ma = (pt.ma || pt.id || "").toLowerCase();
			return ten.includes(search) || ma.includes(search);
		});

		tbody.innerHTML =
			filtered
				.map((pt, i) => {
					const roomCode = pt.ma || pt.id || `P${101 + i}`;
					const roomName = pt.ten || pt.name || roomCode;
					const cap = pt.sucChua || pt.capacity || 40;
					const loc = pt.viTri || pt.location || "Toà nhà A";
					const st = pt.trangThai || pt.status || "Khả dụng";
					const isAvailable =
						st === "Khả dụng" || st === "KhaDung" || st === "Available";

					return `
                <tr class="bg-white border-b border-gray-100 hover:bg-gray-50 transition-colors cursor-pointer" onclick="showPhongThiDetailModal('${roomCode}')">
                    <td class="select-col-phong-thi ${selectModesState["phong-thi"] > 0 ? "" : "hidden"} px-3 py-3 text-center" onclick="event.stopPropagation();">
                        ${renderSelectCheckbox("phong-thi", "", roomCode)}
                    </td>
                    <td class="px-4 py-3 font-bold font-mono text-gray-800">${roomCode}</td>
                    <td class="px-4 py-3 font-bold text-blue-900">${roomName}</td>
                    <td class="px-4 py-3 text-center font-bold text-gray-800">${cap}</td>
                    <td class="px-4 py-3 text-gray-700">${loc}</td>
                    <td class="px-4 py-3">
                        <span class="px-2.5 py-1 rounded-full text-[10px] font-bold ${isAvailable ? "bg-green-100 text-green-700" : "bg-amber-100 text-amber-700"}">${isAvailable ? "Khả dụng" : st}</span>
                    </td>
                    <td class="px-4 py-3 text-center" onclick="event.stopPropagation();">
                        <div class="flex items-center justify-center gap-2">
                            <button class="text-blue-600 hover:text-blue-800 p-1.5 rounded hover:bg-blue-50 transition-colors" title="Sửa thông tin phòng thi" onclick="showPhongThiEditModal('${roomCode}')">
                                <i data-lucide="edit-2" class="w-4 h-4 pointer-events-none"></i>
                            </button>
                            <button class="text-rose-600 hover:text-rose-800 p-1.5 rounded hover:bg-rose-50 transition-colors" title="Xóa phòng thi" onclick="handleDeletePhongThi('${roomCode}')">
                                <i data-lucide="trash-2" class="w-4 h-4 pointer-events-none"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `;
				})
				.join("") ||
			`<tr><td colspan="7" class="text-center py-6 text-gray-500 text-xs italic">Không tìm thấy phòng thi nào.</td></tr>`;
		if (typeof initIcons !== "undefined") initIcons();
	}

	function showPhongThiDetailModal(code) {
		const pt = phongThiData.find(
			(p) =>
				p.ma === code || p.id === code || p.name === code || p.ten === code,

		const roomCode = pt ? pt.ma || pt.id || code : code;
		const roomName = pt ? pt.ten || pt.name || code : code;
		const cap = pt ? pt.sucChua || pt.capacity || 40 : 40;
		const loc = pt ? pt.viTri || pt.location || "Toà nhà A" : "Toà nhà A";
		const type = pt ? pt.loai || "Phòng thường" : "Phòng thường";
		const st = pt ? pt.trangThai || pt.status || "Khả dụng" : "Khả dụng";
