<script>
    // ==========================================================
    // KHỞI TẠO VÀ ĐIỀU HƯỚNG
    // ==========================================================
    let activeViewId = "view-home";

    window.onload = async function() {
        initIcons();
        const savedViewId = sessionStorage.getItem('tkt_activeViewId');
        await navigate(savedViewId || 'view-home');
    };

    function initIcons() {
        lucide.createIcons();
    }

    async function navigate(viewId) {
        document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden-view'));
        const targetView = document.getElementById(viewId);
        if (targetView) targetView.classList.remove('hidden-view');
        sessionStorage.setItem('tkt_activeViewId', viewId);

        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.classList.remove('bg-[#801418]', 'border-[#005691]', 'font-bold');
            btn.classList.add('border-transparent');
        });
        closeAllDropdowns();

        activeViewId = viewId;
        let activeBtnId = 'nav-btn-home';
        if (viewId === 'view-ky-thi') activeBtnId = 'nav-btn-ky-thi';
        else if (viewId === 'view-danh-sach-lich') activeBtnId = 'nav-btn-danh-sach-lich';
        else if (viewId === 'view-nhap-diem') activeBtnId = 'nav-btn-nhap-diem';
        else if (viewId === 'view-phuc-khao') activeBtnId = 'nav-btn-phuc-khao';
        else if (viewId.includes('giao-nhan') || viewId.includes('nhan-bai') || viewId.includes('ban-giao-bai')) activeBtnId = 'nav-btn-giao-nhan';
        else if (viewId === 'view-gio-coi') activeBtnId = 'nav-btn-gio-coi';

        const activeBtn = document.getElementById(activeBtnId);
        if (activeBtn) {
            activeBtn.classList.remove('border-transparent');
            activeBtn.classList.add('bg-[#801418]', 'border-[#005691]', 'font-bold');
        }

        // Thay vì render từ state ảo, gọi hàm fetch dữ liệu tương ứng
        if (viewId === 'view-home') await fetchAndRenderDashboard();
        else if (viewId === 'view-ky-thi') await fetchAndRenderKyThi();
        else if (viewId === 'view-danh-sach-lich') await fetchAndRenderLichThi();
        else if (viewId === 'view-nhap-diem') resetViewNhapDiem(); // Nhập điểm có logic riêng
        else if (viewId === 'view-phuc-khao') await fetchAndRenderPhucKhao();
        else if (viewId.includes('giao-nhan') || viewId.includes('nhan-bai') || viewId.includes('ban-giao-bai')) await fetchAndRenderGiaoNhan();
        else if (viewId === 'view-gio-coi') await fetchAndRenderGioCoi();

        initIcons();
    }

    function navigateGiaoNhan(tab) {
        closeAllDropdowns();
        if (tab === 'tao') {
            navigate('view-ban-giao-bai');
        } else {
            navigate('view-nhan-bai');
        }
    }
    window.navigateGiaoNhan = navigateGiaoNhan;

    function switchGiaoNhanTab(tabId) {
        ['tao', 'nhan', 'lich-su'].forEach(t => {
            const content = document.getElementById(`tab-content-${t}`);
            const btn = document.getElementById(`tab-btn-${t}`);
            if (content) content.classList.add('hidden-view');
            if (btn) btn.classList.remove('bg-gray-200', 'text-[#9e1c22]', 'shadow-inner');
        });
        const activeContent = document.getElementById(`tab-content-${tabId}`);
        const activeBtn = document.getElementById(`tab-btn-${tabId}`);
        if (activeContent) activeContent.classList.remove('hidden-view');
        if (activeBtn) activeBtn.classList.add('bg-gray-200', 'text-[#9e1c22]', 'shadow-inner');
    }
    window.switchGiaoNhanTab = switchGiaoNhanTab;

    function navigateGioCoi(tab) {
        closeAllDropdowns();
        navigate('view-gio-coi');
        const tabPhanCong = document.getElementById('tab-content-cbct-phan-cong');
        const tabTongHop = document.getElementById('tab-content-cbct-tong-hop');
        if (tab === 'tong-hop') {
            if (tabPhanCong) tabPhanCong.classList.add('hidden-view');
            if (tabTongHop) tabTongHop.classList.remove('hidden-view');
        } else {
            if (tabPhanCong) tabPhanCong.classList.remove('hidden-view');
            if (tabTongHop) tabTongHop.classList.add('hidden-view');
        }
    }
    window.navigateGioCoi = navigateGioCoi;

    function toggleDropdown(dropdownId, event) {
        event.stopPropagation();
        const dropdown = document.getElementById(dropdownId);
        const isOpen = !dropdown.classList.contains('hidden-view');
        closeAllDropdowns();
        if (!isOpen) {
            dropdown.classList.remove('hidden-view');
        }
    }
    window.toggleDropdown = toggleDropdown;

    function toggleDropdownFixed(dropdownId, event) {
        event.stopPropagation();
        const dropdown = document.getElementById(dropdownId);
        const isOpen = !dropdown.classList.contains('hidden-view');
        
        // Hide all fixed dropdowns
        document.querySelectorAll('div[id^="dropdown-"]').forEach(el => {
            el.classList.add('hidden-view');
        });
        
        if (!isOpen) {
            dropdown.classList.remove('hidden-view');
            const rect = event.currentTarget.getBoundingClientRect();
            dropdown.style.top = rect.bottom + 'px';
            
            // Prevent going off screen to the right
            const dropdownWidth = dropdown.offsetWidth || 200;
            if (rect.left + dropdownWidth > window.innerWidth) {
                dropdown.style.left = (window.innerWidth - dropdownWidth - 10) + 'px';
            } else {
                dropdown.style.left = rect.left + 'px';
            }
        }
    }
    window.toggleDropdownFixed = toggleDropdownFixed;

    function closeAllDropdowns() {
        document.querySelectorAll('.dropdown-menu').forEach(el => el.classList.add('hidden-view'));
        document.querySelectorAll('div[id^="dropdown-"]').forEach(el => el.classList.add('hidden-view'));
    }
    document.addEventListener('click', closeAllDropdowns);
    
    // Đóng dropdown khi scroll taskbar
    document.getElementById('tkt-nav-scroller')?.addEventListener('scroll', closeAllDropdowns);

    // ==========================================================
    // FETCH VÀ RENDER CHO TỪNG VIEW
    // ==========================================================

    async function fetchData(url) {
        try {
            const response = await fetch(url);
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            return await response.json();
        } catch (error) {
            console.error(`Lỗi khi fetch dữ liệu từ ${url}:`, error);
            showGlobalToast('Lỗi Mạng', `Không thể tải dữ liệu từ server. Vui lòng kiểm tra kết nối.`, 'error');
            return null;
        }
    }

    async function fetchAndRenderDashboard() {
        // Dashboard có thể tổng hợp từ nhiều API hoặc có API riêng
        // Tạm thời để trống, sẽ bổ sung sau nếu cần
        const tbody = document.getElementById('dash-ky-thi-tbody');
        if(tbody) tbody.innerHTML = `<tr><td colspan="4" class="text-center p-4">Đang tải...</td></tr>`;
        const kyThiData = await fetchData('/tkt/api/ky-thi/');
        if (kyThiData) {
            renderDashboard(kyThiData);
        }
    }

    async function fetchAndRenderKyThi() {
        const kyThiData = await fetchData('/tkt/api/ky-thi/');
        const caThiData = await fetchData('/tkt/api/ca-thi/');
        if (kyThiData && caThiData) {
            renderKyThiView(kyThiData, caThiData);
        }
    }

    async function fetchAndRenderLichThi() {
        // Cần API cho Lịch thi
    }

    async function fetchAndRenderPhucKhao() {
        const phucKhaoData = await fetchData('/tkt/api/don-phuc-khao/');
        if (phucKhaoData) {
            renderPhucKhaoList(phucKhaoData);
        }
    }

    async function fetchAndRenderGiaoNhan() {
        const data = await fetchData('/tkt/api/giao-nhan-data/');
        if (data) {
            renderGiaoNhanView(data);
        }
    }

    async function fetchAndRenderGioCoi() {
        const data = await fetchData('/tkt/api/can-bo-coi-thi/');
        if (data) {
            renderGioCoiView(data);
        }
    }

    // ==========================================================
    // CÁC HÀM RENDER GIAO DIỆN
    // ==========================================================

    function renderDashboard(kyThiData) {
        const tbody = document.getElementById('dash-ky-thi-tbody');
        tbody.innerHTML = '';
        if (!kyThiData || kyThiData.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" class="text-center p-4 text-gray-500">Chưa có kỳ thi nào.</td></tr>`;
            return;
        }
        kyThiData.forEach(kt => {
            tbody.innerHTML += `
                <tr class="hover:bg-gray-50">
                    <td class="px-4 py-2.5 font-semibold text-[#9e1c22]">${kt.ten_ky_thi}</td>
                    <td class="px-4 py-2.5 text-gray-700">${kt.nam_hoc}</td>
                    <td class="px-4 py-2.5 text-center font-medium">${kt.hoc_ky}</td>
                    <td class="px-4 py-2.5 text-center font-bold">${kt.ca_thi_count || 0} ca thi</td>
                </tr>
            `;
        });
    }

    function renderKyThiView(kyThiData, caThiData) {
        // Populate select options
        const select = document.getElementById('ct-kythi-select');
        select.innerHTML = '';
        kyThiData.forEach(kt => {
            select.innerHTML += `<option value="${kt.ma_ky_thi}">${kt.ten_ky_thi}</option>`;
        });

        // Render list
        const div = document.getElementById('ca-thi-list-div');
        div.innerHTML = '';
        if (caThiData.length === 0) {
            div.innerHTML = `<div class="text-center text-gray-400 py-6 italic">Chưa có ca thi nào.</div>`;
            return;
        }
        caThiData.forEach(c => {
            const kt = kyThiData.find(x => x.ma_ky_thi === c.ky_thi);
            div.innerHTML += `
                <div class="border border-gray-200 rounded p-3 text-xs bg-gray-50 flex justify-between items-center shadow-sm">
                    <div>
                        <p class="font-bold text-blue-900">${c.ten_ca} - Ngày thi: ${c.ngay_thi}</p>
                        <p class="text-gray-500 mt-1 font-semibold">Khung giờ: ${c.gio_bat_dau} - ${c.gio_ket_thuc}</p>
                        <p class="text-gray-400 mt-0.5">${kt ? kt.ten_ky_thi : ''} (${c.note || 'Không ghi chú'})</p>
                    </div>
                    <span class="bg-blue-100 text-blue-800 px-2 py-0.5 rounded font-bold">Hoạt động</span>
                </div>
            `;
        });
    }

    let allLichThiBanGiao = [];
    let filteredLichThiBanGiao = [];
    let currentGnPage = 1;
    const gnItemsPerPage = 6; // Display exactly 6 cards (3 rows x 2 cols) to keep column height compact!
    const selectedGiaoNhanLichIds = new Set();
    let allLichSuPhieu = [];

    function renderGiaoNhanView(data) {
        if (data) {
            if (data.lich_thi_ban_giao) allLichThiBanGiao = data.lich_thi_ban_giao;
            if (data.phieu_cho_xac_nhan) allPhieuChoXacNhan = data.phieu_cho_xac_nhan;
            if (data.lich_su_phieu) allLichSuPhieu = data.lich_su_phieu;
        }
        const phieu_cho_xac_nhan = allPhieuChoXacNhan || [];
        const lich_su_phieu = allLichSuPhieu || [];

        // Populate Subject Filter Dropdown
        const subjSelect = document.getElementById('gn-filter-subject');
        if (subjSelect) {
            const currentSubj = subjSelect.value;
            subjSelect.innerHTML = '<option value="">Tất cả Học phần</option>';
            const subjectMap = new Map();
            allLichThiBanGiao.forEach(x => {
                const name = x.ten_hoc_phan || '';
                const code = x.lop_hp || '';
                const key = name || code;
                const label = name ? (code.includes(name) ? code : `${name} (${code})`) : code;
                if (key && !subjectMap.has(key)) {
                    subjectMap.set(key, label);
                }
            });
            subjectMap.forEach((label, key) => {
                subjSelect.innerHTML += `<option value="${key}">${label}</option>`;
            });
            if (currentSubj) subjSelect.value = currentSubj;
        }

        filterGiaoNhanList();

        // Tab: Phiếu chờ nhận
        const listNhanDiv = document.getElementById('gn-list-cho-nhan');
        const badge = document.getElementById('badge-cho-nhan');
        if (listNhanDiv) {
            listNhanDiv.innerHTML = '';
            if (!phieu_cho_xac_nhan || phieu_cho_xac_nhan.length === 0) {
                listNhanDiv.innerHTML = `<div class="text-center text-gray-400 py-12 italic text-sm">Không có phiếu nào đang chờ bạn.</div>`;
                if (badge) badge.classList.add('hidden-view');
            } else {
                if (badge) {
                    badge.classList.remove('hidden-view');
                    badge.innerText = phieu_cho_xac_nhan.length;
                }
                phieu_cho_xac_nhan.forEach(p => {
                    listNhanDiv.innerHTML += `
                        <div class="border border-green-200 bg-green-50/50 rounded-xl p-5 flex justify-between items-center hover:shadow-md hover:bg-green-50 transition-all cursor-pointer mb-3" onclick="showGnDetailNhan('${p.ma_phieu}')">
                            <div class="flex gap-4 items-center">
                                <div class="bg-white p-3 rounded-xl text-green-600 shadow-sm border border-green-100"><i data-lucide="file-text" class="w-6 h-6"></i></div>
                                <div>
                                    <div class="flex items-center gap-2">
                                        <span class="font-mono font-bold text-gray-900 text-base">${p.ma_phieu}</span>
                                    </div>
                                    <p class="text-xs text-gray-500 mt-1 flex items-center gap-1"><i data-lucide="arrow-right-left" class="w-3.5 h-3.5"></i> Tuyến: <strong>${p.nguoi_giao?.full_name || 'Bên giao'} ➔ ${p.nguoi_nhan?.full_name || 'Bên nhận'}</strong></p>
                                </div>
                            </div>
                            <button class="bg-green-600 hover:bg-green-700 text-white px-5 py-2.5 rounded-lg font-bold text-xs shadow-sm">KIỂM ĐẾM</button>
                        </div>
                    `;
                });
            }
        }

        // Tab: Lịch sử (Phục vụ cả view Giao và view Nhận)
        const histTbodies = [
            document.getElementById('gn-lich-su-giao-tbody'),
            document.getElementById('gn-lich-su-nhan-tbody'),
            document.getElementById('gn-lich-su-tbody')
        ].filter(Boolean);

        histTbodies.forEach(histTbody => {
            histTbody.innerHTML = '';
            if (!lich_su_phieu || lich_su_phieu.length === 0) {
                histTbody.innerHTML = `<tr><td colspan="5" class="text-center p-4 text-gray-500">Chưa có lịch sử giao nhận.</td></tr>`;
            } else {
                lich_su_phieu.forEach(p => {
                    let stBadge = `<span class="bg-yellow-100 text-yellow-800 px-2 py-0.5 rounded text-xs font-bold">${p.trang_thai}</span>`;
                    if (p.trang_thai === "Đã hoàn tất") stBadge = `<span class="bg-green-100 text-green-800 px-2 py-0.5 rounded text-xs font-bold">✓ ${p.trang_thai}</span>`;

                    let totalItems = (p.chi_tiet || []).length;
                    let qtyDisplay = totalItems;

                    histTbody.innerHTML += `
                        <tr class="hover:bg-gray-50 text-xs">
                            <td class="px-4 py-2.5 font-mono font-bold text-blue-600">${p.ma_phieu}</td>
                            <td class="px-4 py-2.5 text-gray-700 font-semibold">${p.loai_phieu || 'Bàn giao bài thi'}</td>
                            <td class="px-4 py-2.5 text-gray-700">${p.nguoi_giao?.full_name || 'Tổ Khảo thí'} ➔ ${p.nguoi_nhan?.full_name || 'Thư ký'}</td>
                            <td class="px-4 py-2.5 text-center font-bold text-slate-800">${qtyDisplay}</td>
                            <td class="px-4 py-2.5 text-center">${stBadge}</td>
                        </tr>
                    `;
                });
            }
        });
        initIcons();
    }

    function filterGiaoNhanList() {
        const searchKw = (document.getElementById('gn-filter-search')?.value || '').toLowerCase().trim();
        const subjVal = (document.getElementById('gn-filter-subject')?.value || '').toLowerCase().trim();

        filteredLichThiBanGiao = allLichThiBanGiao.filter(lt => {
            const mCode = (lt.ma_lich_thi || '').toLowerCase().includes(searchKw) || (lt.lop_hp || '').toLowerCase().includes(searchKw);
            const mSubj = !subjVal || (lt.ten_hoc_phan || lt.lop_hp || '').toLowerCase().includes(subjVal);
            return mCode && mSubj;
        });

        currentGnPage = 1;
        renderGiaoNhanCards();
    }
    window.filterGiaoNhanList = filterGiaoNhanList;

    function renderGiaoNhanCards() {
        const listDiv = document.getElementById('gn-list-phong-goc');
        if (!listDiv) return;
        listDiv.innerHTML = '';

        if (filteredLichThiBanGiao.length === 0) {
            listDiv.innerHTML = `<div class="col-span-full text-xs text-gray-400 italic text-center py-8">Không có phòng thi nào phù hợp.</div>`;
            updateGnPagination(0, 0);
            return;
        }

        const totalPages = Math.ceil(filteredLichThiBanGiao.length / gnItemsPerPage);
        if (currentGnPage > totalPages) currentGnPage = totalPages;
        if (currentGnPage < 1) currentGnPage = 1;

        const startIdx = (currentGnPage - 1) * gnItemsPerPage;
        const pageItems = filteredLichThiBanGiao.slice(startIdx, startIdx + gnItemsPerPage);

        pageItems.forEach(lt => {
            const isChecked = selectedGiaoNhanLichIds.has(lt.ma_lich_thi);
            const tenHp = lt.ten_hoc_phan || '';
            const headerTitle = tenHp ? `${lt.ma_lich_thi} - ${tenHp}` : lt.ma_lich_thi;

            listDiv.innerHTML += `
                 <label class="gn-item flex items-start gap-3 p-3 rounded-lg border bg-white border-slate-200 hover:border-blue-400 hover:bg-slate-50/30 cursor-pointer transition-all duration-150 shadow-sm ${isChecked ? 'bg-blue-50/80 border-blue-400 ring-1 ring-blue-400' : ''}">
                    <div class="flex items-center h-5 mt-0.5">
                        <input type="checkbox" value="${lt.ma_lich_thi}" ${isChecked ? 'checked' : ''} onchange="toggleGnItemSelect('${lt.ma_lich_thi}', this.checked)" class="w-3.5 h-3.5 text-blue-600 rounded border-gray-300 focus:ring-blue-500" />
                    </div>
                    <div class="flex-1 min-w-0">
                         <div class="flex flex-col gap-1">
                            <span class="font-extrabold text-slate-800 text-[12.5px] tracking-wide leading-tight line-clamp-1" title="${headerTitle}">${headerTitle}</span>
                            <span class="inline-flex items-center w-fit px-1.5 py-0.5 rounded text-[10px] font-bold font-sans border bg-blue-50 text-blue-700 border-blue-100">${lt.so_luong_sv} bài</span>
                        </div>
                    </div>
                </label>
            `;
        });

        updateGnPagination(currentGnPage, totalPages);
    }

    function toggleGnItemSelect(id, checked) {
        if (checked) selectedGiaoNhanLichIds.add(id);
        else selectedGiaoNhanLichIds.delete(id);
        renderGiaoNhanCards();
    }
    window.toggleGnItemSelect = toggleGnItemSelect;

    function updateGnPagination(page, total) {
        const info = document.getElementById('gn-pagination-info');
        const btnPrev = document.getElementById('gn-btn-prev');
        const btnNext = document.getElementById('gn-btn-next');

        if (info) info.innerText = total > 0 ? `Trang ${page} / ${total}` : `Trang 0 / 0`;
        if (btnPrev) btnPrev.disabled = page <= 1;
        if (btnNext) btnNext.disabled = page >= total || total === 0;
    }

    function changeGiaoNhanPage(delta) {
        currentGnPage += delta;
        renderGiaoNhanCards();
    }
    window.changeGiaoNhanPage = changeGiaoNhanPage;

    let activeNhanPhieuObj = null;

    function showGnDetailNhan(maPhieu, objData) {
        if (!objData && typeof maPhieu === 'string') {
            objData = (allPhieuChoXacNhan || []).find(x => x.ma_phieu === maPhieu) || {};
        } else if (!objData && typeof maPhieu === 'object') {
            objData = maPhieu;
            maPhieu = objData.ma_phieu;
        }
        activeNhanPhieuObj = objData;

        const idElem = document.getElementById('gn-detail-id');
        if (idElem) idElem.innerText = maPhieu || objData?.ma_phieu || 'PBG-2026-001';

        const giaoElem = document.getElementById('gn-detail-[#gn-detail-giao]');
        const giaoTarget = document.getElementById('gn-detail-giao');
        if (giaoTarget) giaoTarget.innerText = objData?.nguoi_giao?.full_name || 'Bên giao';

        const typeElem = document.getElementById('gn-detail-type');
        if (typeElem) typeElem.innerText = objData?.loai_phieu || 'Bàn giao bài thi';

        const pdfLink = document.getElementById('gn-detail-pdf-link');
        if (pdfLink) pdfLink.href = `/export-pdf/?id=${maPhieu}`;

        const attName = document.getElementById('gn-detail-attachment-name');
        if (attName) attName.innerText = 'bien_ban_giao_nhan.pdf';

        const tbody = document.getElementById('gn-detail-table-tbody');
        if (tbody) {
            tbody.innerHTML = '';
            const items = objData?.chi_tiet || [{ tui_phach: 'TP-001', hoc_phan: 'Marketing Căn bản', so_bai: 23 }];
            items.forEach(it => {
                const maTui = it.tui_phach?.ma_tui || it.tui_phach || it.ma_lich_thi || 'TP-001';
                const tenHp = it.tui_phach?.hoc_phan?.ten_hoc_phan || it.hoc_phan || 'Học phần thi';
                const soBai = it.tui_phach?.so_bai || it.so_bai || 25;
                tbody.innerHTML += `
                    <tr>
                        <td class="px-4 py-2 font-mono font-bold text-gray-700">${maTui}</td>
                        <td class="px-4 py-2 text-gray-800 font-semibold">${tenHp}</td>
                        <td class="px-4 py-2 text-center font-bold text-blue-900">${soBai} bài</td>
                    </tr>
                `;
            });
        }

        const modal = document.getElementById('gn-detail-nhan');
        if (modal) modal.classList.remove('hidden-view');
        initIcons();
    }
    window.showGnDetailNhan = showGnDetailNhan;

    function hideGnDetailNhan() {
        const modal = document.getElementById('gn-detail-nhan');
        if (modal) modal.classList.add('hidden-view');
    }
    window.hideGnDetailNhan = hideGnDetailNhan;

    function handleTuChoiNhanPhieuTra() {
        const modal = document.getElementById('tkt-modal-nhap-ly-do-tu-choi');
        if (modal) modal.classList.remove('hidden-view');
    }
    window.handleTuChoiNhanPhieuTra = handleTuChoiNhanPhieuTra;

    function hideTuChoiLyDoModal() {
        const modal = document.getElementById('tkt-modal-nhap-ly-do-tu-choi');
        if (modal) modal.classList.add('hidden-view');
    }
    window.hideTuChoiLyDoModal = hideTuChoiLyDoModal;

    function confirmTuChoiLyDoModal() {
        hideTuChoiLyDoModal();
        hideGnDetailNhan();
        showGlobalToast("Đã từ chối bàn giao", "Hệ thống đã cập nhật trạng thái phiếu và phản hồi về bên giao.");
    }
    window.confirmTuChoiLyDoModal = confirmTuChoiLyDoModal;

    function handleSignedFileSelected(input) {
        const fileSpan = document.getElementById('gn-signed-file-name');
        if (input && input.files && input.files[0]) {
            if (fileSpan) fileSpan.innerText = input.files[0].name + " (" + Math.round(input.files[0].size / 1024) + " KB)";
        } else {
            if (fileSpan) fileSpan.innerText = "Chưa chọn tệp đính kèm nào";
        }
    }
    window.handleSignedFileSelected = handleSignedFileSelected;

    function selectDonPhucKhao(maDon) {
        const p = (allPhucKhaoData || []).find(x => x.ma_don === maDon);
        if (!p) return;

        const emptyView = document.getElementById('pk-empty-view');
        const processView = document.getElementById('pk-process-view');
        if (emptyView) emptyView.classList.add('hidden-view');
        if (processView) processView.classList.remove('hidden-view');

        const svName = formatObjStr(p.sinh_vien, 'Thí sinh');
        const hpName = formatObjStr(p.hoc_phan, 'Học phần');

        const activeMon = document.getElementById('pk-active-mon');
        if (activeMon) activeMon.innerText = `${p.ma_don} - ${svName}`;

        const infoTuiBai = document.getElementById('pk-info-tui-bai');
        if (infoTuiBai) infoTuiBai.innerText = p.lich_thi ? (typeof p.lich_thi === 'object' ? `TB-${p.lich_thi.ma_lich_thi || '2026-001'}` : `TB-${p.lich_thi}`) : `TB-2026-001`;

        let phachCodeStr = 'P-102';
        if (p.ma_phach) {
            if (typeof p.ma_phach === 'object') {
                phachCodeStr = p.ma_phach.ma_phach || p.ma_phach.code || p.ma_phach.id || 'P-102';
            } else {
                phachCodeStr = String(p.ma_phach);
            }
        } else if (p.sbd_ma_phach) {
            phachCodeStr = String(p.sbd_ma_phach);
        }

        // Extract prefix and numeric part from phachCodeStr so all 4 papers in the bag have identical code structure
        let match = phachCodeStr.match(/^([A-Za-z0-9_-]*\D)(\d+)$/);
        let prefix = 'PHTP-';
        let numVal = 1001;
        let padLen = 6;

        if (match) {
            prefix = match[1];
            numVal = parseInt(match[2], 10);
            padLen = match[2].length;
        } else {
            let digitsOnly = phachCodeStr.replace(/\D/g, '');
            if (digitsOnly) {
                numVal = parseInt(digitsOnly, 10);
                padLen = Math.max(digitsOnly.length, 5);
                prefix = phachCodeStr.replace(digitsOnly, '');
                if (!prefix) prefix = 'PHTP-';
            }
        }

        let p2Code = `${prefix}${String(numVal + 1).padStart(padLen, '0')}`;
        let p3Code = `${prefix}${String(numVal + 2).padStart(padLen, '0')}`;
        let p4Code = `${prefix}${String(numVal + 3).padStart(padLen, '0')}`;
        
        let diemGocVal = parseFloat(p.diem_goc) || 4.6;
        let diem2Val = (diemGocVal + 1.75 > 9.5) ? (diemGocVal - 1.25).toFixed(2) : (diemGocVal + 1.75).toFixed(2);
        let diem3Val = (diemGocVal + 2.5 > 9.5) ? (diemGocVal - 2.0).toFixed(2) : (diemGocVal + 2.5).toFixed(2);
        let diem4Val = (diemGocVal + 3.25 > 9.5) ? (diemGocVal - 1.5).toFixed(2) : (diemGocVal + 1.25).toFixed(2);

        const savedScores = p.saved_scores || [];
        const papersBundle = [
            { code: phachCodeStr, diemGoc: p.diem_goc || '4.60', diemMoi: savedScores[0] || p.diem_phuc_khao_cuoi || '', label: 'Bài xin phúc khảo' },
            { code: p2Code, diemGoc: diem2Val, diemMoi: savedScores[1] || '', label: 'Bài rút kèm 1 (Ngụy trang)' },
            { code: p3Code, diemGoc: diem3Val, diemMoi: savedScores[2] || '', label: 'Bài rút kèm 2 (Ngụy trang)' },
            { code: p4Code, diemGoc: diem4Val, diemMoi: savedScores[3] || '', label: 'Bài rút kèm 3 (Ngụy trang)' }
        ];

        const infoTuiPhach = document.getElementById('pk-info-tui-phach');
        if (infoTuiPhach) infoTuiPhach.innerText = `Bộ 4 bài: ${phachCodeStr}, ${p2Code}, ${p3Code}, ${p4Code}`;

        const btnRutBai = document.getElementById('pk-btn-rut-bai');
        const btnLuuDiem = document.getElementById('pk-btn-luu-diem');
        const infoTrangThaiRut = document.getElementById('pk-info-trang-thai-rut');
        const isDaRut = (p.trang_thai === 'Đã rút bài' || p.trang_thai === 'DangXuLy' || p.trang_thai === 'Đang xử lý' || p.trang_thai === 'DaHoanThanh' || p.trang_thai === 'Đã hoàn thành');
        const isCompleted = (p.trang_thai === 'Đã hoàn thành' || p.trang_thai === 'DaHoanThanh');

        if (infoTrangThaiRut) {
            infoTrangThaiRut.innerText = isDaRut ? 'Đã rút bài' : 'Chưa rút bài';
            infoTrangThaiRut.className = isDaRut ? 'font-bold text-green-700' : 'font-bold text-red-700';
        }

        if (btnRutBai) {
            if (isDaRut) {
                btnRutBai.classList.add('hidden');
            } else {
                btnRutBai.classList.remove('hidden');
            }
        }

        const btnInBienBan = document.getElementById('pk-btn-in-bien-ban');
        const completedNotice = document.getElementById('pk-completed-notice');

        if (isCompleted) {
            if (btnInBienBan) btnInBienBan.classList.add('hidden');
            if (btnLuuDiem) btnLuuDiem.classList.add('hidden');
            if (completedNotice) completedNotice.classList.remove('hidden-view');
        } else {
            if (btnInBienBan) btnInBienBan.classList.remove('hidden');
            if (btnLuuDiem) btnLuuDiem.classList.remove('hidden');
            if (completedNotice) completedNotice.classList.add('hidden-view');
        }

        const tbody = document.getElementById('pk-tbody');
        if (tbody) {
            tbody.innerHTML = '';
            papersBundle.forEach((item, idx) => {
                const isReadonlyAttr = isCompleted ? 'disabled readonly' : '';
                const inputStyle = isCompleted ? 'bg-gray-100 text-gray-800 border-gray-300 font-bold cursor-not-allowed' : 'border border-gray-300 font-bold focus:border-blue-600 focus:ring-1 focus:ring-blue-500';
                const displayValue = item.diemMoi || (isCompleted ? item.diemGoc : '');

                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50 border-b border-gray-100">
                        <td class="px-4 py-2.5 font-mono font-bold text-blue-900">
                            ${item.code}
                            <span class="text-[10px] font-sans font-semibold text-gray-500 bg-gray-100 px-2 py-0.5 rounded ml-2">${item.label}</span>
                        </td>
                        <td class="px-4 py-2.5 text-center font-bold text-gray-700">${item.diemGoc}</td>
                        <td class="px-4 py-2.5 text-center">
                            <input type="number" step="0.25" min="0" max="10" value="${displayValue}" placeholder="Nhập điểm mới..." ${isReadonlyAttr} class="w-28 rounded px-2 py-1 text-center outline-none ${inputStyle}" />

        initIcons();

    function handleSavePhucKhaoPoint() {

            if (val) hasAnyScore = true;

        });

        if (!hasAnyScore) {
            showGlobalToast("Cảnh báo", "Vui lòng nhập điểm phúc khảo mới vào bảng trước khi ấn lưu!", "warning");

        // Save target paper final score & full 4-paper bundle scores in CSDL structure
        p.diem_phuc_khao_cuoi = bundleDetails[0].newScore || p.diem_goc;

    function renderPhucKhaoList(phucKhaoData) {
        if (phucKhaoData && Array.isArray(phucKhaoData)) {
            allPhucKhaoData = phucKhaoData;
        }
        const div = document.getElementById('pk-list-div');
        if (!div) return;
        div.innerHTML = '';

        // Populate học phần dropdown
        const hpSelect = document.getElementById('pk-filter-hoc-phan');
        if (hpSelect && hpSelect.options.length <= 1) {
            const hpSet = new Set();
            (allPhucKhaoData || []).forEach(item => {
                const name = formatObjStr(item.hoc_phan, '');
                if (name) hpSet.add(name);
            });
            if (hpSet.size === 0) {
                ['Nhập môn Lập trình', 'Tiếng Anh GTQT 3', 'Quản trị dự án', 'Marketing căn bản', 'Cấu trúc dữ liệu', 'Mạng máy tính'].forEach(name => hpSet.add(name));
            }
            hpSet.forEach(name => {
                hpSelect.innerHTML += `<option value="${name}">${name}</option>`;
            });
        }

        const hkVal = document.getElementById('pk-filter-hoc-ky')?.value || '';
        const dotVal = document.getElementById('pk-filter-dot-thi')?.value || '';
        const hpVal = document.getElementById('pk-filter-hoc-phan')?.value || '';
        const statusVal = document.getElementById('pk-filter-status')?.value || '';
        const searchVal = document.getElementById('pk-filter-search')?.value.trim().toLowerCase() || '';

        const activeTextEl = document.getElementById('pk-active-filters-text');
        if (activeTextEl) {
            let desc = [];
            desc.push(`Kỳ: ${hkVal || 'Tất cả'}`);
            desc.push(`Đợt: ${dotVal || 'Tất cả'}`);
            if (hpVal) desc.push(`Học phần: ${hpVal}`);
            activeTextEl.innerText = desc.join(' | ');
        }

        const filtered = (allPhucKhaoData || []).filter(p => {
            if (hkVal && p.hoc_ky && p.hoc_ky !== hkVal) return false;
            if (dotVal && p.dot_thi && p.dot_thi !== dotVal) return false;
            const hpNameStr = formatObjStr(p.hoc_phan, '');
            if (hpVal && hpNameStr !== hpVal) return false;
            if (statusVal && p.trang_thai !== statusVal) return false;
            if (searchVal) {
                const svStr = formatObjStr(p.sinh_vien, '');
                const phachStr = typeof p.ma_phach === 'object' ? (p.ma_phach.ma_phach || '') : String(p.ma_phach || '');
                const text = `${p.ma_don} ${svStr} ${phachStr} ${hpNameStr}`.toLowerCase();
                if (!text.includes(searchVal)) return false;
            }
            return true;

    function filterGioCoiData() {
        const hocKyVal = document.getElementById('gc-filter-hocky')?.value || '';
        const kyThiVal = document.getElementById('gc-filter-kythi')?.value || '';
        const donViVal = document.getElementById('gc-filter-donvi')?.value || '';
        const searchVal = document.getElementById('gc-search-gv')?.value?.trim()?.toLowerCase() || '';

        let filtered = globalGioCoiRawData.filter(item => {
            let hkStr = item.hoc_ky || item.lich_thi?.hoc_ky || 'Học kỳ I';
            let ktStr = item.ky_thi || item.lich_thi?.ky_thi || 'Kỳ thi Cuối kỳ';
            let dvStr = item.khoa || item.can_bo?.khoa || 'Công nghệ thông tin';
            let gvName = (item.ho_ten || item.can_bo?.ho_ten || '').toLowerCase();
            let gvCode = (item.ma_gv || item.can_bo?.ma_giang_vien || '').toLowerCase();

            if (hocKyVal && !hkStr.includes(hocKyVal)) return false;
            if (kyThiVal && !ktStr.includes(kyThiVal)) return false;
            if (donViVal && !dvStr.includes(donViVal)) return false;
            if (searchVal && (!gvName.includes(searchVal) && !gvCode.includes(searchVal))) return false;
            return true;
        });

        // Update metric stats cards
        const totalGvEl = document.getElementById('gc-stat-total-gv');
        const totalCaEl = document.getElementById('gc-stat-total-ca');
        const totalGioEl = document.getElementById('gc-stat-total-gio');

        let sumCa = filtered.reduce((acc, curr) => acc + (curr.ca_thi_count || 1), 0);
        let sumGio = filtered.reduce((acc, curr) => acc + (curr.tong_gio || 2.5), 0);

        if (totalGvEl) totalGvEl.innerText = `${filtered.length} người`;
        if (totalCaEl) totalCaEl.innerText = `${sumCa} ca`;
        if (totalGioEl) totalGioEl.innerText = `${sumGio.toFixed(1)} giờ`;

        // Render summary table
        const tbodyTongHop = document.getElementById('gc-table-tbody');
        if (tbodyTongHop) {
            tbodyTongHop.innerHTML = '';
            if (filtered.length === 0) {
                tbodyTongHop.innerHTML = `<tr><td colspan="6" class="text-center p-6 text-gray-500 font-medium">Không tìm thấy dữ liệu giờ coi thi phù hợp.</td></tr>`;
                return;
            }

            filtered.forEach(item => {
                let maGv = item.ma_gv || item.can_bo?.ma_giang_vien || 'GV001';
                let hoTen = item.ho_ten || item.can_bo?.ho_ten || 'Giảng viên';
                let khoa = item.khoa || item.can_bo?.khoa || 'CNTT';
                let numCa = item.ca_thi_count || 1;
                let numGio = item.tong_gio || 2.5;

                tbodyTongHop.innerHTML += `
                    <tr class="hover:bg-gray-50 border-b border-gray-100">
                        <td class="px-4 py-2.5 font-mono font-bold text-blue-900">${maGv}</td>
                        <td class="px-4 py-2.5 font-semibold text-gray-800">${hoTen}</td>
                        <td class="px-4 py-2.5 text-gray-600">${khoa}</td>
                        <td class="px-4 py-2.5 text-center font-bold text-gray-700">${numCa} ca</td>
                        <td class="px-4 py-2.5 text-center font-bold text-indigo-700">${numGio} giờ</td>
                        <td class="px-4 py-2.5 text-center">
                            <button onclick="showGioCoiDetailsModal('${maGv}')" class="bg-blue-50 text-blue-700 hover:bg-blue-100 px-2.5 py-1 rounded text-xs font-bold transition cursor-pointer">Chi tiết</button>
                        </td>
                    </tr>
                `;
            });
        }
    }

        toast.className = "hidden-view fixed bottom-6 right-6 text-white px-6 py-4 rounded shadow-xl flex items-center gap-3 animate-fade-in-up z-[200]";
        if (type === 'error') {
            toast.classList.add('bg-red-600');
            icon.setAttribute('data-lucide', 'alert-circle');
        } else {
            toast.classList.add('bg-green-600');
            icon.setAttribute('data-lucide', 'check-circle-2');
        }
        document.getElementById('toast-global-title').innerText = title;
        document.getElementById('toast-global-msg').innerText = msg || '';
        toast.classList.remove('hidden-view');
        initIcons();
        setTimeout(() => toast.classList.add('hidden-view'), 4000);
    }

    function renderPhongThiTable() {
        const tbody = document.getElementById('phong-thi-tbody');
        if (!tbody) return;
        const search = (document.getElementById('pt-search')?.value || '').toLowerCase().trim();
        
        const filtered = phongThiData.filter(pt => {
            const ten = (pt.ten || pt.name || '').toLowerCase();
            const ma = (pt.ma || pt.id || '').toLowerCase();
            return ten.includes(search) || ma.includes(search);
        });

        tbody.innerHTML = filtered.map((pt, i) => {
            const roomCode = pt.ma || pt.id || `P${101 + i}`;
            const roomName = pt.ten || pt.name || roomCode;
            const cap = pt.sucChua || pt.capacity || 40;
            const loc = pt.viTri || pt.location || 'Toà nhà A';
            const st = pt.trangThai || pt.status || 'Khả dụng';
            const isAvailable = (st === 'Khả dụng' || st === 'KhaDung' || st === 'Available');

            return `
                <tr class="bg-white border-b border-gray-100 hover:bg-gray-50 transition-colors cursor-pointer" onclick="showPhongThiDetailModal('${roomCode}')">
                    <td class="select-col-phong-thi ${selectModesState['phong-thi'] > 0 ? '' : 'hidden'} px-3 py-3 text-center" onclick="event.stopPropagation();">
                        ${renderSelectCheckbox('phong-thi', '', roomCode)}
                    </td>
                    <td class="px-4 py-3 font-bold font-mono text-gray-800">${roomCode}</td>
                    <td class="px-4 py-3 font-bold text-blue-900">${roomName}</td>
                    <td class="px-4 py-3 text-center font-bold text-gray-800">${cap}</td>
                    <td class="px-4 py-3 text-gray-700">${loc}</td>
                    <td class="px-4 py-3">
                        <span class="px-2.5 py-1 rounded-full text-[10px] font-bold ${isAvailable ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700'}">${isAvailable ? 'Khả dụng' : st}</span>
                    </td>
                    <td class="px-4 py-3 text-center" onclick="event.stopPropagation();">
                        <div class="flex items-center justify-center gap-2">
                            <button class="text-blue-600 hover:text-blue-800 p-1.5 rounded hover:bg-blue-50 transition-colors" title="Sửa thông tin phòng thi" onclick="showPhongThiEditModal('${roomCode}')">
                                <i data-lucide="edit-2" class="w-4 h-4 pointer-events-none"></i>
                            </button>
                            <button class="text-rose-600 hover:text-rose-800 p-1.5 rounded hover:bg-rose-50 transition-colors" title="Xóa phòng thi" onclick="handleDeletePhongThi('${roomCode}')">

    }

    function showPhongThiEditModal(code) {
        const pt = phongThiData.find(p => p.ma === code || p.id === code || p.name === code || p.ten === code);

            showGlobalToast("Thông báo", "Không tìm thấy dữ liệu phòng thi.", "warning");

        switchTabPhongThi('danh-sach');

        const locEl = document.getElementById('pt-vi-tri');
        const typeEl = document.getElementById('pt-loai');
        const stEl = document.getElementById('pt-trang-thai');

    function handleDeletePhongThi(code) {
        const pt = phongThiData.find(p => p.ma === code || p.id === code || p.name === code || p.ten === code);
        const roomName = pt ? (pt.ten || pt.name || code) : code;
        showDeleteConfirmModal(
            `Bạn có chắc chắn muốn xóa phòng thi "${roomName}" (${code})? Hành động này không thể hoàn tác.`,
            function() {
                phongThiData = phongThiData.filter(p => p.ma !== code && p.id !== code && p.name !== code && p.ten !== code);
                renderPhongThiTable();
                showGlobalToast("Thành công", `Đã xóa phòng thi ${roomName} thành công.`, "success");
                if (typeof isStateLoaded !== "undefined" && isStateLoaded) saveStateToServer();
            }
        );
    }

    function handleCreatePhongThi() {
        const ten = document.getElementById('pt-ten').value.trim();
        const sucChua = parseInt(document.getElementById('pt-suc-chua').value);
        const viTri = document.getElementById('pt-vi-tri').value;
        const loai = document.getElementById('pt-loai').value;
        const trangThai = document.getElementById('pt-trang-thai').value;

        if (!ten || !sucChua || sucChua <= 0) {
            showGlobalToast("Thêm thất bại", "Vui lòng nhập tên phòng và sức chứa hợp lệ.", "error");
            return;
        }
        if (phongThiData.some(p => (p.ten || p.name || '').toLowerCase() === ten.toLowerCase())) {
            showGlobalToast("Thêm thất bại", "Tên phòng thi này đã tồn tại trong hệ thống.", "error");
            return;
        }

        const ma = "PT" + Date.now().toString().slice(-4);
        phongThiData.unshift({ id: ma, ma, ten, sucChua, viTri, loai, trangThai });
        
        document.getElementById('pt-ten').value = '';
        document.getElementById('pt-suc-chua').value = '';
        renderPhongThiTable();
        showGlobalToast("Thành công", `Đã thêm phòng thi ${ten} (${ma}) thành công.`, "success");
    
        if (typeof isStateLoaded !== "undefined" && isStateLoaded) saveStateToServer();
    }

    function updatePCInfo() {
        const selId = document.getElementById('pc-lich-thi').value;
        const lt = lichThiData.find(l => l.id === selId);
        
        document.getElementById('pc-so-luong').innerText = lt ? lt.soLuong : '0';
        document.getElementById('pc-ngay-thi').innerText = lt ? lt.date : '-';
        document.getElementById('pc-ca-thi').innerText = lt ? lt.time : '-';

        const pSel = document.getElementById('pc-phong-thi');
        if (!pSel) return;
        pSel.innerHTML = phongThiData.filter(p => (p.trangThai || p.status) === 'Khả dụng').map(p => 
            `<option value="${p.id || p.ma}" data-cap="${p.sucChua || p.capacity}">${p.ten || p.name} (Chứa: ${p.sucChua || p.capacity} SV) - ${p.viTri || 'Toà nhà A'}</option>`
        ).join('');
        const lbl = document.getElementById('pc-tong-suc-chua');
        if (lbl) lbl.innerText = '0';
    }

    function updatePCCapacity() {
        const pSel = document.getElementById('pc-phong-thi');
        let total = 0;
        Array.from(pSel.selectedOptions).forEach(opt => total += parseInt(opt.getAttribute('data-cap') || 0));
        const lbl = document.getElementById('pc-tong-suc-chua');
        if (lbl) {
            lbl.innerText = total;
            const required = parseInt(document.getElementById('pc-so-luong').innerText) || 0;
            if (total >= required && required > 0) lbl.classList.replace('text-blue-700', 'text-green-600');
            else lbl.classList.replace('text-green-600', 'text-blue-700');
        }
    }

    function handlePhanCongPhong() {
        const ltId = document.getElementById('pc-lich-thi').value;
        const pSel = document.getElementById('pc-phong-thi');
        const selectedRooms = Array.from(pSel.selectedOptions).map(opt => opt.value);
        
        if (!ltId) return showGlobalToast("Lỗi", "Vui lòng chọn ca thi / lịch thi cần phân công.", "error");
        if (selectedRooms.length === 0) return showGlobalToast("Lỗi", "Vui lòng chọn ít nhất một phòng thi.", "error");

        const lt = lichThiData.find(l => l.id === ltId);
        
        const mappedRoomNames = selectedRooms.map(rid => {
            const p = phongThiData.find(x => x.id === rid || x.ma === rid);
            return p ? (p.ten || p.name) : rid;
        }).join(', ');

        if (lt) lt.room = mappedRoomNames;

        let existIndex = phanCongPhongData.findIndex(pc => pc.ltId === ltId);
        let phanCongObj = {
            id: 'PC' + Date.now().toString().slice(-4),
            ltId: ltId,
            subjectName: lt ? lt.subjectName : 'Học phần',
            date: lt ? lt.date : '',
            caThi: lt ? lt.time : 'Ca 1',
            soLuong: lt ? lt.soLuong : 40,
            roomIds: selectedRooms,
            roomNames: mappedRoomNames
        };

        if (existIndex > -1) {
            phanCongPhongData[existIndex] = phanCongObj;
        } else {
            phanCongPhongData.unshift(phanCongObj);
        }

        renderPhanCongTable();
        if (typeof renderLichThiTable === 'function') renderLichThiTable();
        showGlobalToast("Thành công", `Đã phân công ${selectedRooms.length} phòng cho ca thi ${lt ? lt.subjectName : ''}.`, "success");
    
        if (typeof isStateLoaded !== "undefined" && isStateLoaded) saveStateToServer();
    }

    function handleSavePhanCongEdit() {
        const pcId = document.getElementById('edit-pc-id').value;
        const pc = phanCongPhongData.find(x => x.id === pcId || x.ltId === pcId);
        if (!pc) return;

        const countVal = parseInt(document.getElementById('edit-pc-count').value) || 40;
        const roomsSelect = document.getElementById('edit-pc-rooms');
        const selectedOptions = Array.from(roomsSelect.selectedOptions);
        const selectedRoomIds = selectedOptions.map(opt => opt.value);

        if (selectedRoomIds.length === 0) {
            showGlobalToast("Lỗi", "Vui lòng chọn ít nhất một phòng thi.", "error");
            return;
        }

        const mappedRoomNames = selectedRoomIds.map(rid => {
            const p = phongThiData.find(x => x.id === rid || x.ma === rid);
            return p ? (p.ten || p.name) : rid;
        }).join(', ');

        pc.soLuong = countVal;
        pc.roomIds = selectedRoomIds;
        pc.roomNames = mappedRoomNames;

        const lt = lichThiData.find(l => l.id === pc.ltId || l.id === pcId);
        if (lt) {
            lt.soLuong = countVal;
            lt.room = mappedRoomNames;
        }

        renderPhanCongTable();
        if (typeof renderLichThiTable === 'function') renderLichThiTable();
        hidePhanCongEditModal();
        showGlobalToast("Thành công", `Đã cập nhật phân công phòng cho môn ${pc.subjectName}.`, "success");

        if (typeof isStateLoaded !== "undefined" && isStateLoaded) saveStateToServer();
    }

    function handleDeletePhanCong(pcId) {
        const pc = phanCongPhongData.find(x => x.id === pcId || x.ltId === pcId);
        if (!pc) return;
        showDeleteConfirmModal(
            `Bạn có chắc chắn muốn xóa phân bổ phòng cho môn ${pc.subjectName}? Hành động này không thể hoàn tác.`,
            function() {
                phanCongPhongData = phanCongPhongData.filter(x => x.id !== pcId && x.ltId !== pcId);
                const lt = lichThiData.find(l => l.id === pc.ltId || l.id === pcId);
                if (lt) lt.room = "Chưa phân công";
                renderPhanCongTable();
                if (typeof renderLichThiTable === 'function') renderLichThiTable();
                showGlobalToast("Thành công", `Đã xóa phân bổ phòng của môn ${pc.subjectName} thành công.`, "success");
                if (typeof isStateLoaded !== "undefined" && isStateLoaded) saveStateToServer();
            }
        );
    }

        const ngay = document.getElementById('is-ngay').value;

        const giamSat = document.getElementById('is-giam-sat').value.trim();
        const ghiChu = document.getElementById('is-ghi-chu').value.trim();

        if (!soLuong || soLuong <= 0 || !ngay || !noiIn || !giamSat) {
            showGlobalToast("Lỗi nhập liệu", "Vui lòng nhập đầy đủ các trường bắt buộc (số lượng, ngày, nơi in, cán bộ giám sát).", "error");
            return;
        }

        // Lấy tên học phần và kỳ thi
        let subjectName = "Không xác định";
        let kyThiTen = "";
        if (ltId) {
            const lt = lichThiData.find(l => l.id === ltId);
            subjectName = lt ? lt.subjectName : (sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].text : "Không xác định");
            if (lt && lt.kyThiId) {
                const kt = kyThiData.find(k => k.id === lt.kyThiId);
                if (kt) kyThiTen = kt.name || "";
            }
            if (!kyThiTen && kyThiData.length > 0) {
                kyThiTen = kyThiData[0].name || "";
            }
        } else if (kyThiData.length > 0) {
            kyThiTen = kyThiData[0].name || "";
        }

        const ma = "IS" + Date.now().toString().slice(-4);
        
        inSaoData.unshift({
            id: ma,
            ltId: ltId || "",
            subjectName: subjectName,
            kyThiTen: kyThiTen,
            soLuong: soLuong,
            ngay: ngay,
            noiIn: noiIn,
            giamSat: giamSat,
            ghiChu: ghiChu,
            trangThai: "Chờ cập nhật"
        });

        document.getElementById('is-so-luong').value = '';
        document.getElementById('is-ngay').value = '';
        document.getElementById('is-noi-in').value = '';
        document.getElementById('is-giam-sat').value = '';
        document.getElementById('is-ghi-chu').value = '';
        
        renderInSaoListPanel();
        showGlobalToast("Thành công", `Đã lập đợt in sao ${ma} thành công. Vui lòng cập nhật nhật ký khi thực hiện.`, "success");
    
        if (typeof isStateLoaded !== "undefined" && isStateLoaded) saveStateToServer();
    }

    function autoCreateInSao() {
        const defaultShifts = [
            { id: "LT-ENG101", subjectName: "Tiếng Anh GTQT 3", caThi: "Ca 1 (07:30 - 09:30)", date: "15/08/2026", soLuong: 120 },
            { id: "LT-BUS201", subjectName: "Quản trị dự án", caThi: "Ca 2 (09:45 - 11:45)", date: "16/08/2026", soLuong: 90 },
            { id: "LT-CS101", subjectName: "Nhập môn Lập trình", caThi: "Ca 3 (13:00 - 15:00)", date: "17/08/2026", soLuong: 60 }
        ];

        let targetList = (lichThiData && lichThiData.length > 0) ? lichThiData : defaultShifts;
        let createdCount = 0;

        targetList.forEach((item, idx) => {
            const shiftName = item.time || item.caThi || `Ca ${idx + 1}`;
            const subjName = item.subjectName || `Học phần Ca ${idx + 1}`;
            const exists = inSaoData.some(is => is.ltId === item.id || (is.subjectName === subjName && is.caThi === shiftName));
            
            if (!exists) {
                const ma = "IS" + (1000 + inSaoData.length + createdCount);
                let ktTen = "";
                if (item.kyThiId) {
                    const kt = kyThiData.find(k => k.id === item.kyThiId);
                    if (kt) ktTen = kt.name || "";
                }
                if (!ktTen && kyThiData.length > 0) ktTen = kyThiData[0].name || "";
                inSaoData.unshift({
                    id: ma,
                    ltId: item.id || `LT-AUTO-${idx+1}`,
                    subjectName: subjName,
                    kyThiTen: ktTen,
                    caThi: shiftName,
                    soLuong: (item.soLuong || 40) + 5,
                    ngay: item.date || "2026-08-15",
                    noiIn: "Phòng khảo thí",
                    giamSat: "Trần Văn Vũ",
                    ghiChu: "",
                    trangThai: "Chờ cập nhật"
                });
                createdCount++;
            }
        });

        if (createdCount > 0) {
            renderInSaoListPanel();
            showGlobalToast("Thành công", `Đã tự động tạo đầy đủ ${createdCount} đợt in sao đề thi cho tất cả các ca thi!`, "success");
            if (typeof isStateLoaded !== "undefined" && isStateLoaded) saveStateToServer();
        } else {
            showGlobalToast("Thông báo", "Tất cả các ca thi hiện tại đều đã được tạo đợt in sao đề thi.", "info");
        }
    }

    // Render danh sách đợt in sao bên cạnh form
    function renderInSaoListPanel() {
        const listItems = document.getElementById('in-sao-list-items');
        const emptyEl = document.getElementById('in-sao-list-empty');
        const countEl = document.getElementById('in-sao-list-count');
        if (!listItems || !emptyEl || !countEl) return;

        countEl.textContent = inSaoData.length;

        if (inSaoData.length === 0) {
            listItems.innerHTML = '';
            emptyEl.style.display = 'flex';
            return;
        }
        emptyEl.style.display = 'none';

        listItems.innerHTML = inSaoData.map(is => {
            let statusClass = "bg-gray-100 text-gray-600";
            let statusIcon = "clock";
            if (is.trangThai === "Chờ cập nhật") { statusClass = "bg-yellow-100 text-yellow-700"; statusIcon = "clock"; }
            else if (is.trangThai === "Chờ xác nhận") { statusClass = "bg-blue-100 text-blue-700"; statusIcon = "loader"; }
            else if (is.trangThai === "Hoàn tất") { statusClass = "bg-green-100 text-green-700"; statusIcon = "check-circle"; }

            return `
                <div class="px-4 py-3 cursor-pointer hover:bg-blue-50 transition-colors flex items-center gap-3" onclick="showInSaoDetail('${is.id}')">
                    ${renderSelectCheckbox('in-sao', '', is.id)}
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-sm text-gray-800">${is.id}</span>
                            <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${statusClass}">${is.trangThai}</span>
                        </div>
                        <p class="text-xs text-gray-500 truncate mt-0.5">${is.subjectName} · ${is.soLuong} bản · ${is.ngay}</p>
                    </div>
                    <button class="del-btn-in-sao text-red-600 hover:text-red-800 p-1 hover:bg-red-50 rounded transition-all shrink-0" onclick="event.stopPropagation(); handleDeleteInSao('${is.id}')" title="Xóa đợt in sao">

    function showInSaoDetail(id) {
        const is = inSaoData.find(x => x.id === id);
        if (!is) return;

        const detailPanel = document.getElementById('in-sao-detail-panel');
        if (!detailPanel) return;

        const idEl = document.getElementById('is-detail-id');
        const statusEl = document.getElementById('is-detail-status');
        const subjectEl = document.getElementById('is-detail-subject');
        const countEl = document.getElementById('is-detail-count');
        const dateEl = document.getElementById('is-detail-date');
        const placeEl = document.getElementById('is-detail-place');
        const supervisorEl = document.getElementById('is-detail-supervisor');
        const noteEl = document.getElementById('is-detail-note');

        if (idEl) idEl.textContent = is.id;
        if (statusEl) {
            let statusClass = "bg-gray-100 text-gray-700";
            if (is.trangThai === "Chờ cập nhật") statusClass = "bg-yellow-100 text-yellow-700";
            else if (is.trangThai === "Chờ xác nhận") statusClass = "bg-blue-100 text-blue-700";
            else if (is.trangThai === "Hoàn tất") statusClass = "bg-green-100 text-green-700";
            else if (is.trangThai === "Cần xử lý lại") statusClass = "bg-red-100 text-red-700";
            statusEl.className = `px-2 py-0.5 rounded-full text-[10px] font-bold ${statusClass}`;
            statusEl.textContent = is.trangThai;
        }
        if (subjectEl) subjectEl.textContent = is.subjectName || 'N/A';
        if (countEl) countEl.textContent = is.soLuong ? `${is.soLuong} bản` : '0 bản';
        if (dateEl) dateEl.textContent = is.ngay || 'N/A';
        if (placeEl) placeEl.textContent = is.noiIn || 'N/A';
        if (supervisorEl) supervisorEl.textContent = is.giamSat || 'N/A';
        if (noteEl) noteEl.textContent = is.ghiChu || 'Không có';

        detailPanel.classList.remove('hidden');
        detailPanel.style.display = 'block';
        initIcons();
    }

    function closeInSaoDetail() {
        const detailPanel = document.getElementById('in-sao-detail-panel');
        if (detailPanel) {
            detailPanel.classList.add('hidden');
            detailPanel.style.display = 'none';
        }
    }

    function handleDeleteInSao(id) {
        showDeleteConfirmModal(
            `Bạn có chắc chắn muốn xóa đợt in sao "${id}" không? Toàn bộ dữ liệu đợt in sao này sẽ bị xóa khỏi hệ thống.`,
            function() {
                inSaoData = inSaoData.filter(x => x.id !== id);

                const currentDetailId = document.getElementById('is-detail-id');
                if (currentDetailId && currentDetailId.textContent === id) {
                    closeInSaoDetail();
                }

                renderInSaoListPanel();
                if (typeof renderInSaoNKList === 'function') renderInSaoNKList();
                if (typeof renderInSaoBBList === 'function') renderInSaoBBList();

                showGlobalToast("Thành công", `Đã xóa thành công đợt in sao ${id}.`, "success");
                if (typeof isStateLoaded !== "undefined" && isStateLoaded) saveStateToServer();
            }
        );
    }

    function openModalBulkNhanThongTin() {
        const checkedCbs = document.querySelectorAll('.select-cb-in-sao-bb:checked');
        if (checkedCbs.length > 0) {
            const ids = Array.from(checkedCbs).map(cb => cb.getAttribute('data-id')).filter(id => id);
            const validIds = ids.filter(id => {
                const item = inSaoData.find(x => x.id === id);
                return item && item.trangThai === "Hoàn tất";
            });

            if (validIds.length === 0) {
                showGlobalToast("Cảnh báo", "Không có đợt in sao nào trong các mục đã chọn đã hoàn tất đối chiếu để xuất nhãn.", "warning");
                return;
            }
            printNhanThongTin(validIds.join(','));
            return;
        }

        const completedItems = inSaoData.filter(is => is.trangThai === "Hoàn tất");
        if (completedItems.length === 0) {
            showGlobalToast("Thông báo", "Chưa có đợt in sao nào được đối chiếu hoàn tất để xuất nhãn thông tin.", "warning");
            return;
        }

        printNhanThongTin(completedItems.map(x => x.id).join(','));
    }

        const ids = rawId.split(',').map(s => s.trim()).filter(s => s);

        let labelHtml = '';

                return;
            }

            validCount++;
            const totalBags = parseInt(is.nkNiemPhong || 0);
            const totalQty = parseInt(is.nkSoLuong || is.soLuong || 0);

            labelHtml += `
                <div class="printable-label bg-white border-2 border-dashed border-gray-400 p-4 rounded-lg space-y-2 text-xs font-sans max-w-lg mx-auto">
                    <div class="text-center border-b border-gray-300 pb-2">

                        <p class="font-extrabold text-xs uppercase text-indigo-900 mt-0.5 tracking-wider">NHÃN THÔNG TIN TÚI ĐỀ THI</p>

    function confirmIsKyXacNhanExecute() {
        const id = document.getElementById('ky-xn-is-id').value;
        const pw = document.getElementById('ky-xn-is-pw').value;
        const nhanXet = document.getElementById('ky-xn-is-nhan-xet').value;
        
        if (pw === "123456") {
            const is = inSaoData.find(x => x.id === id);
            if(is) {
                const signTime = new Date().toISOString();
                const signData = `${id}-${is.nkSoLuong || 0}-${is.nkNiemPhong || 0}-${signTime}`;
                let hash = 0;
                for (let i = 0; i < signData.length; i++) {
                    hash = (hash << 5) - hash + signData.charCodeAt(i);
                    hash |= 0;
                }
                const cryptoSignature = "SHA256-RSA:" + btoa(signData + hash).slice(-30);
                
                is.trangThai = "Hoàn tất";
                is.chuKySo = cryptoSignature;
                is.nhanXetGiamSat = nhanXet;
                
                hideIsKyXacNhanModal();
                showGlobalToast("Thành công", "Đã xác nhận biên bản giám sát in sao.", "success");
                renderInSaoBBList();
                
                if (typeof isStateLoaded !== "undefined" && isStateLoaded) saveStateToServer();
            }
        } else {
            document.getElementById('ky-xn-is-error').classList.remove('hidden-view');
        }
    }
    
    // ==========================================================
    // UC: RÀ SOÁT ĐỀ THI (TKT)
    // ==========================================================
    function renderRasoatDeList() {
        const tbody = document.getElementById('rasoat-de-tbody');
        if (!tbody) return;
        
        tbody.innerHTML = deThiData.map(dt => {
            let statusClass = "bg-gray-100 text-gray-700";
            if (dt.trangThai === "Chờ rà soát") statusClass = "bg-yellow-100 text-yellow-700";
            else if (dt.trangThai === "Đạt") statusClass = "bg-green-100 text-green-700";
            else if (dt.trangThai === "Chờ chỉnh sửa") statusClass = "bg-red-100 text-red-700";

            let actionBtn = "";
            if (dt.trangThai === "Chờ rà soát" || dt.trangThai === "Chờ chỉnh sửa") {
                actionBtn = `<button class="text-blue-600 hover:text-blue-800 font-bold" onclick="openModalRasoat('${dt.id}', '${dt.hocPhan}')">Rà soát</button>`;
            } else {
                actionBtn = `<span class="text-green-600 font-bold"><i data-lucide="check" class="w-4 h-4 inline"></i></span>`;
            }

            return `
                <tr class="bg-white border-b border-gray-100 hover:bg-gray-50 transition-colors cursor-pointer" onclick="showDeThiDetail('${dt.id}')">
                    <td class="select-col-rasoat-de ${selectModesState['rasoat-de'] > 0 ? '' : 'hidden'} px-3 py-3 text-center" onclick="event.stopPropagation();">
                        ${renderSelectCheckbox('rasoat-de')}
                    </td>
                    <td class="px-4 py-3 font-bold">${dt.id}</td>
                    <td class="px-4 py-3">${dt.hocPhan}</td>
                    <td class="px-4 py-3">${dt.nguoiNop}</td>
                    <td class="px-4 py-3 text-blue-600 font-medium hover:underline" onclick="event.stopPropagation();"><i data-lucide="file-text" class="w-4 h-4 inline mr-1"></i>${dt.fileName}</td>
                    <td class="px-4 py-3 text-xs text-gray-600 max-w-[200px] truncate" title="${dt.ghiChu || '-'}">${dt.ghiChu || '-'}</td>
                    <td class="px-4 py-3 text-center">
                        <span class="px-2 py-1 rounded-full text-[10px] font-bold ${statusClass}">${dt.trangThai}</span>
                    </td>
                    <td class="px-4 py-3 text-center" onclick="event.stopPropagation();">
                        ${actionBtn}
                    </td>
                </tr>
            `;
        }).join('') || `<tr><td colspan="7" class="text-center py-4 text-gray-500 text-xs italic">Không có đề thi nào đang chờ rà soát.</td></tr>`;
        initIcons();
    }

    function showDeThiDetail(id) {
        const dt = deThiData.find(x => x.id === id);
        if (!dt) return;

        document.getElementById('dt-detail-id').innerText = dt.id;
        
        let statusClass = "bg-gray-100 text-gray-700";
        if (dt.trangThai === "Chờ rà soát") statusClass = "bg-yellow-100 text-yellow-700";
        else if (dt.trangThai === "Đạt") statusClass = "bg-green-100 text-green-700";
        else if (dt.trangThai === "Chờ chỉnh sửa") statusClass = "bg-red-100 text-red-700";
        
        document.getElementById('dt-detail-status').innerHTML = `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${statusClass}">${dt.trangThai}</span>`;
        document.getElementById('dt-detail-subject').innerText = dt.hocPhan;
        document.getElementById('dt-detail-submitter').innerText = dt.nguoiNop || "-";
        document.getElementById('dt-detail-time').innerText = dt.thoiGian || "-";
        document.getElementById('dt-detail-file-name').innerText = dt.fileName || "-";
        document.getElementById('dt-detail-note').innerText = dt.ghiChu || "-";
        document.getElementById('dt-detail-review').innerText = dt.nhanXet || "-";

        document.getElementById('modal-detail-de-thi').classList.remove('hidden-view');
        initIcons();
    }

    function closeDeThiDetail() {
        document.getElementById('modal-detail-de-thi').classList.add('hidden-view');
    }

    function openModalRasoat(id, tenMon) {
        document.getElementById('rs-ma-de').value = id;
        document.getElementById('rs-ten-mon').innerText = tenMon;
        document.getElementById('rs-trang-thai').value = 'Đạt';
        document.getElementById('rs-nhan-xet').value = '';
        document.getElementById('modal-rasoat-de').classList.remove('hidden-view');
    }

    function closeModalRasoat() {
        document.getElementById('modal-rasoat-de').classList.add('hidden-view');
    }

    function handleSaveRasoat() {
        const id = document.getElementById('rs-ma-de').value;
        const trangThai = document.getElementById('rs-trang-thai').value;
        const nhanXet = document.getElementById('rs-nhan-xet').value.trim();
        
        const dt = deThiData.find(x => x.id === id);
        if (!dt) return;

        dt.trangThai = trangThai;
        dt.nhanXet = nhanXet;

        closeModalRasoat();
        renderRasoatDeList();
        
        if (trangThai === 'Đạt') {
            showGlobalToast("Đã duyệt", `Đề thi môn ${dt.hocPhan} đã đạt yêu cầu rà soát.`, "success");
        } else {
            showGlobalToast("Yêu cầu chỉnh sửa", `Đã gửi yêu cầu chỉnh sửa đề thi môn ${dt.hocPhan}.`, "warning");
        }
    
        if (typeof isStateLoaded !== "undefined" && isStateLoaded) saveStateToServer();
    }

    // ==========================================================
    // CHI TIẾT MODAL VIEWERS (Kỳ thi, Ca thi, Phòng thi)
    // ==========================================================
    function showKyThiDetailModal(id) {
        const kt = kyThiData.find(x => x.id === id);
        if (!kt) return;

        document.getElementById('mkt-name').innerText = kt.name;
        document.getElementById('mkt-id').innerText = kt.id;
        document.getElementById('mkt-year-semester').innerText = `${kt.year} | ${kt.semester}`;
        document.getElementById('mkt-dot').innerText = kt.dot || 'Không có';
        document.getElementById('mkt-duration').innerText = kt.duration || 'Không rõ';
        document.getElementById('mkt-mota').innerText = kt.mota || 'Không có mô tả';

        // Render ca thi trực thuộc
        const tbody = document.getElementById('mkt-shifts-tbody');
        tbody.innerHTML = '';
        const shifts = caThiData.filter(c => c.kyThiId === id);
        if (shifts.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-gray-500 italic">Kỳ thi này chưa có ca thi nào.</td></tr>`;
        } else {
            shifts.forEach(c => {
                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50 text-gray-700">
                        <td class="px-4 py-2 font-semibold text-[#9e1c22] border-b">${c.name}</td>
                        <td class="px-4 py-2 font-mono border-b">${c.date}</td>
                        <td class="px-4 py-2 font-medium border-b">${c.start} - ${c.end}</td>
                        <td class="px-4 py-2 border-b">${c.note || 'Không'}</td>
                    </tr>
                `;
            });
        }

        document.getElementById('modal-ky-thi-detail').classList.remove('hidden-view');
        if (typeof initIcons !== "undefined") initIcons();
    }

    function hideKyThiDetailModal() {
        document.getElementById('modal-ky-thi-detail').classList.add('hidden-view');
    }

    function showCaThiDetailModal(id) {
        const c = caThiData.find(x => x.id === id);
        if (!c) return;

        document.getElementById('mct-name').innerText = c.name;
        document.getElementById('mct-id').innerText = c.id;
        document.getElementById('mct-date').innerText = c.date;
        document.getElementById('mct-time').innerText = `${c.start} - ${c.end}`;
        
        const kt = kyThiData.find(x => x.id === c.kyThiId);
        document.getElementById('mct-parent-exam').innerText = kt ? `${kt.name} (${kt.semester})` : 'Không xác định';
        document.getElementById('mct-note').innerText = c.note || 'Không có ghi chú';

        // Render môn thi trong ca này
        const tbody = document.getElementById('mct-classes-tbody');
        tbody.innerHTML = '';
        const classes = lichThiData.filter(l => l.date === c.date && l.shiftName === c.name);
        if (classes.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-gray-500 italic">Không có môn thi/học phần nào diễn ra trong ca này.</td></tr>`;
        } else {
            classes.forEach(l => {
                const svCount = (lopThiDiemData[l.id] || []).length;
                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50 text-gray-700">
                        <td class="px-4 py-2 font-semibold text-gray-800 border-b">${l.subjectName}</td>
                        <td class="px-4 py-2 font-mono text-gray-500 border-b">${l.id || 'N/A'}</td>
                        <td class="px-4 py-2 font-bold text-center text-[#9e1c22] border-b">${svCount > 0 ? svCount : '--'}</td>
                        <td class="px-4 py-2 font-mono text-center font-bold text-gray-700 border-b">${l.room}</td>
                    </tr>
                `;
            });
        }

        document.getElementById('modal-ca-thi-detail').classList.remove('hidden-view');
        if (typeof initIcons !== "undefined") initIcons();
    }

    function hideCaThiDetailModal() {
        document.getElementById('modal-ca-thi-detail').classList.add('hidden-view');
    }

    function showPhongThiDetailModal(ma) {
        const pt = phongThiData.find(x => x.ma === ma || x.id === ma);
        if (!pt) return;

        document.getElementById('mpt-name').innerText = pt.ten;
        document.getElementById('mpt-id').innerText = pt.ma;
        document.getElementById('mpt-capacity').innerText = pt.sucChua;
        document.getElementById('mpt-location').innerText = pt.viTri || 'Chưa xếp tòa';
        document.getElementById('mpt-type').innerText = pt.loai || 'Phòng thường';

        const statusEl = document.getElementById('mpt-status');
        const isKhaDung = pt.trangThai === 'Khả dụng' || pt.trangThai === 'KhaDung';
        statusEl.innerText = isKhaDung ? 'Khả dụng' : pt.trangThai;
        if (isKhaDung) {
            statusEl.className = "px-2 py-0.5 rounded text-xs font-bold bg-green-100 text-green-700";
        } else if (pt.trangThai === 'Đang bảo trì') {
            statusEl.className = "px-2 py-0.5 rounded text-xs font-bold bg-yellow-100 text-yellow-700";
        } else {
            statusEl.className = "px-2 py-0.5 rounded text-xs font-bold bg-red-100 text-red-700";
        }

        document.getElementById('modal-phong-thi-detail').classList.remove('hidden-view');
        if (typeof initIcons !== "undefined") initIcons();
    }

    function hidePhongThiDetailModal() {
        document.getElementById('modal-phong-thi-detail').classList.add('hidden-view');
    }

    function showPhongThiEditModal(ma) {
        const pt = phongThiData.find(x => x.ma === ma || x.id === ma);
        if (!pt) return;

        document.getElementById('edit-pt-ma').value = pt.ma;
        document.getElementById('edit-pt-ten').value = pt.ten;
        document.getElementById('edit-pt-suc-chua').value = pt.sucChua;
        document.getElementById('edit-pt-vi-tri').value = pt.viTri || 'Toà nhà A';
        document.getElementById('edit-pt-loai').value = pt.loai || 'Phòng thường';
        document.getElementById('edit-pt-trang-thai').value = (pt.trangThai === 'Khả dụng' || pt.trangThai === 'KhaDung') ? 'Khả dụng' : pt.trangThai;

        document.getElementById('modal-phong-thi-edit').classList.remove('hidden-view');
        if (typeof initIcons !== "undefined") initIcons();
    }

    function hidePhongThiEditModal() {
        document.getElementById('modal-phong-thi-edit').classList.add('hidden-view');
    }

    function handleSavePhongThiEdit() {
        const ma = document.getElementById('edit-pt-ma').value;
        const ten = document.getElementById('edit-pt-ten').value.trim();
        const sucChua = parseInt(document.getElementById('edit-pt-suc-chua').value);
        const viTri = document.getElementById('edit-pt-vi-tri').value;
        const loai = document.getElementById('edit-pt-loai').value;
        const trangThai = document.getElementById('edit-pt-trang-thai').value;

        if (!ten || !sucChua || sucChua <= 0) {
            showGlobalToast("Cập nhật thất bại", "Vui lòng nhập tên phòng và sức chứa hợp lệ.", "error");
            return;
        }

        // Kiểm tra trùng lặp tên phòng mới với các phòng khác
        if (phongThiData.some(p => p.ma !== ma && p.id !== ma && p.ten.toLowerCase() === ten.toLowerCase())) {
            showGlobalToast("Cập nhật thất bại", "Tên phòng thi này đã tồn tại trong hệ thống.", "error");
            return;
        }

        const ptIndex = phongThiData.findIndex(x => x.ma === ma || x.id === ma);
        if (ptIndex !== -1) {
            phongThiData[ptIndex].ten = ten;
            phongThiData[ptIndex].sucChua = sucChua;
            phongThiData[ptIndex].viTri = viTri;
            phongThiData[ptIndex].loai = loai;
            phongThiData[ptIndex].trangThai = trangThai;

            renderPhongThiTable();
            showGlobalToast("Thành công", `Đã cập nhật phòng thi ${ten} thành công.`, "success");
            hidePhongThiEditModal();

            if (typeof isStateLoaded !== "undefined" && isStateLoaded) saveStateToServer();
        } else {
            showGlobalToast("Cập nhật thất bại", "Không tìm thấy phòng thi cần chỉnh sửa.", "error");
        }
    }


    window.currentPhucKhaoMode = 'xu-ly';
    function switchPhucKhaoMode(mode) {
        window.currentPhucKhaoMode = mode;
        const scoreSection = document.getElementById('pk-score-input-section');
        const scoreTitle = document.getElementById('pk-score-input-title');
        const thScore = document.getElementById('pk-th-score');
        const btnLuuDiem = document.getElementById('pk-btn-luu-diem');
        const btnInBienBan = document.getElementById('pk-btn-in-bien-ban');
        
        const tbody = document.getElementById('pk-tbody');
        const inputs = tbody ? tbody.querySelectorAll('input') : [];
        
        const p = selectedPhucKhaoDon;
        const isDaRut = p && (p.trang_thai === 'Đã rút bài' || p.trang_thai === 'DangXuLy' || p.trang_thai === 'Đang xử lý' || p.trang_thai === 'DaHoanThanh' || p.trang_thai === 'Đã hoàn thành');
        
        if (isDaRut && scoreSection) {
            scoreSection.classList.remove('hidden-view');
        }
        
        if (mode === 'xu-ly') {
            if (scoreTitle) scoreTitle.classList.add('hidden-view');
            if (thScore) thScore.classList.add('hidden-view');
            if (btnLuuDiem) btnLuuDiem.classList.add('hidden');
            if (btnInBienBan) btnInBienBan.classList.remove('hidden');
            inputs.forEach(inp => {
                const td = inp.closest('td');
                if (td) td.classList.add('hidden-view');
            });
        } else {
            if (scoreTitle) scoreTitle.classList.remove('hidden-view');
            if (thScore) thScore.classList.remove('hidden-view');
            if (btnLuuDiem) btnLuuDiem.classList.remove('hidden');
            if (btnInBienBan) btnInBienBan.classList.add('hidden');
            inputs.forEach(inp => {
                const td = inp.closest('td');
                if (td) td.classList.remove('hidden-view');
            });
        }
    }
    window.switchPhucKhaoMode = switchPhucKhaoMode;


</script>
