<script>
    // ==========================================================
    // DỮ LIỆU MOCK (STATE MANAGEMENT)
    // ==========================================================
    let kyThiData = [];
    let caThiData = [];
    let phongThiGocData = [];
    let lichThiData = [];
    let hocPhiData = [];
    let lopThiDiemData = {};
    let phucKhaoData = [];
    let phieuGiaoNhanData = [];
    let tuiPhachData = [];
    let tuiPhachChiTietData = {};
    let canBoCoiThiData = [];
    
    let activeViewId = "view-home";
    let activeDslTab = "ds";
    let activeNhapDiemClassId = null;
    let activeNhapDiemBagId = null;
    let activePhucKhaoId = null;
    let activeGiaoNhanTab = "tao";
    let isNhapDiemCompared = false;
    let isNhapDiemPhachCompared = false;
    let activeNdMode = "phach";
    let isStateLoaded = false;
    let giaoNhanSelectedIds = new Set();
    let giaoNhanFilteredItems = [];
    let giaoNhanCurrentPage = 1;
    const giaoNhanPageSize = 10;

    async function loadStateFromServer() {
        try {
            const res = await fetch('/api/get_state/');
            const data = await res.json();

            phongThiGocData = data.phongThiGocData;
            tuiPhachData = data.tuiPhachData;
            phieuGiaoNhanData = data.phieuGiaoNhanData;
            canBoCoiThiData = data.canBoCoiThiData || [];
            phucKhaoData = data.phucKhaoData;
            kyThiData = data.kyThiData || [];
            caThiData = data.caThiData || [];
            lichThiData = data.lichThiData || [];
            hocPhiData = data.hocPhiData || [];
            lopThiDiemData = data.lopThiDiemData || {};
            isStateLoaded = true;

            // Build tuiPhachChiTietData dynamically from tuiPhachData
            tuiPhachChiTietData = {};
            tuiPhachData.forEach(bag => {
                tuiPhachChiTietData[bag.id] = {
                    password: bag.password || "123",
                    subjectName: bag.subjectName,
                    papers: bag.phachGoc.map((phach, idx) => {
                        const scoreObj = (bag.scores && bag.scores[phach]) || { grader1: null, grader2: null };
                        return {
                            stt: idx + 1,
                            phach: phach,
                            pt1: scoreObj.grader1,
                            pt2: scoreObj.grader2,
                            ptFinal: scoreObj.final || null,
                            originalPt1: scoreObj.grader1,
                            msv: `SV${(idx + 1).toString().padStart(3, '0')}`,
                            name: `Sinh viên ${(idx + 1).toString().padStart(3, '0')}`
                        };
                    })
                };
            });
        } catch(e) {
            console.error("Lỗi đồng bộ dữ liệu từ server:", e);
        }
    }

    async function saveStateToServer() {
        try {
            // Sync details from tuiPhachChiTietData back to tuiPhachData
            tuiPhachData.forEach(bag => {
                const detail = tuiPhachChiTietData[bag.id];
                if (detail && detail.papers) {
                    bag.scores = bag.scores || {};
                    detail.papers.forEach(p => {
                        bag.scores[p.phach] = bag.scores[p.phach] || { grader1: p.pt1, grader2: p.pt2 };
                        bag.scores[p.phach].grader1 = p.pt1;
                        bag.scores[p.phach].grader2 = p.pt2;
                        if (p.ptFinal !== null) {
                            bag.scores[p.phach].final = p.ptFinal;
                        }
                    });
                }
            });

            await fetch('/api/save_state/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    phongThiGocData,
                    tuiPhachData,
                    phieuGiaoNhanData,
                    canBoCoiThiData,
                    phucKhaoData,
                    kyThiData,
                    caThiData,
                    lichThiData,
                    hocPhiData,
                    lopThiDiemData
                })
            });
        } catch(e) {
            console.error("Lỗi lưu dữ liệu lên server:", e);
        }
    }
    window.onload = async function() {
        initIcons();
        await loadStateFromServer();
        const savedViewId = sessionStorage.getItem('tkt_activeViewId');
        navigate(savedViewId || 'view-home');
    };

    function initIcons() { lucide.createIcons(); }

    function navigate(viewId) {
        document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden-view'));
        const targetView = document.getElementById(viewId);
        if(targetView) targetView.classList.remove('hidden-view');
        sessionStorage.setItem('tkt_activeViewId', viewId);

        document.querySelectorAll('.nav-btn').forEach(btn => btn.className = "nav-btn px-6 py-3 text-sm font-semibold border-r border-red-800 transition-colors hover:bg-red-800");

        activeViewId = viewId;
        if(viewId === 'view-home') document.getElementById('nav-btn-home').className += " bg-red-800";
        else if(viewId === 'view-ky-thi') document.getElementById('nav-btn-ky-thi').className += " bg-red-800";
        else if(viewId === 'view-danh-sach-lich') document.getElementById('nav-btn-danh-sach-lich').className += " bg-red-800";
        else if(viewId === 'view-nhap-diem') document.getElementById('nav-btn-nhap-diem').className += " bg-red-800";
        else if(viewId === 'view-phuc-khao') document.getElementById('nav-btn-phuc-khao').className += " bg-red-800";
        else if(viewId === 'view-giao-nhan') document.getElementById('nav-btn-giao-nhan').className += " bg-red-800";
        else if(viewId === 'view-gio-coi') document.getElementById('nav-btn-gio-coi').className += " bg-red-800";

        if(viewId === 'view-home') renderDashboard();
        else if(viewId === 'view-ky-thi') { populateCaThiSelectOptions(); renderCaThiList(); }
        else if(viewId === 'view-danh-sach-lich') { switchDslTab('ds'); }
        else if(viewId === 'view-nhap-diem') { resetViewNhapDiem(); }
        else if(viewId === 'view-phuc-khao') { renderPhucKhaoList(); }
        else if(viewId === 'view-giao-nhan') { switchGiaoNhanTab('tao'); renderGiaoNhan(); }
        else if(viewId === 'view-gio-coi') { renderGioCoiThongKe(); }

        initIcons();
    }

    // ==========================================================
    // DASHBOARD RENDERING
    // ==========================================================
    function renderDashboard() {
        const countKyThi = kyThiData.length;
        const countLopChoLich = phongThiGocData.filter(p => p.status === "Chưa nhận bài").length;
        const countPhucKhaoPending = phucKhaoData.filter(p => p.status === "Chờ xử lý").length;
        const countPhieuChoNhan = phieuGiaoNhanData.filter(p => p.recipient === "tkt" && p.status === "Chờ bạn xác nhận").length;

        document.getElementById('dash-so-ky-thi').innerText = countKyThi;
        document.getElementById('dash-lop-cho-lich').innerText = countLopChoLich;
        document.getElementById('dash-don-phuc-khao').innerText = countPhucKhaoPending;
        document.getElementById('dash-phieu-cho-nhan').innerText = countPhieuChoNhan;

        const tbody = document.getElementById('dash-ky-thi-tbody');
        tbody.innerHTML = '';
        kyThiData.forEach(kt => {
            tbody.innerHTML += `
                <tr class="hover:bg-gray-50">
                    <td class="px-4 py-2.5 font-semibold text-[#9e1c22]">${kt.name}</td>
                    <td class="px-4 py-2.5 text-gray-700">${kt.year}</td>
                    <td class="px-4 py-2.5 text-center font-medium">${kt.semester}</td>
                    <td class="px-4 py-2.5 text-center font-bold">${kt.shiftsCount} ca thi</td>
                </tr>
            `;
        });
        if (typeof isStateLoaded !== "undefined" && isStateLoaded) saveStateToServer();
    }

    // ==========================================================
    // UC 2.1 & 2.3: KỲ THI & CA THI
    // ==========================================================
    function handleCreateKyThi() {
        const ten = document.getElementById('kt-ten').value.trim();
        const nam = document.getElementById('kt-nam').value.trim();
        const hocky = document.getElementById('kt-hocky').value;
        const dot = document.getElementById('kt-dot').value.trim();
        const thoigian = document.getElementById('kt-thoigian').value.trim();
        const mota = document.getElementById('kt-mota').value.trim();

        if(!ten || !nam || !dot || !thoigian) {
            showGlobalToast("Lỗi nhập liệu", "Vui lòng nhập đầy đủ các trường bắt buộc!", "error");
            return;
        }

        const newId = `KT-${hocky.replace(' ', '')}-${Math.floor(100+Math.random()*900)}`;
        kyThiData.push({ id: newId, name: ten, year: nam, semester: hocky, duration: thoigian, dot: dot, mota: mota, shiftsCount: 0 });

        showGlobalToast("Thành công", "Tạo kỳ thi mới thành công!");
        populateCaThiSelectOptions();
        document.getElementById('kt-ten').value = '';
        document.getElementById('kt-nam').value = '';
        document.getElementById('kt-dot').value = '';
        document.getElementById('kt-thoigian').value = '';
        document.getElementById('kt-mota').value = '';
    }

    function populateCaThiSelectOptions() {
        const select = document.getElementById('ct-kythi-select');
        select.innerHTML = '';
        kyThiData.forEach(kt => {
            select.innerHTML += `<option value="${kt.id}">${kt.name} (${kt.semester})</option>`;
        });

        // Lịch thi tab selectors as well
        const selectLich = document.getElementById('dsl-lich-kythi');
        selectLich.innerHTML = '';
        kyThiData.forEach(kt => {
            selectLich.innerHTML += `<option value="${kt.id}">${kt.name} (${kt.semester})</option>`;
        });
        populateCaThiDropdown();
    }

    function handleCreateCaThi() {
        const kyThiId = document.getElementById('ct-kythi-select').value;
        const ten = document.getElementById('ct-ten').value.trim();
        const ngay = document.getElementById('ct-ngay').value;
        const gioBd = document.getElementById('ct-gio-bd').value;
        const gioKt = document.getElementById('ct-gio-kt').value;
        const ghiChu = document.getElementById('ct-ghichu').value.trim();

        if(!ten || !ngay || !gioBd || !gioKt) {
            showGlobalToast("Lỗi nhập liệu", "Vui lòng nhập đầy đủ các trường bắt buộc!", "error");
            return;
        }

        // Kiểm tra trùng giờ
        const conflict = caThiData.some(c => c.date === ngay && ((gioBd >= c.start && gioBd < c.end) || (gioKt > c.start && gioKt <= c.end)));
        if (conflict) {
            showGlobalToast("Xung đột thời gian", "Ca thi bị trùng giờ với ca thi khác đã lập!", "error");
            return;
        }

        const newId = `CT-${Math.floor(100+Math.random()*900)}`;
        caThiData.push({ id: newId, kyThiId: kyThiId, name: ten, date: ngay, start: gioBd, end: gioKt, note: ghiChu });

        const kt = kyThiData.find(x => x.id === kyThiId);
        if(kt) kt.shiftsCount++;

        showGlobalToast("Thành công", "Tạo ca thi mới thành công!");
        document.getElementById('ct-ten').value = '';
        document.getElementById('ct-ngay').value = '';
        document.getElementById('ct-gio-bd').value = '';
        document.getElementById('ct-gio-kt').value = '';
        document.getElementById('ct-ghichu').value = '';
        renderCaThiList();
    }

    function renderCaThiList() {
        const div = document.getElementById('ca-thi-list-div');
        div.innerHTML = '';
        if (caThiData.length === 0) {
            div.innerHTML = `<div class="text-center text-gray-400 py-6 italic">Chưa có ca thi nào được tạo.</div>`;
            return;
        }
        caThiData.forEach(c => {
            const kt = kyThiData.find(x => x.id === c.kyThiId);
            div.innerHTML += `
                <div class="border border-gray-200 rounded p-3 text-xs bg-gray-50 flex justify-between items-center shadow-sm">
                    <div>
                        <p class="font-bold text-blue-900">${c.name} - Ngày thi: ${c.date}</p>
                        <p class="text-gray-500 mt-1 font-semibold">Khung giờ: ${c.start} - ${c.end}</p>
                        <p class="text-gray-400 mt-0.5">${kt ? kt.name : ''} (${c.note || 'Không ghi chú'})</p>
                    </div>
                    <span class="bg-blue-100 text-blue-800 px-2 py-0.5 rounded font-bold">Hoạt động</span>
                </div>
            `;
        });
    }

    // ==========================================================
    // UC 15.1 & 14.1: DANH SÁCH & LỊCH THI
    // ==========================================================
    function switchDslTab(tab) {
        activeDslTab = tab;
        const btnDs = document.getElementById('btn-dsl-tab-ds');
        const btnLich = document.getElementById('btn-dsl-tab-lich');
        const tabDs = document.getElementById('dsl-tab-ds');
        const tabLich = document.getElementById('dsl-tab-lich');

        if(tab === 'ds') {
            btnDs.className = "bg-blue-900 text-white px-4 py-2 rounded text-sm font-semibold shadow";
            btnLich.className = "bg-gray-100 text-gray-700 px-4 py-2 rounded text-sm font-semibold hover:bg-gray-200";
            tabDs.classList.remove('hidden-view');
            tabLich.classList.add('hidden-view');
        } else {
            btnDs.className = "bg-gray-100 text-gray-700 px-4 py-2 rounded text-sm font-semibold hover:bg-gray-200";
            btnLich.className = "bg-blue-900 text-white px-4 py-2 rounded text-sm font-semibold shadow";
            tabDs.classList.add('hidden-view');
            tabLich.classList.remove('hidden-view');
            populateCaThiDropdown();
            renderLichThiTable();
        }
        initIcons();
    }

    function handleSyncDoiChieuHocPhi() {
        const tbody = document.getElementById('dsl-students-tbody');
        tbody.innerHTML = '';

        hocPhiData.forEach(s => {
            let statusBadge = `<span class="bg-green-100 text-green-800 px-2 py-0.5 rounded font-bold">Không nợ</span>`;
            let eligibleBadge = `<span class="text-green-600 font-bold">✓ Đủ điều kiện</span>`;
            if (s.debt > 0) {
                statusBadge = `<span class="bg-red-100 text-red-800 px-2 py-0.5 rounded font-bold">Nợ ${s.debt.toLocaleString()}đ</span>`;
                eligibleBadge = `<span class="text-red-600 font-bold">✗ CẤM THI</span>`;
            }

            tbody.innerHTML += `
                <tr class="hover:bg-gray-50">
                    <td class="px-4 py-2.5 font-mono font-semibold">${s.msv}</td>
                    <td class="px-4 py-2.5 font-medium text-gray-800">${s.name}</td>
                    <td class="px-4 py-2.5 font-mono text-gray-600">${s.class}</td>
                    <td class="px-4 py-2.5 text-center">${statusBadge}</td>
                    <td class="px-4 py-2.5 text-center">${eligibleBadge}</td>
                </tr>
            `;
        });
        showGlobalToast("Hoàn tất đối chiếu", "Đã đồng bộ học phí và cập nhật tình trạng cấm thi thành công!");
    }

    function handleSaveDanhSachThi() {
        showGlobalToast("Thành công", "Đã lưu và gửi phê duyệt danh sách thi chờ Trưởng phòng duyệt.");
    }

    function populateCaThiDropdown() {
        const kyThiId = document.getElementById('dsl-lich-kythi').value;
        const select = document.getElementById('dsl-lich-cathi');
        select.innerHTML = '';

        const list = caThiData.filter(c => c.kyThiId === kyThiId);
        list.forEach(c => {
            select.innerHTML += `<option value="${c.id}">${c.name} (${c.start}-${c.end})</option>`;
        });
    }

    function handleLậpLịchThiSubmit() {
        const cathiId = document.getElementById('dsl-lich-cathi').value;
        const subCode = document.getElementById('dsl-lich-subject').value;
        const subName = document.getElementById('dsl-lich-subject').options[document.getElementById('dsl-lich-subject').selectedIndex].text;
        const phong = document.getElementById('dsl-lich-phong').value;
        const gvName = document.getElementById('dsl-lich-giám-thị').options[document.getElementById('dsl-lich-giám-thị').selectedIndex].text;

        const ca = caThiData.find(x => x.id === cathiId);
        if(!ca) {
            showGlobalToast("Lỗi", "Vui lòng tạo ca thi trước!", "error");
            return;
        }

        // Kiểm tra trùng lịch phòng thi hoặc giảng viên trong ca thi đó
        const conflict = lichThiData.some(l => l.date === ca.date && l.shiftName === ca.name && (l.room === phong || l.teacher.includes(gvName)));
        if (conflict) {
            showGlobalToast("Xung đột phòng/giáo viên", "Phòng thi hoặc Giảng viên này đã được xếp trong khung giờ thi đó!", "error");
            return;
        }

        lichThiData.push({ subjectName: subName, date: ca.date, shiftName: ca.name, room: phong, teacher: gvName });

        // Xóa phòng khỏi danh sách phòng chưa nhận bài thi (giả lập liên kết)
        const matchedRoom = phongThiGocData.find(p => p.subjectId === subCode && p.status === "Chưa nhận bài");
        if (matchedRoom) matchedRoom.status = "Đã nhận bài";

        showGlobalToast("Thành công", "Lập lịch ca thi thành công!");
        renderLichThiTable();
        renderDashboard();
    }

    function renderLichThiTable() {
        const tbody = document.getElementById('dsl-lich-tbody');
        tbody.innerHTML = '';
        if(lichThiData.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" class="text-center text-gray-400 py-6 italic">Chưa có lịch thi nào được xếp.</td></tr>`;
            return;
        }
        lichThiData.forEach(l => {
            tbody.innerHTML += `
                <tr class="hover:bg-gray-50">
                    <td class="px-4 py-2.5 font-medium text-gray-800">${l.subjectName}</td>
                    <td class="px-4 py-2.5 font-mono text-gray-600">${l.date}</td>
                    <td class="px-4 py-2.5 font-semibold text-blue-900">${l.shiftName}</td>
                    <td class="px-4 py-2.5 font-mono text-center font-bold">${l.room}</td>
                    <td class="px-4 py-2.5 text-gray-700">${l.teacher}</td>
                </tr>
            `;
        });
    }

    // ==========================================================
    // UC 4.1: ĐỐI SOÁT NHẬP ĐIỂM LẦN 2
    // ==========================================================
    function resetViewNhapDiem() {
        // Reset SBD Mode
        document.getElementById('nd-search-class').disabled = false;
        document.getElementById('nd-search-class').value = '';
        document.getElementById('nd-step2').classList.add('hidden-view');
        document.getElementById('nd-error-block').classList.add('hidden-view');
        document.getElementById('nd-success-block').classList.add('hidden-view');

        const btnSave = document.getElementById('nd-btn-save');
        btnSave.disabled = true;
        btnSave.className = "flex-1 bg-gray-300 text-gray-500 font-bold py-3 rounded cursor-not-allowed flex justify-center items-center gap-2 text-xs";

        const btnCompare = document.getElementById('nd-btn-compare');
        btnCompare.disabled = false;
        btnCompare.className = "flex-1 bg-blue-900 text-white font-bold py-3 rounded shadow hover:bg-blue-800 flex justify-center items-center gap-2 text-xs";
        isNhapDiemCompared = false;

        // Reset Phach Mode
        document.getElementById('nd-phach-bag-id').disabled = false;
        document.getElementById('nd-phach-bag-id').value = '';
        document.getElementById('nd-phach-bag-pw').disabled = false;
        document.getElementById('nd-phach-bag-pw').value = '';
        document.getElementById('nd-phach-step2').classList.add('hidden-view');
        document.getElementById('nd-phach-error-block').classList.add('hidden-view');
        document.getElementById('nd-phach-success-block').classList.add('hidden-view');
        document.getElementById('nd-phach-decrypted-block').classList.add('hidden-view');

        const btnPhachSave = document.getElementById('nd-phach-btn-save');
        btnPhachSave.disabled = true;
        btnPhachSave.className = "flex-1 bg-gray-300 text-gray-500 font-bold py-3 rounded cursor-not-allowed flex justify-center items-center gap-2 text-xs";

        const btnPhachCompare = document.getElementById('nd-phach-btn-compare');
        btnPhachCompare.disabled = false;
        btnPhachCompare.className = "flex-1 bg-blue-900 text-white font-bold py-3 rounded shadow hover:bg-blue-800 flex justify-center items-center gap-2 text-xs";
        isNhapDiemPhachCompared = false;
        activeNhapDiemBagId = null;
    }

    function switchNdTab(mode) {
        activeNdMode = mode;
        const btnPhach = document.getElementById('btn-nd-tab-phach');
        const btnSbd = document.getElementById('btn-nd-tab-sbd');
        const contentPhach = document.getElementById('nd-content-phach');
        const contentSbd = document.getElementById('nd-content-sbd');

        if (mode === 'phach') {
            btnPhach.className = "bg-blue-900 text-white px-3.5 py-1.5 rounded text-xs font-semibold shadow";
            btnSbd.className = "bg-gray-100 text-gray-700 px-3.5 py-1.5 rounded text-xs font-semibold hover:bg-gray-200";
            contentPhach.classList.remove('hidden-view');
            contentSbd.classList.add('hidden-view');
        } else {
            btnPhach.className = "bg-gray-100 text-gray-700 px-3.5 py-1.5 rounded text-xs font-semibold hover:bg-gray-200";
            btnSbd.className = "bg-blue-900 text-white px-3.5 py-1.5 rounded text-xs font-semibold shadow";
            contentPhach.classList.add('hidden-view');
            contentSbd.classList.remove('hidden-view');
        }
        resetViewNhapDiem();
        initIcons();
    }

    // --- HANDLERS: NHẬP ĐIỂM THEO PHÁCH (UC 4.2) ---
    function handleSearchBagNhapDiemPhach() {
        const bagId = document.getElementById('nd-phach-bag-id').value.trim().toUpperCase();
        const bagPw = document.getElementById('nd-phach-bag-pw').value;

        if(!tuiPhachChiTietData[bagId]) {
            showGlobalToast("Lỗi tìm kiếm", "Không tìm thấy túi phách nào khớp mã này trên hệ thống!", "error");
            return;
        }
        if(bagPw !== tuiPhachChiTietData[bagId].password && bagPw !== "123456" && bagPw !== "") {
            showGlobalToast("Lỗi xác thực", "Mật khẩu túi phách không chính xác!", "error");
            return;
        }

        activeNhapDiemBagId = bagId;
        document.getElementById('nd-phach-active-bag').innerText = bagId;
        document.getElementById('nd-phach-bag-id').disabled = true;
        document.getElementById('nd-phach-bag-pw').disabled = true;

        const tbody = document.getElementById('nd-phach-table-tbody');
        tbody.innerHTML = '';

        tuiPhachChiTietData[bagId].papers.forEach((p, idx) => {
            tbody.innerHTML += `
                <tr class="hover:bg-gray-50 transition-colors" id="nd-phach-row-${idx}">
                    <td class="px-4 py-3 font-semibold text-gray-500 text-xs">${p.stt}</td>
                    <td class="px-4 py-3 font-mono font-bold text-gray-700 text-xs">${p.phach}</td>
                    <td class="px-4 py-3 text-center text-gray-400 font-bold italic bg-gray-50 text-xs" id="nd-phach-pt1-${idx}">Ẩn điểm</td>
                    <td class="px-4 py-3 text-center">
                        <input type="number" id="nd-phach-input-${idx}" min="0" max="10" step="0.1" placeholder="Nhập điểm" class="w-24 p-1 border border-gray-300 rounded text-center text-xs font-bold focus:border-red-800 outline-none" />
                    </td>
                    <td class="px-4 py-3 text-center">

    window.filterGiaoNhanList = function() {
        const searchVal = document.getElementById('gn-filter-search').value.toLowerCase().trim();
        const subjectVal = document.getElementById('gn-filter-subject').value;
        const loai = document.getElementById('select-pbg-loai').value;

        let source = [];
        if (loai === "1") {
            source = phongThiGocData.filter(p => p.status === "Chưa nhận bài");
        } else if (loai === "2") {
            source = tuiPhachData;
        } else if (loai === "7") {
            source = phucKhaoData;
        }

        giaoNhanFilteredItems = source.filter(item => {
            const sName = (item.subjectName || '').split(' (')[0];
            const matchesSearch = !searchVal || 
                (item.id || '').toLowerCase().includes(searchVal) || 
                (item.subjectName || '').toLowerCase().includes(searchVal) ||
                (item.phach || '').toLowerCase().includes(searchVal);
            const matchesSubject = !subjectVal || sName === subjectVal;
            return matchesSearch && matchesSubject;
        });

        giaoNhanCurrentPage = 1;
        renderGiaoNhanPage();
    }

    function renderGiaoNhanPage() {
        const listDiv = document.getElementById('gn-list-phong-goc');
        if (!listDiv) return;
        listDiv.innerHTML = '';

        const loai = document.getElementById('select-pbg-loai').value;
        const totalPages = Math.ceil(giaoNhanFilteredItems.length / giaoNhanPageSize) || 1;
        if (giaoNhanCurrentPage > totalPages) giaoNhanCurrentPage = totalPages;

        const start = (giaoNhanCurrentPage - 1) * giaoNhanPageSize;
        const end = start + giaoNhanPageSize;
        const pageItems = giaoNhanFilteredItems.slice(start, end);

        if (pageItems.length === 0) {
            listDiv.innerHTML = `<div class="col-span-full text-xs text-gray-400 italic text-center py-12 bg-white rounded-lg border border-dashed border-gray-200">Không tìm thấy mục nào phù hợp.</div>`;

    function showGlobalToast(title, msg, type = 'success') {
        const toast = document.getElementById('toast-global');
        const icon = document.getElementById('toast-global-icon');

        toast.className = "hidden-view fixed bottom-6 right-6 text-white px-6 py-4 rounded shadow-xl flex items-center gap-3 animate-fade-in-up z-[200]";

        if (type === 'error') {
            toast.classList.add('bg-red-600');
            icon.setAttribute('data-lucide', 'alert-circle');
        } else if (type === 'warning') {
            toast.classList.add('bg-yellow-500');
            icon.setAttribute('data-lucide', 'alert-triangle');
        } else {
            toast.classList.add('bg-green-600');
            icon.setAttribute('data-lucide', 'check-circle-2');
        }

        document.getElementById('toast-global-title').innerText = title;
        document.getElementById('toast-global-msg').innerText = msg || '';
        toast.classList.remove('hidden-view');
        initIcons();

        setTimeout(() => toast.classList.add('hidden-view'), 4000);
        if(activeViewId === 'view-home') renderDashboard();
    }

    let activeEmergencyShiftIndex = null;

    function showCbctEmergencyModal(gvCode, shiftIndex) {
        activeEmergencyGvCode = gvCode;
        activeEmergencyShiftIndex = shiftIndex;

        const gv = canBoCoiThiData.find(x => x.code === gvCode);
        const h = gv.history[shiftIndex];

        document.getElementById('emergency-old-gv').value = `${gv.name} (${gv.code}) - ${h.room}`;
        document.getElementById('emergency-new-code').value = '';
        document.getElementById('emergency-new-name').value = '';
        document.getElementById('emergency-reason').value = '';

        document.getElementById('modal-cbct-emergency').classList.remove('hidden-view');
    }

    function hideCbctEmergencyModal() {
        document.getElementById('modal-cbct-emergency').classList.add('hidden-view');
    }

    function autocompleteEmergencyGvName() {
        const code = document.getElementById('emergency-new-code').value.trim().toUpperCase();
        if (code === activeEmergencyGvCode) {
            document.getElementById('emergency-new-name').value = 'Trùng với giám thị hiện tại!';
            return;
        }
        const gv = canBoCoiThiData.find(x => x.code === code);
        if (gv) {
            document.getElementById('emergency-new-name').value = gv.name;
        } else {
            document.getElementById('emergency-new-name').value = '';
        }
    }

    function confirmCbctEmergencyExecute() {
        const newCode = document.getElementById('emergency-new-code').value.trim().toUpperCase();
        const newName = document.getElementById('emergency-new-name').value.trim();
        const reason = document.getElementById('emergency-reason').value.trim();

        if (newCode === "" || newName === "" || reason === "") {
            showGlobalToast("Lỗi nhập liệu", "Vui lòng điền đầy đủ thông tin giảng viên thay thế và lý do!", "error");
            return;
        }

        const oldGv = canBoCoiThiData.find(x => x.code === activeEmergencyGvCode);
        const targetShift = oldGv.history[activeEmergencyShiftIndex];

        // Xóa ca thi khỏi giảng viên cũ
        oldGv.history.splice(activeEmergencyShiftIndex, 1);

        // Thêm ca thi sang giảng viên mới
        const newGv = canBoCoiThiData.find(x => x.code === newCode);
        targetShift.confirmed = false; // Reset confirmed status on replacement
        newGv.history.push(targetShift);

        hideCbctEmergencyModal();
        showGlobalToast("Thành công", `Đã điều động cán bộ khẩn cấp ${newName} thay thế cho ca trực.`);
        renderCbctPhanCong();
    }

    function filterGioCoiData() {
        const donVi = document.getElementById('gc-filter-donvi').value;
        const search = document.getElementById('gc-search-gv').value.trim().toLowerCase();

        const tbody = document.getElementById('gc-table-tbody');
        tbody.innerHTML = '';

        let filtered = canBoCoiThiData.filter(gv => {
            const matchDonVi = donVi === "" || gv.donVi === donVi;
            const matchSearch = gv.name.toLowerCase().includes(search) || gv.code.toLowerCase().includes(search);
            return matchDonVi && matchSearch;
        });

        let grandTotalGV = filtered.length;
        let grandTotalCa = 0;
        let grandTotalGio = 0;
        let grandTotalMoney = 0;
        let hasUnconfirmed = false;

        // Kiểm tra xem trong toàn bộ giảng viên lọc được có ca trực nào chưa được xác nhận không
        filtered.forEach(gv => {
            gv.history.forEach(h => {
                if (!h.confirmed) hasUnconfirmed = true;
            });
        });

        // Ẩn/Hiện cảnh báo khóa xuất báo cáo
        const warningEl = document.getElementById('gc-warning-unconfirmed');
        const btnExcel = document.getElementById('btn-export-excel');
        const btnPdf = document.getElementById('btn-export-pdf');

        if (hasUnconfirmed) {
            warningEl.classList.remove('hidden-view');
            btnExcel.className = "bg-gray-400 text-white font-bold px-3 py-1.5 rounded text-xs cursor-not-allowed flex items-center gap-1.5 font-sans shadow-none";
            btnPdf.className = "bg-gray-400 text-white font-bold px-3 py-1.5 rounded text-xs cursor-not-allowed flex items-center gap-1.5 font-sans shadow-none";
        } else {
            warningEl.classList.add('hidden-view');
            btnExcel.className = "bg-green-600 text-white font-bold px-3 py-1.5 rounded text-xs shadow hover:bg-green-700 transition flex items-center gap-1.5 font-sans";
            btnPdf.className = "bg-[#9e1c22] text-white font-bold px-3 py-1.5 rounded text-xs shadow hover:bg-red-800 transition flex items-center gap-1.5 font-sans";
        }

        if (filtered.length === 0) {
            tbody.innerHTML = `<tr><td colspan="8" class="px-6 py-12 text-center text-gray-400 italic">Không tìm thấy cán bộ coi thi nào thỏa mãn bộ lọc.</td></tr>`;
        } else {
            filtered.forEach(gv => {
                const confirmedShifts = gv.history.filter(h => h.confirmed);
                const totalCa = gv.history.length;
                const totalGio = confirmedShifts.reduce((sum, h) => sum + h.hours, 0);
                const totalMoney = totalGio * gv.pricePerHour;

                grandTotalCa += totalCa;
                grandTotalGio += totalGio;
                grandTotalMoney += totalMoney;

                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50 transition-colors">
                        <td class="px-6 py-4 font-mono font-bold text-gray-800">${gv.code}</td>
                        <td class="px-6 py-4 font-semibold text-gray-900">${gv.name}</td>
                        <td class="px-6 py-4 text-gray-600">${gv.donVi}</td>
                        <td class="px-6 py-4 text-center font-bold text-indigo-700">${totalCa} ca</td>
                        <td class="px-6 py-4 text-center font-bold text-blue-900">${totalGio} giờ</td>
                        <td class="px-6 py-4 text-right text-gray-600">${gv.pricePerHour.toLocaleString()} VND</td>
                        <td class="px-6 py-4 text-right font-bold text-red-700">${totalMoney.toLocaleString()} VND</td>
                        <td class="px-6 py-4 text-center">
                            <button onclick="showGioCoiDetails('${gv.code}')" class="bg-blue-100 hover:bg-blue-200 text-blue-700 px-3 py-1 rounded font-bold text-[10px] transition-colors uppercase">Chi tiết</button>
                        </td>
                    </tr>
                `;
            });
        }

        document.getElementById('gc-stat-total-gv').innerText = `${grandTotalGV} người`;
        document.getElementById('gc-stat-total-ca').innerText = `${grandTotalCa} ca`;
        document.getElementById('gc-stat-total-gio').innerText = `${grandTotalGio} giờ`;
        document.getElementById('gc-stat-total-money').innerText = `${grandTotalMoney.toLocaleString()} VND`;
        if (typeof isStateLoaded !== "undefined" && isStateLoaded) saveStateToServer();
    }

    function showGioCoiDetails(code) {
        const gv = canBoCoiThiData.find(x => x.code === code);
        if (!gv) return;

        document.getElementById('gc-detail-name').innerText = gv.name;
        document.getElementById('gc-detail-code').innerText = `${gv.code} | Khoa ${gv.donVi}`;

        const tbody = document.getElementById('gc-detail-table-tbody');
        tbody.innerHTML = '';

        gv.history.forEach(h => {
            const statusStr = h.confirmed
                ? `<span class="bg-green-100 text-green-800 px-2 py-0.5 rounded text-[10px] font-bold">Đã xác nhận</span>`
                : `<span class="bg-yellow-100 text-yellow-800 px-2 py-0.5 rounded text-[10px] font-bold animate-pulse">Chờ xác nhận</span>`;

            tbody.innerHTML += `
                <tr class="hover:bg-gray-50 text-xs">
                    <td class="px-4 py-2.5 font-mono">${h.date}</td>
                    <td class="px-4 py-2.5">${h.shift}</td>
                    <td class="px-4 py-2.5 font-semibold">${h.subject}</td>
                    <td class="px-4 py-2.5 font-mono text-center">${h.room}</td>
                    <td class="px-4 py-2.5 text-center font-bold">${h.hours} giờ</td>
                    <td class="px-4 py-2.5 text-center">${statusStr}</td>
                </tr>
            `;
        });

        document.getElementById('modal-gc-details').classList.remove('hidden-view');
        initIcons();
    }

    function hideGioCoiDetailsModal() {
        document.getElementById('modal-gc-details').classList.add('hidden-view');
    }

    function exportGioCoiExcel() {
        let hasUnconfirmed = false;
        canBoCoiThiData.forEach(gv => {
            gv.history.forEach(h => {
                if (!h.confirmed) hasUnconfirmed = true;
            });
        });

        if (hasUnconfirmed) {
            showGlobalToast("Không thể xuất báo cáo", "Có ca coi thi chưa được Giảng viên xác nhận lịch! Vui lòng hoàn tất xác nhận lịch.", "error");
            return;
        }
        alert("Hệ thống đang chuẩn bị dữ liệu và xuất file thống kê 'Thong_Ke_Gio_Coi_Thi.xlsx'...");
    }

    function exportGioCoiPDF() {
        let hasUnconfirmed = false;
        canBoCoiThiData.forEach(gv => {
            gv.history.forEach(h => {
                if (!h.confirmed) hasUnconfirmed = true;
            });
        });

        if (hasUnconfirmed) {
            showGlobalToast("Không thể xuất báo cáo", "Có ca coi thi chưa được Giảng viên xác nhận lịch! Vui lòng hoàn tất xác nhận lịch.", "error");
            return;
        }
        alert("Hệ thống đang chuẩn bị dữ liệu và xuất file báo cáo 'Bao_Cao_Thanh_Toan_Gio_Coi_Thi.pdf'...");
    }
</script>
