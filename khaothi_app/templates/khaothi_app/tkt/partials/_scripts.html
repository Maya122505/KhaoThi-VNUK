<script>
    // ==========================================================
    // DỮ LIỆU MOCK (STATE MANAGEMENT)
    // ==========================================================
    let kyThiData = [];
    let caThiData = [];
    let phongThiGocData = [];
    let lichThiData = [];
    let hocPhiData = [];
    let lopThiDiemData = {};
    let phucKhaoData = [];
    let phieuGiaoNhanData = [];
    let tuiPhachData = [];
    let tuiPhachChiTietData = {};
    let canBoCoiThiData = [];
    let cbctCurrentPage = 1;
    const cbctPageSize = 10;
    let gcCurrentPage = 1;
    const gcPageSize = 10;
    
    let activeViewId = "view-home";
    let activeDslTab = "ds";
    let activeNhapDiemClassId = null;
    let activeNhapDiemBagId = null;
    let activePhucKhaoId = null;
    let activeGiaoNhanTab = "tao";
    let isNhapDiemCompared = false;
    let isNhapDiemPhachCompared = false;
    let activeNdMode = "phach";
    let isStateLoaded = false;
    let giaoNhanSelectedIds = new Set();
    let giaoNhanFilteredItems = [];
    let giaoNhanCurrentPage = 1;
    const giaoNhanPageSize = 10;

    async function loadStateFromServer() {
        try {
            const res = await fetch('/api/get_state/');
            const data = await res.json();

            phongThiGocData = data.phongThiGocData;
            tuiPhachData = data.tuiPhachData;
            phieuGiaoNhanData = data.phieuGiaoNhanData;
            canBoCoiThiData = data.canBoCoiThiData || [];
            phucKhaoData = data.phucKhaoData;
            kyThiData = data.kyThiData || [];
            caThiData = data.caThiData || [];
            lichThiData = data.lichThiData || [];
            hocPhiData = data.hocPhiData || [];
            lopThiDiemData = data.lopThiDiemData || {};
            isStateLoaded = true;

            // Build tuiPhachChiTietData dynamically from tuiPhachData
            tuiPhachChiTietData = {};
            tuiPhachData.forEach(bag => {
                tuiPhachChiTietData[bag.id] = {
                    password: bag.password || "123",
                    subjectName: bag.subjectName,
                    papers: bag.phachGoc.map((phach, idx) => {
                        const scoreObj = (bag.scores && bag.scores[phach]) || { grader1: null, grader2: null };
                        return {
                            stt: idx + 1,
                            phach: phach,
                            pt1: scoreObj.grader1,
                            pt2: scoreObj.grader2,
                            ptFinal: scoreObj.final || null,
                            originalPt1: scoreObj.grader1,
                            msv: `SV${(idx + 1).toString().padStart(3, '0')}`,
                            name: `Sinh viên ${(idx + 1).toString().padStart(3, '0')}`
                        };
                    })
                };
            });
        } catch(e) {
            console.error("Lỗi đồng bộ dữ liệu từ server:", e);
        }
    }

    async function saveStateToServer() {
        try {
            // Sync details from tuiPhachChiTietData back to tuiPhachData
            tuiPhachData.forEach(bag => {
                const detail = tuiPhachChiTietData[bag.id];
                if (detail && detail.papers) {
                    bag.scores = bag.scores || {};
                    detail.papers.forEach(p => {
                        bag.scores[p.phach] = bag.scores[p.phach] || { grader1: p.pt1, grader2: p.pt2 };
                        bag.scores[p.phach].grader1 = p.pt1;
                        bag.scores[p.phach].grader2 = p.pt2;
                        if (p.ptFinal !== null) {
                            bag.scores[p.phach].final = p.ptFinal;
                        }
                    });
                }
            });

            await fetch('/api/save_state/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    phongThiGocData,
                    tuiPhachData,
                    phieuGiaoNhanData,
                    canBoCoiThiData,
                    phucKhaoData,
                    kyThiData,
                    caThiData,
                    lichThiData,
                    hocPhiData,
                    lopThiDiemData
                })
            });
        } catch(e) {
            console.error("Lỗi lưu dữ liệu lên server:", e);
        }
    }
    window.onload = async function() {
        initIcons();
        await loadStateFromServer();
        const savedViewId = sessionStorage.getItem('tkt_activeViewId');
        navigate(savedViewId || 'view-home');
    };

    function initIcons() { lucide.createIcons(); }

    function navigate(viewId) {
        document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden-view'));
        const targetView = document.getElementById(viewId);
        if(targetView) targetView.classList.remove('hidden-view');
        sessionStorage.setItem('tkt_activeViewId', viewId);

        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.classList.remove('bg-[#801418]', 'border-[#005691]', 'font-bold');
            btn.classList.add('border-transparent');
        });
        closeAllDropdowns();

        activeViewId = viewId;
        let activeBtnId = 'nav-btn-home';
        if(viewId === 'view-ky-thi') activeBtnId = 'nav-btn-ky-thi';
        else if(viewId === 'view-danh-sach-lich') activeBtnId = 'nav-btn-danh-sach-lich';
        else if(viewId === 'view-nhap-diem') activeBtnId = 'nav-btn-nhap-diem';
        else if(viewId === 'view-phuc-khao') activeBtnId = 'nav-btn-phuc-khao';
        else if(viewId.includes('giao-nhan') || viewId.includes('nhan-bai') || viewId.includes('ban-giao-bai')) activeBtnId = 'nav-btn-giao-nhan';
        else if(viewId === 'view-gio-coi') activeBtnId = 'nav-btn-gio-coi';

        const activeBtn = document.getElementById(activeBtnId);
        if (activeBtn) {
            activeBtn.classList.remove('border-transparent');
            activeBtn.classList.add('bg-[#801418]', 'border-[#005691]', 'font-bold');
        }

        if(viewId === 'view-home') renderDashboard();
        else if(viewId === 'view-ky-thi') { populateCaThiSelectOptions(); renderCaThiList(); }
        else if(viewId === 'view-danh-sach-lich') { switchDslTab('ds'); }
        else if(viewId === 'view-nhap-diem') { resetViewNhapDiem(); }
        else if(viewId === 'view-phuc-khao') { renderPhucKhaoList(); }
        else if(viewId === 'view-nhan-bai' || viewId === 'view-ban-giao-bai') {
            if (viewId === 'view-nhan-bai') hideGnDetailNhan();
            renderGiaoNhan();
        }
        else if(viewId === 'view-gio-coi') { renderGioCoiThongKe(); }

        initIcons();
    }

    function navigateGiaoNhan(tab) {
        activeGnMode = tab;
        if (tab === 'nhan') navigate('view-nhan-bai');
        else navigate('view-ban-giao-bai');
    }
    window.navigateGiaoNhan = navigateGiaoNhan;

    function navigateGioCoi(tab) {
        sessionStorage.setItem('tkt_activeViewId', 'view-gio-coi');
        document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden-view'));
        const targetView = document.getElementById('view-gio-coi');
        if(targetView) targetView.classList.remove('hidden-view');
        
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.classList.remove('bg-[#801418]', 'border-[#005691]', 'font-bold');
            btn.classList.add('border-transparent');
        });
        closeAllDropdowns();
        activeViewId = 'view-gio-coi';
        const activeBtn = document.getElementById('nav-btn-gio-coi');
        if (activeBtn) {
            activeBtn.classList.remove('border-transparent');
            activeBtn.classList.add('bg-[#801418]', 'border-[#005691]', 'font-bold');
        }
        
        switchCbctTab(tab);
        initIcons();
    }
    window.navigateGioCoi = navigateGioCoi;

    function toggleDropdown(dropdownId, event) {
        event.stopPropagation();
        const dropdown = document.getElementById(dropdownId);
        const iconId = dropdownId.replace('dropdown-', 'icon-');
        const icon = document.getElementById(iconId);

        const isOpen = !dropdown.classList.contains('hidden-view');
        closeAllDropdowns();

        if (!isOpen) {
            dropdown.classList.remove('hidden-view');
            if (icon) icon.classList.add('rotate-180');
        }
    }
    window.toggleDropdown = toggleDropdown;

    function closeAllDropdowns() {
        document.querySelectorAll('.dropdown-menu').forEach(el => el.classList.add('hidden-view'));
        document.querySelectorAll('.nav-btn i').forEach(el => el.classList.remove('rotate-180'));
    }
    window.closeAllDropdowns = closeAllDropdowns;

    document.addEventListener('click', closeAllDropdowns);

    // ==========================================================
    // DASHBOARD RENDERING
    // ==========================================================
    function renderDashboard() {
        const countKyThi = kyThiData.length;
        const countLopChoLich = phongThiGocData.filter(p => p.status === "Chưa nhận bài").length;
        const countPhucKhaoPending = phucKhaoData.filter(p => p.status === "Chờ xử lý").length;
        const countPhieuChoNhan = phieuGiaoNhanData.filter(p => p.recipient === "tkt" && p.status === "Chờ bạn xác nhận").length;

        document.getElementById('dash-so-ky-thi').innerText = countKyThi;
        document.getElementById('dash-lop-cho-lich').innerText = countLopChoLich;
        document.getElementById('dash-don-phuc-khao').innerText = countPhucKhaoPending;
        document.getElementById('dash-phieu-cho-nhan').innerText = countPhieuChoNhan;

        const tbody = document.getElementById('dash-ky-thi-tbody');
        tbody.innerHTML = '';
        kyThiData.forEach(kt => {
            tbody.innerHTML += `
                <tr class="hover:bg-gray-50">
                    <td class="px-4 py-2.5 font-semibold text-[#9e1c22]">${kt.name}</td>
                    <td class="px-4 py-2.5 text-gray-700">${kt.year}</td>
                    <td class="px-4 py-2.5 text-center font-medium">${kt.semester}</td>
                    <td class="px-4 py-2.5 text-center font-bold">${kt.shiftsCount} ca thi</td>
                </tr>
            `;
        });

        // Dynamic notifications
        const notifContainer = document.getElementById('tkt-home-notifications');
        if (notifContainer) {
            notifContainer.innerHTML = '';
            
            // 1. Scan for rejected slips sent by TKT
            const rejectedSlips = phieuGiaoNhanData.filter(p => p.sender === "tkt" && p.status === "Bị từ chối");
            rejectedSlips.forEach(p => {
                notifContainer.innerHTML += `
                    <div class="p-3 bg-red-100 border border-red-300 rounded-lg flex gap-3 items-start cursor-pointer hover:bg-red-200 transition-colors animate-pulse" onclick="navigateGiaoNhan('tao')">
                        <div class="bg-red-600 p-1.5 rounded-full shadow-sm text-white shrink-0"><i data-lucide="alert-triangle" class="w-4 h-4"></i></div>
                        <div>
                            <h4 class="text-sm font-bold text-red-800 uppercase tracking-wide">⚠️ Phiếu bàn giao bị TỪ CHỐI!</h4>
                            <p class="text-xs text-red-700 mt-1 font-semibold">Phiếu <strong>${p.id}</strong> bị bên nhận từ chối nhận do phát hiện sai lệch kiểm đếm thực tế. Nhấp vào đây để lập phiếu bàn giao mới.</p>
                        </div>
                    </div>
                `;
            });

            // 2. Standard Notifications
            notifContainer.innerHTML += `
                <div class="p-3 bg-red-50 border border-red-100 rounded-lg flex gap-3 items-start cursor-pointer hover:bg-red-100 transition-colors" onclick="navigate('view-phuc-khao')">
                    <div class="bg-white p-1.5 rounded-full shadow-sm text-red-600 shrink-0"><i data-lucide="mail-warning" class="w-4 h-4"></i></div>
                    <div>
                        <h4 class="text-sm font-bold text-gray-800">Đơn phúc khảo mới [UC 11.1]</h4>
                        <p class="text-xs text-gray-600 mt-1">Hệ thống ghi nhận 2 đơn phúc khảo mới học phần ENG101. Vui lòng lập biên bản và rút túi chấm phúc khảo ẩn danh.</p>
                    </div>
                </div>
                <div class="p-3 bg-green-50 border border-green-100 rounded-lg flex gap-3 items-start cursor-pointer hover:bg-green-100 transition-colors" onclick="navigateGiaoNhan('nhan')">
                    <div class="bg-white p-1.5 rounded-full shadow-sm text-green-600 shrink-0"><i data-lucide="inbox" class="w-4 h-4"></i></div>
                    <div>
                        <h4 class="text-sm font-bold text-gray-800">Ký nhận hồ sơ phách [UC 16.2]</h4>
                        <p class="text-xs text-gray-600 mt-1">Thư ký đã hoàn tất rọc phách, đối chiếu và gửi trả đầu phách. Vui lòng ký nhận chốt lưu trữ.</p>
                    </div>
                </div>
            `;
            initIcons();
        }

        if (typeof isStateLoaded !== "undefined" && isStateLoaded) saveStateToServer();
    }

    // ==========================================================
    // UC 2.1 & 2.3: KỲ THI & CA THI
    // ==========================================================
    function handleCreateKyThi() {
        const ten = document.getElementById('kt-ten').value.trim();
        const nam = document.getElementById('kt-nam').value.trim();
        const hocky = document.getElementById('kt-hocky').value;
        const dot = document.getElementById('kt-dot').value.trim();
        const thoigian = document.getElementById('kt-thoigian').value.trim();
        const mota = document.getElementById('kt-mota').value.trim();

        if(!ten || !nam || !dot || !thoigian) {
            showGlobalToast("Lỗi nhập liệu", "Vui lòng nhập đầy đủ các trường bắt buộc!", "error");
            return;
        }

        const newId = `KT-${hocky.replace(' ', '')}-${Math.floor(100+Math.random()*900)}`;
        kyThiData.push({ id: newId, name: ten, year: nam, semester: hocky, duration: thoigian, dot: dot, mota: mota, shiftsCount: 0 });

        showGlobalToast("Thành công", "Tạo kỳ thi mới thành công!");
        populateCaThiSelectOptions();
        document.getElementById('kt-ten').value = '';
        document.getElementById('kt-nam').value = '';
        document.getElementById('kt-dot').value = '';
        document.getElementById('kt-thoigian').value = '';
        document.getElementById('kt-mota').value = '';
    }

    function populateCaThiSelectOptions() {
        const select = document.getElementById('ct-kythi-select');
        select.innerHTML = '';
        kyThiData.forEach(kt => {
            select.innerHTML += `<option value="${kt.id}">${kt.name} (${kt.semester})</option>`;
        });

        // Lịch thi tab selectors as well
        const selectLich = document.getElementById('dsl-lich-kythi');
        selectLich.innerHTML = '';
        kyThiData.forEach(kt => {
            selectLich.innerHTML += `<option value="${kt.id}">${kt.name} (${kt.semester})</option>`;
        });
        populateCaThiDropdown();
    }

    function handleCreateCaThi() {
        const kyThiId = document.getElementById('ct-kythi-select').value;
        const ten = document.getElementById('ct-ten').value.trim();
        const ngay = document.getElementById('ct-ngay').value;
        const gioBd = document.getElementById('ct-gio-bd').value;
        const gioKt = document.getElementById('ct-gio-kt').value;
        const ghiChu = document.getElementById('ct-ghichu').value.trim();

        if(!ten || !ngay || !gioBd || !gioKt) {
            showGlobalToast("Lỗi nhập liệu", "Vui lòng nhập đầy đủ các trường bắt buộc!", "error");
            return;
        }

        // Kiểm tra trùng giờ
        const conflict = caThiData.some(c => c.date === ngay && ((gioBd >= c.start && gioBd < c.end) || (gioKt > c.start && gioKt <= c.end)));
        if (conflict) {
            showGlobalToast("Xung đột thời gian", "Ca thi bị trùng giờ với ca thi khác đã lập!", "error");
            return;
        }

        const newId = `CT-${Math.floor(100+Math.random()*900)}`;
        caThiData.push({ id: newId, kyThiId: kyThiId, name: ten, date: ngay, start: gioBd, end: gioKt, note: ghiChu });

        const kt = kyThiData.find(x => x.id === kyThiId);
        if(kt) kt.shiftsCount++;

        showGlobalToast("Thành công", "Tạo ca thi mới thành công!");
        document.getElementById('ct-ten').value = '';
        document.getElementById('ct-ngay').value = '';
        document.getElementById('ct-gio-bd').value = '';
        document.getElementById('ct-gio-kt').value = '';
        document.getElementById('ct-ghichu').value = '';
        renderCaThiList();
    }

    function renderCaThiList() {
        const div = document.getElementById('ca-thi-list-div');
        div.innerHTML = '';
        if (caThiData.length === 0) {
            div.innerHTML = `<div class="text-center text-gray-400 py-6 italic">Chưa có ca thi nào được tạo.</div>`;
            return;
        }
        caThiData.forEach(c => {
            const kt = kyThiData.find(x => x.id === c.kyThiId);
            div.innerHTML += `
                <div class="border border-gray-200 rounded p-3 text-xs bg-gray-50 flex justify-between items-center shadow-sm">
                    <div>
                        <p class="font-bold text-blue-900">${c.name} - Ngày thi: ${c.date}</p>
                        <p class="text-gray-500 mt-1 font-semibold">Khung giờ: ${c.start} - ${c.end}</p>
                        <p class="text-gray-400 mt-0.5">${kt ? kt.name : ''} (${c.note || 'Không ghi chú'})</p>
                    </div>
                    <span class="bg-blue-100 text-blue-800 px-2 py-0.5 rounded font-bold">Hoạt động</span>
                </div>
            `;
        });
    }

    // ==========================================================
    // UC 15.1 & 14.1: DANH SÁCH & LỊCH THI
    // ==========================================================
    function switchDslTab(tab) {
        activeDslTab = tab;
        const btnDs = document.getElementById('btn-dsl-tab-ds');
        const btnLich = document.getElementById('btn-dsl-tab-lich');
        const tabDs = document.getElementById('dsl-tab-ds');
        const tabLich = document.getElementById('dsl-tab-lich');

        if(tab === 'ds') {
            btnDs.className = "bg-blue-900 text-white px-4 py-2 rounded text-sm font-semibold shadow";
            btnLich.className = "bg-gray-100 text-gray-700 px-4 py-2 rounded text-sm font-semibold hover:bg-gray-200";
            tabDs.classList.remove('hidden-view');
            tabLich.classList.add('hidden-view');
        } else {
            btnDs.className = "bg-gray-100 text-gray-700 px-4 py-2 rounded text-sm font-semibold hover:bg-gray-200";
            btnLich.className = "bg-blue-900 text-white px-4 py-2 rounded text-sm font-semibold shadow";
            tabDs.classList.add('hidden-view');
            tabLich.classList.remove('hidden-view');
            populateCaThiDropdown();
            renderLichThiTable();
        }
        initIcons();
    }

    function handleSyncDoiChieuHocPhi() {
        const tbody = document.getElementById('dsl-students-tbody');
        tbody.innerHTML = '';

        hocPhiData.forEach(s => {
            let statusBadge = `<span class="bg-green-100 text-green-800 px-2 py-0.5 rounded font-bold">Không nợ</span>`;
            let eligibleBadge = `<span class="text-green-600 font-bold">✓ Đủ điều kiện</span>`;
            if (s.debt > 0) {
                statusBadge = `<span class="bg-red-100 text-red-800 px-2 py-0.5 rounded font-bold">Nợ ${s.debt.toLocaleString()}đ</span>`;
                eligibleBadge = `<span class="text-red-600 font-bold">✗ CẤM THI</span>`;
            }

            tbody.innerHTML += `
                <tr class="hover:bg-gray-50">
                    <td class="px-4 py-2.5 font-mono font-semibold">${s.msv}</td>
                    <td class="px-4 py-2.5 font-medium text-gray-800">${s.name}</td>
                    <td class="px-4 py-2.5 font-mono text-gray-600">${s.class}</td>
                    <td class="px-4 py-2.5 text-center">${statusBadge}</td>
                    <td class="px-4 py-2.5 text-center">${eligibleBadge}</td>
                </tr>
            `;
        });
        showGlobalToast("Hoàn tất đối chiếu", "Đã đồng bộ học phí và cập nhật tình trạng cấm thi thành công!");
    }

    function handleSaveDanhSachThi() {
        showGlobalToast("Thành công", "Đã lưu và gửi phê duyệt danh sách thi chờ Trưởng phòng duyệt.");
    }

    function populateCaThiDropdown() {
        const kyThiId = document.getElementById('dsl-lich-kythi').value;
        const select = document.getElementById('dsl-lich-cathi');
        select.innerHTML = '';

        const list = caThiData.filter(c => c.kyThiId === kyThiId);
        list.forEach(c => {
            select.innerHTML += `<option value="${c.id}">${c.name} (${c.start}-${c.end})</option>`;
        });
    }

    function handleLậpLịchThiSubmit() {
        const cathiId = document.getElementById('dsl-lich-cathi').value;
        const subCode = document.getElementById('dsl-lich-subject').value;
        const subName = document.getElementById('dsl-lich-subject').options[document.getElementById('dsl-lich-subject').selectedIndex].text;
        const phong = document.getElementById('dsl-lich-phong').value;
        const gvName = document.getElementById('dsl-lich-giám-thị').options[document.getElementById('dsl-lich-giám-thị').selectedIndex].text;

        const ca = caThiData.find(x => x.id === cathiId);
        if(!ca) {
            showGlobalToast("Lỗi", "Vui lòng tạo ca thi trước!", "error");
            return;
        }

        // Kiểm tra trùng lịch phòng thi hoặc giảng viên trong ca thi đó
        const conflict = lichThiData.some(l => l.date === ca.date && l.shiftName === ca.name && (l.room === phong || l.teacher.includes(gvName)));
        if (conflict) {
            showGlobalToast("Xung đột phòng/giáo viên", "Phòng thi hoặc Giảng viên này đã được xếp trong khung giờ thi đó!", "error");
            return;
        }

        lichThiData.push({ subjectName: subName, date: ca.date, shiftName: ca.name, room: phong, teacher: gvName });

        // Xóa phòng khỏi danh sách phòng chưa nhận bài thi (giả lập liên kết)
        const matchedRoom = phongThiGocData.find(p => p.subjectId === subCode && p.status === "Chưa nhận bài");
        if (matchedRoom) matchedRoom.status = "Đã nhận bài";

        showGlobalToast("Thành công", "Lập lịch ca thi thành công!");
        renderLichThiTable();
        renderDashboard();
    }

    function renderLichThiTable() {
        const tbody = document.getElementById('dsl-lich-tbody');
        tbody.innerHTML = '';
        if(lichThiData.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" class="text-center text-gray-400 py-6 italic">Chưa có lịch thi nào được xếp.</td></tr>`;
            return;
        }
        lichThiData.forEach(l => {
            tbody.innerHTML += `
                <tr class="hover:bg-gray-50">
                    <td class="px-4 py-2.5 font-medium text-gray-800">${l.subjectName}</td>
                    <td class="px-4 py-2.5 font-mono text-gray-600">${l.date}</td>
                    <td class="px-4 py-2.5 font-semibold text-blue-900">${l.shiftName}</td>
                    <td class="px-4 py-2.5 font-mono text-center font-bold">${l.room}</td>
                    <td class="px-4 py-2.5 text-gray-700">${l.teacher}</td>
                </tr>
            `;
        });
    }

    // ==========================================================
    // UC 4.1: ĐỐI SOÁT NHẬP ĐIỂM LẦN 2
    // ==========================================================
    function resetViewNhapDiem() {

    function handleComparePhachPoints() {
        const list = tuiPhachChiTietData[activeNhapDiemBagId].papers;
        let hasBlank = false;
        let hasRangeError = false;

        for (let i = 0; i < list.length; i++) {
            const val = document.getElementById(`nd-phach-input-${i}`).value;
            if (val === '') {
                hasBlank = true;
            } else {
                const point = parseFloat(val);
                if (point < 0 || point > 10) hasRangeError = true;
            }
        }

        if (hasBlank) {
            showGlobalToast("Lỗi nhập điểm", "Không được bỏ trống điểm của bất kỳ mã phách nào!", "error");
            return;
        }
        if (hasRangeError) {
            showGlobalToast("Lỗi nhập điểm", "Điểm số nhập vào bắt buộc phải từ 0 đến 10!", "error");
            return;
        }

        let hasMismatch = false;

        for (let i = 0; i < list.length; i++) {
            const pt1Text = document.getElementById(`nd-phach-pt1-${i}`);
            const pt2Input = document.getElementById(`nd-phach-input-${i}`);
            const ptFinalInput = document.getElementById(`nd-phach-final-${i}`);

            pt1Text.innerText = list[i].pt1.toFixed(1);
            pt1Text.classList.remove('text-gray-400', 'italic');
            pt1Text.classList.add('text-gray-800');

            const pt2Val = parseFloat(pt2Input.value);
            list[i].pt2 = pt2Val;

            pt2Input.disabled = true;

            if (list[i].pt1 !== pt2Val) {
                hasMismatch = true;
                document.getElementById(`nd-phach-row-${i}`).className = "bg-red-50 hover:bg-red-100 transition-colors";
                ptFinalInput.disabled = false;
                ptFinalInput.classList.remove('bg-gray-50');
                ptFinalInput.classList.add('bg-white', 'border-red-500', 'ring-1', 'ring-red-400');
                ptFinalInput.value = '';
            } else {
                ptFinalInput.value = list[i].pt1.toFixed(1);
                list[i].ptFinal = list[i].pt1;
                document.getElementById(`nd-phach-row-${i}`).className = "hover:bg-gray-50 transition-colors";
            }
        }

        if (hasMismatch) {
            document.getElementById('nd-phach-error-block').classList.remove('hidden-view');
            document.getElementById('nd-phach-success-block').classList.add('hidden-view');
        } else {
            document.getElementById('nd-phach-error-block').classList.add('hidden-view');
            document.getElementById('nd-phach-success-block').classList.remove('hidden-view');
        }

        document.getElementById('nd-phach-btn-compare').disabled = true;
        document.getElementById('nd-phach-btn-compare').className = "flex-1 bg-gray-400 text-white font-bold py-3 rounded cursor-not-allowed flex justify-center items-center gap-2 text-xs";

        const btnSave = document.getElementById('nd-phach-btn-save');
        btnSave.disabled = false;
        btnSave.className = "flex-1 bg-[#9e1c22] text-white font-bold py-3 rounded shadow hover:bg-red-800 flex justify-center items-center gap-2 text-xs";
        isNhapDiemPhachCompared = true;
    }

    // UC 11.1 - 11.3: XỬ LÝ ĐƠN PHÚC KHẢO

    function renderPhucKhaoList() {
        const div = document.getElementById('pk-list-div');
        if(!div) return;
        div.innerHTML = '';

        // Populate subject options dropdown if empty
        const hpSelect = document.getElementById('pk-filter-hoc-phan');
        if(hpSelect && hpSelect.options.length <= 1) {
            const subjects = [...new Set(phucKhaoData.map(p => p.subjectName).filter(Boolean))];
            subjects.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s;
                opt.textContent = s;
                hpSelect.appendChild(opt);
            });
        }

        // Get filter values
        const hkVal = document.getElementById('pk-filter-hoc-ky')?.value || '';
        const hpVal = document.getElementById('pk-filter-hoc-phan')?.value || '';
        const dotVal = document.getElementById('pk-filter-dot-thi')?.value || '';
        const statusVal = document.getElementById('pk-filter-status')?.value || '';
        const searchVal = (document.getElementById('pk-filter-search')?.value || '').toLowerCase();

        // Update active filter text
        const activeTextSpan = document.getElementById('pk-active-filters-text');
        if (activeTextSpan) {
            let activeFilters = [];
            const hkSelect = document.getElementById('pk-filter-hoc-ky');
            if (hkSelect && hkSelect.selectedIndex > 0) activeFilters.push(hkSelect.options[hkSelect.selectedIndex].text);
            const dotSelect = document.getElementById('pk-filter-dot-thi');
            if (dotSelect && dotSelect.selectedIndex > 0) activeFilters.push(dotSelect.options[dotSelect.selectedIndex].text);
            if (hpSelect && hpSelect.selectedIndex > 0) activeFilters.push(hpSelect.options[hpSelect.selectedIndex].text);
            const statusSelect = document.getElementById('pk-filter-status');
            if (statusSelect && statusSelect.selectedIndex > 0) activeFilters.push(statusSelect.options[statusSelect.selectedIndex].text.split('/')[0].trim());

            if (activeFilters.length > 0) {
                activeTextSpan.innerText = 'Đang lọc: ' + activeFilters.join(', ');
            } else {
                activeTextSpan.innerText = 'Đang xem: Tất cả đơn phúc khảo';
            }
        }

        let filtered = phucKhaoData.filter(p => {
            if (statusVal) {
                if (statusVal === 'Chờ xử lý' && p.status !== 'Chờ xử lý' && p.status !== 'ChoXuLy') return false;
                if (statusVal === 'Đang xử lý' && p.status !== 'Đang xử lý' && p.status !== 'Đã rút bài') return false;
                if (statusVal === 'Đã hoàn thành' && p.status !== 'Đã hoàn thành' && p.status !== 'Đã xử lý' && p.status !== 'DaXuLy' && p.status !== 'Đã phê duyệt phúc khảo' && p.status !== 'DaPheDuyet') return false;
            }
            if (hkVal && p.semester !== hkVal) return false;
            if (dotVal && p.dot !== dotVal) return false;
            if (hpVal && p.subjectName !== hpVal) return false;
            if (searchVal) {
                const text = `${p.id} ${p.name} ${p.msv} ${p.phach} ${p.subjectName}`.toLowerCase();
                if (!text.includes(searchVal)) return false;
            }
            return true;
        });

        const badgeEl = document.getElementById('pk-count-badge');
        if (badgeEl) badgeEl.innerText = `${filtered.length} đơn`;

        if(filtered.length === 0) {
            div.innerHTML = `<div class="text-center text-gray-400 py-12 text-xs italic">Không có đơn phúc khảo nào phù hợp với bộ lọc.</div>`;
            return;
        }

        filtered.forEach(p => {
            let badge = `<span class="bg-red-100 text-red-800 px-2 py-0.5 rounded text-[10px] font-bold">Chờ xử lý</span>`;
            if(p.status === "Đang xử lý") badge = `<span class="bg-yellow-100 text-yellow-800 px-2 py-0.5 rounded text-[10px] font-bold">Đang xử lý</span>`;
            else if(p.status === "Đã rút bài") badge = `<span class="bg-amber-100 text-amber-800 px-2 py-0.5 rounded text-[10px] font-bold">✓ Đã rút bài</span>`;
            else if(p.status === "Đã hoàn thành" || p.status === "Đã xử lý" || p.status === "DaXuLy") badge = `<span class="bg-blue-100 text-blue-800 px-2 py-0.5 rounded text-[10px] font-bold">Đã xử lý</span>`;
            else if(p.status === "Đã phê duyệt phúc khảo" || p.status === "DaPheDuyet") badge = `<span class="bg-green-100 text-green-800 px-2 py-0.5 rounded text-[10px] font-bold">✓ Đã phê duyệt</span>`;

            const oldPtVal = (p.originalPt1 !== undefined && p.originalPt1 !== null) ? Number(p.originalPt1).toFixed(1) : (p.oldPt !== undefined ? Number(p.oldPt).toFixed(1) : '--');

            div.innerHTML += `
                <div onclick="selectPhucKhaoRequest('${p.id}')" class="group p-4 border border-gray-200 rounded-xl bg-white hover:border-blue-400 hover:shadow-md hover:-translate-y-0.5 cursor-pointer transition-all text-sm relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-1 h-full bg-blue-500 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                    <div class="flex justify-between items-start mb-2">
                        <span class="font-bold text-gray-900 font-mono flex items-center gap-1.5"><i data-lucide="file-text" class="w-4 h-4 text-gray-400 group-hover:text-blue-500 transition-colors"></i> ${p.id}</span>
                        ${badge}
                    </div>
                    <p class="text-gray-800 font-semibold mb-1 truncate" title="${p.subjectName}">${p.subjectName}</p>
                    <div class="flex items-center gap-2 text-xs text-gray-500 mt-2 bg-gray-50/50 p-2 rounded-lg border border-gray-100">
                        <i data-lucide="user" class="w-3.5 h-3.5 text-gray-400"></i>
                        <span class="truncate" title="${p.name} (${p.msv})">${p.name} (${p.msv})</span>
                        <span class="mx-auto"></span>
                        <span class="font-bold px-1.5 py-0.5 bg-gray-200/50 rounded text-gray-600">Điểm: ${oldPtVal}</span>
                    </div>
                </div>
            `;
        });
        initIcons();
    }

    function selectPhucKhaoRequest(pkId) {
        activePhucKhaoId = pkId;
        const pk = phucKhaoData.find(x => x.id === pkId);
        if(!pk) return;
        if(pk.status === "Chờ xử lý") pk.status = "Đang xử lý";
        renderPhucKhaoList();

        document.getElementById('pk-empty-view').classList.add('hidden-view');
        document.getElementById('pk-process-view').classList.remove('hidden-view');
        document.getElementById('pk-active-mon').innerText = pk.subjectName;

        // Display Bag info
        const targetPhach = pk.phach || 'PH001';
        const numPart = targetPhach.replace(/\D/g, '') || '001';
        const numVal = parseInt(numPart) || 1;
        const tuiBaiCode = pk.tuiBai || `TB-${numPart}`;
        const tuiPhachCode = pk.tuiPhach || `TP-${targetPhach}`;

        const tuiBaiEl = document.getElementById('pk-info-tui-bai');
        const tuiPhachEl = document.getElementById('pk-info-tui-phach');
        if (tuiBaiEl) tuiBaiEl.innerText = `${tuiBaiCode} (Cùng 1 túi bài thi)`;
        if (tuiPhachEl) tuiPhachEl.innerText = tuiPhachCode;
        
        const rutStatusEl = document.getElementById('pk-info-trang-thai-rut');
        const rutBtn = document.getElementById('pk-btn-rut-bai');

        if(pk.status === "Chờ xử lý" || pk.status === "Đang xử lý") {
            if(rutStatusEl) {
                rutStatusEl.innerText = "Chưa rút bài";
                rutStatusEl.className = "font-bold text-amber-700";
            }
            if(rutBtn) {
                rutBtn.innerText = "Xác nhận rút 4 bài thi & Lập biên bản";
                rutBtn.disabled = false;
                rutBtn.className = "bg-amber-600 hover:bg-amber-700 text-white px-2.5 py-1 rounded font-bold shadow text-[11px] flex items-center gap-1";
                rutBtn.classList.remove('hidden-view');
            }
        } else {
            if(rutStatusEl) {
                rutStatusEl.innerText = "✓ Đã rút 4 bài thi cứng khỏi kho";
                rutStatusEl.className = "font-bold text-green-700";
            }
            if(rutBtn) {
                rutBtn.classList.add('hidden-view');
            }
        }

        const workflowStatusEl = document.getElementById('pk-workflow-status');
        const scoreInputEl = document.getElementById('pk-score-input-section');
        const btnLuuDiemEl = document.getElementById('pk-btn-luu-diem');
        const wfTitle = document.getElementById('pk-workflow-title');
        const wfDesc = document.getElementById('pk-workflow-desc');
        const wfIcon = document.getElementById('pk-workflow-icon');
        const btnChuyenGiao = document.getElementById('pk-btn-chuyen-giao-nhan');

        // Reset display
        workflowStatusEl.classList.add('hidden-view');
        scoreInputEl.classList.remove('hidden-view');
        btnLuuDiemEl.classList.add('hidden-view');
        
        let inputsDisabled = true;

        if (pk.status === "Đã rút bài - Chờ bàn giao DVCM") {
            workflowStatusEl.classList.remove('hidden-view');
            wfTitle.innerText = "Đã rút bài - Chờ bàn giao";
            wfDesc.innerText = "Bài thi đã được rút khỏi kho. Vui lòng chuyển sang chức năng Giao nhận để tạo phiếu bàn giao (Loại 4) cho Đơn vị chuyên môn (Khoa).";
            wfIcon.setAttribute('data-lucide', 'truck');
            wfIcon.className = "w-5 h-5 text-yellow-600 shrink-0 mt-0.5";
            btnChuyenGiao.classList.remove('hidden-view');
            workflowStatusEl.className = "bg-yellow-50 border border-yellow-200 p-4 rounded-lg flex items-start gap-3";
        } else if (pk.status === "Đang chấm phúc khảo") {
            workflowStatusEl.classList.remove('hidden-view');
            wfTitle.innerText = "Đang xử lý tại Khoa";
            wfDesc.innerText = "Hồ sơ phúc khảo đang được luân chuyển và tổ chức chấm tại Đơn vị chuyên môn. Vui lòng chờ Khoa trả lại bài để nhập điểm.";
            wfIcon.setAttribute('data-lucide', 'refresh-cw');
            wfIcon.className = "w-5 h-5 text-blue-600 shrink-0 mt-0.5 animate-spin-slow";
            btnChuyenGiao.classList.add('hidden-view');
            workflowStatusEl.className = "bg-blue-50 border border-blue-200 p-4 rounded-lg flex items-start gap-3";
        } else if (pk.status === "Đã trả bài - Chờ nhập điểm") {
            inputsDisabled = false;
            btnLuuDiemEl.classList.remove('hidden-view');
        } else if (pk.status === "Đã hoàn thành" || pk.status === "Đã xử lý" || pk.status === "Đã phê duyệt phúc khảo") {
            inputsDisabled = true;
        } else if (pk.status === "Chờ xử lý") {
            inputsDisabled = true;
        }

        const tbody = document.getElementById('pk-tbody');
        tbody.innerHTML = '';

        const oldPtVal = (pk.originalPt1 !== undefined && pk.originalPt1 !== null) ? Number(pk.originalPt1) : (pk.oldPt || 0);

        // Fetch other papers from the EXACT SAME BAG (gồm 1 bài phúc khảo và 3 bài đối chứng)
        let bagPhachList = [];
        const bag = tuiPhachData.find(b => b.phachGoc && b.phachGoc.includes(targetPhach));
        if (bag && bag.phachGoc) {
            bagPhachList = bag.phachGoc.filter(p => p !== targetPhach);
        }

        const otherPhach1 = bagPhachList.length > 0 ? bagPhachList[0] : `PH${String(Math.max(1, numVal - 1)).padStart(3, '0')}`;
        const otherPhach2 = bagPhachList.length > 1 ? bagPhachList[1] : `PH${String(numVal + 1).padStart(3, '0')}`;
        const otherPhach3 = bagPhachList.length > 2 ? bagPhachList[2] : `PH${String(numVal + 2).padStart(3, '0')}`;

        // Exactly 4 papers drawn from the SAME exam bag (with similar scores)
        const mockRows = [
            { phach: targetPhach, oldPt: oldPtVal, isTarget: true },
            { phach: otherPhach1, oldPt: Math.min(10, Math.max(0, oldPtVal - 0.5)), isTarget: false },
            { phach: otherPhach2, oldPt: Math.min(10, Math.max(0, oldPtVal + 0.5)), isTarget: false },
            { phach: otherPhach3, oldPt: Math.min(10, Math.max(0, oldPtVal + 0.25)), isTarget: false }
        ];

        mockRows.sort(() => Math.random() - 0.5);

        mockRows.forEach((r, idx) => {
            const targetIndicator = r.isTarget ? 'data-target="true"' : '';
            const existingVal = r.isTarget && pk.ptFinal !== undefined && pk.ptFinal !== null ? pk.ptFinal : '';
            const disableAttr = inputsDisabled ? 'disabled' : '';
            const styleAttr = inputsDisabled ? 'class="w-32 p-1.5 border border-transparent rounded text-center font-bold text-gray-500 bg-gray-50"' : 'class="w-32 p-1.5 border border-gray-300 rounded text-center font-bold focus:border-red-800 outline-none bg-white"';
            
            tbody.innerHTML += `
                <tr class="hover:bg-gray-50 text-xs ${r.isTarget ? 'bg-blue-50/30 font-semibold' : ''}" ${targetIndicator} id="pk-row-${idx}">
                    <td class="px-4 py-3 font-mono font-bold text-gray-700">${r.phach} ${r.isTarget ? '<span class="text-[10px] text-blue-600 font-sans">(Đơn phúc khảo)</span>' : '<span class="text-[10px] text-gray-400 font-sans">(Bài đối chứng cùng túi)</span>'}</td>
                    <td class="px-4 py-3 text-center font-bold text-gray-500">${r.oldPt.toFixed(1)}</td>
                    <td class="px-4 py-3 text-center">
                        <input type="number" id="pk-input-${idx}" min="0" max="10" step="0.1" value="${existingVal}" placeholder="--" ${styleAttr} ${disableAttr} />
                    </td>
                </tr>
            `;
        });
        initIcons();
        if (typeof isStateLoaded !== "undefined" && isStateLoaded) saveStateToServer();
    }

    function confirmRutBaiThi() {
        const pk = phucKhaoData.find(x => x.id === activePhucKhaoId);
        if(!pk) return;
        pk.status = "Đã rút bài - Chờ bàn giao DVCM";
        showGlobalToast("Đã rút bài", `Đã rút bài thi cứng và cập nhật trạng thái đơn ${pk.id}. Bạn có thể tạo phiếu bàn giao.`);
        selectPhucKhaoRequest(pk.id);
    }


    function handlePrintBiênBảnPhúcKhảo() {

        if(!pk) return;

        document.getElementById('print-time-stamp').innerText = `Mã đơn: ${pk.id} | Ngày lập: ${new Date().toLocaleDateString()}`;

        alert("Đang kết nối máy in và xuất bản file biên bản phúc khảo dạng PDF...");
        hidePkPrintModal();

    function handleSavePhucKhaoPoint() {
        const pk = phucKhaoData.find(x => x.id === activePhucKhaoId);
        let targetInputVal = null;
        let hasBlank = false;
        let hasRangeError = false;

        const tableRows = document.querySelectorAll('#pk-tbody tr');
        tableRows.forEach(tr => {
            const isTarget = tr.getAttribute('data-target') === 'true';
            const inputEl = tr.cells[2].querySelector('input');

            if (inputEl.value === '') {
                hasBlank = true;
            } else {
                const point = parseFloat(inputEl.value);
                if(point < 0 || point > 10) hasRangeError = true;
                if(isTarget) targetInputVal = point;
            }
        });

        if (hasBlank) {
            showGlobalToast("Lỗi lưu điểm", "Vui lòng nhập đầy đủ điểm phúc khảo cho các bài rút ra!", "error");
            return;
        }
        if (hasRangeError) {
            showGlobalToast("Lỗi lưu điểm", "Điểm số bắt buộc từ 0 đến 10!", "error");
            return;
        }

        pk.status = "Đã hoàn thành";
        pk.ptFinal = targetInputVal;
        pk.oldPt = targetInputVal;

        if (typeof isStateLoaded !== "undefined" && isStateLoaded) saveStateToServer();

        showGlobalToast("Thành công", "Đã lưu điểm phúc khảo và chốt điều chỉnh điểm số học sinh!");
        document.getElementById('pk-empty-view').classList.remove('hidden-view');
        document.getElementById('pk-process-view').classList.add('hidden-view');
        renderPhucKhaoList();
        renderDashboard();
    }


    function switchGiaoNhanTab(tab) {
        activeGiaoNhanTab = tab;
        const tabs = ['tao', 'nhan', 'lich-su'];

        tabs.forEach(t => {
            const btn = document.getElementById(`tab-btn-${t}`);
            const content = document.getElementById(`tab-content-${t}`);
            if(!btn || !content) return;

            btn.className = "text-left px-4 py-3 rounded font-semibold transition flex items-center gap-2 text-gray-600 hover:bg-gray-100 font-sans shadow-none";
            content.classList.add('hidden-view');

            if (t === tab) {
                if(t === 'nhan') btn.className = "text-left px-4 py-3 rounded font-semibold transition flex items-center gap-2 bg-green-100 text-green-800 shadow-sm";
                else if (t === 'tao') btn.className = "text-left px-4 py-3 rounded font-semibold transition flex items-center gap-2 bg-blue-100 text-blue-800 shadow-sm";
                else btn.className = "text-left px-4 py-3 rounded font-semibold transition flex items-center gap-2 bg-gray-200 text-gray-800 shadow-sm";
                content.classList.remove('hidden-view');
            }
        });

        if(tab === 'nhan') hideGnDetailNhan();
        renderGiaoNhan();
    }

    function populateGiaoNhanFilterSubjects(items, getSubjectFn) {
        const select = document.getElementById('gn-filter-subject');
        if (!select) return;
        const subjects = new Set();
        items.forEach(item => {
            const sName = getSubjectFn(item).split(' (')[0];
            if (sName) subjects.add(sName);
        });
        select.innerHTML = '<option value="">Tất cả Học phần</option>';
        Array.from(subjects).sort().forEach(s => {
            select.innerHTML += `<option value="${s}">${s}</option>`;
        });
        const searchInput = document.getElementById('gn-filter-search');
        if (searchInput) searchInput.value = '';
    }

    window.changeGiaoNhanPage = function(delta) {
        giaoNhanCurrentPage += delta;
        const totalPages = Math.ceil(giaoNhanFilteredItems.length / giaoNhanPageSize) || 1;
        if (giaoNhanCurrentPage < 1) giaoNhanCurrentPage = 1;
        if (giaoNhanCurrentPage > totalPages) giaoNhanCurrentPage = totalPages;
        renderGiaoNhanPage();
    }

    window.handleGiaoNhanCheckboxChange = function(el) {
        if (el.checked) {
            giaoNhanSelectedIds.add(el.value);
        } else {
            giaoNhanSelectedIds.delete(el.value);
        }
    }

    window.filterGiaoNhanList = function() {
        const searchVal = document.getElementById('gn-filter-search').value.toLowerCase().trim();
        const subjectVal = document.getElementById('gn-filter-subject').value;
        const loai = document.getElementById('select-pbg-loai').value;

        let source = [];
        if (loai === "1") {
            source = phongThiGocData.filter(p => p.status === "Chưa nhận bài");
        } else if (loai === "2") {
            source = tuiPhachData;
        } else if (loai === "7") {
            source = phucKhaoData;
        }

        giaoNhanFilteredItems = source.filter(item => {
            const sName = (item.subjectName || '').split(' (')[0];
            const matchesSearch = !searchVal || 
                (item.id || '').toLowerCase().includes(searchVal) || 
                (item.subjectName || '').toLowerCase().includes(searchVal) ||
                (item.phach || '').toLowerCase().includes(searchVal);
            const matchesSubject = !subjectVal || sName === subjectVal;
            return matchesSearch && matchesSubject;
        });

        giaoNhanCurrentPage = 1;
        renderGiaoNhanPage();
    }

    function renderGiaoNhanPage() {
        const listDiv = document.getElementById('gn-list-phong-goc');
        if (!listDiv) return;
        listDiv.innerHTML = '';

        const loai = document.getElementById('select-pbg-loai').value;
        const totalPages = Math.ceil(giaoNhanFilteredItems.length / giaoNhanPageSize) || 1;
        if (giaoNhanCurrentPage > totalPages) giaoNhanCurrentPage = totalPages;

        const start = (giaoNhanCurrentPage - 1) * giaoNhanPageSize;
        const end = start + giaoNhanPageSize;
        const pageItems = giaoNhanFilteredItems.slice(start, end);

        if (pageItems.length === 0) {
            listDiv.innerHTML = `<div class="col-span-full text-xs text-gray-400 italic text-center py-12 bg-white rounded-lg border border-dashed border-gray-200">Không tìm thấy mục nào phù hợp.</div>`;
        } else {
            pageItems.forEach(item => {
                const isChecked = giaoNhanSelectedIds.has(item.id);
                let labelContent = '';
                let iconName = 'door-open';
                let iconColor = 'text-blue-600';
                let bgBadge = 'bg-blue-50 text-blue-700 border-blue-100';

                if (loai === "1") {
                    iconName = 'door-open';
                    iconColor = 'text-blue-600';
                    bgBadge = 'bg-blue-50 text-blue-700 border-blue-100';
                    labelContent = `
                        <div class="flex flex-col gap-0.5">
                            <span class="font-extrabold text-slate-800 text-[12.5px] tracking-wide leading-tight">${item.id}</span>
                            <span class="text-slate-500 text-[11px] font-sans font-medium line-clamp-1 leading-normal">${item.subjectName}</span>
                            <span class="inline-flex items-center w-fit px-1.5 py-0.5 rounded text-[10px] font-bold font-sans border ${bgBadge} mt-1">${item.papers} bài</span>
                        </div>
                    `;
                } else if (loai === "2") {
                    iconName = 'package';
                    iconColor = 'text-amber-600';
                    bgBadge = 'bg-amber-50 text-amber-700 border-amber-100';
                    labelContent = `
                        <div class="flex flex-col gap-0.5">
                            <span class="font-extrabold text-slate-800 text-[12.5px] tracking-wide leading-tight">${item.id}</span>
                            <span class="text-slate-500 text-[11px] font-sans font-medium line-clamp-1 leading-normal">${item.subjectName}</span>
                            <span class="inline-flex items-center w-fit px-1.5 py-0.5 rounded text-[10px] font-bold font-sans border ${bgBadge} mt-1">${item.papers} bài thi</span>
                        </div>
                    `;
                } else if (loai === "7") {
                    iconName = 'check-square';
                    iconColor = 'text-purple-600';
                    bgBadge = 'bg-purple-50 text-purple-700 border-purple-100';
                    labelContent = `
                        <div class="flex flex-col gap-0.5">
                            <span class="font-extrabold text-slate-800 text-[12.5px] tracking-wide leading-tight">${item.id}</span>
                            <span class="text-slate-500 text-[11px] font-sans font-medium line-clamp-1 leading-normal">${item.subjectName}</span>
                            <span class="inline-flex items-center w-fit px-1.5 py-0.5 rounded text-[10px] font-bold font-sans border ${bgBadge} mt-1">Bài phách: ${item.phach}</span>
                        </div>
                    `;
                }

                const checkedClasses = isChecked 
                    ? 'bg-blue-50/50 border-blue-500 ring-1 ring-blue-500/20' 
                    : 'bg-white border-slate-200 hover:border-blue-400 hover:bg-slate-50/30';

                listDiv.innerHTML += `
                    <label class="gn-item flex items-start gap-3 p-3 rounded-lg border cursor-pointer transition-all duration-150 shadow-sm ${checkedClasses}">
                        <div class="flex items-center h-5 mt-0.5">
                            <input type="checkbox" value="${item.id}" onchange="handleGiaoNhanCheckboxChange(this)" ${isChecked ? 'checked' : ''} class="w-3.5 h-3.5 text-blue-600 rounded border-gray-300 focus:ring-blue-500" />
                        </div>
                        <div class="flex-1 min-w-0">
                            ${labelContent}
                        </div>
                        <div class="shrink-0 bg-slate-100 p-2 rounded-lg text-slate-500 flex items-center justify-center">
                            <i data-lucide="${iconName}" class="w-4 h-4 ${iconColor}"></i>
                        </div>
                    </label>
                `;
            });
        }

        // Update pagination info
        document.getElementById('gn-pagination-info').innerText = `Trang ${giaoNhanCurrentPage} / ${totalPages}`;
        document.getElementById('gn-btn-prev').disabled = giaoNhanCurrentPage === 1;
        document.getElementById('gn-btn-next').disabled = giaoNhanCurrentPage === totalPages;
        initIcons();
    }

    function handleGiaoNhanLoaiChange() {
        const loai = document.getElementById('select-pbg-loai').value;
        const selectUser = document.getElementById('select-pbg-user');

        selectUser.innerHTML = '';

        let source = [];
        if (loai === "1") {
            selectUser.innerHTML = `<option value="TK_KhaoThi01">Thư ký Chấm thi (TK_KhaoThi01)</option>`;
            source = phongThiGocData.filter(p => p.status === "Chưa nhận bài");
        } else if (loai === "2") {
            selectUser.innerHTML = `<option value="GV_Khoa01">Giáo vụ Khoa (GV_Khoa01)</option>`;
            source = tuiPhachData;
        } else if (loai === "7") {
            selectUser.innerHTML = `<option value="GV_Khoa01">Giáo vụ Khoa (GV_Khoa01)</option>`;
            source = phucKhaoData.filter(p => p.status === "Đã rút bài - Chờ bàn giao DVCM");
        }

        populateGiaoNhanFilterSubjects(source, item => item.subjectName);
        giaoNhanSelectedIds.clear();

        filterGiaoNhanList();
        initIcons();
    }

    function renderGiaoNhan() {
        // Populate checklist
        handleGiaoNhanLoaiChange();

        // 1. Phiếu nhận chờ duyệt
        const listNhanDiv = document.getElementById('gn-list-cho-nhan');
        const badge = document.getElementById('badge-cho-nhan');
        
        if (listNhanDiv) {
            listNhanDiv.innerHTML = '';
            const pendingNhan = phieuGiaoNhanData.filter(p => p.recipient === "tkt" && p.status === "Chờ bạn xác nhận");

            if (pendingNhan.length === 0) {
                listNhanDiv.innerHTML = `<div class="text-center text-gray-400 py-12 italic text-sm">Không có phiếu bàn giao nào đang chờ bạn kiểm nhận.</div>`;
                if (badge) badge.classList.add('hidden-view');
            } else {
                if (badge) {
                    badge.classList.remove('hidden-view');
                    badge.innerText = pendingNhan.length;
                }

                pendingNhan.forEach(p => {
                    listNhanDiv.innerHTML += `
                        <div class="border border-green-200 bg-green-50/50 rounded-xl p-5 flex justify-between items-center hover:shadow-md hover:bg-green-50 transition-all cursor-pointer mb-3" onclick="showGnDetailNhan('${p.id}')">
                            <div class="flex gap-4 items-center">
                                <div class="bg-white p-3 rounded-xl text-green-600 shadow-sm border border-green-100"><i data-lucide="file-text" class="w-6 h-6"></i></div>
                                <div>
                                    <div class="flex items-center gap-2">
                                        <span class="font-mono font-bold text-gray-900 text-base">${p.id}</span>
                                        <span class="bg-blue-100 text-blue-800 text-[10px] px-2 py-0.5 rounded-full font-bold">Túi phách / Đầu phách</span>
                                    </div>
                                    <p class="text-xs text-gray-500 mt-1 flex items-center gap-1"><i data-lucide="arrow-right-left" class="w-3.5 h-3.5"></i> Tuyến: <strong>${p.flow}</strong></p>
                                </div>
                            </div>
                            <button onclick="event.stopPropagation(); showGnDetailNhan('${p.id}')" class="bg-green-600 hover:bg-green-700 text-white px-5 py-2.5 rounded-lg font-bold text-xs shadow-sm hover:shadow flex items-center gap-1.5 font-sans transition-all">
                                KIỂM ĐẾM <i data-lucide="chevron-right" class="w-4 h-4"></i>
                            </button>
                        </div>
                    `;
                });
            }
        }

        // 2. Lịch sử nhận bài (recipient = tkt)
        const histNhanTbody = document.getElementById('gn-lich-su-nhan-tbody');
        if (histNhanTbody) {
            histNhanTbody.innerHTML = '';
            const tktReceipts = phieuGiaoNhanData.filter(p => p.recipient === "tkt");
            tktReceipts.forEach(p => {
                let stBadge = `<span class="bg-yellow-100 text-yellow-800 px-2 py-0.5 rounded text-xs font-bold">${p.status}</span>`;
                let rejectInfo = "";

    function showGlobalToast(title, msg, type = 'success') {
        const toast = document.getElementById('toast-global');
        const icon = document.getElementById('toast-global-icon');

        toast.className = "hidden-view fixed bottom-6 right-6 text-white px-6 py-4 rounded shadow-xl flex items-center gap-3 animate-fade-in-up z-[200]";

        if (type === 'error') {
            toast.classList.add('bg-red-600');
            icon.setAttribute('data-lucide', 'alert-circle');
        } else if (type === 'warning') {
            toast.classList.add('bg-yellow-500');
            icon.setAttribute('data-lucide', 'alert-triangle');
        } else {
            toast.classList.add('bg-green-600');
            icon.setAttribute('data-lucide', 'check-circle-2');
        }

        document.getElementById('toast-global-title').innerText = title;
        document.getElementById('toast-global-msg').innerText = msg || '';
        toast.classList.remove('hidden-view');
        initIcons();

        setTimeout(() => toast.classList.add('hidden-view'), 4000);
        if(activeViewId === 'view-home') renderDashboard();
    }

    function renderCbctPhanCong() {
        const tbody = document.getElementById('cbct-phan-cong-tbody');
        tbody.innerHTML = '';

        // Flatten all shift history items into a single array
        let allShifts = [];
        canBoCoiThiData.forEach(gv => {
            gv.history.forEach((h, index) => {
                allShifts.push({
                    gvCode: gv.code,
                    gvName: gv.name,
                    shiftIndex: index,
                    ...h
                });
            });
        });

        // Paginate allShifts
        const totalItems = allShifts.length;
        const totalPages = Math.ceil(totalItems / cbctPageSize) || 1;

        if (cbctCurrentPage > totalPages) cbctCurrentPage = totalPages;
        if (cbctCurrentPage < 1) cbctCurrentPage = 1;

        const startIdx = (cbctCurrentPage - 1) * cbctPageSize;
        const endIdx = startIdx + cbctPageSize;
        const paginatedShifts = allShifts.slice(startIdx, endIdx);

        // Update pagination UI
        const infoEl = document.getElementById('cbct-pagination-info');
        if (infoEl) infoEl.innerText = `Trang ${cbctCurrentPage} / ${totalPages} (Tổng cộng ${totalItems} ca)`;

        const btnPrev = document.getElementById('cbct-btn-prev');
        const btnNext = document.getElementById('cbct-btn-next');
        if (btnPrev) btnPrev.disabled = cbctCurrentPage === 1;
        if (btnNext) btnNext.disabled = cbctCurrentPage === totalPages;

        if (paginatedShifts.length === 0) {
            tbody.innerHTML = `<tr><td colspan="8" class="px-6 py-8 text-center text-gray-400 italic">Không có ca thi nào được phân công.</td></tr>`;
            return;
        }

        paginatedShifts.forEach(item => {
            const statusBadge = item.confirmed
                ? `<span class="bg-green-100 text-green-800 px-2 py-0.5 rounded text-[10px] font-bold">✓ Đã xác nhận</span>`
                : `<span class="bg-yellow-100 text-yellow-800 px-2 py-0.5 rounded text-[10px] font-bold animate-pulse">⏳ Chờ xác nhận</span>`;

            const actionBtn = item.confirmed
                ? `<button onclick="toggleShiftConfirm('${item.gvCode}', ${item.shiftIndex})" class="bg-red-50 hover:bg-red-100 text-red-700 border border-red-200 px-2.5 py-1 rounded font-bold text-[10px] uppercase tracking-wider transition-colors">Hủy xác nhận</button>`
                : `<button onclick="toggleShiftConfirm('${item.gvCode}', ${item.shiftIndex})" class="bg-green-50 hover:bg-green-100 text-green-700 border border-green-200 px-2.5 py-1 rounded font-bold text-[10px] uppercase tracking-wider transition-colors">GV Ký nhận</button>`;

            const emergencyBtn = `<button onclick="showCbctEmergencyModal('${item.gvCode}', ${item.shiftIndex})" class="bg-orange-50 hover:bg-orange-100 text-orange-700 border border-orange-200 px-2.5 py-1 rounded font-bold text-[10px] uppercase tracking-wider transition-colors">Đổi khẩn cấp</button>`;

            tbody.innerHTML += `
                <tr class="hover:bg-gray-50 transition-colors">
                    <td class="px-4 py-3 font-mono text-gray-600">${item.date}</td>
                    <td class="px-4 py-3 text-gray-700">${item.shift}</td>
                    <td class="px-4 py-3 font-mono font-bold text-gray-800">${item.room}</td>
                    <td class="px-4 py-3 text-gray-600 font-semibold">${item.subject}</td>
                    <td class="px-4 py-3 text-gray-900 font-semibold">${item.gvName} (${item.gvCode})</td>
                    <td class="px-4 py-3 text-gray-600">${item.role}</td>
                    <td class="px-4 py-3 text-center">${statusBadge}</td>
                    <td class="px-4 py-3">
                        <div class="flex items-center justify-end gap-1.5 min-w-[190px]">
                            ${actionBtn}
                            ${emergencyBtn}
                        </div>
                    </td>
                </tr>
            `;
        });
        initIcons();
        if (typeof isStateLoaded !== "undefined" && isStateLoaded) saveStateToServer();
    }

    function hideCbctEmergencyModal() {
        document.getElementById('modal-cbct-emergency').classList.add('hidden-view');
    }

    function autocompleteEmergencyGvName() {
        const code = document.getElementById('emergency-new-code').value.trim().toUpperCase();
        if (code === activeEmergencyGvCode) {
            document.getElementById('emergency-new-name').value = 'Trùng với giám thị hiện tại!';
            return;
        }
        const gv = canBoCoiThiData.find(x => x.code === code);
        if (gv) {
            document.getElementById('emergency-new-name').value = gv.name;
        } else {
            document.getElementById('emergency-new-name').value = '';
        }
    }

    function confirmCbctEmergencyExecute() {
        const newCode = document.getElementById('emergency-new-code').value.trim().toUpperCase();
        const newName = document.getElementById('emergency-new-name').value.trim();
        const reason = document.getElementById('emergency-reason').value.trim();

        if (newCode === "" || newName === "" || reason === "") {
            showGlobalToast("Lỗi nhập liệu", "Vui lòng điền đầy đủ thông tin giảng viên thay thế và lý do!", "error");
            return;
        }

        const oldGv = canBoCoiThiData.find(x => x.code === activeEmergencyGvCode);
        const targetShift = oldGv.history[activeEmergencyShiftIndex];

        // Xóa ca thi khỏi giảng viên cũ
        oldGv.history.splice(activeEmergencyShiftIndex, 1);

        // Thêm ca thi sang giảng viên mới
        const newGv = canBoCoiThiData.find(x => x.code === newCode);
        targetShift.confirmed = false; // Reset confirmed status on replacement
        newGv.history.push(targetShift);

        hideCbctEmergencyModal();
        showGlobalToast("Thành công", `Đã điều động cán bộ khẩn cấp ${newName} thay thế cho ca trực.`);
        renderCbctPhanCong();
    }

    function filterGioCoiData(resetPage = true) {
        if (resetPage) {
            gcCurrentPage = 1;
        }
        const donVi = document.getElementById('gc-filter-donvi').value;
        const search = document.getElementById('gc-search-gv').value.trim().toLowerCase();

        const tbody = document.getElementById('gc-table-tbody');
        tbody.innerHTML = '';

        let filtered = canBoCoiThiData.filter(gv => {
            const matchDonVi = donVi === "" || gv.donVi === donVi;
            const matchSearch = gv.name.toLowerCase().includes(search) || gv.code.toLowerCase().includes(search);
            return matchDonVi && matchSearch;
        });

        let grandTotalGV = filtered.length;
        let grandTotalCa = 0;
        let grandTotalGio = 0;
        let grandTotalMoney = 0;
        let hasUnconfirmed = false;

        // Kiểm tra xem trong toàn bộ giảng viên lọc được có ca trực nào chưa được xác nhận không
        filtered.forEach(gv => {
            const confirmedShifts = gv.history.filter(h => h.confirmed);
            const totalCa = gv.history.length;
            const totalGio = confirmedShifts.reduce((sum, h) => sum + h.hours, 0);
            const totalMoney = totalGio * gv.pricePerHour;

            grandTotalCa += totalCa;
            grandTotalGio += totalGio;
            grandTotalMoney += totalMoney;

            gv.history.forEach(h => {
                if (!h.confirmed) hasUnconfirmed = true;
            });
        });

        // Ẩn/Hiện cảnh báo khóa xuất báo cáo
        const warningEl = document.getElementById('gc-warning-unconfirmed');
        const btnExcel = document.getElementById('btn-export-excel');
        const btnPdf = document.getElementById('btn-export-pdf');

        if (warningEl) {
            if (hasUnconfirmed) {
                warningEl.classList.remove('hidden-view');
            } else {
                warningEl.classList.add('hidden-view');
            }
            if (btnExcel) btnExcel.className = "bg-green-600 text-white font-bold px-3 py-1.5 rounded text-xs shadow hover:bg-green-700 transition flex items-center gap-1.5 font-sans";
            if (btnPdf) btnPdf.className = "bg-[#9e1c22] text-white font-bold px-3 py-1.5 rounded text-xs shadow hover:bg-red-800 transition flex items-center gap-1.5 font-sans";
        }

        // Paginate the filtered list
        const totalItems = filtered.length;
        const totalPages = Math.ceil(totalItems / gcPageSize) || 1;

        if (gcCurrentPage > totalPages) gcCurrentPage = totalPages;
        if (gcCurrentPage < 1) gcCurrentPage = 1;

        const startIdx = (gcCurrentPage - 1) * gcPageSize;
        const endIdx = startIdx + gcPageSize;
        const paginatedGv = filtered.slice(startIdx, endIdx);

        // Update pagination UI
        const infoEl = document.getElementById('gc-pagination-info');
        if (infoEl) infoEl.innerText = `Trang ${gcCurrentPage} / ${totalPages} (Tổng cộng ${totalItems} người)`;

        const btnPrev = document.getElementById('gc-btn-prev');
        const btnNext = document.getElementById('gc-btn-next');
        if (btnPrev) btnPrev.disabled = gcCurrentPage === 1;
        if (btnNext) btnNext.disabled = gcCurrentPage === totalPages;

        if (paginatedGv.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-12 text-center text-gray-400 italic">Không tìm thấy cán bộ coi thi nào thỏa mãn bộ lọc.</td></tr>`;
        } else {
            paginatedGv.forEach(gv => {
                const confirmedShifts = gv.history.filter(h => h.confirmed);
                const totalCa = gv.history.length;
                const totalGio = confirmedShifts.reduce((sum, h) => sum + h.hours, 0);

                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50 transition-colors">
                        <td class="px-6 py-4 font-mono font-bold text-gray-800">${gv.code}</td>
                        <td class="px-6 py-4 font-semibold text-gray-900">${gv.name}</td>
                        <td class="px-6 py-4 text-gray-600">${gv.donVi}</td>
                        <td class="px-6 py-4 text-center font-bold text-indigo-700">${totalCa} ca</td>
                        <td class="px-6 py-4 text-center font-bold text-blue-900">${totalGio} giờ</td>
                        <td class="px-6 py-4 text-center">
                            <button onclick="showGioCoiDetails('${gv.code}')" class="bg-blue-100 hover:bg-blue-200 text-blue-700 px-3 py-1 rounded font-bold text-[10px] transition-colors uppercase">Chi tiết</button>
                        </td>
                    </tr>
                `;
            });
        }

        document.getElementById('gc-stat-total-gv').innerText = `${grandTotalGV} người`;
        document.getElementById('gc-stat-total-ca').innerText = `${grandTotalCa} ca`;
        document.getElementById('gc-stat-total-gio').innerText = `${grandTotalGio} giờ`;
        if (typeof isStateLoaded !== "undefined" && isStateLoaded) saveStateToServer();
    }

    function changeGcPage(direction) {
        gcCurrentPage += direction;
        filterGioCoiData(false);
    }
    window.changeGcPage = changeGcPage;

    function showGioCoiDetails(code) {
        const gv = canBoCoiThiData.find(x => x.code === code);
        if (!gv) return;

        document.getElementById('gc-detail-name').innerText = gv.name;
        document.getElementById('gc-detail-code').innerText = `${gv.code} | Khoa ${gv.donVi}`;

        const tbody = document.getElementById('gc-detail-table-tbody');
        tbody.innerHTML = '';

        gv.history.forEach(h => {
            const statusStr = h.confirmed
                ? `<span class="bg-green-100 text-green-800 px-2 py-0.5 rounded text-[10px] font-bold">Đã xác nhận</span>`
                : `<span class="bg-yellow-100 text-yellow-800 px-2 py-0.5 rounded text-[10px] font-bold animate-pulse">Chờ xác nhận</span>`;

            tbody.innerHTML += `
                <tr class="hover:bg-gray-50 text-xs">
                    <td class="px-4 py-2.5 font-mono">${h.date}</td>
                    <td class="px-4 py-2.5">${h.shift}</td>
                    <td class="px-4 py-2.5 font-semibold">${h.subject}</td>
                    <td class="px-4 py-2.5 font-mono text-center">${h.room}</td>
                    <td class="px-4 py-2.5 text-center font-bold">${h.hours} giờ</td>
                    <td class="px-4 py-2.5 text-center">${statusStr}</td>
                </tr>
            `;
        });

        document.getElementById('modal-gc-details').classList.remove('hidden-view');
        initIcons();
    }

    function hideGioCoiDetailsModal() {
        document.getElementById('modal-gc-details').classList.add('hidden-view');
    }

    function downloadCsvFile(filename, headers, rows) {
        let csvContent = "\uFEFF"; // UTF-8 BOM to ensure Vietnamese characters show correctly in Excel
        csvContent += headers.join(",") + "\n";
        rows.forEach(row => {
            csvContent += row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(",") + "\n";
        });

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        if (link.download !== undefined) {
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", filename);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    }

    function exportGioCoiExcel() {
        let hasUnconfirmed = false;
        canBoCoiThiData.forEach(gv => {
            gv.history.forEach(h => {
                if (!h.confirmed) hasUnconfirmed = true;
            });
        });

        if (hasUnconfirmed) {
            showGlobalToast("Lưu ý", "Hệ thống phát hiện có ca chưa xác nhận, nhưng vẫn cho phép xuất báo cáo thử nghiệm.", "warning");
        }

        // Collect rows of current table data
        const headers = ["Mã GV", "Họ tên Cán bộ coi thi", "Đơn vị / Khoa", "Số ca thi", "Tổng giờ thi"];
        const rows = [];
        
        const donVi = document.getElementById('gc-filter-donvi').value;
        const search = document.getElementById('gc-search-gv').value.trim().toLowerCase();
        
        let filtered = canBoCoiThiData.filter(gv => {
            const matchDonVi = donVi === "" || gv.donVi === donVi;
            const matchSearch = gv.name.toLowerCase().includes(search) || gv.code.toLowerCase().includes(search);
            return matchDonVi && matchSearch;
        });

        filtered.forEach(gv => {
            const confirmedShifts = gv.history.filter(h => h.confirmed);
            const totalCa = gv.history.length;
            const totalGio = confirmedShifts.reduce((sum, h) => sum + h.hours, 0);
            rows.push([gv.code, gv.name, gv.donVi, `${totalCa} ca`, `${totalGio} giờ`]);
        });

        downloadCsvFile("Thong_Ke_Gio_Coi_Thi.csv", headers, rows);
        showGlobalToast("Thành công", "Đã tải xuống file 'Thong_Ke_Gio_Coi_Thi.csv' thành công!");
    }
