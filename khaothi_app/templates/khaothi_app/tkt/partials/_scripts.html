<script>
    // ==========================================================
    // KHỞI TẠO VÀ ĐIỀU HƯỚNG
    // ==========================================================
    let activeViewId = "view-home";

    window.onload = async function() {
        initIcons();
        const savedViewId = sessionStorage.getItem('tkt_activeViewId');
        await navigate(savedViewId || 'view-home');
    };

    function initIcons() {
        lucide.createIcons();
    }

    async function navigate(viewId) {
        document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden-view'));
        const targetView = document.getElementById(viewId);
        if (targetView) targetView.classList.remove('hidden-view');
        sessionStorage.setItem('tkt_activeViewId', viewId);

        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.classList.remove('bg-[#801418]', 'border-[#005691]', 'font-bold');
            btn.classList.add('border-transparent');
        });
        closeAllDropdowns();

        activeViewId = viewId;
        let activeBtnId = 'nav-btn-home';
        if (viewId === 'view-ky-thi') activeBtnId = 'nav-btn-ky-thi';
        else if (viewId === 'view-danh-sach-lich') activeBtnId = 'nav-btn-danh-sach-lich';
        else if (viewId === 'view-nhap-diem') activeBtnId = 'nav-btn-nhap-diem';
        else if (viewId === 'view-phuc-khao') activeBtnId = 'nav-btn-phuc-khao';
        else if (viewId.includes('giao-nhan') || viewId.includes('nhan-bai') || viewId.includes('ban-giao-bai')) activeBtnId = 'nav-btn-giao-nhan';
        else if (viewId === 'view-gio-coi') activeBtnId = 'nav-btn-gio-coi';

        const activeBtn = document.getElementById(activeBtnId);
        if (activeBtn) {
            activeBtn.classList.remove('border-transparent');
            activeBtn.classList.add('bg-[#801418]', 'border-[#005691]', 'font-bold');
        }

        // Thay vì render từ state ảo, gọi hàm fetch dữ liệu tương ứng
        if (viewId === 'view-home') await fetchAndRenderDashboard();
        else if (viewId === 'view-ky-thi') await fetchAndRenderKyThi();
        else if (viewId === 'view-danh-sach-lich') await fetchAndRenderLichThi();
        else if (viewId === 'view-nhap-diem') resetViewNhapDiem(); // Nhập điểm có logic riêng
        else if (viewId === 'view-phuc-khao') await fetchAndRenderPhucKhao();
        else if (viewId.includes('giao-nhan') || viewId.includes('nhan-bai') || viewId.includes('ban-giao-bai')) await fetchAndRenderGiaoNhan();
        else if (viewId === 'view-gio-coi') await fetchAndRenderGioCoi();

        initIcons();
    }

    function navigateGiaoNhan(tab) {
        closeAllDropdowns();
        if (tab === 'tao') {
            navigate('view-ban-giao-bai');
        } else {
            navigate('view-nhan-bai');
        }
    }
    window.navigateGiaoNhan = navigateGiaoNhan;

    function switchGiaoNhanTab(tabId) {
        ['tao', 'nhan', 'lich-su'].forEach(t => {
            const content = document.getElementById(`tab-content-${t}`);
            const btn = document.getElementById(`tab-btn-${t}`);
            if (content) content.classList.add('hidden-view');
            if (btn) btn.classList.remove('bg-gray-200', 'text-[#9e1c22]', 'shadow-inner');
        });
        const activeContent = document.getElementById(`tab-content-${tabId}`);
        const activeBtn = document.getElementById(`tab-btn-${tabId}`);
        if (activeContent) activeContent.classList.remove('hidden-view');
        if (activeBtn) activeBtn.classList.add('bg-gray-200', 'text-[#9e1c22]', 'shadow-inner');
    }
    window.switchGiaoNhanTab = switchGiaoNhanTab;

    function navigateGioCoi(tab) {
        closeAllDropdowns();
        navigate('view-gio-coi');
        const tabPhanCong = document.getElementById('tab-content-cbct-phan-cong');
        const tabTongHop = document.getElementById('tab-content-cbct-tong-hop');
        if (tab === 'tong-hop') {
            if (tabPhanCong) tabPhanCong.classList.add('hidden-view');
            if (tabTongHop) tabTongHop.classList.remove('hidden-view');
        } else {
            if (tabPhanCong) tabPhanCong.classList.remove('hidden-view');
            if (tabTongHop) tabTongHop.classList.add('hidden-view');
        }
    }
    window.navigateGioCoi = navigateGioCoi;

    function toggleDropdown(dropdownId, event) {
        event.stopPropagation();
        const dropdown = document.getElementById(dropdownId);
        const isOpen = !dropdown.classList.contains('hidden-view');
        closeAllDropdowns();
        if (!isOpen) {
            dropdown.classList.remove('hidden-view');
        }
    }
    window.toggleDropdown = toggleDropdown;

    function toggleDropdownFixed(dropdownId, event) {
        event.stopPropagation();
        const dropdown = document.getElementById(dropdownId);
        const isOpen = !dropdown.classList.contains('hidden-view');
        
        // Hide all fixed dropdowns
        document.querySelectorAll('div[id^="dropdown-"]').forEach(el => {
            el.classList.add('hidden-view');
        });
        
        if (!isOpen) {
            dropdown.classList.remove('hidden-view');
            const rect = event.currentTarget.getBoundingClientRect();
            dropdown.style.top = rect.bottom + 'px';
            
            // Prevent going off screen to the right
            const dropdownWidth = dropdown.offsetWidth || 200;
            if (rect.left + dropdownWidth > window.innerWidth) {
                dropdown.style.left = (window.innerWidth - dropdownWidth - 10) + 'px';
            } else {
                dropdown.style.left = rect.left + 'px';
            }
        }
    }
    window.toggleDropdownFixed = toggleDropdownFixed;

    function closeAllDropdowns() {
        document.querySelectorAll('.dropdown-menu').forEach(el => el.classList.add('hidden-view'));
        document.querySelectorAll('div[id^="dropdown-"]').forEach(el => el.classList.add('hidden-view'));
    }
    document.addEventListener('click', closeAllDropdowns);
    
    // Đóng dropdown khi scroll taskbar
    document.getElementById('tkt-nav-scroller')?.addEventListener('scroll', closeAllDropdowns);

    // ==========================================================
    // FETCH VÀ RENDER CHO TỪNG VIEW
    // ==========================================================

    async function fetchData(url) {
        try {
            const response = await fetch(url);
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            return await response.json();
        } catch (error) {
            console.error(`Lỗi khi fetch dữ liệu từ ${url}:`, error);
            showGlobalToast('Lỗi Mạng', `Không thể tải dữ liệu từ server. Vui lòng kiểm tra kết nối.`, 'error');
            return null;
        }
    }

    async function fetchAndRenderDashboard() {
        // Dashboard có thể tổng hợp từ nhiều API hoặc có API riêng
        // Tạm thời để trống, sẽ bổ sung sau nếu cần
        const tbody = document.getElementById('dash-ky-thi-tbody');
        if(tbody) tbody.innerHTML = `<tr><td colspan="4" class="text-center p-4">Đang tải...</td></tr>`;
        const kyThiData = await fetchData('/tkt/api/ky-thi/');
        if (kyThiData) {
            renderDashboard(kyThiData);
        }
    }

    async function fetchAndRenderKyThi() {
        const kyThiData = await fetchData('/tkt/api/ky-thi/');
        const caThiData = await fetchData('/tkt/api/ca-thi/');
        if (kyThiData && caThiData) {
            renderKyThiView(kyThiData, caThiData);
        }
    }

    async function fetchAndRenderLichThi() {
        // Cần API cho Lịch thi
    }

    async function fetchAndRenderPhucKhao() {
        const phucKhaoData = await fetchData('/tkt/api/don-phuc-khao/');
        if (phucKhaoData) {
            renderPhucKhaoList(phucKhaoData);
        }
    }

    async function fetchAndRenderGiaoNhan() {
        const data = await fetchData('/tkt/api/giao-nhan-data/');
        if (data) {
            renderGiaoNhanView(data);
        }
    }

    async function fetchAndRenderGioCoi() {
        const data = await fetchData('/tkt/api/can-bo-coi-thi/');
        if (data) {
            renderGioCoiView(data);
        }
    }

    // ==========================================================
    // CÁC HÀM RENDER GIAO DIỆN
    // ==========================================================

    function renderDashboard(kyThiData) {
        const tbody = document.getElementById('dash-ky-thi-tbody');
        tbody.innerHTML = '';
        if (!kyThiData || kyThiData.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" class="text-center p-4 text-gray-500">Chưa có kỳ thi nào.</td></tr>`;
            return;
        }
        kyThiData.forEach(kt => {
            tbody.innerHTML += `
                <tr class="hover:bg-gray-50">
                    <td class="px-4 py-2.5 font-semibold text-[#9e1c22]">${kt.ten_ky_thi}</td>
                    <td class="px-4 py-2.5 text-gray-700">${kt.nam_hoc}</td>
                    <td class="px-4 py-2.5 text-center font-medium">${kt.hoc_ky}</td>
                    <td class="px-4 py-2.5 text-center font-bold">${kt.ca_thi_count || 0} ca thi</td>
                </tr>
            `;
        });
    }

    function renderKyThiView(kyThiData, caThiData) {
        // Populate select options
        const select = document.getElementById('ct-kythi-select');
        select.innerHTML = '';
        kyThiData.forEach(kt => {
            select.innerHTML += `<option value="${kt.ma_ky_thi}">${kt.ten_ky_thi}</option>`;
        });

        // Render list
        const div = document.getElementById('ca-thi-list-div');
        div.innerHTML = '';
        if (caThiData.length === 0) {
            div.innerHTML = `<div class="text-center text-gray-400 py-6 italic">Chưa có ca thi nào.</div>`;
            return;
        }
        caThiData.forEach(c => {
            const kt = kyThiData.find(x => x.ma_ky_thi === c.ky_thi);
            div.innerHTML += `
                <div class="border border-gray-200 rounded p-3 text-xs bg-gray-50 flex justify-between items-center shadow-sm">
                    <div>
                        <p class="font-bold text-blue-900">${c.ten_ca} - Ngày thi: ${c.ngay_thi}</p>
                        <p class="text-gray-500 mt-1 font-semibold">Khung giờ: ${c.gio_bat_dau} - ${c.gio_ket_thuc}</p>
                        <p class="text-gray-400 mt-0.5">${kt ? kt.ten_ky_thi : ''} (${c.note || 'Không ghi chú'})</p>
                    </div>
                    <span class="bg-blue-100 text-blue-800 px-2 py-0.5 rounded font-bold">Hoạt động</span>
                </div>
            `;
        });
    }

    let allLichThiBanGiao = [];
    let filteredLichThiBanGiao = [];
    let currentGnPage = 1;
    const gnItemsPerPage = 6; // Display exactly 6 cards (3 rows x 2 cols) to keep column height compact!
    const selectedGiaoNhanLichIds = new Set();
    let allLichSuPhieu = [];

    function renderGiaoNhanView(data) {
        if (data) {
            if (data.lich_thi_ban_giao) allLichThiBanGiao = data.lich_thi_ban_giao;
            if (data.phieu_cho_xac_nhan) allPhieuChoXacNhan = data.phieu_cho_xac_nhan;
            if (data.lich_su_phieu) allLichSuPhieu = data.lich_su_phieu;
        }
        const phieu_cho_xac_nhan = allPhieuChoXacNhan || [];
        const lich_su_phieu = allLichSuPhieu || [];

        // Populate Subject Filter Dropdown
        const subjSelect = document.getElementById('gn-filter-subject');
        if (subjSelect) {
            const currentSubj = subjSelect.value;
            subjSelect.innerHTML = '<option value="">Tất cả Học phần</option>';
            const subjectMap = new Map();
            allLichThiBanGiao.forEach(x => {
                const name = x.ten_hoc_phan || '';
                const code = x.lop_hp || '';
                const key = name || code;
                const label = name ? (code.includes(name) ? code : `${name} (${code})`) : code;
                if (key && !subjectMap.has(key)) {
                    subjectMap.set(key, label);
                }
            });
            subjectMap.forEach((label, key) => {
                subjSelect.innerHTML += `<option value="${key}">${label}</option>`;
            });
            if (currentSubj) subjSelect.value = currentSubj;
        }

        filterGiaoNhanList();

        // Tab: Phiếu chờ nhận
        const listNhanDiv = document.getElementById('gn-list-cho-nhan');
        const badge = document.getElementById('badge-cho-nhan');
        if (listNhanDiv) {
            listNhanDiv.innerHTML = '';
            if (!phieu_cho_xac_nhan || phieu_cho_xac_nhan.length === 0) {
                listNhanDiv.innerHTML = `<div class="text-center text-gray-400 py-12 italic text-sm">Không có phiếu nào đang chờ bạn.</div>`;
                if (badge) badge.classList.add('hidden-view');
            } else {
                if (badge) {
                    badge.classList.remove('hidden-view');
                    badge.innerText = phieu_cho_xac_nhan.length;
                }
                phieu_cho_xac_nhan.forEach(p => {
                    listNhanDiv.innerHTML += `
                        <div class="border border-green-200 bg-green-50/50 rounded-xl p-5 flex justify-between items-center hover:shadow-md hover:bg-green-50 transition-all cursor-pointer mb-3" onclick="showGnDetailNhan('${p.ma_phieu}')">
                            <div class="flex gap-4 items-center">
                                <div class="bg-white p-3 rounded-xl text-green-600 shadow-sm border border-green-100"><i data-lucide="file-text" class="w-6 h-6"></i></div>
                                <div>
                                    <div class="flex items-center gap-2">
                                        <span class="font-mono font-bold text-gray-900 text-base">${p.ma_phieu}</span>
                                    </div>
                                    <p class="text-xs text-gray-500 mt-1 flex items-center gap-1"><i data-lucide="arrow-right-left" class="w-3.5 h-3.5"></i> Tuyến: <strong>${p.nguoi_giao?.full_name || 'Bên giao'} ➔ ${p.nguoi_nhan?.full_name || 'Bên nhận'}</strong></p>
                                </div>
                            </div>
                            <button class="bg-green-600 hover:bg-green-700 text-white px-5 py-2.5 rounded-lg font-bold text-xs shadow-sm">KIỂM ĐẾM</button>
                        </div>
                    `;
                });
            }
        }

        // Tab: Lịch sử (Phục vụ cả view Giao và view Nhận)
        const histTbodies = [
            document.getElementById('gn-lich-su-giao-tbody'),
            document.getElementById('gn-lich-su-nhan-tbody'),
            document.getElementById('gn-lich-su-tbody')
        ].filter(Boolean);

        histTbodies.forEach(histTbody => {
            histTbody.innerHTML = '';
            if (!lich_su_phieu || lich_su_phieu.length === 0) {
                histTbody.innerHTML = `<tr><td colspan="5" class="text-center p-4 text-gray-500">Chưa có lịch sử giao nhận.</td></tr>`;
            } else {
                lich_su_phieu.forEach(p => {
                    let stBadge = `<span class="bg-yellow-100 text-yellow-800 px-2 py-0.5 rounded text-xs font-bold">${p.trang_thai}</span>`;
                    if (p.trang_thai === "Đã hoàn tất") stBadge = `<span class="bg-green-100 text-green-800 px-2 py-0.5 rounded text-xs font-bold">✓ ${p.trang_thai}</span>`;

                    let totalItems = (p.chi_tiet || []).length;
                    let qtyDisplay = totalItems;

                    histTbody.innerHTML += `
                        <tr class="hover:bg-gray-50 text-xs">
                            <td class="px-4 py-2.5 font-mono font-bold text-blue-600">${p.ma_phieu}</td>
                            <td class="px-4 py-2.5 text-gray-700 font-semibold">${p.loai_phieu || 'Bàn giao bài thi'}</td>
                            <td class="px-4 py-2.5 text-gray-700">${p.nguoi_giao?.full_name || 'Tổ Khảo thí'} ➔ ${p.nguoi_nhan?.full_name || 'Thư ký'}</td>
                            <td class="px-4 py-2.5 text-center font-bold text-slate-800">${qtyDisplay}</td>
                            <td class="px-4 py-2.5 text-center">${stBadge}</td>
                        </tr>
                    `;
                });
            }
        });
        initIcons();
    }

    function filterGiaoNhanList() {
        const searchKw = (document.getElementById('gn-filter-search')?.value || '').toLowerCase().trim();
        const subjVal = (document.getElementById('gn-filter-subject')?.value || '').toLowerCase().trim();

        filteredLichThiBanGiao = allLichThiBanGiao.filter(lt => {
            const mCode = (lt.ma_lich_thi || '').toLowerCase().includes(searchKw) || (lt.lop_hp || '').toLowerCase().includes(searchKw);
            const mSubj = !subjVal || (lt.ten_hoc_phan || lt.lop_hp || '').toLowerCase().includes(subjVal);
            return mCode && mSubj;
        });

        currentGnPage = 1;
        renderGiaoNhanCards();
    }
    window.filterGiaoNhanList = filterGiaoNhanList;

    function renderGiaoNhanCards() {
        const listDiv = document.getElementById('gn-list-phong-goc');
        if (!listDiv) return;
        listDiv.innerHTML = '';

        if (filteredLichThiBanGiao.length === 0) {
            listDiv.innerHTML = `<div class="col-span-full text-xs text-gray-400 italic text-center py-8">Không có phòng thi nào phù hợp.</div>`;
            updateGnPagination(0, 0);
            return;
        }

        const totalPages = Math.ceil(filteredLichThiBanGiao.length / gnItemsPerPage);
        if (currentGnPage > totalPages) currentGnPage = totalPages;
        if (currentGnPage < 1) currentGnPage = 1;

        const startIdx = (currentGnPage - 1) * gnItemsPerPage;
        const pageItems = filteredLichThiBanGiao.slice(startIdx, startIdx + gnItemsPerPage);

        pageItems.forEach(lt => {
            const isChecked = selectedGiaoNhanLichIds.has(lt.ma_lich_thi);
            const tenHp = lt.ten_hoc_phan || '';
            const headerTitle = tenHp ? `${lt.ma_lich_thi} - ${tenHp}` : lt.ma_lich_thi;

            listDiv.innerHTML += `
                 <label class="gn-item flex items-start gap-3 p-3 rounded-lg border bg-white border-slate-200 hover:border-blue-400 hover:bg-slate-50/30 cursor-pointer transition-all duration-150 shadow-sm ${isChecked ? 'bg-blue-50/80 border-blue-400 ring-1 ring-blue-400' : ''}">
                    <div class="flex items-center h-5 mt-0.5">
                        <input type="checkbox" value="${lt.ma_lich_thi}" ${isChecked ? 'checked' : ''} onchange="toggleGnItemSelect('${lt.ma_lich_thi}', this.checked)" class="w-3.5 h-3.5 text-blue-600 rounded border-gray-300 focus:ring-blue-500" />
                    </div>
                    <div class="flex-1 min-w-0">
                         <div class="flex flex-col gap-1">
                            <span class="font-extrabold text-slate-800 text-[12.5px] tracking-wide leading-tight line-clamp-1" title="${headerTitle}">${headerTitle}</span>
                            <span class="inline-flex items-center w-fit px-1.5 py-0.5 rounded text-[10px] font-bold font-sans border bg-blue-50 text-blue-700 border-blue-100">${lt.so_luong_sv} bài</span>
                        </div>
                    </div>
                </label>
            `;
        });

        updateGnPagination(currentGnPage, totalPages);
    }

    function toggleGnItemSelect(id, checked) {
        if (checked) selectedGiaoNhanLichIds.add(id);
        else selectedGiaoNhanLichIds.delete(id);
        renderGiaoNhanCards();
    }
    window.toggleGnItemSelect = toggleGnItemSelect;

    function updateGnPagination(page, total) {
        const info = document.getElementById('gn-pagination-info');
        const btnPrev = document.getElementById('gn-btn-prev');
        const btnNext = document.getElementById('gn-btn-next');

        if (info) info.innerText = total > 0 ? `Trang ${page} / ${total}` : `Trang 0 / 0`;
        if (btnPrev) btnPrev.disabled = page <= 1;
        if (btnNext) btnNext.disabled = page >= total || total === 0;
    }

    function changeGiaoNhanPage(delta) {
        currentGnPage += delta;
        renderGiaoNhanCards();
    }
    window.changeGiaoNhanPage = changeGiaoNhanPage;

    let activeNhanPhieuObj = null;

    function showGnDetailNhan(maPhieu, objData) {
        if (!objData && typeof maPhieu === 'string') {
            objData = (allPhieuChoXacNhan || []).find(x => x.ma_phieu === maPhieu) || {};
        } else if (!objData && typeof maPhieu === 'object') {
            objData = maPhieu;
            maPhieu = objData.ma_phieu;
        }
        activeNhanPhieuObj = objData;

        const idElem = document.getElementById('gn-detail-id');
        if (idElem) idElem.innerText = maPhieu || objData?.ma_phieu || 'PBG-2026-001';

        const giaoElem = document.getElementById('gn-detail-[#gn-detail-giao]');
        const giaoTarget = document.getElementById('gn-detail-giao');
        if (giaoTarget) giaoTarget.innerText = objData?.nguoi_giao?.full_name || 'Bên giao';

        const typeElem = document.getElementById('gn-detail-type');
        if (typeElem) typeElem.innerText = objData?.loai_phieu || 'Bàn giao bài thi';

        const pdfLink = document.getElementById('gn-detail-pdf-link');
        if (pdfLink) pdfLink.href = `/export-pdf/?id=${maPhieu}`;

        const attName = document.getElementById('gn-detail-attachment-name');
        if (attName) attName.innerText = 'bien_ban_giao_nhan.pdf';

        const tbody = document.getElementById('gn-detail-table-tbody');
        if (tbody) {
            tbody.innerHTML = '';
            const items = objData?.chi_tiet || [{ tui_phach: 'TP-001', hoc_phan: 'Marketing Căn bản', so_bai: 23 }];
            items.forEach(it => {
                const maTui = it.tui_phach?.ma_tui || it.tui_phach || it.ma_lich_thi || 'TP-001';
                const tenHp = it.tui_phach?.hoc_phan?.ten_hoc_phan || it.hoc_phan || 'Học phần thi';
                const soBai = it.tui_phach?.so_bai || it.so_bai || 25;
                tbody.innerHTML += `
                    <tr>
                        <td class="px-4 py-2 font-mono font-bold text-gray-700">${maTui}</td>
                        <td class="px-4 py-2 text-gray-800 font-semibold">${tenHp}</td>
                        <td class="px-4 py-2 text-center font-bold text-blue-900">${soBai} bài</td>
                    </tr>
                `;
            });
        }

        const modal = document.getElementById('gn-detail-nhan');
        if (modal) modal.classList.remove('hidden-view');
        initIcons();
    }
    window.showGnDetailNhan = showGnDetailNhan;

    function hideGnDetailNhan() {
        const modal = document.getElementById('gn-detail-nhan');
        if (modal) modal.classList.add('hidden-view');
    }
    window.hideGnDetailNhan = hideGnDetailNhan;

    function handleTuChoiNhanPhieuTra() {
        const modal = document.getElementById('tkt-modal-nhap-ly-do-tu-choi');
        if (modal) modal.classList.remove('hidden-view');
    }
    window.handleTuChoiNhanPhieuTra = handleTuChoiNhanPhieuTra;

    function hideTuChoiLyDoModal() {
        const modal = document.getElementById('tkt-modal-nhap-ly-do-tu-choi');
        if (modal) modal.classList.add('hidden-view');
    }
    window.hideTuChoiLyDoModal = hideTuChoiLyDoModal;

    function confirmTuChoiLyDoModal() {
        hideTuChoiLyDoModal();
        hideGnDetailNhan();
        showGlobalToast("Đã từ chối bàn giao", "Hệ thống đã cập nhật trạng thái phiếu và phản hồi về bên giao.");
    }
    window.confirmTuChoiLyDoModal = confirmTuChoiLyDoModal;

    function handleSignedFileSelected(input) {
        const fileSpan = document.getElementById('gn-signed-file-name');
        if (input && input.files && input.files[0]) {
            if (fileSpan) fileSpan.innerText = input.files[0].name + " (" + Math.round(input.files[0].size / 1024) + " KB)";
        } else {
            if (fileSpan) fileSpan.innerText = "Chưa chọn tệp đính kèm nào";
        }
    }
    window.handleSignedFileSelected = handleSignedFileSelected;

        if (!val) return fallback;

    function selectDonPhucKhao(maDon) {
        const p = (allPhucKhaoData || []).find(x => x.ma_don === maDon);
        if (!p) return;
        selectedPhucKhaoDon = p;

        const emptyView = document.getElementById('pk-empty-view');
        const processView = document.getElementById('pk-process-view');
        if (emptyView) emptyView.classList.add('hidden-view');
        if (processView) processView.classList.remove('hidden-view');

        const svName = formatObjStr(p.sinh_vien, 'Thí sinh');
        const hpName = formatObjStr(p.hoc_phan, 'Học phần');

        const activeMon = document.getElementById('pk-active-mon');
        if (activeMon) activeMon.innerText = `${p.ma_don} - ${svName}`;

        const infoTuiBai = document.getElementById('pk-info-tui-bai');
        if (infoTuiBai) infoTuiBai.innerText = p.lich_thi ? (typeof p.lich_thi === 'object' ? `TB-${p.lich_thi.ma_lich_thi || '2026-001'}` : `TB-${p.lich_thi}`) : `TB-2026-001`;

        let phachCodeStr = 'P-102';
        if (p.ma_phach) {
            if (typeof p.ma_phach === 'object') {
                phachCodeStr = p.ma_phach.ma_phach || p.ma_phach.code || p.ma_phach.id || 'P-102';
            } else {
                phachCodeStr = String(p.ma_phach);
            }
        } else if (p.sbd_ma_phach) {
            phachCodeStr = String(p.sbd_ma_phach);
        }

        // Extract prefix and numeric part from phachCodeStr so all 4 papers in the bag have identical code structure
        let match = phachCodeStr.match(/^([A-Za-z0-9_-]*\D)(\d+)$/);
        let prefix = 'PHTP-';
        let numVal = 1001;
        let padLen = 6;

        if (match) {
            prefix = match[1];
            numVal = parseInt(match[2], 10);
            padLen = match[2].length;
        } else {
            let digitsOnly = phachCodeStr.replace(/\D/g, '');
            if (digitsOnly) {
                numVal = parseInt(digitsOnly, 10);
                padLen = Math.max(digitsOnly.length, 5);
                prefix = phachCodeStr.replace(digitsOnly, '');
                if (!prefix) prefix = 'PHTP-';
            }
        }

        let p2Code = `${prefix}${String(numVal + 1).padStart(padLen, '0')}`;
        let p3Code = `${prefix}${String(numVal + 2).padStart(padLen, '0')}`;
        let p4Code = `${prefix}${String(numVal + 3).padStart(padLen, '0')}`;
        
        let diemGocVal = parseFloat(p.diem_goc) || 4.6;
        let diem2Val = (diemGocVal + 1.75 > 9.5) ? (diemGocVal - 1.25).toFixed(2) : (diemGocVal + 1.75).toFixed(2);
        let diem3Val = (diemGocVal + 2.5 > 9.5) ? (diemGocVal - 2.0).toFixed(2) : (diemGocVal + 2.5).toFixed(2);
        let diem4Val = (diemGocVal + 3.25 > 9.5) ? (diemGocVal - 1.5).toFixed(2) : (diemGocVal + 1.25).toFixed(2);

        const savedScores = p.saved_scores || [];
        const papersBundle = [
            { code: phachCodeStr, diemGoc: p.diem_goc || '4.60', diemMoi: savedScores[0] || p.diem_phuc_khao_cuoi || '', label: 'Bài xin phúc khảo' },
            { code: p2Code, diemGoc: diem2Val, diemMoi: savedScores[1] || '', label: 'Bài rút kèm 1 (Ngụy trang)' },
            { code: p3Code, diemGoc: diem3Val, diemMoi: savedScores[2] || '', label: 'Bài rút kèm 2 (Ngụy trang)' },
            { code: p4Code, diemGoc: diem4Val, diemMoi: savedScores[3] || '', label: 'Bài rút kèm 3 (Ngụy trang)' }
        ];

        const infoTuiPhach = document.getElementById('pk-info-tui-phach');
        if (infoTuiPhach) infoTuiPhach.innerText = `Bộ 4 bài: ${phachCodeStr}, ${p2Code}, ${p3Code}, ${p4Code}`;

        const btnRutBai = document.getElementById('pk-btn-rut-bai');
        const btnLuuDiem = document.getElementById('pk-btn-luu-diem');
        const infoTrangThaiRut = document.getElementById('pk-info-trang-thai-rut');
        const isDaRut = (p.trang_thai === 'Đã rút bài' || p.trang_thai === 'DangXuLy' || p.trang_thai === 'Đang xử lý' || p.trang_thai === 'DaHoanThanh' || p.trang_thai === 'Đã hoàn thành');
        const isCompleted = (p.trang_thai === 'Đã hoàn thành' || p.trang_thai === 'DaHoanThanh');

        if (infoTrangThaiRut) {
            infoTrangThaiRut.innerText = isDaRut ? 'Đã rút bài' : 'Chưa rút bài';
            infoTrangThaiRut.className = isDaRut ? 'font-bold text-green-700' : 'font-bold text-red-700';
        }

        if (btnRutBai) {
            if (isDaRut) {
                btnRutBai.classList.add('hidden');
            } else {
                btnRutBai.classList.remove('hidden');
            }
        }

        const btnInBienBan = document.getElementById('pk-btn-in-bien-ban');
        const completedNotice = document.getElementById('pk-completed-notice');

        if (isCompleted) {
            if (btnInBienBan) btnInBienBan.classList.add('hidden');
            if (btnLuuDiem) btnLuuDiem.classList.add('hidden');
            if (completedNotice) completedNotice.classList.remove('hidden-view');
        } else {
            if (btnInBienBan) btnInBienBan.classList.remove('hidden');
            if (btnLuuDiem) btnLuuDiem.classList.remove('hidden');
            if (completedNotice) completedNotice.classList.add('hidden-view');
        }

        const tbody = document.getElementById('pk-tbody');
        if (tbody) {
            tbody.innerHTML = '';
            papersBundle.forEach((item, idx) => {
                const isReadonlyAttr = isCompleted ? 'disabled readonly' : '';
                const inputStyle = isCompleted ? 'bg-gray-100 text-gray-800 border-gray-300 font-bold cursor-not-allowed' : 'border border-gray-300 font-bold focus:border-blue-600 focus:ring-1 focus:ring-blue-500';
                const displayValue = item.diemMoi || (isCompleted ? item.diemGoc : '');

                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50 border-b border-gray-100">
                        <td class="px-4 py-2.5 font-mono font-bold text-blue-900">
                            ${item.code}
                            <span class="text-[10px] font-sans font-semibold text-gray-500 bg-gray-100 px-2 py-0.5 rounded ml-2">${item.label}</span>
                        </td>
                        <td class="px-4 py-2.5 text-center font-bold text-gray-700">${item.diemGoc}</td>
                        <td class="px-4 py-2.5 text-center">
                            <input type="number" step="0.25" min="0" max="10" value="${displayValue}" placeholder="Nhập điểm mới..." ${isReadonlyAttr} class="w-28 rounded px-2 py-1 text-center outline-none ${inputStyle}" />
                        </td>

        if (scoreSection) scoreSection.classList.remove('hidden-view');

        initIcons();
    }

    function handleSavePhucKhaoPoint() {
        if (!selectedPhucKhaoDon) {

        rows.forEach((tr, index) => {

            if (val) hasAnyScore = true;

        });

        if (!hasAnyScore) {
            showGlobalToast("Cảnh báo", "Vui lòng nhập điểm phúc khảo mới vào bảng trước khi ấn lưu!", "warning");
            return;

        // Save target paper final score & full 4-paper bundle scores in CSDL structure
        p.diem_phuc_khao_cuoi = bundleDetails[0].newScore || p.diem_goc;

    function renderPhucKhaoList(phucKhaoData) {

        if (!div) return;
        div.innerHTML = '';

        // Populate học phần dropdown
        const hpSelect = document.getElementById('pk-filter-hoc-phan');
        if (hpSelect && hpSelect.options.length <= 1) {
            const hpSet = new Set();
            (allPhucKhaoData || []).forEach(item => {
                const name = formatObjStr(item.hoc_phan, '');
                if (name) hpSet.add(name);
            });
            if (hpSet.size === 0) {
                ['Nhập môn Lập trình', 'Tiếng Anh GTQT 3', 'Quản trị dự án', 'Marketing căn bản', 'Cấu trúc dữ liệu', 'Mạng máy tính'].forEach(name => hpSet.add(name));
            }
            hpSet.forEach(name => {
                hpSelect.innerHTML += `<option value="${name}">${name}</option>`;
            });
        }

        const hkVal = document.getElementById('pk-filter-hoc-ky')?.value || '';
        const dotVal = document.getElementById('pk-filter-dot-thi')?.value || '';
        const hpVal = document.getElementById('pk-filter-hoc-phan')?.value || '';
        const statusVal = document.getElementById('pk-filter-status')?.value || '';
        const searchVal = document.getElementById('pk-filter-search')?.value.trim().toLowerCase() || '';

        const activeTextEl = document.getElementById('pk-active-filters-text');
        if (activeTextEl) {
            let desc = [];
            desc.push(`Kỳ: ${hkVal || 'Tất cả'}`);
            desc.push(`Đợt: ${dotVal || 'Tất cả'}`);
            if (hpVal) desc.push(`Học phần: ${hpVal}`);
            activeTextEl.innerText = desc.join(' | ');
        }

        const filtered = (allPhucKhaoData || []).filter(p => {
            if (hkVal && p.hoc_ky && p.hoc_ky !== hkVal) return false;
            if (dotVal && p.dot_thi && p.dot_thi !== dotVal) return false;
            const hpNameStr = formatObjStr(p.hoc_phan, '');
            if (hpVal && hpNameStr !== hpVal) return false;
            if (statusVal && p.trang_thai !== statusVal) return false;
            if (searchVal) {
                const svStr = formatObjStr(p.sinh_vien, '');
                const phachStr = typeof p.ma_phach === 'object' ? (p.ma_phach.ma_phach || '') : String(p.ma_phach || '');
                const text = `${p.ma_don} ${svStr} ${phachStr} ${hpNameStr}`.toLowerCase();
                if (!text.includes(searchVal)) return false;
            }
            return true;
        });

    function filterGioCoiData() {
        const hocKyVal = document.getElementById('gc-filter-hocky')?.value || '';
        const kyThiVal = document.getElementById('gc-filter-kythi')?.value || '';
        const donViVal = document.getElementById('gc-filter-donvi')?.value || '';
        const searchVal = document.getElementById('gc-search-gv')?.value?.trim()?.toLowerCase() || '';

        let filtered = globalGioCoiRawData.filter(item => {
            let hkStr = item.hoc_ky || item.lich_thi?.hoc_ky || 'Học kỳ I';
            let ktStr = item.ky_thi || item.lich_thi?.ky_thi || 'Kỳ thi Cuối kỳ';
            let dvStr = item.khoa || item.can_bo?.khoa || 'Công nghệ thông tin';
            let gvName = (item.ho_ten || item.can_bo?.ho_ten || '').toLowerCase();
            let gvCode = (item.ma_gv || item.can_bo?.ma_giang_vien || '').toLowerCase();

            if (hocKyVal && !hkStr.includes(hocKyVal)) return false;
            if (kyThiVal && !ktStr.includes(kyThiVal)) return false;
            if (donViVal && !dvStr.includes(donViVal)) return false;
            if (searchVal && (!gvName.includes(searchVal) && !gvCode.includes(searchVal))) return false;
            return true;
        });

        // Update metric stats cards
        const totalGvEl = document.getElementById('gc-stat-total-gv');
        const totalCaEl = document.getElementById('gc-stat-total-ca');
        const totalGioEl = document.getElementById('gc-stat-total-gio');

        let sumCa = filtered.reduce((acc, curr) => acc + (curr.ca_thi_count || 1), 0);
        let sumGio = filtered.reduce((acc, curr) => acc + (curr.tong_gio || 2.5), 0);

        if (totalGvEl) totalGvEl.innerText = `${filtered.length} người`;
        if (totalCaEl) totalCaEl.innerText = `${sumCa} ca`;
        if (totalGioEl) totalGioEl.innerText = `${sumGio.toFixed(1)} giờ`;

        // Render summary table
        const tbodyTongHop = document.getElementById('gc-table-tbody');
        if (tbodyTongHop) {
            tbodyTongHop.innerHTML = '';
            if (filtered.length === 0) {
                tbodyTongHop.innerHTML = `<tr><td colspan="6" class="text-center p-6 text-gray-500 font-medium">Không tìm thấy dữ liệu giờ coi thi phù hợp.</td></tr>`;
                return;
            }

            filtered.forEach(item => {
                let maGv = item.ma_gv || item.can_bo?.ma_giang_vien || 'GV001';
                let hoTen = item.ho_ten || item.can_bo?.ho_ten || 'Giảng viên';
                let khoa = item.khoa || item.can_bo?.khoa || 'CNTT';
                let numCa = item.ca_thi_count || 1;
                let numGio = item.tong_gio || 2.5;

                tbodyTongHop.innerHTML += `
                    <tr class="hover:bg-gray-50 border-b border-gray-100">
                        <td class="px-4 py-2.5 font-mono font-bold text-blue-900">${maGv}</td>
                        <td class="px-4 py-2.5 font-semibold text-gray-800">${hoTen}</td>
                        <td class="px-4 py-2.5 text-gray-600">${khoa}</td>
                        <td class="px-4 py-2.5 text-center font-bold text-gray-700">${numCa} ca</td>
                        <td class="px-4 py-2.5 text-center font-bold text-indigo-700">${numGio} giờ</td>
                        <td class="px-4 py-2.5 text-center">
                            <button onclick="showGioCoiDetailsModal('${maGv}')" class="bg-blue-50 text-blue-700 hover:bg-blue-100 px-2.5 py-1 rounded text-xs font-bold transition cursor-pointer">Chi tiết</button>
                        </td>
                    </tr>
                `;
            });
        }
    }

        const toast = document.getElementById('toast-global');
        const icon = document.getElementById('toast-global-icon');
        toast.className = "hidden-view fixed bottom-6 right-6 text-white px-6 py-4 rounded shadow-xl flex items-center gap-3 animate-fade-in-up z-[200]";
        if (type === 'error') {
            toast.classList.add('bg-red-600');
            icon.setAttribute('data-lucide', 'alert-circle');
        } else {
            toast.classList.add('bg-green-600');
            icon.setAttribute('data-lucide', 'check-circle-2');
        }
        document.getElementById('toast-global-title').innerText = title;
        document.getElementById('toast-global-msg').innerText = msg || '';
        toast.classList.remove('hidden-view');
        initIcons();
        setTimeout(() => toast.classList.add('hidden-view'), 4000);
    }
</script>
