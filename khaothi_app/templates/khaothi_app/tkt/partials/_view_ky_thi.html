<div id="view-ky-thi" class="view-section hidden-view animate-fade-in">
    <div class="mb-6 border-b border-gray-200 pb-4">
        <h2 class="text-2xl font-bold text-blue-900 mb-1 flex items-center gap-2"><i data-lucide="award" class="text-blue-600"></i> Quản lý Kỳ thi & Ca thi</h2>
        <p class="text-sm text-gray-600">Khởi tạo đợt thi mới [UC 2.1] và thiết lập các ca thi chi tiết trong đợt thi [UC 2.3].</p>
    </div>

    <div class="grid grid-cols-3 gap-6">
        <!-- Form Tạo kỳ thi -->
        <div class="bg-white border border-gray-200 rounded-lg shadow-sm p-6">
            <h3 class="font-bold text-lg text-gray-800 mb-4 border-b pb-2 flex items-center gap-2 text-[#9e1c22]"><i data-lucide="plus-circle" class="w-5 h-5"></i> Tạo kỳ thi mới [UC 2.1]</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1 uppercase">Tên kỳ thi:</label>
                    <input id="kt-ten" type="text" placeholder="Ví dụ: Thi cuối kỳ HK III" class="w-full p-2 border border-gray-300 rounded text-sm focus:border-red-800 outline-none" />
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1 uppercase">Năm học:</label>
                        <input id="kt-nam" type="text" placeholder="2025-2026" class="w-full p-2 border border-gray-300 rounded text-sm focus:border-red-800 outline-none" />
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1 uppercase">Học kỳ:</label>
                        <select id="kt-hocky" class="w-full p-2 border border-gray-300 rounded text-sm bg-white focus:border-red-800 outline-none">
                            <option value="Học kỳ I">Học kỳ I</option>
                            <option value="Học kỳ II">Học kỳ II</option>
                            <option value="Học kỳ III" selected>Học kỳ III</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1 uppercase">Đợt thi:</label>
                    <input id="kt-dot" type="text" placeholder="Ví dụ: Đợt 1" class="w-full p-2 border border-gray-300 rounded text-sm focus:border-red-800 outline-none" />
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1 uppercase">Thời gian áp dụng:</label>
                    <input id="kt-thoigian" type="text" placeholder="10/07/2026 - 20/07/2026" class="w-full p-2 border border-gray-300 rounded text-sm focus:border-red-800 outline-none" />
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1 uppercase">Mô tả kỳ thi:</label>
                    <textarea id="kt-mota" placeholder="Ghi chú thêm về kỳ thi..." class="w-full p-2 border border-gray-300 rounded text-sm focus:border-red-800 outline-none h-16 resize-none"></textarea>
                </div>
                <button onclick="handleCreateKyThi()" class="w-full bg-[#9e1c22] text-white font-bold py-2.5 rounded shadow hover:bg-red-800 transition-colors">Tạo kỳ thi</button>
            </div>
        </div>

        <!-- Form Tạo ca thi -->
        <div class="bg-white border border-gray-200 rounded-lg shadow-sm p-6">
            <h3 class="font-bold text-lg text-gray-800 mb-4 border-b pb-2 flex items-center gap-2 text-blue-900"><i data-lucide="plus-circle" class="w-5 h-5"></i> Tạo ca thi mới [UC 2.3]</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1 uppercase">Thuộc kỳ thi:</label>
                    <select id="ct-kythi-select" class="w-full p-2 border border-gray-300 rounded text-sm bg-white focus:border-red-800 outline-none"></select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1 uppercase">Tên ca thi:</label>
                    <input id="ct-ten" type="text" placeholder="Ví dụ: Ca 1" class="w-full p-2 border border-gray-300 rounded text-sm focus:border-red-800 outline-none" />
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1 uppercase">Ngày thi:</label>
                    <input id="ct-ngay" type="date" class="w-full p-2 border border-gray-300 rounded text-sm focus:border-red-800 outline-none" />
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1 uppercase">Giờ bắt đầu:</label>
                        <input id="ct-gio-bd" type="time" class="w-full p-2 border border-gray-300 rounded text-sm focus:border-red-800 outline-none" />
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1 uppercase">Giờ kết thúc:</label>
                        <input id="ct-gio-kt" type="time" class="w-full p-2 border border-gray-300 rounded text-sm focus:border-red-800 outline-none" />
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1 uppercase">Ghi chú:</label>
                    <input id="ct-ghichu" type="text" placeholder="Không bắt buộc" class="w-full p-2 border border-gray-300 rounded text-sm focus:border-red-800 outline-none" />
                </div>
                <button onclick="handleCreateCaThi()" class="w-full bg-blue-900 text-white font-bold py-2.5 rounded shadow hover:bg-blue-800 transition-colors">Tạo ca thi</button>
            </div>
        </div>

        <!-- Danh sách ca thi hiện hữu -->
        <div class="bg-white border border-gray-200 rounded-lg shadow-sm p-6 flex flex-col">
            <h3 class="font-bold text-lg text-gray-800 mb-4 border-b pb-2 flex items-center gap-2"><i data-lucide="list" class="w-5 h-5 text-gray-500"></i> Danh sách ca thi hiện có [UC 2.4]</h3>
            <div class="flex-1 overflow-y-auto space-y-3 max-h-[380px]" id="ca-thi-list-div"></div>
        </div>
    </div>
</div>
