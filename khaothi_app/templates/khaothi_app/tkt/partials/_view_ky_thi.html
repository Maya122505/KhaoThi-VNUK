<div id="view-ky-thi" class="view-section hidden-view animate-fade-in">
    <div class="mb-6 border-b border-gray-200 pb-4">
        <h2 class="text-2xl font-bold text-blue-900 mb-1 flex items-center gap-2"><i data-lucide="award" class="text-blue-600"></i> Quản lý Kỳ thi</h2>
        <p class="text-sm text-gray-600">Khởi tạo đợt thi mới và theo dõi các kỳ thi hiện hữu trên hệ thống.</p>
    </div>

    <div class="grid grid-cols-3 gap-6">
        <!-- Form Tạo kỳ thi (chiếm 1 cột) -->
        <div class="bg-white border border-gray-200 rounded-lg shadow-sm p-6 h-fit">
            <h3 class="font-bold text-lg text-gray-800 mb-4 border-b pb-2 flex items-center gap-2 text-[#9e1c22]"><i data-lucide="plus-circle" class="w-5 h-5"></i> Tạo kỳ thi mới</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1 uppercase">Tên kỳ thi</label>
                    <select id="kt-ten" class="w-full p-2 border border-gray-300 rounded text-sm bg-white focus:border-red-800 outline-none">
                        <option value="Thi giữa kỳ">Thi giữa kỳ</option>
                        <option value="Thi cuối kỳ">Thi cuối kỳ</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1 uppercase">Năm học</label>
                        <select id="kt-nam" class="w-full p-2 border border-gray-300 rounded text-sm bg-white focus:border-red-800 outline-none"></select>
                        <script>
                            (function(){
                                const currentYear = new Date().getFullYear();
                                const selectNamHoc = document.getElementById('kt-nam');
                                for (let year = 2023; year <= currentYear; year++) {
                                    const option = document.createElement('option');
                                    option.value = `${year}-${year + 1}`;
                                    option.textContent = `${year}-${year + 1}`;
                                    if (year === currentYear) option.selected = true;
                                    selectNamHoc.appendChild(option);
                                }
                            })();
                        </script>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1 uppercase">Học kỳ</label>
                        <select id="kt-hocky" class="w-full p-2 border border-gray-300 rounded text-sm bg-white focus:border-red-800 outline-none">
                            <option value="Học kỳ I">Học kỳ I</option>
                            <option value="Học kỳ II">Học kỳ II</option>
                            <option value="Học kỳ III" selected>Học kỳ III</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1 uppercase">Đợt thi</label>
                    <select id="kt-dot" class="w-full p-2 border border-gray-300 rounded text-sm bg-white focus:border-red-800 outline-none">
                        <option value="Đợt 1">Đợt 1</option>
                        <option value="Đợt 2">Đợt 2</option>
                        <option value="Đợt 3">Đợt 3</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1 uppercase">Thời gian áp dụng</label>
                    <div class="grid grid-cols-2 gap-4">
                        <input id="kt-thoigian-bd" type="date" class="w-full p-2 border border-gray-300 rounded text-sm focus:border-red-800 outline-none" />
                        <input id="kt-thoigian-kt" type="date" class="w-full p-2 border border-gray-300 rounded text-sm focus:border-red-800 outline-none" />
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1 uppercase">Mô tả kỳ thi</label>
                    <textarea id="kt-mota" placeholder="Ghi chú thêm về kỳ thi..." class="w-full p-2 border border-gray-300 rounded text-sm focus:border-red-800 outline-none h-16 resize-none"></textarea>
                </div>
                <button onclick="handleCreateKyThi()" class="w-full bg-[#9e1c22] text-white font-bold py-2.5 rounded shadow hover:bg-red-800 transition-colors">Tạo kỳ thi</button>
            </div>
        </div>

        <!-- Danh sách Kỳ thi hiện hữu (chiếm 2 cột) -->
        <div class="col-span-2 bg-white border border-gray-200 rounded-lg shadow-sm p-6 flex flex-col h-[600px]">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h3 class="font-bold text-lg text-gray-800 flex items-center gap-2 text-[#9e1c22]"><i data-lucide="list" class="w-5 h-5"></i> Danh sách kỳ thi hiện có</h3>
                <div class="flex items-center gap-2">
                    <button id="btn-select-ky-thi" onclick="toggleSelectMode('ky-thi')" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold px-3 py-1 text-xs rounded transition-colors flex items-center gap-1.5"><i data-lucide="check-square" class="w-3.5 h-3.5 text-gray-600"></i> <span>Chọn</span></button>
                    <button id="btn-delete-all-ky-thi" onclick="handleDeleteSelected('ky-thi')" class="bg-red-600 hover:bg-red-700 text-white font-bold p-1.5 rounded transition-colors flex items-center justify-center hidden shadow-sm" title="Xóa các mục đã chọn"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                </div>
            </div>
            <div class="flex-1 overflow-y-auto space-y-3" id="ky-thi-list-div"></div>
        </div>
    </div>
</div>
