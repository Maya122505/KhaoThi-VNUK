<!-- Giao diện rà soát đề thi -->
<div id="view-rasoat-de" class="view-section hidden-view animate-fade-in flex flex-col h-full">
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold text-[#9e1c22]">Rà soát Đề thi</h2>
    </div>

    <!-- Danh sách đề thi chờ rà soát -->
        <div class="p-4 border-b border-gray-200 bg-gray-50 rounded-t-lg flex justify-between items-center">
            <h3 class="font-bold text-gray-800 flex items-center gap-2"><i data-lucide="check-square" class="w-5 h-5 text-gray-500"></i> Danh sách đề thi chờ rà soát</h3>
            <div class="flex items-center gap-2">
                <button id="btn-select-rasoat-de" onclick="toggleSelectMode('rasoat-de')" class="bg-white border border-gray-300 hover:bg-gray-100 text-gray-700 font-bold px-3 py-1 text-xs rounded transition-colors flex items-center gap-1.5"><i data-lucide="check-square" class="w-3.5 h-3.5 text-gray-600"></i> <span>Chọn</span></button>
                <button id="btn-delete-all-rasoat-de" onclick="handleDeleteSelected('rasoat-de')" class="bg-red-600 hover:bg-red-700 text-white font-bold p-1.5 rounded transition-colors flex items-center justify-center hidden shadow-sm" title="Xóa các mục đã chọn"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
            </div>
        </div>
        <div class="overflow-y-auto max-h-[420px]">
            <table class="w-full text-sm text-left border-collapse">
                <thead class="text-xs text-gray-600 uppercase bg-gray-100 border-b border-gray-200 sticky top-0 z-10 font-bold">
                    <tr>
                        <th class="select-col-rasoat-de hidden px-3 py-3 w-8 text-center"></th>
                        <th class="px-4 py-3">Mã Đề</th>
                        <th class="px-4 py-3">Học phần</th>
                        <th class="px-4 py-3">Người nộp</th>
                        <th class="px-4 py-3">Tệp đính kèm</th>
                        <th class="px-4 py-3">Ghi chú</th>
                        <th class="px-4 py-3 text-center">Trạng thái</th>
                        <th class="px-4 py-3 text-center">Thao tác</th>
                    </tr>
                </thead>
                <tbody id="rasoat-de-tbody">
                    <!-- JS render -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal Rà soát đề -->
<div id="modal-rasoat-de" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden-view flex items-center justify-center">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-lg overflow-hidden animate-fade-in-down">
        <div class="bg-gray-50 border-b border-gray-200 p-4 flex justify-between items-center">
            <h3 class="font-bold text-lg text-gray-800 flex items-center gap-2"><i data-lucide="edit-3" class="w-5 h-5 text-gray-500"></i> Kết quả Rà soát</h3>
            <button onclick="closeModalRasoat()" class="text-gray-400 hover:text-gray-600"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        <div class="p-6 space-y-4">
            <input type="hidden" id="rs-ma-de" />
            <div>
                <p class="text-sm text-gray-600">Đang rà soát đề: <span id="rs-ten-mon" class="font-bold text-gray-900"></span></p>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-600 mb-1 uppercase">Đánh giá chung</label>
                <select id="rs-trang-thai" class="w-full p-2 border border-gray-300 rounded text-sm bg-white focus:border-red-800 outline-none">
                    <option value="Đạt">Đạt yêu cầu</option>
                    <option value="Chờ chỉnh sửa">Không đạt (Yêu cầu chỉnh sửa)</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-600 mb-1 uppercase">Nhận xét chi tiết</label>
                <textarea id="rs-nhan-xet" placeholder="Vui lòng nhập nhận xét chi tiết..." class="w-full p-2 border border-gray-300 rounded text-sm focus:border-red-800 outline-none h-24"></textarea>
            </div>
            <div class="text-right mt-4 pt-4 border-t border-gray-100">
                <button onclick="closeModalRasoat()" class="bg-gray-200 text-gray-700 font-bold py-2 px-4 rounded mr-2 hover:bg-gray-300 transition-colors">Hủy</button>
                <button onclick="handleSaveRasoat()" class="bg-[#9e1c22] text-white font-bold py-2 px-4 rounded hover:bg-red-800 transition-colors">Lưu kết quả</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal Chi tiết Đề thi -->
<div id="modal-detail-de-thi" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden-view flex items-center justify-center">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-lg overflow-hidden animate-fade-in-down">
        <div class="bg-gray-50 border-b border-gray-200 p-4 flex justify-between items-center">
            <h3 class="font-bold text-lg text-gray-800 flex items-center gap-2"><i data-lucide="info" class="w-5 h-5 text-gray-500"></i> Chi tiết Đề thi</h3>
            <button onclick="closeDeThiDetail()" class="text-gray-400 hover:text-gray-600"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        <div class="p-6 space-y-4">
            <div class="grid grid-cols-2 gap-x-4 gap-y-3 text-sm">
                <div><span class="font-semibold text-gray-600">Mã đề:</span> <span id="dt-detail-id" class="text-gray-900 font-bold"></span></div>
                <div><span class="font-semibold text-gray-600">Trạng thái:</span> <span id="dt-detail-status"></span></div>
                <div class="col-span-2"><span class="font-semibold text-gray-600">Học phần:</span> <span id="dt-detail-subject" class="text-gray-900 font-bold"></span></div>
                <div><span class="font-semibold text-gray-600">Người nộp:</span> <span id="dt-detail-submitter" class="text-gray-900"></span></div>
                <div><span class="font-semibold text-gray-600">Thời gian nộp:</span> <span id="dt-detail-time" class="text-gray-900"></span></div>
                <div class="col-span-2"><span class="font-semibold text-gray-600">Tệp đính kèm:</span> <span id="dt-detail-file" class="text-blue-600 cursor-pointer hover:underline flex items-center"><i data-lucide="file-text" class="w-4 h-4 mr-1"></i><span id="dt-detail-file-name"></span></span></div>
                <div class="col-span-2"><span class="font-semibold text-gray-600">Ghi chú người nộp:</span> <span id="dt-detail-note" class="text-gray-900 block mt-1 p-2 bg-gray-50 rounded border border-gray-100 min-h-[40px]"></span></div>
                <div class="col-span-2"><span class="font-semibold text-gray-600">Nhận xét rà soát:</span> <span id="dt-detail-review" class="text-gray-900 block mt-1 p-2 bg-gray-50 rounded border border-gray-100 min-h-[40px]"></span></div>
            </div>
            <div class="text-right mt-4 pt-4 border-t border-gray-100">
                <button onclick="closeDeThiDetail()" class="bg-[#9e1c22] text-white font-bold py-2 px-6 rounded hover:bg-red-800 transition-colors">Đóng</button>
            </div>
        </div>
    </div>
</div>
