<script>
    // Synced global variables
    let kyThiData = [];
    let caThiData = [];
    let lichThiData = [];
    let hocPhiData = [];
    let lopThiDiemData = [];

    // ==========================================================
    // DỮ LIỆU GIẢ LẬP (STATE MANAGEMENT)
    // ==========================================================
    let phongThiData = [];
    let tuiBaiData = [];
    let phieuGiaoNhanData = [];
    let dashTuiCurrentPage = 1;
    const dashTuiPageSize = 5;
    let taoTuiCurrentPage = 1;
    const taoTuiPageSize = 6;

    let activeViewId = "view-home";
    let currentOpenDropdown = null;
    let selectedPhongTaoTui = [];
    let traCuuSubView = "list";
    let activeTuiDetailId = null;
    let activeTuiDoiChieuId = null;
    let activeTuiKhoaId = null;
    let isDecryptedPassword = false;
    let activeGnMode = "nhan";
    let activeGnKyNhanType = "goc";
    let traCuuCurrentPage = 1;
    let isStateLoaded = false;
    let giaoNhanSelectedIds = new Set();
    let giaoNhanFilteredItems = [];
    let giaoNhanCurrentPage = 1;
    const giaoNhanPageSize = 10;
    let canBoCoiThiData = [];
    let phucKhaoData = [];
    let traCuuPageSize = 3;
    let detailActiveTab = "view";

    async function loadStateFromServer() {
        try {
            const res = await fetch('/api/get_state/');
            const data = await res.json();

            kyThiData = data.kyThiData || [];
            caThiData = data.caThiData || [];
            lichThiData = data.lichThiData || [];
            hocPhiData = data.hocPhiData || [];
            lopThiDiemData = data.lopThiDiemData || [];
            phongThiData = data.phongThiGocData;
            tuiBaiData = data.tuiPhachData;
            phieuGiaoNhanData = data.phieuGiaoNhanData;
            canBoCoiThiData = data.canBoCoiThiData;
            phucKhaoData = data.phucKhaoData;
            isStateLoaded = true;
        } catch (e) {
            console.error("Lỗi đồng bộ dữ liệu từ server:", e);
        }
    }

    async function saveStateToServer() {
        try {
            await fetch('/api/save_state/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    kyThiData,
                    caThiData,
                    lichThiData,
                    hocPhiData,
                    lopThiDiemData,
                    phongThiGocData: phongThiData,
                    tuiPhachData: tuiBaiData,
                    tuiBaiData: tuiBaiData,
                    phieuGiaoNhanData,
                    canBoCoiThiData,
                    phucKhaoData
                })
            });
        } catch (e) {
            console.error("Lỗi lưu dữ liệu lên server:", e);
        }
    }
    window.saveStateToServer = saveStateToServer;

    window.onload = async function () {
        initIcons();
        await loadStateFromServer();
        const savedViewId = sessionStorage.getItem('tkct_activeViewId');
        navigate(savedViewId || 'view-home');
    };

    function initIcons() {
        lucide.createIcons();
    }

    function navigate(viewId) {
        document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden-view'));
        const targetView = document.getElementById(viewId);
        if (targetView) targetView.classList.remove('hidden-view');
        sessionStorage.setItem('tkct_activeViewId', viewId);

        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.classList.remove('bg-[#801418]', 'border-[#005691]', 'font-bold');
            btn.classList.add('border-transparent');
        });
        closeAllDropdowns();

        activeViewId = viewId;
        let activeBtnId = 'nav-btn-home';
        if (viewId.includes('tui') || viewId.includes('phach') || viewId.includes('doi-chieu')) activeBtnId = 'nav-btn-tui-bai';
        else if (viewId.includes('giao-nhan') || viewId.includes('nhan-bai') || viewId.includes('ban-giao-bai')) activeBtnId = 'nav-btn-giao-nhan';

        const activeBtn = document.getElementById(activeBtnId);
        if (activeBtn) {
            activeBtn.classList.remove('border-transparent');
            activeBtn.classList.add('bg-[#801418]', 'border-[#005691]', 'font-bold');
        }

        if (viewId === 'view-home') renderDashboard();
        else if (viewId === 'view-tao-tui-bai') renderViewTaoTui();
        else if (viewId === 'view-tra-cuu-tui') { switchTraCuuSubView('list'); renderViewTraCuuTui(); }
        else if (viewId === 'view-nhap-doi-chieu') resetViewDoiChieu();
        else if (viewId === 'view-khoa-phach') renderViewKhoaPhach();
        else if (viewId === 'view-nhan-bai' || viewId === 'view-ban-giao-bai') {
            if (viewId === 'view-nhan-bai') hideGnDetailNhan();
            renderGiaoNhan();
        }

        initIcons();
    }

    function navigateGiaoNhan(tab) {
        activeGnMode = tab;
        if (tab === 'nhan') navigate('view-nhan-bai');
        else navigate('view-ban-giao-bai');
    }
    window.navigateGiaoNhan = navigateGiaoNhan;

    function toggleDropdown(dropdownId, event) {
        event.stopPropagation();
        const dropdown = document.getElementById(dropdownId);
        const overlay = document.getElementById('overlay');
        const iconId = dropdownId.replace('dropdown-', 'icon-');
        const icon = document.getElementById(iconId);

        if (currentOpenDropdown === dropdownId) {
            closeAllDropdowns();
        } else {
            closeAllDropdowns();
            dropdown.classList.remove('hidden-view');
            overlay.classList.remove('hidden-view');
            if (icon) icon.setAttribute('data-lucide', 'chevron-up');
            currentOpenDropdown = dropdownId;
            initIcons();
        }
    }

    function closeAllDropdowns() {
        document.querySelectorAll('.dropdown-menu').forEach(el => el.classList.add('hidden-view'));
        document.getElementById('overlay').classList.add('hidden-view');
        document.querySelectorAll('[id^="icon-"]').forEach(icon => {
            if (icon.parentElement.classList.contains('nav-btn')) icon.setAttribute('data-lucide', 'chevron-down');
        });
        currentOpenDropdown = null;
        initIcons();
    }

    // ==========================================================
    // DASHBOARD
    // ==========================================================
    function renderDashboard() {
        // Sửa lỗi trạng thái Chưa làm phách
        const countPhongCho = phongThiData.filter(p => p.status === "Chưa làm phách").length;
        const countTuiDoiChieu = tuiBaiData.filter(t => t.status === "Đã tạo phách").length;
        const countTuiDaKhoa = tuiBaiData.filter(t => t.status === "Đã khóa phách").length;
        const countPhieuMoi = phieuGiaoNhanData.filter(p => p.status === "Chờ bạn xác nhận").length;

        document.getElementById('dash-phong-cho').innerText = countPhongCho;
        document.getElementById('dash-tui-doi-chieu').innerText = countTuiDoiChieu;
        document.getElementById('dash-tui-da-khoa').innerText = countTuiDaKhoa;
        document.getElementById('dash-phieu-moi').innerText = countPhieuMoi;

        // Render danh sách thông báo nghiệp vụ khẩn động dựa trên dữ liệu thực tế
        const notifList = document.getElementById('dash-notifications-list');
        if (notifList) {
            let html = '';

            // 0. Scan for rejected slips sent by TKCT
            const rejectedSlips = phieuGiaoNhanData.filter(p => p.sender === "tkct" && p.status === "Bị từ chối");
            rejectedSlips.forEach(p => {
                const reasonText = p.rejectReason ? `<div class="mt-1 bg-red-50 border-l-2 border-red-500 p-2 rounded text-[10px] text-red-900 font-medium italic">Lý do: "${p.rejectReason}"</div>` : '';
                html += `
                <div class="p-3 bg-red-100 border border-red-300 rounded-lg flex gap-3 items-start cursor-pointer hover:bg-red-200 transition-colors animate-pulse" onclick="navigateGiaoNhan('tao')">
                    <div class="bg-red-600 p-1.5 rounded-full shadow-sm text-white shrink-0"><i data-lucide="alert-triangle" class="w-4 h-4"></i></div>
                    <div class="flex-1">
                        <h4 class="text-sm font-bold text-red-800 uppercase tracking-wide">⚠️ Phiếu bàn giao bị TỪ CHỐI!</h4>
                        <p class="text-xs text-red-700 mt-1 font-semibold">Phiếu <strong>${p.id}</strong> trả Tổ Khảo thí đã bị từ chối nhận. Nhấp vào đây để xem chi tiết và phát hành phiếu mới.</p>
                        ${reasonText}
                    </div>
                </div>`;
            });

            // 1. Thông báo phiếu bàn giao mới
            if (countPhieuMoi > 0) {
                html += `
                <div class="p-3 bg-red-50 border border-red-100 rounded-lg flex gap-3 items-start cursor-pointer hover:bg-red-100 transition-colors animate-pulse" onclick="navigateGiaoNhan('nhan')">
                    <div class="bg-white p-1.5 rounded-full shadow-sm text-red-600 shrink-0"><i data-lucide="file-signature" class="w-4 h-4"></i></div>
                    <div>
                        <h4 class="text-sm font-bold text-gray-800">Yêu cầu nhận bàn giao bài thi</h4>
                        <p class="text-xs text-gray-600 mt-1">Tổ Khảo thí vừa gửi <strong>${countPhieuMoi}</strong> phiếu bàn giao bài thi gốc. Vui lòng đếm bài vật lý và xác nhận nhận trách nhiệm.</p>
                    </div>
                </div>`;
            }

            // 2. Thông báo phòng chờ làm phách
            if (countPhongCho > 0) {
                html += `
                <div class="p-3 bg-orange-50 border border-orange-100 rounded-lg flex gap-3 items-start cursor-pointer hover:bg-orange-100 transition-colors" onclick="navigate('view-tao-tui')">
                    <div class="bg-white p-1.5 rounded-full shadow-sm text-orange-600 shrink-0"><i data-lucide="layers" class="w-4 h-4"></i></div>
                    <div>
                        <h4 class="text-sm font-bold text-gray-800">Yêu cầu tạo túi bài thi & làm phách</h4>
                        <p class="text-xs text-gray-600 mt-1">Có <strong>${countPhongCho}</strong> phòng thi đã nộp bài thi đang chờ cắt phách & dồntúi phách ẩn danh.</p>
                    </div>
                </div>`;
            }

            // 3. Thông báo túi chờ đối chiếu đầu phách
            if (countTuiDoiChieu > 0) {
                html += `
                <div class="p-3 bg-blue-50 border border-blue-100 rounded-lg flex gap-3 items-start cursor-pointer hover:bg-blue-100 transition-colors animate-pulse" onclick="navigate('view-doi-chieu')">
                    <div class="bg-white p-1.5 rounded-full shadow-sm text-blue-600 shrink-0"><i data-lucide="file-search" class="w-4 h-4"></i></div>
                    <div>
                        <h4 class="text-sm font-bold text-gray-800">Yêu cầu đối chiếu đầu phách</h4>
                        <p class="text-xs text-gray-600 mt-1">Có <strong>${countTuiDoiChieu}</strong> túi bài đã đánh phách cần đối chiếu kiểm dò đầu phách vật lý trước khi chuyển giao.</p>
                    </div>
                </div>`;
            }

            // 4. Các thông tin quy định cố định
            html += `
            <div class="p-3 bg-yellow-50 border border-yellow-100 rounded-lg flex gap-3 items-start">
                <div class="bg-white p-1.5 rounded-full shadow-sm text-yellow-600 shrink-0"><i data-lucide="shield-check" class="w-4 h-4"></i></div>
                <div>
                    <h4 class="text-sm font-bold text-gray-800">Nguyên tắc ẩn danh tuyệt đối</h4>
                    <p class="text-xs text-gray-600 mt-1">Mã phách sinh ra bắt buộc là chuỗi ngẫu nhiên không có quy luật để chống can thiệp hoặc đoán điểm bài thi.</p>
                </div>
            </div>
            
            <div class="p-3 bg-slate-50 border border-slate-200 rounded-lg flex gap-3 items-start">
                <div class="bg-white p-1.5 rounded-full shadow-sm text-slate-600 shrink-0"><i data-lucide="shield-alert" class="w-4 h-4"></i></div>
                <div>
                    <h4 class="text-sm font-bold text-gray-800">Nội quy bảo mật phòng phách</h4>
                    <p class="text-xs text-gray-600 mt-1">Khu vực làm phách cách ly hoàn toàn, không mang thiết bị di động, camera giám sát hoạt động 24/7.</p>
                </div>
            </div>`;

            notifList.innerHTML = html;
        }

        const tbody = document.getElementById('dash-tui-tbody');
        tbody.innerHTML = '';
        if (tuiBaiData.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" class="text-center text-gray-400 py-4 italic">Chưa có túi phách nào được lập.</td></tr>`;
            document.getElementById('dash-tui-pagination').innerHTML = '';
            return;
        }

        // Thực hiện phân trang
        const totalItems = tuiBaiData.length;
        const totalPages = Math.ceil(totalItems / dashTuiPageSize);
        if (dashTuiCurrentPage > totalPages) dashTuiCurrentPage = totalPages;
        if (dashTuiCurrentPage < 1) dashTuiCurrentPage = 1;

        const startIdx = (dashTuiCurrentPage - 1) * dashTuiPageSize;
        const endIdx = startIdx + dashTuiPageSize;
        const paginatedData = tuiBaiData.slice(startIdx, endIdx);

        paginatedData.forEach(t => {
            let statusBadge = `<span class="bg-blue-100 text-blue-800 px-2 py-0.5 rounded text-xs font-semibold">${t.status}</span>`;
            if (t.status === 'Đã đối chiếu hợp lệ') statusBadge = `<span class="bg-yellow-100 text-yellow-800 px-2 py-0.5 rounded text-xs font-semibold">${t.status}</span>`;
            if (t.status === 'Đã khóa phách') statusBadge = `<span class="bg-green-100 text-green-800 px-2 py-0.5 rounded text-xs font-semibold"><i class="w-3 h-3 inline pb-0.5" data-lucide="lock"></i> ${t.status}</span>`;

            tbody.innerHTML += `
                <tr class="hover:bg-gray-50 border-b border-gray-100 text-xs">
                    <td class="px-4 py-2.5 font-mono font-bold text-blue-900">${t.id}</td>
                    <td class="px-4 py-2.5 text-gray-700">${t.subjectName}</td>
                    <td class="px-4 py-2.5 text-center font-medium">${t.papers} bài / ${t.rooms.length} phòng</td>
                    <td class="px-4 py-2.5 text-center">${statusBadge}</td>
                </tr>
            `;
        });

        // Vẽ các nút điều hướng phân trang
        const paginationDiv = document.getElementById('dash-tui-pagination');
        if (paginationDiv) {
            paginationDiv.innerHTML = `
                <div>Hiển thị ${startIdx + 1} - ${Math.min(endIdx, totalItems)} / ${totalItems} túi</div>
                <div class="flex items-center gap-1">
                    <button onclick="changeDashTuiPage(1)" ${dashTuiCurrentPage === 1 ? 'disabled' : ''} class="px-2 py-1 border rounded hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed">&lt;&lt;</button>
                    <button onclick="changeDashTuiPage(${dashTuiCurrentPage - 1})" ${dashTuiCurrentPage === 1 ? 'disabled' : ''} class="px-2 py-1 border rounded hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed">&lt;</button>
                    <span class="px-2 font-semibold text-gray-700">Trang ${dashTuiCurrentPage}/${totalPages}</span>
                    <button onclick="changeDashTuiPage(${dashTuiCurrentPage + 1})" ${dashTuiCurrentPage === totalPages ? 'disabled' : ''} class="px-2 py-1 border rounded hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed">&gt;</button>
                    <button onclick="changeDashTuiPage(${totalPages})" ${dashTuiCurrentPage === totalPages ? 'disabled' : ''} class="px-2 py-1 border rounded hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed">&gt;&gt;</button>
                </div>
            `;
        }

        initIcons();
        if (typeof isStateLoaded !== 'undefined' && isStateLoaded) saveStateToServer();
    }

    function changeDashTuiPage(page) {
        dashTuiCurrentPage = page;
        renderDashboard();
    }
    window.changeDashTuiPage = changeDashTuiPage;

    // ==========================================================
    // TẠO TÚI
    // ==========================================================
    function renderViewTaoTui() {
        const select = document.getElementById('tao-tui-hoc-phan');
        let filterMon = select ? select.value : '';

        // Dynamically build subject list based on rooms waiting to be processed
        if (select) {
            const uniqueSubjects = [];
            const seen = new Set();
            phongThiData.forEach(p => {
                if (p.status === "Chưa làm phách" && !seen.has(p.subjectId)) {
                    seen.add(p.subjectId);
                    uniqueSubjects.push({ id: p.subjectId, name: p.subjectName });
                }
            });
            // Re-render select options, keeping the selection if it is still valid
            let optionsHtml = '<option value="">-- Tất cả học phần --</option>';
            uniqueSubjects.forEach(sub => {
                optionsHtml += `<option value="${sub.id}">${sub.name}</option>`;
            });
            select.innerHTML = optionsHtml;
            // Restore previous value if it exists in the new list
            if (seen.has(filterMon)) {
                select.value = filterMon;
            } else {
                select.value = '';
                filterMon = '';
            }
        }

        const tbody = document.getElementById('tao-tui-tbody');
        tbody.innerHTML = '';

        const listKhaDung = phongThiData.filter(p => p.status === "Chưa làm phách" && (filterMon === "" || p.subjectId === filterMon));

        if (listKhaDung.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" class="text-center text-gray-400 py-8 italic">Không có phòng thi nào.</td></tr>`;
            updateTaoTuiPreview();
            return;
        }

        const totalItems = listKhaDung.length;
        const totalPages = Math.ceil(totalItems / taoTuiPageSize);
        if (taoTuiCurrentPage > totalPages) taoTuiCurrentPage = totalPages;
        if (taoTuiCurrentPage < 1) taoTuiCurrentPage = 1;

        const startIdx = (taoTuiCurrentPage - 1) * taoTuiPageSize;
        const endIdx = startIdx + taoTuiPageSize;
        const paginatedList = listKhaDung.slice(startIdx, endIdx);

        paginatedList.forEach(p => {
            const isChecked = selectedPhongTaoTui.includes(p.id) ? 'checked' : '';
            tbody.innerHTML += `
                <tr class="hover:bg-gray-50 transition-colors">
                    <td class="px-4 py-3 text-center"><input type="checkbox" value="${p.id}" ${isChecked} onchange="handlePhongTaoTuiCheckbox(this)" class="w-4 h-4 text-red-600 rounded cursor-pointer" /></td>
                    <td class="px-4 py-3 font-mono font-bold">${p.name || p.phong || p.id}</td>
                    <td class="px-4 py-3">${p.subjectName}</td>
                    <td class="px-4 py-3 text-center font-bold text-blue-900">${p.papers}</td>
                </tr>
            `;
        });

        const paginationDiv = document.getElementById('tao-tui-pagination');
        if (paginationDiv) {
            paginationDiv.innerHTML = `
                <div>Hiển thị ${startIdx + 1} - ${Math.min(endIdx, totalItems)} / ${totalItems} phòng thi</div>
                <div class="flex items-center gap-1">
                    <button onclick="changeTaoTuiPage(1)" ${taoTuiCurrentPage === 1 ? 'disabled' : ''} class="px-2 py-1 border rounded hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed">&lt;&lt;</button>
                    <button onclick="changeTaoTuiPage(${taoTuiCurrentPage - 1})" ${taoTuiCurrentPage === 1 ? 'disabled' : ''} class="px-2 py-1 border rounded hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed">&lt;</button>
                    <span class="px-2 font-semibold text-gray-700">Trang ${taoTuiCurrentPage}/${totalPages}</span>
                    <button onclick="changeTaoTuiPage(${taoTuiCurrentPage + 1})" ${taoTuiCurrentPage === totalPages ? 'disabled' : ''} class="px-2 py-1 border rounded hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed">&gt;</button>
                    <button onclick="changeTaoTuiPage(${totalPages})" ${taoTuiCurrentPage === totalPages ? 'disabled' : ''} class="px-2 py-1 border rounded hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed">&gt;&gt;</button>
                </div>
            `;
        }

        updateTaoTuiPreview();
        if (typeof isStateLoaded !== 'undefined' && isStateLoaded) saveStateToServer();
    }

    function changeTaoTuiPage(page) {
        taoTuiCurrentPage = page;
        renderViewTaoTui();
    }
    window.changeTaoTuiPage = changeTaoTuiPage;

    function handlePhongTaoTuiCheckbox(cb) {
        if (cb.checked) {
            if (!selectedPhongTaoTui.includes(cb.value)) selectedPhongTaoTui.push(cb.value);
        } else {
            selectedPhongTaoTui = selectedPhongTaoTui.filter(id => id !== cb.value);
        }
        updateTaoTuiPreview();
    }

    function toggleAllPhongTaoTui(isChecked) {
        const select = document.getElementById('tao-tui-hoc-phan');
        const filterMon = select ? select.value : '';
        const listKhaDung = phongThiData.filter(p => p.status === "Chưa làm phách" && (filterMon === "" || p.subjectId === filterMon));
        
        if (isChecked) {
            listKhaDung.forEach(p => {
                if (!selectedPhongTaoTui.includes(p.id)) selectedPhongTaoTui.push(p.id);
            });
        } else {
            const listKhaDungIds = listKhaDung.map(p => p.id);
            selectedPhongTaoTui = selectedPhongTaoTui.filter(id => !listKhaDungIds.includes(id));
        }
        renderViewTaoTui();
    }

    function handleAlternativeFlow3a() {
        let filterMon = document.getElementById('tao-tui-hoc-phan').value;
        // If filter is not selected, but user has ticked some checkboxes, auto-select the subject of the first checked room
        if (!filterMon && selectedPhongTaoTui.length > 0) {
            const firstSelectedRoom = phongThiData.find(x => x.id === selectedPhongTaoTui[0]);
            if (firstSelectedRoom) {
                filterMon = firstSelectedRoom.subjectId;
                const selectEl = document.getElementById('tao-tui-hoc-phan');
                if (selectEl) {
                    selectEl.value = filterMon;
                    renderViewTaoTui();
                }
            }
        }
        if (!filterMon) {
            alert("Vui lòng chọn cụ thể một Học phần ở bộ lọc để thực hiện chọn tất cả!");
            return;
        }
        toggleAllPhongTaoTui(true);
        document.getElementById('tao-tui-check-all').checked = true;
    }

    function updateTaoTuiPreview() {
        document.getElementById('tao-tui-selected-count').innerText = selectedPhongTaoTui.length;
        document.getElementById('preview-so-phong').innerText = `${selectedPhongTaoTui.length} Phòng`;

        let totalPapers = 0;
        selectedPhongTaoTui.forEach(id => {
            const p = phongThiData.find(x => x.id === id);
            if (p) totalPapers += p.papers;
        });
        document.getElementById('preview-tong-bai').innerText = `${totalPapers} bài`;

        const previewBagsDiv = document.getElementById('preview-danh-sach-tui');
        previewBagsDiv.innerHTML = '';

        if (selectedPhongTaoTui.length === 0) {
            previewBagsDiv.innerHTML = `<div class="text-xs text-gray-400 italic">Chọn phòng thi ở bảng trái</div>`;
            return;
        }

        let currentBagSize = 0;
        let bagCount = 1;
        let currentBagRooms = [];
        let bagDistribution = [];

        for (let i = 0; i < selectedPhongTaoTui.length; i++) {
            const p = phongThiData.find(x => x.id === selectedPhongTaoTui[i]);
            if (!p) continue;

            if (currentBagSize + p.papers > 60 && currentBagSize > 0) {
                bagDistribution.push({ index: bagCount, qty: currentBagSize, rooms: [...currentBagRooms] });
                bagCount++;
                currentBagSize = p.papers;
                currentBagRooms = [p.id];
            } else {
                currentBagSize += p.papers;
                currentBagRooms.push(p.id);
            }
        }
        if (currentBagSize > 0) {
            bagDistribution.push({ index: bagCount, qty: currentBagSize, rooms: [...currentBagRooms] });
        }

        bagDistribution.forEach(b => {
            const roomNames = b.rooms.map(id => {
                const r = phongThiData.find(x => x.id === id);
                return r ? (r.name || r.phong) : id;
            }).join(', ');
            previewBagsDiv.innerHTML += `
                <div class="bg-gray-100 p-2 rounded border border-gray-200 text-xs text-gray-700">
                    🔑 <strong>Túi dự kiến #${b.index}</strong>: <span class="text-blue-900 font-bold">${b.qty} bài</span> (${roomNames})
                </div>
            `;
        });
    }

    async function confirmGhepPhongExecute() {
        hideGhepPhongModal();
        const firstRoom = phongThiData.find(x => x.id === selectedPhongTaoTui[0]);
        const subId = firstRoom.subjectId;
        const subName = firstRoom.subjectName;

        let currentBagSize = 0;
        let currentBagRooms = [];
        let tempRooms = [...selectedPhongTaoTui];
        let createdBagIds = [];

        let payload_tui_bais = [];
        for (let i = 0; i < tempRooms.length; i++) {
            const p = phongThiData.find(x => x.id === tempRooms[i]);
            if (!p) continue;
            payload_tui_bais.push({
                subjectId: p.subjectId,
                papers: p.papers
            });
        }

        try {
            const response = await fetch('/tkct/api/tui-phach/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({ tui_bais: payload_tui_bais })
            });

            if (!response.ok) throw new Error('Network response was not ok');
            
            // Đồng bộ nạp lại toàn bộ dữ liệu mới nhất trực tiếp từ CSDL
            await loadStateFromServer();

        } catch (error) {
            showGlobalToast("Lỗi", "Không thể tạo túi phách", "error");
        }

        selectedPhongTaoTui = [];

        document.getElementById('tao-tui-check-all').checked = false;
        showGlobalToast("Thành công", "Tạo túi và sinh mã phách thành công!");
        renderViewTaoTui();
        renderDashboard();

        if (createdBagIds.length > 0) {
            const lastBagId = createdBagIds[createdBagIds.length - 1];
            document.getElementById('filter-tui-id').value = lastBagId;
            navigate('view-tra-cuu-tui');
            renderViewTraCuuTui();
        }
    }

    function renderViewTraCuuTui() {
        const select = document.getElementById('filter-tui-mon');
        let filterMon = select ? select.value : '';

        // Dynamically build subject list based on bags in the system
        if (select) {
            const uniqueSubjects = [];
            const seen = new Set();
            tuiBaiData.forEach(t => {
                if (t.subjectId && !seen.has(t.subjectId)) {
                    seen.add(t.subjectId);
                    uniqueSubjects.push({ id: t.subjectId, name: t.subjectName });
                }
            });
            let optionsHtml = '<option value="">Học phần: Tất cả</option>';
            uniqueSubjects.forEach(sub => {
                optionsHtml += `<option value="${sub.id}">${sub.name}</option>`;
            });
            select.innerHTML = optionsHtml;
            if (seen.has(filterMon)) {
                select.value = filterMon;
            } else {
                select.value = '';
                filterMon = '';
            }
        }

        const filterId = document.getElementById('filter-tui-id').value.trim().toUpperCase();
        const tbody = document.getElementById('tra-cuu-tui-tbody');
        tbody.innerHTML = '';

        const list = tuiBaiData.filter(t => (filterId === "" || t.id.includes(filterId)) && (filterMon === "" || t.subjectId === filterMon));
        if (list.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" class="text-center text-gray-400 py-6 italic">Không tìm thấy túi bài thi phù hợp.</td></tr>`;
            document.getElementById('tui-pagination-info').innerText = "Hiển thị 0-0 của 0 túi";
            document.getElementById('tui-prev-page').disabled = true;
            document.getElementById('tui-next-page').disabled = true;
            return;
        }

        const totalItems = list.length;
        const totalPages = Math.ceil(totalItems / traCuuPageSize) || 1;
        if (traCuuCurrentPage > totalPages) traCuuCurrentPage = totalPages;
        if (traCuuCurrentPage < 1) traCuuCurrentPage = 1;

        const paginatedList = list.slice((traCuuCurrentPage - 1) * traCuuPageSize, traCuuCurrentPage * traCuuPageSize);

        paginatedList.forEach(t => {
            tbody.innerHTML += `
            <tr class="hover:bg-gray-50 transition-colors">
                <td class="px-6 py-4 font-mono font-bold text-blue-900">${t.id}</td>
                <td class="px-6 py-4">${t.subjectName}</td>
                <td class="px-6 py-4 text-center font-semibold">${t.papers}</td>
                <td class="px-6 py-4 text-center"><span class="bg-blue-100 text-blue-800 px-2 py-1 rounded text-xs font-bold">${t.status}</span></td>
                <td class="px-6 py-4 text-right">
                    <button onclick="showTuiDetailPanel('${t.id}')" class="text-blue-600 hover:text-blue-800 font-bold text-sm inline-flex items-center gap-1">
                        Xem <i data-lucide="arrow-right" class="w-4 h-4"></i>
                    </button>
                </td>
            </tr>`;
        });

        const startIdx = (traCuuCurrentPage - 1) * traCuuPageSize + 1;
        const endIdx = Math.min(traCuuCurrentPage * traCuuPageSize, totalItems);
        document.getElementById('tui-pagination-info').innerText = `Hiển thị ${startIdx}-${endIdx} của ${totalItems} túi`;
        document.getElementById('tui-prev-page').disabled = (traCuuCurrentPage === 1);
        document.getElementById('tui-next-page').disabled = (traCuuCurrentPage === totalPages);

        initIcons();
        if (typeof isStateLoaded !== 'undefined' && isStateLoaded) saveStateToServer();
    }

    function hideLuuTuiModal() { document.getElementById('modal-luu-tui').classList.add('hidden-view'); }

    function confirmLuuTuiExecute() {
        hideLuuTuiModal();
        const tui = tuiBaiData.find(x => x.id === activeTuiDetailId);
        if (!tui) return;

        const removedRooms = tui.rooms.filter(rid => !tempRoomsTableA.includes(rid));
        const addedRooms = tempRoomsTableA.filter(rid => !tui.rooms.includes(rid));

        tui.rooms.forEach(rid => { if (!tempRoomsTableA.includes(rid)) phongThiData.find(x => x.id === rid).status = "Chưa làm phách"; });
        tempRoomsTableA.forEach(rid => { phongThiData.find(x => x.id === rid).status = "Đã vào túi"; });

        if (!tui.roomPhachMap) tui.roomPhachMap = {};

        removedRooms.forEach(rid => {
            delete tui.roomPhachMap[rid];
        });

        addedRooms.forEach(rid => {
            const roomObj = phongThiData.find(x => x.id === rid);
            if (roomObj) {
                let roomCodes = [];
                for (let k = 1; k <= roomObj.papers; k++) {
                    let randomCode;
                    do {
                        randomCode = `PH${Math.floor(10000 + Math.random() * 90000)}`;
                    } while (tui.phachGoc.includes(randomCode) || roomCodes.includes(randomCode));
                    roomCodes.push(randomCode);
                }
                tui.roomPhachMap[rid] = roomCodes;
            }
        });

        tui.rooms = [...tempRoomsTableA];
        let mockPhach = [];
        tui.rooms.forEach(rid => {
            if (tui.roomPhachMap[rid]) {
                mockPhach.push(...tui.roomPhachMap[rid]);
            }
        });
        tui.phachGoc = mockPhach;
        tui.papers = mockPhach.length;

        showGlobalToast("Thành công", "Đã lưu điều chỉnh cấu trúc túi bài thi.");
        switchTraCuuSubView('list');
        renderViewTraCuuTui();
        renderDashboard();
    }

    function handleSearchDoiChieuTui() {
        const searchId = document.getElementById('ndc-search-id').value.trim().toUpperCase();
        const tui = tuiBaiData.find(x => x.id.toUpperCase() === searchId);
        if (!tui) {
            showGlobalToast("Lỗi tìm kiếm", "Không tìm thấy mã túi bài thi này trên hệ thống!", "error");
            return;
        }

        activeTuiDoiChieuId = tui.id;
        sessionStorage.setItem('tkct_activeTuiDoiChieuId', tui.id);
        document.getElementById('ndc-active-id').innerText = tui.id;
        document.getElementById('ndc-search-id').disabled = false;

        // Try to load saved progress from memory or localStorage
        let tempValues = tui.tempPhach || null;
        if (!tempValues) {
            const saved = localStorage.getItem(`tempPhach_${tui.id}`);
            if (saved) {
                try {
                    tempValues = JSON.parse(saved);
                } catch (e) {
                    console.error("Lỗi đọc tiến độ lưu tạm:", e);
                }
            }
        }

        const grid = document.getElementById('ndc-inputs-grid');
        grid.innerHTML = '';
        const limit = tui.papers;
        const isAlreadyMatched = (tui.status === "Đã đối chiếu hợp lệ" || tui.status === "Đã khóa phách" || tui.status === "Đang chấm");

        const realStudentNames = [
            "Nguyễn Thị Ánh Tuyết", "Trần Nhật Minh", "Lê Hoàng Phúc", "Phạm Đăng Khoa",
            "Hoàng Thị Thu Hà", "Nguyễn Đức Anh", "Đặng Minh Trí", "Bùi Ngọc Khánh",
            "Vũ Gia Bảo", "Ngô Hải Đăng", "Lý Minh Quân", "Đỗ Phương Linh",
            "Mai Thanh Hằng", "Dương Hoài Nam", "Trịnh Gia Huy", "Phan Quốc Bảo",
            "Hồ Mỹ Duyên", "Đinh Quang Hải", "Võ Thị Quỳnh Như", "Nguyễn Khánh Linh",
            "Lê Tuấn Anh", "Trần Bảo Ngọc", "Phạm Hoàng Yến", "Nguyễn Văn Tâm"
        ];
        const phachList = tui.phachGoc || [];

        for (let i = 1; i <= limit; i++) {
            let val = '';
            let isDisabled = false;
            let classStr = "w-full max-w-[160px] border border-gray-300 rounded-lg px-3 py-1.5 font-mono text-xs font-bold uppercase outline-none focus:border-[#9e1c22] focus:ring-1 focus:ring-[#9e1c22] shadow-xs text-center transition-all";
            
            if (isAlreadyMatched) {
                val = phachList[i - 1] || '';
                isDisabled = true;
                classStr = "w-full max-w-[160px] border-gray-200 bg-gray-100 text-gray-500 rounded-lg px-3 py-1.5 font-mono text-xs font-bold uppercase outline-none cursor-not-allowed text-center shadow-inner";
            } else if (tempValues && tempValues[i - 1]) {
                val = tempValues[i - 1].value || '';
                isDisabled = tempValues[i - 1].disabled || false;
                
                if (isDisabled) {
                    classStr = "w-full max-w-[160px] border-gray-200 bg-gray-100 text-gray-500 rounded-lg px-3 py-1.5 font-mono text-xs font-bold uppercase outline-none cursor-not-allowed text-center shadow-inner";
                } else if (val) {
                    const isMatch = /^PH\d{4}$/.test(val);
                    if (isMatch) {
                        classStr = "w-full max-w-[160px] border-green-500 bg-green-50 text-green-800 rounded-lg px-3 py-1.5 font-mono text-xs font-bold uppercase outline-none ring-1 ring-green-400 text-center shadow-xs transition-all";
                    } else {
                        classStr = "w-full max-w-[160px] border-yellow-500 bg-yellow-50 text-yellow-800 rounded-lg px-3 py-1.5 font-mono text-xs font-bold uppercase outline-none ring-1 ring-yellow-400 text-center shadow-xs transition-all";
                    }
                }
            }
            
            const disabledAttr = isDisabled ? 'disabled' : '';

            const currentPhach = phachList[i - 1] || '';
            const studentObj = (tui.phachStudentMap && currentPhach && tui.phachStudentMap[currentPhach]) ? tui.phachStudentMap[currentPhach] : null;
            const studentName = studentObj?.name || realStudentNames[(i - 1) % realStudentNames.length];
            const studentSbd = studentObj?.sbd || `SBD-${String(i).padStart(3, '0')}`;
            const studentMasv = studentObj?.masv || studentObj?.ma_sv || `SV230${String(1000 + i)}`;

            grid.innerHTML += `
            <tr class="hover:bg-red-50/40 transition-colors whitespace-nowrap">
                <td class="px-4 py-2.5 text-center font-mono font-bold text-gray-400 whitespace-nowrap">${i}</td>
                <td class="px-4 py-2.5 font-mono font-bold text-gray-800 whitespace-nowrap">
                    <span class="bg-gray-100 text-gray-700 px-2.5 py-1 rounded text-xs font-mono font-bold border border-gray-200/60 inline-block whitespace-nowrap">${studentSbd}</span>
                </td>
                <td class="px-4 py-2.5 font-mono text-gray-600 font-semibold whitespace-nowrap">${studentMasv}</td>
                <td class="px-4 py-2.5 font-bold text-gray-800 text-xs whitespace-nowrap">
                    <div class="flex items-center gap-2">
                        <i data-lucide="user" class="w-3.5 h-3.5 text-red-700 shrink-0"></i>
                        <span class="whitespace-nowrap">${studentName}</span>
                    </div>
                </td>
                <td class="px-4 py-2.5 text-center whitespace-nowrap">
                    <input type="text" id="ndc-input-${i}" value="${val}" ${disabledAttr} oninput="validatePhachInput(this)" placeholder="PH..." class="${classStr}" />
                </td>
            </tr>`;
        }
        initIcons();
        document.getElementById('ndc-step2').classList.remove('hidden-view');
        document.getElementById('ndc-error').classList.add('hidden-view');
        
        if (isAlreadyMatched) {
            document.getElementById('ndc-success').classList.remove('hidden-view');
            const btnVerify = document.getElementById('ndc-btn-verify');
            btnVerify.disabled = true;
            btnVerify.className = "flex-1 bg-gray-400 text-white font-bold py-3 rounded cursor-not-allowed flex items-center justify-center gap-2";
        } else {
            document.getElementById('ndc-success').classList.add('hidden-view');
            const btnVerify = document.getElementById('ndc-btn-verify');
            btnVerify.disabled = false;
            btnVerify.className = "flex-1 bg-[#9e1c22] text-white font-bold py-3 rounded shadow hover:bg-red-800 flex items-center justify-center gap-2";
        }
    }

    function handleDoiChieuLuuTam() {
        const tui = tuiBaiData.find(x => x.id === activeTuiDoiChieuId);
        if (!tui) return;

        const limit = tui.papers;
        const tempValues = [];
        for (let i = 1; i <= limit; i++) {
            const el = document.getElementById(`ndc-input-${i}`);
            if (el) {
                tempValues.push({
                    value: el.value.trim().toUpperCase(),
                    disabled: el.disabled
                });
            }
        }
        
        // Save to localStorage and memory
        localStorage.setItem(`tempPhach_${tui.id}`, JSON.stringify(tempValues));
        tui.tempPhach = tempValues;

        saveStateToServer();
        showGlobalToast("Thành công", "Đã lưu tạm tiến độ gõ phách.");
    }

    function handleExecuteDoiChieuSoKhop() {
        const tui = tuiBaiData.find(x => x.id === activeTuiDoiChieuId);
        if (!tui) return;

        let hasError = false, errorCount = 0;
        let firstErrorIdx = -1;
        const limit = tui.papers;

        for (let i = 1; i <= limit; i++) {
            const el = document.getElementById(`ndc-input-${i}`);
            if (el.disabled) continue;

            if (el.value.trim().toUpperCase() !== tui.phachGoc[i - 1]) {
                hasError = true;
                errorCount++;
                if (firstErrorIdx === -1) firstErrorIdx = i;

                el.value = '';
                el.placeholder = "Sai - Nhập lại";
                el.className = "flex-1 min-w-0 border-red-500 bg-red-50 text-red-700 rounded px-2.5 py-1.5 font-mono text-sm uppercase outline-none ring-1 ring-red-400 shadow-sm focus:border-red-500";
            } else {
                el.disabled = true;
                el.className = "flex-1 min-w-0 border-gray-200 bg-gray-100 text-gray-500 rounded px-2.5 py-1.5 font-mono text-sm uppercase outline-none cursor-not-allowed shadow-inner";
            }
        }

        if (hasError) {
            document.getElementById('ndc-error-text').innerText = `Phát hiện ${errorCount} mã phách không hợp lệ. Vui lòng kiểm tra lại các ô màu đỏ.`;
            document.getElementById('ndc-error').classList.remove('hidden-view');
            document.getElementById('ndc-success').classList.add('hidden-view');

            if (firstErrorIdx !== -1) {
                document.getElementById(`ndc-input-${firstErrorIdx}`).focus();
            }
        } else {
            document.getElementById('ndc-error').classList.add('hidden-view');
            document.getElementById('ndc-success').classList.remove('hidden-view');
            tui.status = "Đã đối chiếu hợp lệ";
            
            // Clear tempPhach
            delete tui.tempPhach;
            localStorage.removeItem(`tempPhach_${tui.id}`);
            
            document.getElementById('ndc-btn-verify').disabled = true;
            document.getElementById('ndc-btn-verify').className = "flex-1 bg-gray-400 text-white font-bold py-3 rounded cursor-not-allowed flex items-center justify-center gap-2";

            saveStateToServer();
            renderDashboard();
        }
    }

    function populateGiaoNhanFilterSubjects(items, getSubjectFn) {
        const select = document.getElementById('gn-filter-subject');
        if (!select) return;
        const subjects = new Set();
        items.forEach(item => {
            const sName = getSubjectFn(item).split(' (')[0];
            if (sName) subjects.add(sName);
        });
        select.innerHTML = '<option value="">Tất cả Học phần</option>';
        Array.from(subjects).sort().forEach(s => {
            select.innerHTML += `<option value="${s}">${s}</option>`;
        });
        const searchInput = document.getElementById('gn-filter-search');
        if (searchInput) searchInput.value = '';
    }

    window.changeGiaoNhanPage = function (delta) {
        giaoNhanCurrentPage += delta;
        const totalPages = Math.ceil(giaoNhanFilteredItems.length / giaoNhanPageSize) || 1;
        if (giaoNhanCurrentPage < 1) giaoNhanCurrentPage = 1;
        if (giaoNhanCurrentPage > totalPages) giaoNhanCurrentPage = totalPages;
        renderGiaoNhanPage();
    }

    window.handleGiaoNhanCheckboxChange = function (el) {
        if (el.checked) {
            giaoNhanSelectedIds.add(el.value);
        } else {
            giaoNhanSelectedIds.delete(el.value);
        }
    }

    window.filterGiaoNhanList = function () {
        const searchVal = document.getElementById('gn-filter-search').value.toLowerCase().trim();
        const subjectVal = document.getElementById('gn-filter-subject').value;
        const tuiKhaDung = tuiBaiData.filter(t => t.status === "Đã khóa phách" || t.status === "Đã đối chiếu hợp lệ");

        giaoNhanFilteredItems = tuiKhaDung.filter(t => {
            const sName = (t.subjectName || '').split(' (')[0];
            const matchesSearch = !searchVal ||
                (t.id || '').toLowerCase().includes(searchVal) ||
                (t.subjectName || '').toLowerCase().includes(searchVal);
            const matchesSubject = !subjectVal || sName === subjectVal;
            return matchesSearch && matchesSubject;
        });

        giaoNhanCurrentPage = 1;
        renderGiaoNhanPage();
    }

    function renderGiaoNhanPage() {
        const listTuiDiv = document.getElementById('gn-list-tui-kha-dung');
        if (!listTuiDiv) return;
        listTuiDiv.innerHTML = '';

        const totalPages = Math.ceil(giaoNhanFilteredItems.length / giaoNhanPageSize) || 1;
        if (giaoNhanCurrentPage > totalPages) giaoNhanCurrentPage = totalPages;

        const start = (giaoNhanCurrentPage - 1) * giaoNhanPageSize;
        const end = start + giaoNhanPageSize;
        const pageItems = giaoNhanFilteredItems.slice(start, end);

        if (pageItems.length === 0) {
            listTuiDiv.innerHTML = `<div class="col-span-full text-xs text-gray-400 italic text-center py-12 bg-white rounded-lg border border-dashed border-gray-200">Không tìm thấy túi bài thi nào phù hợp.</div>`;
        } else {
            pageItems.forEach(t => {
                const isChecked = giaoNhanSelectedIds.has(t.id);
                const bgBadge = 'bg-amber-50 text-amber-700 border-amber-100';

                const checkedClasses = isChecked
                    ? 'bg-blue-50/50 border-blue-500 ring-1 ring-blue-500/20'
                    : 'bg-white border-slate-200 hover:border-blue-400 hover:bg-slate-50/30';

                listTuiDiv.innerHTML += `
                    <label class="gn-item flex items-start gap-3 p-3 rounded-lg border cursor-pointer transition-all duration-150 shadow-sm ${checkedClasses}">
                        <div class="flex items-center h-5 mt-0.5">
                            <input type="checkbox" value="${t.id}" onchange="handleGiaoNhanCheckboxChange(this)" ${isChecked ? 'checked' : ''} class="w-3.5 h-3.5 text-blue-600 rounded border-gray-300 focus:ring-blue-500" />
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex flex-col gap-0.5">
                                <span class="font-extrabold text-slate-800 text-[12.5px] tracking-wide leading-tight">${t.id}</span>
                                <span class="text-slate-500 text-[11px] font-sans font-medium line-clamp-1 leading-normal">${t.subjectName}</span>
                                <span class="inline-flex items-center w-fit px-1.5 py-0.5 rounded text-[10px] font-bold font-sans border ${bgBadge} mt-1">${t.papers} bài</span>
                            </div>
                        </div>
                        <div class="shrink-0 bg-slate-100 p-2 rounded-lg text-slate-500 flex items-center justify-center">
                            <i data-lucide="package" class="w-4 h-4 text-amber-600"></i>
                        </div>
                    </label>
                `;
            });
        }

        // Update pagination controls
        document.getElementById('gn-pagination-info').innerText = `Trang ${giaoNhanCurrentPage} / ${totalPages}`;
        document.getElementById('gn-btn-prev').disabled = giaoNhanCurrentPage === 1;
        document.getElementById('gn-btn-next').disabled = giaoNhanCurrentPage === totalPages;
        initIcons();
    }

                                    <div class="flex items-center gap-2">
                                        <span class="font-mono font-bold text-gray-900 text-base">${pid}</span>
                                        <span class="bg-blue-100 text-blue-800 text-[10px] px-2 py-0.5 rounded-full font-bold">Bài thi gốc</span>
                                    </div>
                                    <p class="text-xs text-gray-500 mt-1 flex items-center gap-1"><i data-lucide="arrow-right-left" class="w-3.5 h-3.5"></i> Tuyến: <strong>${pflow}</strong></p>
                                </div>
                            </div>
                            <button onclick="event.stopPropagation(); showGnDetailNhan('${pid}')" class="bg-green-600 hover:bg-green-700 text-white px-5 py-2.5 rounded-lg font-bold text-xs shadow-sm hover:shadow flex items-center gap-1.5 font-sans transition-all">
                                KIỂM ĐẾM <i data-lucide="chevron-right" class="w-4 h-4"></i>
                            </button>
                        </div>
                    `;
                });
            }
        }

        // 2. Danh sách túi khả dụng để giao/trả
        const listTuiKhaDungContainer = document.getElementById('gn-list-tui-kha-dung');
        if (listTuiKhaDungContainer) {
            const tuiKhaDung = tuiBaiData.filter(t => t.status === "Đã khóa phách" || t.status === "Đã đối chiếu hợp lệ");
            populateGiaoNhanFilterSubjects(tuiKhaDung, t => t.subjectName);
            giaoNhanSelectedIds.clear();
            filterGiaoNhanList();
        }

        // 3. Lịch sử nhận bài (recipient = tkct)
        const histNhanTbody = document.getElementById('gn-lich-su-nhan-tbody');
        if (histNhanTbody) {
            histNhanTbody.innerHTML = '';
            let tkctReceipts = phieuGiaoNhanData.filter(p => p.recipient === "tkct" || p.receiver === "tkct");
            if (tkctReceipts.length === 0) {
                tkctReceipts = phieuGiaoNhanData;
            }
            tkctReceipts.forEach(p => {
                const pid = p.id || p.ma_phieu || 'PGN-2026-001';
                const pflow = p.flow || `${p.sender_name || 'Bên giao'} ➔ ${p.receiver_name || 'Bên nhận'}`;
                const pqty = p.qty || (p.chi_tiet ? p.chi_tiet.length : 1);
                const pstatus = p.status || (p.trang_thai === 'ChoXacNhan' ? 'Chờ bạn xác nhận' : 'Đã hoàn tất');
                let stBadge = `<span class="bg-yellow-100 text-yellow-800 px-2 py-0.5 rounded text-xs font-bold">${pstatus}</span>`;
                let rejectInfo = "";
                if (pstatus === "Đã hoàn tất" || pstatus === "Đã xác nhận") stBadge = `<span class="bg-green-100 text-green-800 px-2 py-0.5 rounded text-xs font-bold">✓ Đã tiếp nhận</span>`;
                if (pstatus === "Bị từ chối") {
                    stBadge = `<span class="bg-red-100 text-red-800 px-2 py-0.5 rounded text-xs font-bold">✗ Hủy phiếu</span>`;
                    if (p.rejectReason) {
                        rejectInfo = `<div class="text-[10px] text-red-600 font-normal italic mt-1">Lý do: "${p.rejectReason}"</div>`;
                    }
                }

                histNhanTbody.innerHTML += `
                    <tr class="hover:bg-gray-50 text-xs">
                        <td class="px-4 py-2.5 font-mono font-bold text-blue-600 hover:underline">
                            <div class="flex items-center gap-2">
                                <button onclick="showGnDetailNhan('${pid}')" class="hover:text-blue-800 font-mono font-bold text-left">${pid}</button>
                                <a href="/export-pdf/?id=${pid}" target="_blank" title="Tải PDF" class="text-gray-400 hover:text-red-600 transition"><i data-lucide="file-text" class="w-3.5 h-3.5"></i></a>
                            </div>
                        </td>
                        <td class="px-4 py-2.5 text-gray-700 font-semibold">${pflow}</td>
                        <td class="px-4 py-2.5 text-center font-bold">${pqty}</td>
                        <td class="px-4 py-2.5 text-center">${stBadge}${rejectInfo}</td>
                    </tr>
                `;
            });
        }

        // 4. Lịch sử giao bài (sender = tkct)
        const histGiaoTbody = document.getElementById('gn-lich-su-giao-tbody');
        if (histGiaoTbody) {
            histGiaoTbody.innerHTML = '';
            let tkctHandovers = phieuGiaoNhanData.filter(p => p.sender === "tkct");
            if (tkctHandovers.length === 0) {
                tkctHandovers = phieuGiaoNhanData;
            }
            tkctHandovers.forEach(p => {
                const pid = p.id || p.ma_phieu || 'PGN-2026-001';
                const pflow = p.flow || `${p.sender_name || 'Bên giao'} ➔ ${p.receiver_name || 'Bên nhận'}`;
                const pqty = p.qty || (p.chi_tiet ? p.chi_tiet.length : 1);
                const pstatus = p.status || (p.trang_thai === 'ChoXacNhan' ? 'Chờ bạn xác nhận' : 'Đã hoàn tất');
                let stBadge = `<span class="bg-yellow-100 text-yellow-800 px-2 py-0.5 rounded text-xs font-bold">${pstatus}</span>`;
                let rejectInfo = "";
                if (pstatus === "Đã hoàn tất" || pstatus === "Đã xác nhận") stBadge = `<span class="bg-green-100 text-green-800 px-2 py-0.5 rounded text-xs font-bold">✓ Đã tiếp nhận</span>`;
                if (pstatus === "Bị từ chối") {
                    stBadge = `<span class="bg-red-100 text-red-800 px-2 py-0.5 rounded text-xs font-bold">✗ Hủy phiếu</span>`;
                    if (p.rejectReason) {
                        rejectInfo = `<div class="text-[10px] text-red-600 font-normal italic mt-1">Lý do: "${p.rejectReason}"</div>`;
                    }
                }

                histGiaoTbody.innerHTML += `
                    <tr class="hover:bg-gray-50 text-xs">
                        <td class="px-4 py-2.5 font-mono font-bold text-blue-600 hover:underline">
                            <div class="flex items-center gap-2">
                                <button onclick="showGnDetailNhan('${pid}')" class="hover:text-blue-800 font-mono font-bold text-left">${pid}</button>
                                <a href="/export-pdf/?id=${pid}" target="_blank" title="Tải PDF" class="text-gray-400 hover:text-red-600 transition"><i data-lucide="file-text" class="w-3.5 h-3.5"></i></a>
                            </div>
                        </td>
                        <td class="px-4 py-2.5 text-gray-700 font-semibold">${pflow}</td>
                        <td class="px-4 py-2.5 text-center font-bold">${pqty}</td>
                        <td class="px-4 py-2.5 text-center">${stBadge}${rejectInfo}</td>
                    </tr>
                `;
            });
        }

        initIcons();
        if (typeof isStateLoaded !== "undefined" && isStateLoaded) saveStateToServer();
    }

    let activeNhanPhieuId = null;
    function showGnDetailNhan(phieuId) {
        activeNhanPhieuId = phieuId;
        const phieu = phieuGiaoNhanData.find(x => x.id === phieuId);
        if (!phieu) return;


        const actorNames = {
            "tkt": "Tổ Khảo thí",
            "tkct": "Thư ký Chấm thi",
            "dvcm": "Giáo vụ Khoa",
            "gv": "Giảng viên",
            "tkcoithi": "Thư ký Coi thi",
            "ldp": "Lãnh đạo phòng",
            "cvht": "Chuyên viên Hệ thống"
        };

        document.getElementById('gn-detail-nhan-title').innerText = 'Chi tiết: ' + phieu.type;
        document.getElementById('gn-detail-nhan-id').innerText = phieu.id;
        document.getElementById('gn-detail-nhan-giao').innerText = actorNames[phieu.sender] || phieu.sender;
        document.getElementById('gn-detail-nhan-type').innerText = phieu.type;
        document.getElementById('gn-detail-pdf-link').href = '/export-pdf/?id=' + phieu.id;
        const attName = phieu.attachments && phieu.attachments[0] || 'bien_ban_ban_giao.pdf';
        document.getElementById('gn-detail-attachment-name').innerText = attName;
        document.getElementById('gn-detail-attachment-link').href = '#';
        document.getElementById('gn-detail-attachment-link').onclick = function(e) {
            e.preventDefault();
            showGlobalToast("Tải tài liệu đính kèm", "Hệ thống đang tải bản scan thực tế của tệp: " + attName, "success");
        };

        const rejectBox = document.getElementById('gn-detail-reject-box');
        if (rejectBox) {
            if (phieu.status === "Bị từ chối") {
                rejectBox.classList.remove('hidden');
                document.getElementById('gn-detail-reject-reason').innerText = `Lý do: "${phieu.rejectReason || 'Phát hiện sai lệch kiểm đếm thực tế'}"`;
            } else {
                rejectBox.classList.add('hidden');
            }
        }

        const actionsFooter = document.getElementById('gn-detail-actions-footer');
        if (actionsFooter) {
            if (phieu.status === "Chờ bạn xác nhận" && phieu.recipient === "tkct") {
                actionsFooter.classList.remove('hidden-view');
            } else {
                actionsFooter.classList.add('hidden-view');
            }
        }

        const tbody = document.getElementById('gn-detail-nhan-tbody');
        tbody.innerHTML = '';

        const items = phieu.rooms || phieu.bags || [];
        items.forEach(itemId => {
            let subName = "Hồ sơ thi học phần";
            let numPapers = "";
            if (phieu.rooms) {
                const r = phongThiData.find(x => x.id === itemId);
                if (r) {
                    subName = r.subjectName;
                    numPapers = `${r.papers} bài`;
                }
            } else if (phieu.bags) {
                const b = tuiBaiData.find(x => x.id === itemId);
                if (b) {
                    subName = b.subjectName;
                    numPapers = `${b.papers} bài`;
                }
            }
            tbody.innerHTML += `
                <tr>
                    <td class="px-4 py-2 font-mono font-bold text-gray-700">${itemId}</td>
                    <td class="px-4 py-2">${subName}</td>
                    <td class="px-4 py-2 text-center font-bold">${numPapers}</td>
                </tr>
            `;
        });

        document.getElementById('gn-detail-nhan').classList.remove('hidden-view');
        initIcons();
    }

    function hideGnDetailNhan() { document.getElementById('gn-detail-nhan').classList.add('hidden-view'); }

    function handleTuChoiNhanPhieuGoc() {
        const input = document.getElementById('tkct-tu-choi-ly-do-input');
        if (input) input.value = '';
        const modal = document.getElementById('tkct-modal-nhap-ly-do-tu-choi');
        if (modal) modal.classList.remove('hidden-view');
    }
    window.handleTuChoiNhanPhieuGoc = handleTuChoiNhanPhieuGoc;

    function hideTuChoiLyDoModal() {
        const modal = document.getElementById('tkct-modal-nhap-ly-do-tu-choi');
        if (modal) modal.classList.add('hidden-view');
    }
    window.hideTuChoiLyDoModal = hideTuChoiLyDoModal;

    function confirmTuChoiLyDoModal() {
        const input = document.getElementById('tkct-tu-choi-ly-do-input');
        const lyDo = input ? input.value.trim() : "";
        const lyDoFinal = lyDo || "Phát hiện sai sót dữ liệu kiểm đếm thực tế";

        const phieu = phieuGiaoNhanData.find(x => x.id === activeNhanPhieuId);
        if (phieu) {
            phieu.status = "Bị từ chối";
            phieu.rejectReason = lyDoFinal;
        }
        hideTuChoiLyDoModal();
        hideGnDetailNhan();
        showGlobalToast("Đã từ chối", "Hệ thống đã hủy phiếu và phản hồi lý do về cho bên giao.");
        saveStateToServer();
        renderGiaoNhan();
    }
    window.confirmTuChoiLyDoModal = confirmTuChoiLyDoModal;

    function showGnKyNhanModal(type) {
        activeGnKyNhanType = type;
        confirmKyNhanPhieuExecute();
    }

    function hideGnKyNhanModal() { 
        const m = document.getElementById('modal-gn-ky-nhan');
        if (m) m.classList.add('hidden-view'); 
    }

    window.showGnDetailNhan = showGnDetailNhan;
    window.hideGnDetailNhan = hideGnDetailNhan;
    window.handleTuChoiNhanPhieuGoc = handleTuChoiNhanPhieuGoc;
    window.showGnKyNhanModal = showGnKyNhanModal;
    window.hideGnKyNhanModal = hideGnKyNhanModal;
    window.confirmKyNhanPhieuExecute = confirmKyNhanPhieuExecute;

    function confirmKyNhanPhieuExecute() {
        hideGnKyNhanModal();
        const phieu = phieuGiaoNhanData.find(x => (x.id === activeNhanPhieuId || x.ma_phieu === activeNhanPhieuId));
        if (phieu) {
            phieu.status = "Đã hoàn tất";
            phieu.trang_thai = "DaHoanTat";
            const timestamp = new Date().toLocaleString('vi-VN');
            phieu.log = `Đã nhận bàn giao bài thi vào ${timestamp}`;

            if (phieu.rooms) {
                phieu.rooms.forEach(rid => {
                    const p = phongThiData.find(x => x.id === rid);
                    if (p) p.status = "Chưa làm phách";
                });
            }
        }
        hideGnDetailNhan();
        showGlobalToast("Thành công", "Đã xác nhận tiếp nhận thành công bài thi bàn giao.");
        saveStateToServer();
        renderGiaoNhan();
    }

    let selectedAttachmentFile = null;
    function handleGiaoNhanFileSelect(input) {
        if(input.files && input.files[0]) {
            selectedAttachmentFile = input.files[0];
            document.getElementById('gn-file-status').innerHTML = `Đã chọn: <span class="text-green-600 font-mono font-bold">${selectedAttachmentFile.name}</span> <br><span class="text-[10px] text-gray-400 font-normal">(Nhấp lại để thay đổi)</span>`;
            showGlobalToast("Đính kèm tệp thành công", `Đã chọn tệp: ${selectedAttachmentFile.name}`, "success");
        }
    }
    window.handleGiaoNhanFileSelect = handleGiaoNhanFileSelect;

    function handleExecuteTaoPhieuChuyenDi() {
        const listIds = Array.from(giaoNhanSelectedIds);
        if (listIds.length === 0) {
            showGlobalToast("Lỗi giao nhận", "Vui lòng chọn ít nhất 1 túi phách hợp lệ để tiến hành bàn giao đi!", "error");
            return;
        }

        const nextNum = phieuGiaoNhanData.length + 1;
        const newPhieuId = `PBG-2026-${String(nextNum).padStart(3, '0')}`;
        const attName = selectedAttachmentFile ? selectedAttachmentFile.name : "bien_ban_roc_phach.pdf";

        phieuGiaoNhanData.push({
            id: newPhieuId,
            type: "Thư ký chấm thi trả túi bài thi về Tổ khảo thí (Loại 3)",
            flow: "Thư ký Chấm thi ➔ Tổ Khảo thí",
            qty: `${listIds.length} túi`,
            status: "Chờ bạn xác nhận",
            rooms: null,
            bags: listIds,
            sender: "tkct",
            recipient: "tkt",
            attachments: [attName],
            log: ""
        });

        showGlobalToast("Thành công", `Đã phát hành phiếu trả bài thi ${newPhieuId} đi chấm!`);
        giaoNhanSelectedIds.clear();
        filterGiaoNhanList();
        
        // Reset file upload field
        selectedAttachmentFile = null;
        const fileInput = document.getElementById('gn-file-input');
        if (fileInput) fileInput.value = '';
        const statusSpan = document.getElementById('gn-file-status');
        if (statusSpan) statusSpan.innerText = "Tải biên bản rọc phách (.pdf, .jpg)";

        saveStateToServer();
        renderGiaoNhan();
    }

    function showGlobalToast(title, msg, type = 'success') {
        const toast = document.getElementById('toast-global');
        const icon = document.getElementById('toast-global-icon');

        toast.className = "hidden-view fixed bottom-6 right-6 text-white px-6 py-4 rounded shadow-xl flex items-center gap-3 animate-fade-in-up z-[200]";

        if (type === 'error') {
            toast.classList.add('bg-red-600');
            icon.setAttribute('data-lucide', 'alert-circle');
        } else if (type === 'warning') {
            toast.classList.add('bg-yellow-500');
            icon.setAttribute('data-lucide', 'alert-triangle');
        } else {
            toast.classList.add('bg-green-600');
            icon.setAttribute('data-lucide', 'check-circle-2');
        }

        document.getElementById('toast-global-title').innerText = title;
        document.getElementById('toast-global-msg').innerText = msg || '';
        toast.classList.remove('hidden-view');
        initIcons();

        setTimeout(() => toast.classList.add('hidden-view'), 4000);
        if (activeViewId === 'view-home') renderDashboard();
    }
</script>
